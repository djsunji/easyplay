# easyplay als iPhone/iPad-App bauen (Capacitor) auf einem Mac von GitHub, ohne eigenen Mac.
# Mit den Apple-Secrets wird signiert und direkt zu App Store Connect (TestFlight) hochgeladen.
# Ohne Secrets wird nur zur Probe für den Simulator gebaut. Anleitung: app/ANLEITUNG-APP.md
name: App iOS
on:
  workflow_dispatch:
    inputs:
      kid:
        description: "Erwartete Key ID (nur zur Kontrolle)"
        default: ""
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ios.yml']
concurrency: { group: app-ios, cancel-in-progress: true }
jobs:
  ios:
    runs-on: macos-26
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KID: ${{ secrets.ASC_KEY_ID }}
      ISS: ${{ secrets.ASC_ISSUER_ID }}
      P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Schlüssel bei Apple prüfen
        if: env.TEAM != ''
        env:
          KID_SOLL: ${{ github.event.inputs.kid }}
        run: |
          pip3 install -q --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install -q pyjwt cryptography
          python3 - <<'PY'
          import os, re, time, json, urllib.request, urllib.error
          kid=os.environ["KID"]; iss=os.environ["ISS"]; p8=os.environ["P8"]; team=os.environ["TEAM"]
          def n(t): print("::notice::"+t)
          def e(t): print("::error::"+t)
          n(f"Key ID: {len(kid)} Zeichen, Format {'ok' if re.fullmatch(r'[A-Z0-9]{10}',kid) else 'FALSCH (10 Grossbuchstaben/Ziffern erwartet, Leerzeichen?)'}")
          soll=os.environ.get("KID_SOLL","")
          if soll: n(f"Key ID gleich wie erwartet ({soll}): {'ja' if kid==soll else 'NEIN'}")
          n(f"Issuer ID: Format {'ok' if re.fullmatch(r'[0-9a-f-]{36}',iss) else 'FALSCH'}")
          n(f"Team ID: Format {'ok' if re.fullmatch(r'[A-Z0-9]{10}',team) else 'FALSCH'}")
          zeilen=[z for z in p8.strip().splitlines() if z.strip()]
          n(f"P8: {len(zeilen)} Zeilen, BEGIN {'ok' if zeilen and 'BEGIN PRIVATE KEY' in zeilen[0] else 'FEHLT'}, END {'ok' if zeilen and 'END PRIVATE KEY' in zeilen[-1] else 'FEHLT'}")
          import jwt
          try:
              tok=jwt.encode({"iss":iss,"iat":int(time.time()),"exp":int(time.time())+600,"aud":"appstoreconnect-v1"},p8.strip()+"\n",algorithm="ES256",headers={"kid":kid,"typ":"JWT"})
          except Exception as x:
              e(f"P8 lässt sich nicht lesen: {type(x).__name__}"); raise SystemExit(0)
          def hol(u):
              r=urllib.request.Request("https://api.appstoreconnect.apple.com"+u,headers={"Authorization":"Bearer "+tok})
              try:
                  with urllib.request.urlopen(r) as a: return a.status, json.load(a)
              except urllib.error.HTTPError as h:
                  return h.code, h.read().decode()[:300]
          c,d=hol("/v1/apps?filter[bundleId]=ch.easyplay.app")
          if c!=200: e(f"Apple-API antwortet {c}: {d}")
          else: n(f"Apple-API ok. App mit ch.easyplay.app in App Store Connect: {len(d['data'])}")
          c,d=hol("/v1/bundleIds?filter[identifier]=ch.easyplay.app")
          if c==200: n(f"Bundle ID ch.easyplay.app registriert: {len(d['data'])}")
          c,d=hol("/v1/users?limit=1")
          n(f"Admin-Recht (Benutzerliste lesen): {'ja' if c==200 else 'nein, Code '+str(c)}")
          PY
      - name: Xcode 26 wählen
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Kein Xcode 26 auf diesem Mac gefunden"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::Gebaut mit $(xcodebuild -version | head -1)"
      - name: Capacitor-Projekt erzeugen
        working-directory: app
        run: |
          python3 www-bauen.py
          npm install --no-audit --no-fund
          npx cap add ios
          npx capacitor-assets generate --ios --splashBackgroundColor '#2B1466' --splashBackgroundColorDark '#2B1466'
          npx cap sync ios
      - name: Info.plist ergänzen
        working-directory: app/ios/App/App
        run: |
          P=Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName easyplay" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string easyplay" $P
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string de" $P || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion de" $P
      - name: Bauen
        working-directory: app/ios/App
        run: |
          set -o pipefail
          if [ -d App.xcworkspace ]; then W="-workspace App.xcworkspace"; else W="-project App.xcodeproj"; fi
          if [ -z "$TEAM" ] || [ -z "$KID" ] || [ -z "$ISS" ] || [ -z "$P8" ]; then
            xcodebuild $W -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
            echo "Nur Probe-Bau für den Simulator (Apple-Secrets fehlen)." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          # Archiv unsigniert bauen (braucht kein Gerät); signiert wird beim Export mit dem Verteilungs-Zertifikat, das Xcode über den API-Schlüssel selbst holt.
          mkdir -p "$RUNNER_TEMP/key" && printf '%s' "$P8" > "$RUNNER_TEMP/key/AuthKey.p8"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/key/AuthKey.p8 -authenticationKeyID $KID -authenticationKeyIssuerID $ISS"
          xcodebuild $W -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" \
            MARKETING_VERSION=1.0.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error:|warning: .*(sign|profile|provision)|No profiles|No Account|Signing|Provisioning|code signing" "$RUNNER_TEMP/archive.log" | sort -u | head -15 | sed 's/^/::error::Archiv: /'; tail -40 "$RUNNER_TEMP/archive.log"; exit 65; }
          tail -10 "$RUNNER_TEMP/archive.log"
          sed "s/TEAM_ID/$TEAM/" ../../ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH > "$RUNNER_TEMP/export.log" 2>&1 || { grep -E "error|Error|failed" "$RUNNER_TEMP/export.log" | sort -u | head -15 | sed 's/^/::error::Export: /'; tail -40 "$RUNNER_TEMP/export.log"; exit 65; }
          tail -10 "$RUNNER_TEMP/export.log"
          echo "Hochgeladen zu App Store Connect (Build ${{ github.run_number }}). In TestFlight erscheint es nach einigen Minuten." >> $GITHUB_STEP_SUMMARY
