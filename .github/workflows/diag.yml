name: diag
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > >(tee -a out1.txt) 2>&1
          for u in / /sw.js /api/health /stil.js /fragen-1.json /index.html; do curl -s -o /dev/null -H 'Accept-Encoding: br, gzip' -w "$u %{http_code} %{time_starttransfer}s ttfb %{time_total}s %{size_download}B\n" --max-time 60 "https://easyplay.ch$u?x=$RANDOM"; done
          curl -sI https://easyplay.ch/ | head -20
          curl -s --max-time 20 https://easyplay.ch/api/health; echo
      - run: |
          npm i --prefix /tmp/pw playwright@1.48.2 >/dev/null 2>&1 && /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();const T0=Date.now();const L=m=>console.log(((Date.now()-T0)/1000).toFixed(1)+'s '+m);
          p.on('console',m=>L('CON '+m.type()+': '+m.text().slice(0,250)));p.on('pageerror',e=>L('PE '+e.message.slice(0,300)));
          p.on('framenavigated',f=>{if(f===p.mainFrame())L('NAV '+f.url())});
          p.on('response',r=>{if(r.status()>=400)L('HTTP '+r.status()+' '+r.url())});
          await p.goto('https://easyplay.ch/',{waitUntil:'commit',timeout:60000}).catch(e=>L('GOTO '+e.message));
          for(let i=0;i<40;i++){await p.waitForTimeout(1000);const s=await p.evaluate(()=>[window.__epVer,window.__epGerendert,document.readyState,document.documentElement.className,document.scripts.length,(window.S&&S.screen)].join(' | ')).catch(e=>'ERR '+e.message.slice(0,80));if(i%3==0)L('STATE '+s);}
          await b.close();})();
          JS
          NODE_PATH=/tmp/pw/node_modules node t.js > out2.txt 2>&1 || true
      - run: |
          git config user.name diag; git config user.email diag@x
          git add out1.txt out2.txt; git commit -m 'Ergebnis [skip ci]'; git push
