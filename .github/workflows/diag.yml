name: diag
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for u in / /sw.js /api/health /stil.js /fragen-1.json /index.html; do curl -s -o /dev/null -H 'Accept-Encoding: br, gzip' -w "$u %{http_code} %{time_starttransfer}s ttfb %{time_total}s %{size_download}B\n" --max-time 60 "https://easyplay.ch$u?x=$RANDOM"; done
          curl -sI https://easyplay.ch/ | head -20
          curl -s --max-time 20 https://easyplay.ch/api/health; echo
      - run: |
          npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage();
          const log=[];p.on('console',m=>log.push(m.type()+': '+m.text().slice(0,200)));p.on('pageerror',e=>log.push('PE '+e.message.slice(0,300)));
          p.on('requestfailed',r=>log.push('FAIL '+r.url()+' '+(r.failure()||{}).errorText));
          const slow=[];p.on('requestfinished',async r=>{const t=r.timing();if(t.responseEnd>3000)slow.push(Math.round(t.responseEnd)+'ms '+r.url())});
          for(let i=0;i<3;i++){const t=Date.now();await p.goto('https://easyplay.ch/',{waitUntil:'commit',timeout:60000}).catch(e=>log.push('GOTO '+e.message));
          const r=await p.waitForFunction(()=>!document.documentElement.classList.contains('ep-boot'),null,{timeout:60000,polling:200}).then(()=>'ok').catch(()=>'TIMEOUT');
          console.log('load',i,r,Date.now()-t,'ms',await p.evaluate(()=>[window.__epVer,window.__epGerendert,window.EP_BUILD,document.readyState,(document.querySelector('#epBoot p')||{}).textContent].join(' | ')).catch(e=>e.message));}
          console.log(slow.slice(0,30).join('\n'));console.log(log.slice(0,60).join('\n'));await b.close();})();
          JS
          node t.js
