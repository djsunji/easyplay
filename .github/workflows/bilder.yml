name: Bilder für die Bibliothek finden
on:
  workflow_dispatch:
    inputs:
      neu:
        description: "Alle Bilder neu suchen (1) statt nur fehlende (0)"
        default: "0"
  push:
    paths: ["tools/bildseiten.json"]
permissions:
  contents: write
concurrency:
  group: bilder
  cancel-in-progress: false
jobs:
  suchen:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        teil: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bilder suchen (Teil ${{ matrix.teil }} von 8)
        env:
          NEU: ${{ github.event.inputs.neu || '0' }}
          TEIL: "${{ matrix.teil }}/8"
          MAX_MINUTEN: "180"
        run: python3 tools/bilder_finden.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teil-${{ matrix.teil }}
          path: bildindex-teil-${{ matrix.teil }}.json
          if-no-files-found: ignore
  zusammenfuegen:
    needs: suchen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: teile
      - name: Zusammenfügen
        run: python3 tools/bilder_zusammen.py
      - name: Ergebnis speichern
        run: |
          git config user.name "easyplay-bilder"
          git config user.email "easyplay-bilder@users.noreply.github.com"
          git add bildindex.json
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Bibliothek: Bildindex aktualisiert"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
