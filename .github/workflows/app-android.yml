# easyplay als Android-App bauen (Capacitor). Ergebnis: AAB-Datei für Google Play unter «Artifacts».
# Ohne Schlüssel (Secrets) wird nur zur Probe gebaut, nicht signiert. Anleitung: app/ANLEITUNG-APP.md
name: App Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-android.yml']
concurrency: { group: app-android, cancel-in-progress: true }
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor-Projekt erzeugen
        working-directory: app
        run: |
          python3 www-bauen.py
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#2B1466' --iconBackgroundColorDark '#2B1466' --splashBackgroundColor '#2B1466' --splashBackgroundColorDark '#2B1466'
          npx cap sync android
      - name: Versionsnummer setzen
        working-directory: app/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle
      - name: Bauen (AAB)
        working-directory: app/android
        run: |
          chmod +x gradlew
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias=upload \
              -Pandroid.injected.signing.key.password="$KS_PASS"
            echo "Signiert gebaut." >> $GITHUB_STEP_SUMMARY
          else
            ./gradlew bundleRelease
            echo "Nur Probe-Bau ohne Signatur (Secrets ANDROID_KEYSTORE_B64 und ANDROID_KEYSTORE_PASSWORD fehlen)." >> $GITHUB_STEP_SUMMARY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: easyplay-android-${{ github.run_number }}
          path: app/android/app/build/outputs/bundle/release/*.aab
