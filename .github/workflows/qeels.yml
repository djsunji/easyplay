name: Qeels-Seite erzeugen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "sw.js", "tools/qeels_bauen.py"]
permissions:
  contents: read
concurrency:
  group: qeels
  cancel-in-progress: false
jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: qeels/index.html aus index.html erzeugen
        run: python3 tools/qeels_bauen.py
      - name: Ergebnis speichern
        run: |
          git config user.name "easyplay-qeels"
          git config user.email "easyplay-qeels@users.noreply.github.com"
          git add qeels/index.html
          git diff --cached --quiet && echo "Keine Änderungen" && exit 0
          git commit -m "Qeels: Seite aus index.html neu erzeugt"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
