name: Bilder der Bibliothek prüfen
on:
  workflow_dispatch:
    inputs:
      rang:
        description: "Ab welchem Rang ein Bild verdächtig ist"
        default: "300"
permissions:
  contents: read
concurrency:
  group: bildpruefung
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        teil: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pakete
        run: pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --quiet sentence-transformers pillow requests
      - name: Prüfen (Teil ${{ matrix.teil }} von 8)
        env:
          TEIL: "${{ matrix.teil }}/8"
          RANG_VERDACHT: ${{ github.event.inputs.rang || '300' }}
        run: python3 tools/bilder_pruefen.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pruefung-${{ matrix.teil }}
          path: |
            pruefung-teil-${{ matrix.teil }}.json
            pruefung/teil-${{ matrix.teil }}/
          if-no-files-found: ignore
  zusammenfuegen:
    needs: pruefen
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: teile
      - name: Zusammenfügen und Bogen bauen
        run: mkdir -p pruefung && python3 tools/bilder_pruefung_zusammen.py
      - name: Auf Zweig bildpruefung speichern
        run: |
          git config user.name "easyplay-bilder"
          git config user.email "easyplay-bilder@users.noreply.github.com"
          git checkout -B bildpruefung
          git add -f pruefung/ergebnis.json pruefung/bogen-*.jpg
          git commit -m "Bildprüfung: Ergebnis und Übersichtsbogen" || exit 0
          git push -f origin bildpruefung
