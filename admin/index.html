<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https://api.github.com https://*.supabase.co https://commons.wikimedia.org https://de.wikipedia.org https://api.openverse.org https://www.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>easyplay Verwaltung</title>
<link rel="icon" type="image/webp" href="../img/fragezeichen.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3fb;--fl:#fff;--tx:#1d1b2e;--mu:#6b6880;--li:#e2def0;--ak:#5b45e8;--v:#8A3FE0;--b:#3D5AFE;--grad:linear-gradient(135deg,#8A3FE0,#3D5AFE);--ok:#1d7a3a;--wa:#a86400;--fe:#b3261e;--zb:#fafafb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121126;--fl:#1b1a33;--tx:#ecebf7;--mu:#a3a1bd;--li:#2f2d4d;--ak:#a08cff;--ok:#5cc47e;--wa:#e0a34a;--fe:#ff7a70;--zb:#202028;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--li);background:var(--fl);position:sticky;top:0;z-index:5;min-height:48px}
header b{font-size:15px}
#status{margin-left:auto;font-size:12px;color:var(--mu);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#rahmen{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 48px)}
nav{display:flex;flex-direction:column;gap:2px;padding:12px 8px;border-right:1px solid var(--li);background:var(--fl);position:sticky;top:48px;height:calc(100vh - 48px);overflow:auto}
nav .gr{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:12px 8px 4px}
nav button{background:none;border:0;border-radius:6px;padding:7px 10px;color:var(--tx);font:inherit;cursor:pointer;text-align:left;display:flex;justify-content:space-between;gap:6px}
nav button:hover{background:var(--bg)}
nav button.an{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 0 var(--ak)}
nav button small{color:var(--mu);font-weight:400}
main{padding:16px 20px;max-width:1500px;width:100%}
@media (max-width:800px){#rahmen{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--li)}nav .gr{display:none}}
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
#login form{background:var(--fl);border:1px solid var(--li);border-radius:8px;padding:24px;width:min(360px,100%);display:grid;gap:10px}
#login h1{font-size:18px;margin:0 0 4px}
#login input{width:100%;padding:8px 10px}
#login button{padding:8px}
.abschnitt{margin-bottom:22px}
.spalten{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px;align-items:start}
.balkenzeile{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px;align-items:center}
.mini{height:6px;background:var(--zb);border-radius:3px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ak)}
a.link{color:var(--ak);cursor:pointer;text-decoration:none}a.link:hover{text-decoration:underline}
.ampel{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}.ampel.ok{background:var(--ok)}.ampel.wa{background:var(--wa)}.ampel.fe{background:var(--fe)}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:18px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.zahl{background:var(--fl);border:1px solid var(--li);border-radius:6px;padding:8px 10px}
.zahl span{display:block;font-size:12px;color:var(--mu)}
.zahl b{font-size:20px;font-variant-numeric:tabular-nums}
.zahl small{color:var(--mu)}
.kpi .zahl{min-height:84px}
.box{background:var(--fl);border:1px solid var(--li);border-radius:6px;padding:12px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--fl);font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--li);vertical-align:top}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--zb);position:sticky;top:48px}
tr.wahl td{background:color-mix(in srgb,var(--ak) 12%,transparent)}
tbody tr{cursor:default}
tbody tr.klick{cursor:pointer}
tbody tr.klick:hover td{background:var(--zb)}
.r{text-align:right}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=search],input[type=password],input[type=email],input[type=number],select,textarea{background:var(--fl);border:1px solid var(--li);border-radius:5px;padding:5px 7px}
textarea{width:100%;min-height:60px;resize:vertical}
button.k{background:var(--fl);border:1px solid var(--li);border-radius:5px;padding:5px 10px;cursor:pointer}
button.k:hover{border-color:var(--mu)}
button.p{background:var(--ak);border-color:var(--ak);color:#fff}
button.g{color:var(--fe);border-color:color-mix(in srgb,var(--fe) 40%,var(--li))}
button:disabled{opacity:.5;cursor:default}
.leiste{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.leiste .rechts{margin-left:auto}
.mu{color:var(--mu)}.ok{color:var(--ok)}.wa{color:var(--wa)}.fe{color:var(--fe)}
.formular{display:grid;grid-template-columns:140px 1fr;gap:6px 10px;align-items:start}
.formular label{color:var(--mu);padding-top:6px}
.zwei{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:900px){.zwei{grid-template-columns:1fr}.formular{grid-template-columns:1fr}th{position:static}}
.bilder{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.bild{background:var(--fl);border:1px solid var(--li);border-radius:6px;padding:6px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.bild img,.bild .leer{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;background:var(--zb)}
.bild .leer{display:grid;place-items:center;color:var(--mu)}
.bild b{font-size:13px}
.bild .ak{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.bild.geaendert{outline:2px solid var(--wa)}
.balken{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--li);padding-top:6px}
.balken i{flex:1;background:var(--ak);min-height:1px;border-radius:2px 2px 0 0;position:relative}
.balken i:hover{opacity:.75}
.achse{display:flex;justify-content:space-between;font-size:11px;color:var(--mu)}
#aenderungen{display:none;position:sticky;bottom:0;background:var(--fl);border-top:2px solid var(--wa);padding:8px 16px;gap:10px;align-items:center;flex-wrap:wrap;z-index:6}
#aenderungen.da{display:flex}
#meldung{position:fixed;right:16px;bottom:64px;max-width:420px;background:var(--tx);color:var(--bg);padding:8px 12px;border-radius:6px;display:none;z-index:9}
.hinweis{border-left:3px solid var(--wa);padding:6px 10px;background:var(--fl);margin-bottom:10px}
code{font-size:12px;background:var(--zb);padding:1px 4px;border-radius:3px}
.seiten{display:flex;gap:6px;align-items:center;margin-top:8px}
dialog{border:1px solid var(--li);border-radius:8px;background:var(--fl);color:var(--tx);max-width:640px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.klein{font-size:12px}
.nowrap{white-space:nowrap}
.marke{display:inline-block;padding:0 6px;border-radius:9px;font-size:11px;border:1px solid var(--li)}

/* ---------- Gestaltung mit Logo und Kindern ---------- */
h2,#login h1,.held h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
h2{font-size:20px}
header{border-bottom:0;box-shadow:0 1px 0 var(--li)}
header::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad)}
.marke-kopf{display:flex;align-items:center;gap:8px}
.marke-kopf img.fz{width:34px;height:auto}
.marke-kopf img.wm{height:24px;width:auto}
.marke-kopf .pill{font-size:11px;font-weight:600;color:#fff;background:var(--grad);padding:2px 8px;border-radius:999px}
nav button.an{box-shadow:none;background:linear-gradient(90deg,color-mix(in srgb,var(--v) 16%,transparent),transparent)}
nav button.an::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--grad)}
nav button{position:relative}
nav .fusskinder{margin-top:auto;padding:12px 4px 0;opacity:.9}
nav .fusskinder img{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(80,40,160,.18))}
h3{display:flex;align-items:center;gap:8px}
h3::before{content:"";width:14px;height:4px;border-radius:2px;background:var(--grad)}
.zahl{border-radius:10px;box-shadow:0 1px 2px rgba(40,20,90,.05)}
.kpi .zahl{border-top:3px solid var(--li)}
.kpi .zahl.ok{border-top-color:var(--ok)}.kpi .zahl.wa{border-top-color:var(--wa)}.kpi .zahl.fe{border-top-color:var(--fe)}
.zahl[data-ziel]:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(60,40,160,.12)}
.zahl{transition:transform .15s,box-shadow .15s}
table{box-shadow:0 0 0 1px var(--li);border-radius:10px}
.box{border-radius:10px}
button.k.p{background:var(--grad);border-color:transparent}
.held{position:relative;overflow:hidden;border-radius:16px;background:var(--grad);color:#fff;padding:22px 24px;margin-bottom:20px;min-height:150px;display:flex;align-items:center}
.held::after{content:"";position:absolute;inset:auto -40px -80px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.held .text{position:relative;z-index:1;max-width:58%}
.held h2{font-size:26px;margin:0 0 6px;color:#fff}
.held p{margin:0;opacity:.92;font-size:15px}
.held .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.held .chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:3px 10px;border-radius:999px;font-size:12px}
.held img{position:absolute;right:8px;bottom:-6px;height:118%;width:auto;z-index:1;filter:drop-shadow(0 10px 18px rgba(20,0,60,.35))}
@media (max-width:900px){.held .text{max-width:100%}.held img{opacity:.25;height:100%}}
.leerbild{display:flex;gap:14px;align-items:center}
.leerbild img{width:64px;height:auto;flex:none}
#meldung{border-radius:12px;padding:10px 14px 10px 46px;background:var(--grad)!important;color:#fff;box-shadow:0 10px 30px rgba(60,30,160,.35)}
#meldung.fe{background:var(--fe)!important}
#meldung::before{content:"";position:absolute;left:10px;top:50%;width:28px;height:26px;transform:translateY(-50%);background:url(../img/fragezeichen.webp) center/contain no-repeat}
/* Login */
#login{background:radial-gradient(1200px 600px at 10% 0%,#c79bff 0,transparent 60%),radial-gradient(900px 600px at 100% 100%,#7d93ff 0,transparent 60%),linear-gradient(135deg,#8A3FE0,#3D5AFE);position:relative;overflow:hidden}
#login .wrap{display:grid;justify-items:center;gap:0;width:min(440px,100%);position:relative;z-index:1}
#login .wrap>img{width:min(440px,100%);height:auto;margin-bottom:-26px;filter:drop-shadow(0 18px 30px rgba(20,0,70,.45));animation:schweben 6s ease-in-out infinite}
#login form{border:0;border-radius:18px;box-shadow:0 20px 60px rgba(20,0,70,.35);width:100%;padding:34px 26px 24px}
#login h1{text-align:center;font-size:22px}
#login form>p{text-align:center}
#login .punkte i{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);animation:schweben 9s ease-in-out infinite}
@keyframes schweben{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){#login .wrap>img,#login .punkte i{animation:none}}

/* Bilder wechseln */
nav button.unter{padding-left:22px;font-size:13px}
.bw{max-width:980px;margin:0 auto;text-align:center}
.bw-kopf{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:10px}
.bw-titel h2{font-size:30px;margin:0}
.bw-bild{display:grid;place-items:center;background:var(--fl);border:1px solid var(--li);border-radius:16px;padding:10px;min-height:220px}
.bw-bild img{max-width:100%;max-height:min(340px,38vh);border-radius:10px;object-fit:contain}
.bw-bild .leer{color:var(--mu);font-size:18px}
.bw-info{margin:6px 0 10px}
.bw-aktion{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.bw-aktion .k{padding:8px 16px;font-size:15px}
.bw-aktion small{opacity:.75;font-size:11px}
.bw h3{justify-content:center}
.bw-vs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:8px}
@media (max-width:900px){.bw-vs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bw-karte.hoch{align-items:center;justify-content:center;border-style:dashed;text-align:center;min-height:150px}
.bw-karte.hoch .gross{font-size:30px}
.bw-karte{position:relative;background:var(--fl);border:2px solid var(--li);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;font:inherit;color:inherit;text-align:left;transition:border-color .15s,transform .15s}
.bw-karte:hover{border-color:var(--v);transform:translateY(-2px)}
.bw-karte img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--zb)}
.bw-karte b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-karte small{font-size:11px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-karte .nr{position:absolute;left:10px;top:10px;background:var(--grad);color:#fff;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.bw-upload{margin:16px 0 4px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.bw-upload label.k{cursor:pointer;padding:8px 16px}
.bw-leer{text-align:center;padding:40px}.bw-leer img{width:120px;height:auto}

/* Welten, Bereiche, Klassen-Liga */
.spalten{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.welten{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:10px}
.wkarte{background:var(--fl);border:1px solid var(--li);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 1px 2px rgba(40,20,90,.05)}
.wkarte .wk-kopf{display:flex;gap:10px;align-items:center}
.wkarte .wk-emo{font-size:26px;line-height:1;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--v) 12%,var(--fl));flex:none}
.wkarte b.wk-t{font-size:15px}
.wkarte .wk-dateien{font-size:12px;color:var(--mu);display:grid;gap:2px}
.wkarte .wk-dateien span{display:flex;justify-content:space-between;gap:8px;min-width:0}
.wkarte .wk-dateien code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wkarte .wk-chips{display:flex;gap:4px;flex-wrap:wrap}
.wkarte .wk-chips span{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--zb);border:1px solid var(--li)}
.wkarte .ak{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
a.k{display:inline-block;text-decoration:none;color:inherit;background:var(--fl);border:1px solid var(--li);border-radius:5px;padding:5px 10px}
a.k:hover{border-color:var(--mu)}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.seg button{background:var(--fl);border:1px solid var(--li);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button.an{background:var(--grad);border-color:transparent;color:#fff}
tr.weg td{text-decoration:line-through;color:var(--mu)}
tr.geaendert td:first-child{box-shadow:inset 3px 0 0 var(--wa)}
.bild.aus{opacity:.55}
.bild .bfakt{color:var(--mu);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.balkenlang{height:10px;background:var(--zb);border-radius:5px;overflow:hidden;margin:6px 0 2px}.balkenlang i{display:block;height:100%;background:var(--grad)}
@media (max-width:800px){#rahmen{grid-template-columns:minmax(0,1fr)}nav .fusskinder{display:none}}
@media (max-width:900px){.zwei{grid-template-columns:minmax(0,1fr)}}
select{max-width:100%}
@media (max-width:640px){main{padding:12px}main table{display:block;overflow-x:auto;max-width:100%}.leiste input[type=search]{min-width:0!important;flex:1 1 180px}.held{padding:18px}.held h2{font-size:22px}}
</style>
</head>
<body>
<script>if(window.top!==window.self){ document.documentElement.innerHTML=""; throw new Error("Rahmen nicht erlaubt"); }</script>
<div id="login"><div class="punkte" aria-hidden="true"><i style="width:180px;height:180px;left:6%;top:12%"></i><i style="width:90px;height:90px;right:12%;top:18%;animation-delay:-3s"></i><i style="width:240px;height:240px;right:-60px;bottom:8%;animation-delay:-5s"></i></div>
<div class="wrap"><img src="../img/kinder.webp" alt="easyplay mit Lumi und Milo" width="760" height="507"><form id="lForm" autocomplete="on">
  <h1>Verwaltung</h1><p class="mu klein" style="margin:0 0 6px">Hallo! Bitte melde dich an.</p>
  <label class="klein mu" for="lName">Benutzername</label><input id="lName" name="username" autocomplete="username" required>
  <label class="klein mu" for="lPw">Passwort</label><input id="lPw" name="password" type="password" autocomplete="current-password" required>
  <button class="k p" type="submit" id="lGo">Anmelden</button><p id="lFehler" class="fe klein" style="margin:0;min-height:1em"></p>
</form></div></div>
<div id="app" hidden>
<header>
  <span class="marke-kopf"><img class="fz" id="kopfFz" src="../img/fragezeichen.webp" alt="" width="180" height="169"><img class="wm" src="../img/logo.webp" alt="easyplay" width="1100" height="294"><span class="pill">Verwaltung</span></span>
  <div id="status"></div>
</header>
<div id="rahmen">
<nav id="tabs">
  <div class="gr">Überblick</div>
  <button data-t="uebersicht" class="an">Übersicht</button>
  <button data-t="statistik">Besucher</button>
  <div class="gr">Inhalte</div>
  <button data-t="fragen">Fragen <small id="nFragen"></small></button>
  <button data-t="bilder">Bilder <small id="nBilder"></small></button>
  <button data-t="bildwechsel" class="unter">↳ Bilder wechseln</button>
  <button data-t="welten">Welten <small id="nWelten"></small></button>
  <div class="gr">Personen</div>
  <button data-t="benutzer">Benutzer</button>
  <button data-t="lehrpersonen">Lehrpersonen</button>
  <button data-t="liga">Klassen-Liga</button>
  <button data-t="kommentare">Kommentare</button>
  <button data-t="fehlermeldungen">Fehlermeldungen</button>
  <div class="gr">System</div>
  <button data-t="technik">Technik</button>
  <button data-t="zugang">Zugang</button>
  <div class="fusskinder" aria-hidden="true"><img src="../img/kinder.webp" alt="" width="760" height="507" loading="lazy"></div>
</nav>
<main id="inhalt"></main>
</div>
</div>
<div id="aenderungen"><b id="aeText"></b><span class="mu klein">Erst mit «Speichern» landen die Änderungen auf GitHub. Danach sind sie nach etwa 1 bis 2 Minuten auf der Website.</span><span style="margin-left:auto"></span><button class="k" id="aeListe">Anzeigen</button><button class="k g" id="aeVerwerfen">Verwerfen</button><button class="k p" id="aeSpeichern">Speichern</button></div>
<div id="meldung" role="status"></div>
<dialog id="dlg"></dialog>
<script src="../config.js"></script>
<script>
"use strict";
/* ======================= Grundlagen ======================= */
const B = "../";   // Website-Wurzel (die Verwaltung liegt unter /admin/)
const REPO = "djsunji/easyplay", ZWEIG = "main", GH = "https://api.github.com/repos/" + REPO;
const CFG = window.EP_CONFIG || {};
const $ = (q, el) => (el || document).querySelector(q);
const $$ = (q, el) => [...(el || document).querySelectorAll(q)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const zahl = n => (n == null || isNaN(n)) ? "-" : Number(n).toLocaleString("de-CH");

/* ======================= GitHub ======================= */
const ghToken = () => store.get("ep-admin-gh", "");
async function gh(pfad, opt){
  opt = opt || {};
  const h = {Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"};
  const t = ghToken(); if(t) h.Authorization = "Bearer " + t;
  if(opt.body) h["Content-Type"] = "application/json";
  const r = await fetch(pfad.startsWith("http") ? pfad : GH + pfad, {method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: "no-store"});
  if(!r.ok){ let m = r.status + ""; try{ m += " " + (await r.json()).message; }catch(e){} throw new Error("GitHub: " + m); }
  if(r.status === 204) return null;
  return opt.raw ? r.text() : r.json();
}
async function ghDateiText(pfad){ return gh("/contents/" + pfad.split("/").map(encodeURIComponent).join("/") + "?ref=" + ZWEIG, {raw:true}); }
// Gleiches Format wie die Python-Werkzeuge: eine Frage pro Zeile, «, » und «: » als Trenner
const pyJson = v => Array.isArray(v) ? "[" + v.map(pyJson).join(", ") + "]" : (v && typeof v === "object") ? "{" + Object.keys(v).map(k => JSON.stringify(k) + ": " + pyJson(v[k])).join(", ") + "}" : JSON.stringify(v);
const fragenDatei = liste => "[\n" + liste.map(pyJson).join(",\n") + "\n]\n";
const b64 = buf => { const b = new Uint8Array(buf); let s = ""; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); };
// Mehrere Dateien in einem Commit speichern. bauen(): liefert [{pfad, text}|{pfad, base64}] und wird bei einem Konflikt neu aufgerufen.
async function ghCommit(nachricht, bauen){
  if(!ghToken()) throw new Error("Kein GitHub-Schlüssel. Bitte unter «Zugang» eintragen.");
  for(let versuch=0; versuch<3; versuch++){
    const ref = await gh("/git/ref/heads/" + ZWEIG);
    const basis = await gh("/git/commits/" + ref.object.sha);
    const dateien = await bauen();
    const baum = [];
    for(const d of dateien){
      const blob = await gh("/git/blobs", {method:"POST", body: d.base64 != null ? {content:d.base64, encoding:"base64"} : {content:d.text, encoding:"utf-8"}});
      baum.push({path:d.pfad, mode:"100644", type:"blob", sha:blob.sha});
    }
    const tree = await gh("/git/trees", {method:"POST", body:{base_tree: basis.tree.sha, tree: baum}});
    const commit = await gh("/git/commits", {method:"POST", body:{message: nachricht, tree: tree.sha, parents:[ref.object.sha]}});
    try{ await gh("/git/refs/heads/" + ZWEIG, {method:"PATCH", body:{sha: commit.sha, force:false}}); return commit; }
    catch(e){ if(!/422|409/.test(e.message) || versuch===2) throw e; }
  }
}

const SB = { url:(CFG.supabaseUrl||"").replace(/\/$/,""), key:CFG.supabaseKey||"" };
const sbAn = () => !!(SB.url && SB.key);
const sbSitzung = () => store.get("ep-admin-sb", null);
async function sbLogin(mail, pw){
  const r = await fetch(SB.url + "/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:SB.key, "Content-Type":"application/json"}, body: JSON.stringify({email:mail, password:pw})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || "Anmeldung fehlgeschlagen");
  store.set("ep-admin-sb", {token:j.access_token, refresh:j.refresh_token, bis:Date.now() + (j.expires_in||3600)*1000, mail:j.user?.email});
}
async function sbToken(){
  const s = sbSitzung(); if(!s) return null;
  if(Date.now() < s.bis - 60000) return s.token;
  const r = await fetch(SB.url + "/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:SB.key, "Content-Type":"application/json"}, body: JSON.stringify({refresh_token:s.refresh})});
  if(!r.ok){ store.del("ep-admin-sb"); return null; }
  const j = await r.json(); store.set("ep-admin-sb", {...s, token:j.access_token, refresh:j.refresh_token, bis:Date.now() + (j.expires_in||3600)*1000}); return j.access_token;
}
async function rpc(name, args){
  const t = await sbToken(); if(!t) throw new Error("Nicht bei Supabase angemeldet (siehe «Zugang»).");
  const r = await fetch(SB.url + "/rest/v1/rpc/" + name, {method:"POST", headers:{apikey:SB.key, Authorization:"Bearer " + t, "Content-Type":"application/json"}, body: JSON.stringify(args||{})});
  const txt = await r.text(); let j = null; try{ j = txt ? JSON.parse(txt) : null; }catch(e){}
  if(!r.ok) throw new Error((j && (j.message || j.hint)) || ("Supabase " + r.status));
  return j;
}

async function ladeFragen(){
  if(DATEN.fragen) return DATEN.fragen;
  const teile = CFG.fragenDateien || [];
  const res = await Promise.all(teile.map(f => fetch(B + f, {cache:"no-cache"}).then(r => r.ok ? r.json() : []).catch(() => [])));
  const alle = [];
  res.forEach((liste, i) => (liste||[]).forEach(f => alle.push({...f, _datei: teile[i]})));
  DATEN.fragen = alle;
  zahlenMerken({fragen: alle.length, themen: new Set(alle.map(f => f.t)).size, fragenStand: Date.now()});
  try{
    const html = await fetch(B + "index.html", {cache:"no-cache"}).then(r => r.text());
    for(const m of html.matchAll(/\{id:"([a-z0-9_]+)", name:"([^"]+)"/g)) DATEN.themen[m[1]] = m[2];
    // Bereiche: Zeilen mit 2 Leerzeichen sind Hauptbereiche, mit 4 Leerzeichen Themen
    const block = html.slice(html.indexOf("const BEREICHE = ["), html.indexOf("const THEMA = {}"));
    let akt = null;
    for(const z of block.split("\n")){ const m = z.match(/^( {2,4})\{id:"([a-z0-9_]+)", name:"([^"]+)"/); if(!m) continue;
      if(m[1].length === 2){ akt = m[2]; DATEN.bereiche[akt] = m[3]; } else if(akt){ DATEN.themaBereich[m[2]] = akt; } }
    for(const m of html.matchAll(/\{id:"([a-z0-9_]+)", name:"[^"]+"[^}]*?parent:"([^"]+)"/g)){
      const p = m[2].replace("submenu:", ""); DATEN.themaBereich[m[1]] = DATEN.themaBereich[p] || (p === "geschmenu" ? DATEN.themaBereich.geschichte : p === "chmenu" ? DATEN.themaBereich.schweiz : null); }
  }catch(e){}
  return alle;
}
const bereichVon = t => DATEN.themaBereich[t] || (t && t.startsWith("kt_") ? DATEN.themaBereich.schweiz : t && t.startsWith("g_") ? DATEN.themaBereich.geschichte : null) || "andere";
const themaName = t => DATEN.themen[t] || (t && t.startsWith("kt_") ? "Kanton " + t.slice(3) : t);
async function ladeBilder(){
  if(!DATEN.bildindex) DATEN.bildindex = await fetch(B + "bildindex.json", {cache:"no-cache"}).then(r => r.json()).catch(() => ({}));
  if(!DATEN.seiten) DATEN.seiten = await fetch(B + "tools/bildseiten.json", {cache:"no-cache"}).then(r => r.json()).catch(() => []);
  if(DATEN.seiten.length) zahlenMerken({seiten: DATEN.seiten.length, mitBild: DATEN.seiten.filter(s => DATEN.bildindex[s.k]).length, buecher: new Set(DATEN.seiten.map(s => s.b)).size, bilderStand: Date.now()});
  return DATEN;
}

/* Veröffentlichte Grösse = Summe aller Dateien im aktuellen Stand (ohne Verlauf). repo.size von GitHub enthält den ganzen Verlauf. */
async function seitenGroesseMB(){
  try{ const c = JSON.parse(sessionStorage.getItem("ep-admin-seitengroesse") || "null"); if(c && Date.now() - c.t < 3600000) return c.mb; }catch(e){}
  const t = await gh("/git/trees/" + ZWEIG + "?recursive=1");
  if(!t || !Array.isArray(t.tree)) return null;
  const mb = t.tree.reduce((a, x) => a + (x.type === "blob" ? (x.size || 0) : 0), 0) / 1048576;
  try{ sessionStorage.setItem("ep-admin-seitengroesse", JSON.stringify({t:Date.now(), mb, abgeschnitten:!!t.truncated})); }catch(e){}
  return mb;
}

async function fragenSpeichern(){
  const nachDatei = new Map();
  for(const [nr, a] of AE.fragen){ const d = a.neu._datei; if(!nachDatei.has(d)) nachDatei.set(d, []); nachDatei.get(d).push([nr, a]); }

  await ghCommit(`Verwaltung: ${anzahl} ${anzahl === 1 ? "Frage" : "Fragen"} bearbeitet`, async () => {
    const out = [];
    for(const [datei, liste] of nachDatei){
      const aktuell = JSON.parse(await ghDateiText(datei));   // immer die neuste Fassung von GitHub
      for(const [nr, a] of liste){
        const i = aktuell.findIndex(f => +f.nr === +nr);
        if(a.loeschen){ if(i >= 0) aktuell.splice(i, 1); continue; }
        const sauber = {}; for(const k of ["nr","t","l","q","a","e","m","s","img"]) if(a.neu[k] !== undefined && a.neu[k] !== "") sauber[k] = a.neu[k];
        if(i >= 0) aktuell[i] = sauber; else aktuell.push(sauber);
      }
      out.push({pfad: datei, text: fragenDatei(aktuell)});
    }
    return out;
  });
  AE.fragen.clear(); DATEN.fragen = null;
}

async function commonsInfo(eingabe){
  let datei = String(eingabe).trim();
  const m = datei.match(/(?:File|Datei):([^?#]+)/i) || datei.match(/upload\.wikimedia\.org\/.+\/(?:\d+px-)?([^/?#]+)$/);
  if(m) datei = decodeURIComponent(m[1]); datei = datei.replace(/_/g, " ");
  const u = "https://commons.wikimedia.org/w/api.php?" + new URLSearchParams({action:"query", format:"json", formatversion:"2", origin:"*", titles:"File:" + datei, prop:"imageinfo", iiprop:"url|size|mime|extmetadata", iiurlwidth:"960", iiextmetadatafilter:"Artist|LicenseShortName"});
  const j = await fetch(u).then(r => r.json());
  const p = j?.query?.pages?.[0]; const ii = p?.imageinfo?.[0];
  if(!ii) throw new Error("Datei auf Wikimedia Commons nicht gefunden.");
  const md = ii.extmetadata || {}; const txt = h => { const d = new DOMParser().parseFromString(String(h||""), "text/html"); return (d.body.textContent||"").replace(/\s+/g, " ").trim().slice(0,120); };
  return {url: ii.thumburl || ii.url, urheber: txt(md.Artist?.value) || "Wikimedia Commons", lizenz: txt(md.LicenseShortName?.value), quelle: ii.descriptionurl, breite: ii.width, hoehe: ii.height, mime: ii.mime};
}
function bildVerkleinern(datei, max){
  return new Promise((ok, fehler) => { const img = new Image(); img.onload = () => { const f = Math.min(1, max[0] / img.naturalWidth, max[1] / img.naturalHeight);
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : fehler(new Error("WebP nicht möglich")), "image/webp", max[2]); URL.revokeObjectURL(img.src); };
    img.onerror = () => fehler(new Error("Bild kann nicht gelesen werden")); img.src = URL.createObjectURL(datei); });
}

async function bilderSpeichern(){
  const n = AE.bilder.size, nf = AE.freigabe ? AE.freigabe.size : 0;
  const uploads = [];
  for(const [k, a] of AE.bilder) if(a.upload) uploads.push({pfad: bildPfad(k), base64: b64(await a.upload.klein.arrayBuffer())}, {pfad: bildPfad(k, true), base64: b64(await a.upload.gross.arrayBuffer())});
  await ghCommit(`Verwaltung: ${n} ${n === 1 ? "Bild" : "Bilder"} geändert${nf ? `, ${nf} geprüft` : ""}`, async () => {
    const ix = JSON.parse(await ghDateiText("bildindex.json"));
    let gesperrt = []; try{ gesperrt = JSON.parse(await ghDateiText("tools/bilder_gesperrt.json")); }catch(e){}
    const ohne = new Set(ix._ohne || []);
    for(const [k, a] of AE.bilder){
      const vorher = ix[k];
      if(vorher && vorher[0] && vorher[5] !== "e" && (a.entfernen || a.eintrag)) gesperrt.push(vorher[0]);
      if(a.entfernen){ delete ix[k]; ohne.add(k); }
      else { ix[k] = a.eintrag; ohne.delete(k); }
    }
    ix._ohne = [...ohne].sort();
    let frei = []; try{ frei = JSON.parse(await ghDateiText("tools/bilder_freigegeben.json")); }catch(e){}
    const freiNeu = new Set(frei); for(const k of (AE.freigabe || [])) freiNeu.add(k); for(const k of AE.bilder.keys()) freiNeu.add(k);
    return [{pfad:"tools/bilder_freigegeben.json", text: JSON.stringify([...freiNeu].sort())}, {pfad:"bildindex.json", text: JSON.stringify(ix)}, {pfad:"tools/bilder_gesperrt.json", text: JSON.stringify([...new Set(gesperrt)].sort(), null, 0)}, ...uploads];
  });
  for(const [k, a] of AE.bilder){ if(a.entfernen) delete DATEN.bildindex[k]; else DATEN.bildindex[k] = a.eintrag; if(FREIGEGEBEN) FREIGEGEBEN.add(k); }
  if(AE.freigabe && FREIGEGEBEN) for(const k of AE.freigabe) FREIGEGEBEN.add(k);
  AE.bilder.clear(); if(AE.freigabe) AE.freigabe.clear();
}

/* Vorschläge: Wikipedia-Artikel, Wikimedia Commons, Openverse und (wenn eingerichtet) Google */
async function sucheVorschlaege(q, zwischen){
  // jede Quelle hat höchstens 6 Sekunden; was schon da ist, wird sofort gezeigt
  const holeJson = (url) => { const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 6000);
    return fetch(url, {signal:ac.signal}).then(r => r.ok ? r.json() : {}).finally(() => clearTimeout(t)); };
  const txt = h => { const d = new DOMParser().parseFromString(String(h||""), "text/html"); return (d.body.textContent||"").replace(/\s+/g, " ").trim().slice(0,100); };
  const aus = [], urls = new Set();
  const dazu = v => { if(!v || !v.url || urls.has(v.url)) return; urls.add(v.url); aus.push(v); };
  const jobs = [];
  // 1. Wikipedia: Hauptbilder passender Artikel, Lizenzen von Commons
  jobs.push((async () => {
    const j = await holeJson("https://de.wikipedia.org/w/api.php?" + new URLSearchParams({action:"query", format:"json", formatversion:"2", origin:"*", generator:"search", gsrsearch:q, gsrlimit:"8", gsrnamespace:"0", prop:"pageimages", piprop:"name"}));
    const seiten = (j?.query?.pages || []).sort((a,b) => a.index - b.index).filter(p => p.pageimage);
    if(!seiten.length) return [];
    const ii = await holeJson("https://commons.wikimedia.org/w/api.php?" + new URLSearchParams({action:"query", format:"json", formatversion:"2", origin:"*", titles:seiten.map(p => "File:" + p.pageimage).join("|"), prop:"imageinfo", iiprop:"url|extmetadata|mime", iiurlwidth:"960", iiextmetadatafilter:"Artist|LicenseShortName"}));
    const info = {}; (ii?.query?.pages || []).forEach(p => { if(p.imageinfo) info[p.title.replace(/^File:/, "").replace(/ /g, "_")] = p.imageinfo[0]; });
    return seiten.map(p => { const i = info[p.pageimage]; if(!i || !/jpeg|png|webp/.test(i.mime||"")) return null;
      return {url:i.thumburl || i.url, thumb:(i.thumburl || i.url), titel:p.title, quelleName:"Wikipedia: " + p.title, urheber:txt(i.extmetadata?.Artist?.value), lizenz:txt(i.extmetadata?.LicenseShortName?.value), quelle:i.descriptionurl, code:"m"}; }).filter(Boolean);
  })());
  // 2. Commons-Suche
  jobs.push((async () => {
    const j = await holeJson("https://commons.wikimedia.org/w/api.php?" + new URLSearchParams({action:"query", format:"json", formatversion:"2", origin:"*", generator:"search", gsrsearch:q + " filetype:bitmap", gsrnamespace:"6", gsrlimit:"12", prop:"imageinfo", iiprop:"url|extmetadata|size|mime", iiurlwidth:"960", iiextmetadatafilter:"Artist|LicenseShortName"}));
    return (j?.query?.pages || []).sort((a,b) => a.index - b.index).map(p => { const i = (p.imageinfo||[])[0]; if(!i || !/jpeg|png|webp/.test(i.mime||"") || i.width < 500) return null;
      return {url:i.thumburl || i.url, thumb:i.thumburl || i.url, titel:p.title.replace(/^File:/, ""), quelleName:"Commons", urheber:txt(i.extmetadata?.Artist?.value), lizenz:txt(i.extmetadata?.LicenseShortName?.value), quelle:i.descriptionurl, code:"m"}; }).filter(Boolean);
  })());
  // 3. Openverse
  jobs.push((async () => {
    const j = await holeJson("https://api.openverse.org/v1/images/?" + new URLSearchParams({q, page_size:"12", mature:"false"}));
    return (j?.results || []).filter(r => r.url && /^https:/.test(r.url)).map(r => ({url:r.url, thumb:r.thumbnail || r.url, titel:r.title || q, quelleName:"Openverse" + (r.source ? ": " + r.source : ""), urheber:txt(r.creator), lizenz:(r.license === "cc0" ? "CC0" : r.license === "pdm" ? "Public Domain" : ("CC " + String(r.license||"").toUpperCase() + " " + (r.license_version||"")).trim()), quelle:r.foreign_landing_url || "", code:"o"}));
  })());
  // 4. Google (nur wenn unter «Zugang» eingerichtet)
  const g = store.get("ep-admin-google", null);
  if(g && g.key && g.cx) jobs.push((async () => {
    const j = await holeJson("https://www.googleapis.com/customsearch/v1?" + new URLSearchParams({key:g.key, cx:g.cx, q, searchType:"image", num:"10", safe:"active", imgSize:"large"}));
    return (j?.items || []).filter(i => /^https:/.test(i.link)).map(i => ({url:i.link, thumb:i.image?.thumbnailLink || i.link, titel:i.title, quelleName:"Google: " + (i.displayLink || ""), urheber:i.displayLink || "", lizenz:"Lizenz prüfen", quelle:i.image?.contextLink || "", code:"g"}));
  })());
  // abwechselnd mischen, damit unter den ersten 4 verschiedene Quellen sind
  const listen = jobs.map(() => []);
  const mischen = () => { aus.length = 0; urls.clear(); for(let i = 0; i < 20; i++) listen.forEach(l => dazu(l[i])); return aus.slice(); };
  let offen = jobs.length;
  await Promise.all(jobs.map((p, n) => p.then(v => { listen[n] = v || []; }, () => {}).finally(() => { offen--; if(offen > 0 && zwischen) try{ zwischen(mischen()); }catch(e){} })));
  return mischen();
}
document.addEventListener("keydown", e => {
  if(TAB !== "bildwechsel" || /input|textarea|select/i.test((e.target && e.target.tagName) || "") || $("#dlg").open) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); bwGehe(1); }

  else if(/^[1-4]$/.test(e.key)){ const b = $$("#bwVs .bw-karte[data-j]")[+e.key - 1]; if(b){ e.preventDefault(); b.click(); } }
});

const WD = {};   // geladene Dateien: Pfad -> Promise<{text, bytes, json}>
function weltDatei(pfad){
  if(!WD[pfad]){ WD[pfad] = fetch(B + pfad, {cache:"no-cache"}).then(async r => { if(!r.ok) throw new Error(pfad + ": " + r.status); const text = await r.text();
    return {text, bytes: new Blob([text]).size, json: /\.json$/.test(pfad) ? JSON.parse(text) : null}; }); WD[pfad].catch(() => delete WD[pfad]); }
  return WD[pfad];
}
// Datei mit allen offenen Änderungen (Kopie, das Original bleibt unverändert)
async function weltDaten(pfad){ const d = await weltDatei(pfad); const j = JSON.parse(JSON.stringify(d.json)); for(const op of AE.welten.values()) if(op.datei === pfad) weltAnwenden(j, op); return j; }
// Eine Änderung auf eine Datei anwenden. Gesperrte Einträge wandern in eine eigene Liste, welche die Website nicht liest.
function weltAnwenden(j, op){
  const verschieben = (an, aus, finde, gesperrt) => { const i = an.findIndex(finde), g = aus.findIndex(finde);
    if(gesperrt === true && i >= 0) aus.push(an.splice(i, 1)[0]); if(gesperrt === false && g >= 0) an.push(aus.splice(g, 1)[0]); };
  const setze = (e, werte) => { for(const [k, v] of Object.entries(werte || {})){ if(v === "" || v == null) delete e[k]; else e[k] = v; } };
  if(op.art === "feste"){ const l = j[op.fest] = j[op.fest] || []; const i = op.alt == null ? -1 : l.findIndex(f => f.q === op.alt);
    if(op.neu == null){ if(i >= 0) l.splice(i, 1); } else if(i >= 0) l[i] = op.neu; else l.push(op.neu); }
  if(op.art === "reihe" || op.art === "paar"){
    const gruppe = op.art === "reihe" ? (j.kategorien || []).find(k => k.id === op.gruppe) : (j.saetze || []).find(s => s.id === op.gruppe); if(!gruppe) return;
    const feld = op.art === "reihe" ? "eintraege" : "paare", schl = op.art === "reihe" ? "n" : "l";
    gruppe[feld] = gruppe[feld] || []; const aus = gruppe.gesperrt || [];
    const e = gruppe[feld].find(x => x[schl] === op.name) || aus.find(x => x[schl] === op.name); if(!e) return;
    setze(e, op.werte); verschieben(gruppe[feld], aus, x => x[schl] === op.name, op.gesperrt);
    if(aus.length) gruppe.gesperrt = aus; else delete gruppe.gesperrt;
  }
  if(op.art === "album"){ const aus = j.aus || []; verschieben(j.k, aus, c => c[0] === op.id, op.gesperrt); if(aus.length) j.aus = aus; else delete j.aus; }
}
// Gleiche Formatierung wie die Datei vorher (kompakt oder eingerückt)
function jsonWie(j, alt){ const nl = /\n$/.test(alt) ? "\n" : "", body = alt.trim(); if(!/\n/.test(body)) return JSON.stringify(j) + nl;
  const m = body.match(/\n( *)["{\[]/), ein = m ? m[1].length : 0; return (ein ? JSON.stringify(j, null, ein) : JSON.stringify(j, null, 1).replace(/^ +/gm, "")) + nl; }
async function weltenSpeichern(){
  const nachDatei = new Map(); for(const op of AE.welten.values()){ if(!nachDatei.has(op.datei)) nachDatei.set(op.datei, []); nachDatei.get(op.datei).push(op); }
  const n = AE.welten.size;
  await ghCommit(`Verwaltung: ${n} ${n === 1 ? "Änderung" : "Änderungen"} in den Welten`, async () => {
    const out = [];
    for(const [datei, ops] of nachDatei){ const alt = await ghDateiText(datei); const j = JSON.parse(alt); ops.forEach(op => weltAnwenden(j, op)); out.push({pfad: datei, text: jsonWie(j, alt)}); }
    return out;
  });
  AE.welten.clear(); for(const k of Object.keys(WD)) delete WD[k];
}
async function weltenZahlen(){
  const [k, a, f, b, r, p] = await Promise.all(["welten/karte/kantone.js", PA, PF, "welten/spielwelt/bilder.json", PR, PP].map(x => (x.endsWith(".json") ? weltDaten(x) : weltDatei(x)).catch(() => null)));
  const summe = (l, fn) => (l || []).reduce((s, x) => s + fn(x), 0);
  return {
    karte:{kantone: k ? new Set([...k.text.matchAll(/"([A-Z]{2})":"M/g)].map(m => m[1])).size : null},
    album:{karten: a ? a.k.length : null, aus: a && a.aus ? a.aus.length : 0, kap: a ? (a.kap || []).length : null},
    feste:{feste: f ? Object.keys(f).length : null, fragen: f ? summe(Object.values(f), l => l.length) : null},
    sw:{bilder: Array.isArray(b) ? b.length : null, reihen: r ? r.kategorien.length : null, reihenEintraege: r ? summe(r.kategorien, k => (k.eintraege || []).length) : null, reihenAus: r ? summe(r.kategorien, k => (k.gesperrt || []).length) : 0,
        saetze: p ? p.saetze.length : null, paare: p ? summe(p.saetze, s => (s.paare || []).length) : null, paareAus: p ? summe(p.saetze, s => (s.gesperrt || []).length) : 0, kantone: p ? (p.kantone || []).length : null}
  };
}
const textFehler = t => { const p = []; if(/ß/.test(t)) p.push("«ß» wird beim Übernehmen durch «ss» ersetzt."); if(/[–—]/.test(t)) p.push("Gedankenstriche (lange Striche) sind nicht erlaubt, bitte Komma, Punkt oder Doppelpunkt verwenden."); return p; };

    <div class="welten">${WELTEN.map(w => { const m = meta(w); const c = (chips[w.id] || []).filter(([, n]) => n);

/* ---------- Feste-Fragen ---------- */
async function festeAnsicht(){
  const [basis, js] = await Promise.all([weltDatei(PF), weltDatei("feste.js").catch(() => null)]);
  const namen = {}; if(js) for(const m of js.text.matchAll(/\{id:"([a-z0-9-]+)", name:"([^"]+)", emo:"([^"]+)", deko:/g)) namen[m[1]] = {name:m[2], emo:m[3]};
  const daten = await weltDaten(PF), box = $("#wBox"); if(!box) return;
  const feste = [...new Set([...Object.keys(namen), ...Object.keys(daten)])];
  if(!feste.includes(WT.fest)) WT.fest = feste[0];
  const name = id => (namen[id] ? namen[id].emo + " " + namen[id].name : id);
  const eintraege = festeEintraege(basis.json, WT.fest);
  const aktiv = eintraege.filter(e => e.st !== "weg"), stufen = [1, 2, 3].map(l => aktiv.filter(e => +e.f.l === l).length);
  const probleme = e => festePruefen(e.f).filter(x => !/ersetzt|empfohlen/.test(x)).length;
  box.innerHTML = `<div class="leiste"><select id="wfFest" aria-label="Fest wählen">${feste.map(id => `<option value="${esc(id)}"${id === WT.fest ? " selected" : ""}>${esc(name(id))} (${(daten[id] || []).length})</option>`).join("")}</select>
      <span class="mu klein">${zahl(aktiv.length)} Fragen · Stufe 1: ${stufen[0]}, 2: ${stufen[1]}, 3: ${stufen[2]}</span><span class="rechts"></span><button type="button" class="k p" id="wfNeu">Neue Frage</button></div>
    <table><thead><tr><th>Nr.</th><th>St.</th><th>Frage</th><th>Richtige Antwort</th></tr></thead><tbody>${eintraege.map((e, i) => `<tr class="klick${e.st === "weg" ? " weg" : ""}${e.st ? " geaendert" : ""}" data-i="${i}"><td class="nowrap">${i + 1}${e.st ? ` <span class="wa" title="nicht gespeichert">●</span>` : ""}${probleme(e) ? ` <span class="fe" title="Prüfung nicht bestanden">⚠</span>` : ""}</td><td>${+e.f.l || "?"}</td><td>${esc(e.f.q)}${e.st === "neu" ? ' <span class="marke">neu</span>' : ""}</td><td class="klein">${esc((e.f.a || [])[0])}</td></tr>`).join("") || `<tr><td colspan="4" class="mu">Noch keine Fragen für dieses Fest.</td></tr>`}</tbody></table>
    <p class="mu klein">Zeile anklicken zum Bearbeiten. Die erste Antwort ist die richtige, die Website mischt die Reihenfolge. Regeln: vier verschiedene Antworten, Stufe 1 bis 3, kein «ß», keine Gedankenstriche.</p>`;
  $("#wfFest").onchange = e => { WT.fest = e.target.value; festeAnsicht(); };
  $("#wfNeu").onclick = () => festeDialog(null, WT.fest, name(WT.fest), basis.json);
  $$("#wBox tr[data-i]").forEach(tr => tr.onclick = () => festeDialog(eintraege[+tr.dataset.i], WT.fest, name(WT.fest), basis.json));
}
function festeEintraege(basis, fest){
  const out = (basis[fest] || []).map(f => { const key = "feste|" + fest + "|" + f.q, op = AE.welten.get(key); return {key, alt:f.q, f: op && op.neu ? op.neu : f, st: op ? (op.neu ? "geaendert" : "weg") : ""}; });
  for(const [key, op] of AE.welten) if(op.art === "feste" && op.fest === fest && op.alt == null) out.push({key, alt:null, f:op.neu, st:"neu"});
  return out;
}
function festePruefen(n){
  const p = [], a = (n.a || []).map(x => String(x || "").trim());
  if(!String(n.q || "").trim()) p.push("Die Frage fehlt.");
  if(a.length !== 4 || a.some(x => !x)) p.push("Alle vier Antworten ausfüllen.");
  else if(new Set(a.map(x => x.toLowerCase())).size !== 4) p.push("Die vier Antworten müssen verschieden sein.");
  if(![1, 2, 3].includes(+n.l)) p.push("Die Stufe muss 1, 2 oder 3 sein.");
  p.push(...textFehler([n.q, ...a, n.e].join(" ")));
  if(!String(n.e || "").trim()) p.push("Eine Erklärung ist empfohlen.");
  return p;
}
function festeDialog(e, fest, festName, basis){
  const f = e ? e.f : {q:"", a:["", "", "", ""], e:"", l:1}, d = $("#dlg");
  d.innerHTML = `<h2>${e ? "Frage bearbeiten" : "Neue Frage"}</h2><p class="mu klein" style="margin-top:-6px">${esc(festName)} · ${PF}</p>
    <div class="formular">
      <label for="wfL">Stufe</label><select id="wfL">${[1, 2, 3].map(l => `<option${+f.l === l ? " selected" : ""}>${l}</option>`).join("")}</select>
      <label for="wfQ">Frage</label><textarea id="wfQ">${esc(f.q)}</textarea>
      <label class="ok" for="wfA0">Richtige Antwort</label><input type="text" id="wfA0" value="${esc((f.a || [])[0])}">
      <label for="wfA1">Falsche Antwort 1</label><input type="text" id="wfA1" value="${esc((f.a || [])[1])}">
      <label for="wfA2">Falsche Antwort 2</label><input type="text" id="wfA2" value="${esc((f.a || [])[2])}">

/* ---------- Spielwelt: Reihen und Paare ---------- */
async function spielweltAnsicht(){
  const reihe = WT.sw !== "paare", pfad = reihe ? PR : PP;
  const [basis, daten, bilder] = await Promise.all([weltDatei(pfad), weltDaten(pfad), weltDatei("welten/spielwelt/bilder.json").catch(() => null)]);
  const box = $("#wBox"); if(!box) return;
  const gruppen = reihe ? daten.kategorien : daten.saetze, gKey = reihe ? "kat" : "satz";
  if(!gruppen.some(g => g.id === WT[gKey])) WT[gKey] = gruppen[0].id;
  const g = gruppen.find(x => x.id === WT[gKey]), gB = (reihe ? basis.json.kategorien : basis.json.saetze).find(x => x.id === g.id) || {};
  const feld = reihe ? "eintraege" : "paare", schl = reihe ? "n" : "l", art = reihe ? "reihe" : "paar";
  const zeilen = [...(g[feld] || []).map(e => ({e, aus:false})), ...(g.gesperrt || []).map(e => ({e, aus:true}))];
  const minimum = reihe ? 4 : 8, aktiv = (g[feld] || []).length;
  const opKey = name => art + "|" + g.id + "|" + name;
  box.innerHTML = `<div class="leiste"><div class="seg" style="margin:0" id="wSw"><button type="button" data-v="reihen" class="${reihe ? "an" : ""}">Reihenfolge und Zeitstrahl</button><button type="button" data-v="paare" class="${reihe ? "" : "an"}">Zuordnen (Paare)</button></div>
      <select id="wSwG" aria-label="Kategorie wählen">${gruppen.map(x => `<option value="${esc(x.id)}"${x.id === g.id ? " selected" : ""}>${esc((x.emo || "") + " " + x.titel)} (${(x[feld] || []).length})</option>`).join("")}</select>
      <span class="rechts mu klein">${bilder ? zahl(bilder.json.length) + " Bilder im Bild-Rätsel (" + groesse(bilder.bytes) + ")" : ""}</span></div>
    <div class="box klein">${reihe ? `<b>${esc(g.titel)}</b>: ${esc(g.frage)} · Einheit ${esc(g.einheit || "keine")} · ${g.richtung === "ab" ? "absteigend" : "aufsteigend"}${g.jahr ? " · Jahreszahlen" : ""} · ab Stufe ${+g.stufe || 1}${g.quelle ? ` · Quelle: ${esc(g.quelle)}` : ""}`
      : `<b>${esc(g.titel)}</b>: Spalten «${esc(g.links)}» und «${esc(g.rechts)}» · ab Stufe ${+g.stufe || 1}`}
      <br><span class="${aktiv < minimum ? "fe" : "mu"}">${zahl(aktiv)} aktiv${(g.gesperrt || []).length ? `, ${zahl(g.gesperrt.length)} gesperrt` : ""}. ${reihe ? "Das Spiel braucht mindestens 4 Einträge pro Kategorie." : "Für Stufe 3 braucht ein Satz mindestens 8 Paare (Stufe 1: 5, Stufe 2: 6)."}</span></div>
    <table><thead><tr>${reihe ? "<th>Name</th><th class=\"r\">Wert</th><th>Anzeige</th>" : `<th>${esc(g.links)}</th><th>${esc(g.rechts)}</th><th>Zusatz</th>`}<th>Status</th><th></th></tr></thead><tbody>
    ${zeilen.map(({e, aus}, i) => { const op = AE.welten.get(opKey(e[schl]));
      return `<tr class="${aus ? "weg" : ""}${op ? " geaendert" : ""}" data-i="${i}"><td>${esc(e[schl])}${op ? ' <span class="wa" title="nicht gespeichert">●</span>' : ""}</td>${reihe ? `<td class="r nowrap">${esc(Number(e.w).toLocaleString("de-CH", {useGrouping: !g.jahr}))} ${esc(g.jahr ? "" : g.einheit || "")}</td><td class="klein">${esc(e.t || "")}</td>` : `<td>${esc(e.r)}</td><td class="klein">${esc([e.e, e.f ? "Flagge " + e.f : ""].filter(Boolean).join(" · "))}</td>`}
        <td class="nowrap">${aus ? '<span class="wa">gesperrt</span>' : '<span class="ok">aktiv</span>'}</td><td class="nowrap"><button type="button" class="k" data-a="edit">Bearbeiten</button> <button type="button" class="k${aus ? "" : " g"}" data-a="sperren">${aus ? "Entsperren" : "Sperren"}</button></td></tr>`; }).join("")}</tbody></table>
    <p class="mu klein">Gesperrte Einträge bleiben in der Datei (Liste «gesperrt»), die Website zeigt sie aber nicht mehr. Namen sind der Schlüssel und lassen sich hier nicht umbenennen.</p>`;
  $("#wSw").onclick = ev => { const b = ev.target.closest("button"); if(!b) return; WT.sw = b.dataset.v; spielweltAnsicht(); };
  $("#wSwG").onchange = ev => { WT[gKey] = ev.target.value; spielweltAnsicht(); };
  // Basiszustand eines Eintrags (wie auf GitHub)
  const basisEintrag = name => { const e = (gB[feld] || []).find(x => x[schl] === name); if(e) return {e, aus:false}; const a = (gB.gesperrt || []).find(x => x[schl] === name); return a ? {e:a, aus:true} : null; };
  const setzeOp = (name, aenderung, text) => { const key = opKey(name), alt = AE.welten.get(key) || {datei:pfad, art, gruppe:g.id, name};
    const op = {...alt, ...aenderung, werte: {...(alt.werte || {}), ...(aenderung.werte || {})}};
    const b = basisEintrag(name); const felder = Object.keys(op.werte);
    const gleich = b && felder.every(k => String(b.e[k] ?? "") === String(op.werte[k] ?? "")) && (op.gesperrt == null || op.gesperrt === b.aus);
    if(gleich) AE.welten.delete(key); else { if(!felder.length) delete op.werte; op.text = `Spielwelt «${g.titel}»: ${name} ${text}`; AE.welten.set(key, op); }
    aenderungenZeigen(); spielweltAnsicht(); };
  $$("#wBox tr[data-i]").forEach(tr => { const {e, aus} = zeilen[+tr.dataset.i];
    tr.querySelector('[data-a="sperren"]').onclick = () => { if(!aus && aktiv - 1 < minimum && !confirm(`Danach hat «${g.titel}» nur noch ${aktiv - 1} aktive Einträge. Trotzdem sperren?`)) return; setzeOp(e[schl], {gesperrt: !aus}, aus ? "entsperrt" : "gesperrt"); };
    tr.querySelector('[data-a="edit"]').onclick = () => spielweltDialog(reihe, g, e, werte => setzeOp(e[schl], {werte}, "geändert"));
  });
}
function spielweltDialog(reihe, g, e, ok){
  const d = $("#dlg");
  d.innerHTML = `<h2>${esc(reihe ? e.n : e.l)}</h2><p class="mu klein" style="margin-top:-6px">${esc(g.titel)} · ${reihe ? PR : PP}</p>
    <div class="formular">${reihe ? `<label for="wsW">Wert${g.einheit ? " (" + esc(g.einheit) + ")" : ""}</label><input type="number" id="wsW" step="any" value="${esc(e.w)}">
      <label for="wsT">Anzeige (optional)</label><input type="text" id="wsT" value="${esc(e.t || "")}" placeholder="z. B. etwa 150 Tonnen">`

      <label for="wsE">Emoji (optional)</label><input type="text" id="wsE" value="${esc(e.e || "")}">

    <div class="leiste" style="margin:0"><span class="rechts"></span><button type="button" class="k" id="wsAbbr">Abbrechen</button><button type="button" class="k p" id="wsOk">Übernehmen</button></div>`;

  const pruefen = () => { const n = lesen(), p = [];

  $("#wsAbbr").onclick = () => d.close();
  $("#wsOk").onclick = () => { if(!pruefen()) return; d.close(); ok(ohneSz(lesen())); melde("Übernommen. Zum Veröffentlichen unten «Speichern» drücken."); };
}

/* ---------- Album-Karten ---------- */
async function albumAnsicht(){
  const [basis, j] = await Promise.all([weltDatei(PA), weltDaten(PA)]); const box = $("#wBox"); if(!box) return;
  const kap = j.kap || [], liz = j.liz || [], basisAus = new Set((basis.json.aus || []).map(c => c[0]));
  const pos = new Map([...basis.json.k, ...(basis.json.aus || [])].map((c, i) => [c[0], i]));
  const alle = [...j.k.map(c => ({c, aus:false})), ...(j.aus || []).map(c => ({c, aus:true}))].sort((x, y) => (pos.get(x.c[0]) ?? 1e9) - (pos.get(y.c[0]) ?? 1e9));
  const q = WT.aSuche.toLowerCase();
  const l = alle.filter(({c, aus}) => (!WT.aKap || String(c[2]) === WT.aKap) && (!q || (c[1] + " " + (c[7] || "")).toLowerCase().includes(q))
    && (WT.aArt !== "aus" || aus) && (WT.aArt !== "aktiv" || !aus) && (WT.aArt !== "ae" || AE.welten.has("album|" + c[0])));
  const pro = 48, seiten = Math.max(1, Math.ceil(l.length / pro)); WT.aSeite = Math.min(WT.aSeite, seiten - 1);
  box.innerHTML = `<div class="leiste"><input type="search" id="waSuche" placeholder="Titel oder Fakt" value="${esc(WT.aSuche)}" style="min-width:220px">
      <select id="waKap" aria-label="Kapitel"><option value="">alle Kapitel</option>${kap.map((k, i) => `<option value="${i}"${WT.aKap === String(i) ? " selected" : ""}>${esc(k[2])}</option>`).join("")}</select>
      <select id="waArt" aria-label="Auswahl">${[["", "alle Karten"], ["aktiv", "sichtbare"], ["aus", "ausgeblendete"], ["ae", "nur geänderte"]].map(([v, t]) => `<option value="${v}"${WT.aArt === v ? " selected" : ""}>${t}</option>`).join("")}</select>
      <span class="rechts mu klein">${zahl(l.length)} von ${zahl(alle.length)} Karten · ${zahl(j.k.length)} sichtbar</span></div>
    <div class="bilder">${l.slice(WT.aSeite * pro, WT.aSeite * pro + pro).map(({c, aus}) => { const [id, titel, ki, , urheber, li, datei, fakt] = c; const k = kap[ki] || [];
      const quelle = String(datei || "").startsWith("c:") ? "https://commons.wikimedia.org/wiki/File:" + String(datei).slice(2) : String(datei || "");
      return `<div class="bild${aus ? " aus" : ""}${AE.welten.has("album|" + id) ? " geaendert" : ""}" data-id="${esc(id)}"><img src="${esc(B + "bilder/" + id.slice(-2) + "/" + id + ".webp")}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;leer&quot;>Bild nur online</div>'">
        <b>${esc(titel)}</b><span class="mu">${esc(k[2] || "")}</span><span class="bfakt">${esc(fakt || "")}</span><span class="mu">${esc(urheber || "")} · ${esc(liz[li] || "")}</span>
        <div class="ak">${aus ? '<button type="button" class="k" data-a="an">Wieder zeigen</button>' : '<button type="button" class="k g" data-a="aus">Ausblenden</button>'}${quelle ? `<a class="k" href="${esc(quelle)}" target="_blank" rel="noopener noreferrer">Quelle</a>` : ""}</div></div>`; }).join("") || '<p class="mu">Keine Karten gefunden.</p>'}</div>
    <div class="seiten"><button type="button" class="k" id="waZur"${WT.aSeite ? "" : " disabled"}>‹</button><span class="mu">Seite ${WT.aSeite + 1} von ${seiten}</span><button type="button" class="k" id="waVor"${WT.aSeite < seiten - 1 ? "" : " disabled"}>›</button></div>
    <p class="mu klein">Ausgeblendete Karten (z. B. bei einem ungeeigneten Bild) kommen in die Liste «aus» der Datei. Kinder können sie nicht mehr ziehen, bereits gesammelte zählen nicht mehr mit. Die Kartennummern im Album rücken nach.</p>`;
  let t; $("#waSuche").oninput = e => { clearTimeout(t); t = setTimeout(() => { WT.aSuche = e.target.value.trim(); WT.aSeite = 0; albumAnsicht().then(() => { const s = $("#waSuche"); if(s){ s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }); }, 250); };
  $("#waKap").onchange = e => { WT.aKap = e.target.value; WT.aSeite = 0; albumAnsicht(); };
  $("#waArt").onchange = e => { WT.aArt = e.target.value; WT.aSeite = 0; albumAnsicht(); };
  $("#waZur").onclick = () => { WT.aSeite--; albumAnsicht(); }; $("#waVor").onclick = () => { WT.aSeite++; albumAnsicht(); };
  $$("#wBox .bild[data-id]").forEach(el => el.querySelectorAll("button[data-a]").forEach(b => b.onclick = () => {
    const id = el.dataset.id, aus = b.dataset.a === "aus", key = "album|" + id, titel = el.querySelector("b").textContent;
    if(aus === basisAus.has(id)) AE.welten.delete(key); else AE.welten.set(key, {datei:PA, art:"album", id, gesperrt:aus, text:`Album-Karte «${titel}» ${aus ? "ausblenden" : "wieder zeigen"}`});
    aenderungenZeigen(); albumAnsicht(); }));
}

  const aus = $("#zSbAus"); if(aus) aus.onclick = () => { store.del("ep-admin-sb"); statusZeigen(); zeige("zugang"); };
  if(s && $("#zAdmin")){ try{ const ja = await rpc("ist_admin"); $("#zAdmin").innerHTML = ja ? '<span class="ok">Admin</span>' : '<span class="fe">kein Admin (siehe Einrichtung, Schritt 4)</span>'; }catch(e){ $("#zAdmin").innerHTML = `<span class="fe">${esc(e.message)}</span>`; } }
};

/* ======================= Speichern ======================= */
$("#aeVerwerfen").onclick = () => { if(!confirm("Alle nicht gespeicherten Änderungen verwerfen?")) return; AE.fragen.clear(); AE.bilder.clear(); if(AE.freigabe) AE.freigabe.clear(); AE.welten.clear(); aenderungenZeigen(); zeige(TAB); };
$("#aeListe").onclick = () => { const d = $("#dlg");
  d.innerHTML = `<h2>Nicht gespeicherte Änderungen</h2><ul>${[...AE.fragen].map(([nr, a]) => `<li>Frage ${nr}: ${a.loeschen ? "löschen" : a.neu._neu && !DATEN.fragen.some(f => +f.nr === nr) ? "neu" : "geändert"} · ${esc((a.neu.q||"").slice(0,80))}</li>`).join("")}${AE.freigabe && AE.freigabe.size ? `<li>${AE.freigabe.size} Bilder als passend markiert</li>` : ""}${[...AE.bilder].map(([k, a]) => `<li>Bild «${esc((DATEN.seiten||[]).find(s => s.k === k)?.t || k)}»: ${a.entfernen ? "entfernen" : a.upload ? "eigenes Bild" : "ersetzen"}</li>`).join("")}${[...AE.welten.values()].map(op => `<li>${esc(op.text)} <span class="mu klein">(${esc(op.datei)})</span></li>`).join("")}</ul><div class="leiste"><span class="rechts"></span><button class="k" id="dZu">Schliessen</button></div>`;
  d.showModal(); $("#dZu").onclick = () => d.close(); };
$("#aeSpeichern").onclick = async () => { const b = $("#aeSpeichern"); b.disabled = true; b.textContent = "Speichert …";
  try{ if(AE.fragen.size) await fragenSpeichern(); if(AE.bilder.size || (AE.freigabe && AE.freigabe.size)) await bilderSpeichern(); if(AE.welten.size) await weltenSpeichern(); melde("Gespeichert. In 1 bis 2 Minuten auf der Website; Bilder werden danach automatisch lokal kopiert."); aenderungenZeigen(); zeige(TAB); }
  catch(e){ melde("Speichern fehlgeschlagen: " + e.message, "fe"); }
  finally{ b.disabled = false; b.textContent = "Speichern"; } };

/* ======================= Anmeldung ======================= */
// Passwörter sind nur als PBKDF2-Prüfwert (600 000 Runden) gespeichert, nie im Klartext.
const KONTEN = { "dejan": {salt:"eBxtEj0aBUr7Cq6ZS3v9nA==", hash:"QlE4uUhCqZ37OJAwVARp+TQ0ExoACyiFsuT7BazMjRU="} };
const ab64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pbkdf2(pw, salt, bits){ const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:600000}, k, bits)); }
let SCHLUESSEL = null;   // AES-Schlüssel aus dem Passwort, nur im Speicher, zum Verschlüsseln des GitHub-Tokens
async function aesAusPasswort(pw){ const roh = await pbkdf2(pw, new TextEncoder().encode("easyplay-verwaltung-token"), 256); return crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["encrypt","decrypt"]); }
async function tokenVerschluesseln(t){ if(!SCHLUESSEL) return false; const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, SCHLUESSEL, new TextEncoder().encode(t)));
  try{ localStorage.setItem("ep-admin-gh-enc", JSON.stringify({iv:b64(iv), c:b64(c)})); }catch(e){} return true; }
async function tokenEntschluesseln(){ try{ const e = JSON.parse(localStorage.getItem("ep-admin-gh-enc") || "null"); if(!e || !SCHLUESSEL) return "";
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:ab64(e.iv)}, SCHLUESSEL, ab64(e.c))); }catch(e){ return ""; } }
function abmelden(){ if(AE.fragen.size + AE.bilder.size && !confirm("Nicht gespeicherte Änderungen gehen verloren. Trotzdem abmelden?")) return;
  AE.fragen.clear(); AE.bilder.clear(); store.del("ep-admin-sitzung"); try{ sessionStorage.removeItem("ep-admin-gh"); }catch(e){} SCHLUESSEL = null; location.replace(location.pathname); }
function angemeldet(){ const l = store.get("ep-admin-sitzung", null); return l && l.bis > Date.now() && KONTEN[l.name]; }
async function anmelden(e){
  e.preventDefault(); const f = $("#lFehler"), btn = $("#lGo");
  const sperre = store.get("ep-admin-sperre", {n:0, bis:0});
  if(sperre.bis > Date.now()){ f.textContent = `Zu viele Fehlversuche. Bitte ${Math.ceil((sperre.bis - Date.now())/60000)} Minuten warten.`; return; }
  btn.disabled = true; btn.textContent = "Prüfe …"; f.textContent = "";
  const name = $("#lName").value.trim().toLowerCase(), pw = $("#lPw").value, k = KONTEN[name];
  let ok = false;
  try{ const h = await pbkdf2(pw, ab64(k ? k.salt : "AAAAAAAAAAAAAAAAAAAAAA=="), 256); ok = !!k && b64(h) === k.hash; }catch(err){}
  if(!ok){ sperre.n++; if(sperre.n >= 5){ sperre.bis = Date.now() + 5*60000; sperre.n = 0; } store.set("ep-admin-sperre", sperre, true);
    f.textContent = "Benutzername oder Passwort falsch."; btn.disabled = false; btn.textContent = "Anmelden"; return; }
  store.del("ep-admin-sperre");
  store.set("ep-admin-sitzung", {name, bis: Date.now() + 8*3600000});
  SCHLUESSEL = await aesAusPasswort(pw);
  const t = await tokenEntschluesseln(); if(t) store.set("ep-admin-gh", t);
  $("#lPw").value = ""; starten();
}
$("#lForm").onsubmit = anmelden;
function starten(){
  try{ localStorage.removeItem("ep-admin-gh"); }catch(e){}   // alte, unverschlüsselte Ablage entfernen
  $("#login").hidden = true; $("#login").style.display = "none"; $("#app").hidden = false;
  statusZeigen(); aenderungenZeigen();
  zeige(TABS[location.hash.slice(1)] ? location.hash.slice(1) : "uebersicht");
  setInterval(() => { if(!angemeldet()) abmelden(); }, 60000);
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => { const f = $("#kopfFz"); if(!f) return; f.src = "../img/fragezeichen-zwinkern.webp"; setTimeout(() => f.src = "../img/fragezeichen.webp", 350); }, 7000);
}

/* ======================= Start ======================= */
if(angemeldet()) starten(); else { $("#lName").focus(); }
