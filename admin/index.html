<style>

<script>
"use strict";
/* ======================= Grundlagen ======================= */
const B = "../";   // Website-Wurzel (die Verwaltung liegt unter /admin/)
const REPO = "djsunji/easyplay", ZWEIG = "main", GH = "https://api.github.com/repos/" + REPO;
const CFG = window.EP_CONFIG || {};
const $ = (q, el) => (el || document).querySelector(q);
const $$ = (q, el) => [...(el || document).querySelectorAll(q)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const zahl = n => (n == null || isNaN(n)) ? "-" : Number(n).toLocaleString("de-CH");
const datum = d => d ? new Date(d).toLocaleString("de-CH", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit"}) : "-";
const tag = d => d ? new Date(d).toLocaleDateString("de-CH", {day:"2-digit", month:"2-digit", year:"numeric"}) : "-";
const proz = (a, b) => b ? Math.round(a / b * 1000) / 10 + " %" : "-";
function melde(t, art){ const m=$("#meldung"); m.textContent=t; m.classList.toggle("fe", art==="fe"); m.style.display="block"; clearTimeout(m._t); m._t=setTimeout(()=>m.style.display="none", art==="fe"?8000:3500); }
const store = {
  get(k, d){ try{ const v = sessionStorage.getItem(k) ?? localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v, dauerhaft){ try{ (dauerhaft ? localStorage : sessionStorage).setItem(k, JSON.stringify(v)); if(!dauerhaft) localStorage.removeItem(k); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); localStorage.removeItem(k); }catch(e){} }
};
const DATEN = { fragen:null, themen:{}, bereiche:{}, themaBereich:{}, bildindex:null, seiten:null, gesperrt:null, repo:null };
const AE = { fragen:new Map(), bilder:new Map(), dateien:new Map() };   // offene Änderungen

/* ======================= GitHub ======================= */
const ghToken = () => store.get("ep-admin-gh", "");
async function gh(pfad, opt){
  opt = opt || {};
  const h = {Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"};
  const t = ghToken(); if(t) h.Authorization = "Bearer " + t;
  if(opt.body) h["Content-Type"] = "application/json";
  const r = await fetch(pfad.startsWith("http") ? pfad : GH + pfad, {method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: "no-store"});
  if(!r.ok){ let m = r.status + ""; try{ m += " " + (await r.json()).message; }catch(e){} throw new Error("GitHub: " + m); }
  if(r.status === 204) return null;
  return opt.raw ? r.text() : r.json();
}
async function ghDateiText(pfad){ return gh("/contents/" + pfad.split("/").map(encodeURIComponent).join("/") + "?ref=" + ZWEIG, {raw:true}); }
// Gleiches Format wie die Python-Werkzeuge: eine Frage pro Zeile, «, » und «: » als Trenner
const pyJson = v => Array.isArray(v) ? "[" + v.map(pyJson).join(", ") + "]" : (v && typeof v === "object") ? "{" + Object.keys(v).map(k => JSON.stringify(k) + ": " + pyJson(v[k])).join(", ") + "}" : JSON.stringify(v);
const fragenDatei = liste => "[\n" + liste.map(pyJson).join(",\n") + "\n]\n";
const b64 = buf => { const b = new Uint8Array(buf); let s = ""; for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(s); };
// Mehrere Dateien in einem Commit speichern. bauen(): liefert [{pfad, text}|{pfad, base64}] und wird bei einem Konflikt neu aufgerufen.
async function ghCommit(nachricht, bauen){
  if(!ghToken()) throw new Error("Kein GitHub-Schlüssel. Bitte unter «Zugang» eintragen.");
  for(let versuch=0; versuch<3; versuch++){
    const ref = await gh("/git/ref/heads/" + ZWEIG);
    const basis = await gh("/git/commits/" + ref.object.sha);
    const dateien = await bauen();
    const baum = [];
    for(const d of dateien){
      const blob = await gh("/git/blobs", {method:"POST", body: d.base64 != null ? {content:d.base64, encoding:"base64"} : {content:d.text, encoding:"utf-8"}});
      baum.push({path:d.pfad, mode:"100644", type:"blob", sha:blob.sha});
    }
    const tree = await gh("/git/trees", {method:"POST", body:{base_tree: basis.tree.sha, tree: baum}});
    const commit = await gh("/git/commits", {method:"POST", body:{message: nachricht, tree: tree.sha, parents:[ref.object.sha]}});
    try{ await gh("/git/refs/heads/" + ZWEIG, {method:"PATCH", body:{sha: commit.sha, force:false}}); return commit; }
    catch(e){ if(!/422|409/.test(e.message) || versuch===2) throw e; }
  }
}

/* ======================= Supabase ======================= */
const SB = { url:(CFG.supabaseUrl||"").replace(/\/$/,""), key:CFG.supabaseKey||"" };
const sbAn = () => !!(SB.url && SB.key);
const sbSitzung = () => store.get("ep-admin-sb", null);
async function sbLogin(mail, pw){
  const r = await fetch(SB.url + "/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:SB.key, "Content-Type":"application/json"}, body: JSON.stringify({email:mail, password:pw})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || "Anmeldung fehlgeschlagen");
  store.set("ep-admin-sb", {token:j.access_token, refresh:j.refresh_token, bis:Date.now() + (j.expires_in||3600)*1000, mail:j.user?.email});
}
async function sbToken(){
  const s = sbSitzung(); if(!s) return null;
  if(Date.now() < s.bis - 60000) return s.token;
  const r = await fetch(SB.url + "/auth/v1/token?grant_type=refresh_token", {method:"POST", headers:{apikey:SB.key, "Content-Type":"application/json"}, body: JSON.stringify({refresh_token:s.refresh})});
  if(!r.ok){ store.del("ep-admin-sb"); return null; }
  const j = await r.json(); store.set("ep-admin-sb", {...s, token:j.access_token, refresh:j.refresh_token, bis:Date.now() + (j.expires_in||3600)*1000}); return j.access_token;
}
async function rpc(name, args){
  const t = await sbToken(); if(!t) throw new Error("Nicht bei Supabase angemeldet (siehe «Zugang»).");
  const r = await fetch(SB.url + "/rest/v1/rpc/" + name, {method:"POST", headers:{apikey:SB.key, Authorization:"Bearer " + t, "Content-Type":"application/json"}, body: JSON.stringify(args||{})});

async function ladeFragen(){
  if(DATEN.fragen) return DATEN.fragen;
  const teile = CFG.fragenDateien || [];
  const res = await Promise.all(teile.map(f => fetch(B + f, {cache:"no-cache"}).then(r => r.ok ? r.json() : []).catch(() => [])));
  const alle = [];
  res.forEach((liste, i) => (liste||[]).forEach(f => alle.push({...f, _datei: teile[i]})));
  DATEN.fragen = alle;
  try{
    const html = await fetch(B + "index.html", {cache:"no-cache"}).then(r => r.text());
    for(const m of html.matchAll(/\{id:"([a-z0-9_]+)", name:"([^"]+)"/g)) DATEN.themen[m[1]] = m[2];
    // Bereiche: Zeilen mit 2 Leerzeichen sind Hauptbereiche, mit 4 Leerzeichen Themen
    const block = html.slice(html.indexOf("const BEREICHE = ["), html.indexOf("const THEMA = {}"));
    let akt = null;
    for(const z of block.split("\n")){ const m = z.match(/^( {2,4})\{id:"([a-z0-9_]+)", name:"([^"]+)"/); if(!m) continue;
      if(m[1].length === 2){ akt = m[2]; DATEN.bereiche[akt] = m[3]; } else if(akt){ DATEN.themaBereich[m[2]] = akt; } }
    for(const m of html.matchAll(/\{id:"([a-z0-9_]+)", name:"[^"]+"[^}]*?parent:"([^"]+)"/g)){
      const p = m[2].replace("submenu:", ""); DATEN.themaBereich[m[1]] = DATEN.themaBereich[p] || (p === "geschmenu" ? DATEN.themaBereich.geschichte : p === "chmenu" ? DATEN.themaBereich.schweiz : null); }
  }catch(e){}
  return alle;
}
const bereichVon = t => DATEN.themaBereich[t] || (t && t.startsWith("kt_") ? DATEN.themaBereich.schweiz : t && t.startsWith("g_") ? DATEN.themaBereich.geschichte : null) || "andere";
const themaName = t => DATEN.themen[t] || (t && t.startsWith("kt_") ? "Kanton " + t.slice(3) : t);
async function ladeBilder(){
  if(!DATEN.bildindex) DATEN.bildindex = await fetch(B + "bildindex.json", {cache:"no-cache"}).then(r => r.json()).catch(() => ({}));
  if(!DATEN.seiten) DATEN.seiten = await fetch(B + "tools/bildseiten.json", {cache:"no-cache"}).then(r => r.json()).catch(() => []);
  return DATEN;
}

const PRUEF = {

function doppelteBerechnen(){ const z = new Map(); for(const f of DATEN.fragen||[]){ if(f.img) continue; const k = String(f.q||"").trim().toLowerCase() + "|" + String((f.a||[])[0]||"").trim(); z.set(k, (z.get(k)||0) + 1); } DOPPELT = new Set([...z].filter(([k,n]) => n > 1).map(([k]) => k)); }
const auffaellig = f => /ß|[–—]/.test([f.q, ...(f.a||[]), f.e, f.m].join(" ")) || new Set((f.a||[]).map(x => String(x).trim())).size !== 4 || (f.a||[]).some(x => !String(x).trim());
function aktuelleFrage(nr){ const a = AE.fragen.get(nr); if(a) return a.loeschen ? null : a.neu; return DATEN.fragen.find(f => +f.nr === +nr) || null; }
function gefilterteFragen(){

  for(const [nr, a] of AE.fragen) if(a.neu && a.neu._neu && !DATEN.fragen.some(f => +f.nr === nr)) basis.push(a.neu);
  return basis.filter(f => (!FF.stufe || +f.l === +FF.stufe) && (!FF.thema || f.t === FF.thema)

    <div class="seiten"><button class="k" id="fZur"${FF.seite ? "" : " disabled"}>‹</button><span class="mu">${zahl(l.length)} Fragen · Seite ${FF.seite + 1} von ${seiten}</span><button class="k" id="fVor"${FF.seite < seiten - 1 ? "" : " disabled"}>›</button></div>`;
  $("#fZur").onclick = () => { FF.seite--; liste(); }; $("#fVor").onclick = () => { FF.seite++; liste(); };

function fragenEdit(f){

      <label>Thema</label><select id="eT">${themen.map(t => `<option value="${esc(t)}"${f.t===t?" selected":""}>${esc(themaName(t))} (${esc(t)})</option>`).join("")}</select>

      <label>Falsche Antwort 3</label><input type="text" id="eA3" value="${esc((f.a||[])[3])}">
      <label>Erklärung</label><textarea id="eE">${esc(f.e)}</textarea>
      <label>Merksatz</label><textarea id="eM" style="min-height:40px">${esc(f.m)}</textarea>
      <label>Quelle</label><input type="text" id="eS" value="${esc(f.s)}">
      <label>Bild (Code)</label><input type="text" id="eI" value="${esc(f.img||"")}" placeholder="leer = kein Bild">
    </div>
    <p id="ePruef" class="klein"></p>
    <div class="leiste" style="margin:0"><span class="rechts"></span>${ae ? '<button class="k" id="eZurueck">Änderung verwerfen</button>' : ""}<button class="k p" id="eOk">Übernehmen</button></div></div>`;
  const lesen = () => { const neu = {...f}; delete neu._weg;

  $$("#fEdit input,#fEdit textarea,#fEdit select").forEach(el => el.oninput = pruefen); pruefen();

    aenderungenZeigen(); liste(); fragenEdit(n); melde("Übernommen. Zum Veröffentlichen unten «Speichern» drücken."); };
  const weg = $("#eWeg"); if(weg) weg.onclick = () => { if(ae && ae.loeschen) AE.fragen.delete(+f.nr); else AE.fragen.set(+f.nr, {loeschen:true, neu:f}); aenderungenZeigen(); liste(); fragenEdit(DATEN.fragen.find(x => +x.nr === +f.nr) || f); };
  const zur = $("#eZurueck"); if(zur) zur.onclick = () => { AE.fragen.delete(+f.nr); aenderungenZeigen(); liste(); const o = DATEN.fragen.find(x => +x.nr === +f.nr); if(o) fragenEdit(o); else $("#fEdit").innerHTML = ""; };
}
async function fragenSpeichern(){
  const nachDatei = new Map();
  for(const [nr, a] of AE.fragen){ const d = a.neu._datei; if(!nachDatei.has(d)) nachDatei.set(d, []); nachDatei.get(d).push([nr, a]); }
  const anzahl = AE.fragen.size;
  await ghCommit(`Verwaltung: ${anzahl} ${anzahl === 1 ? "Frage" : "Fragen"} bearbeitet`, async () => {
    const out = [];
    for(const [datei, liste] of nachDatei){
      const aktuell = JSON.parse(await ghDateiText(datei));   // immer die neuste Fassung von GitHub
      for(const [nr, a] of liste){
        const i = aktuell.findIndex(f => +f.nr === +nr);
        if(a.loeschen){ if(i >= 0) aktuell.splice(i, 1); continue; }
        const sauber = {}; for(const k of ["nr","t","l","q","a","e","m","s","img"]) if(a.neu[k] !== undefined && a.neu[k] !== "") sauber[k] = a.neu[k];
        if(i >= 0) aktuell[i] = sauber; else aktuell.push(sauber);
      }
      out.push({pfad: datei, text: fragenDatei(aktuell)});
    }
    return out;
  });
  AE.fragen.clear(); DATEN.fragen = null;
}

async function commonsInfo(eingabe){
  let datei = String(eingabe).trim();
  const m = datei.match(/(?:File|Datei):([^?#]+)/i) || datei.match(/upload\.wikimedia\.org\/.+\/(?:\d+px-)?([^/?#]+)$/);
  if(m) datei = decodeURIComponent(m[1]); datei = datei.replace(/_/g, " ");
  const u = "https://commons.wikimedia.org/w/api.php?" + new URLSearchParams({action:"query", format:"json", formatversion:"2", origin:"*", titles:"File:" + datei, prop:"imageinfo", iiprop:"url|size|mime|extmetadata", iiurlwidth:"960", iiextmetadatafilter:"Artist|LicenseShortName"});
  const j = await fetch(u).then(r => r.json());
  const p = j?.query?.pages?.[0]; const ii = p?.imageinfo?.[0];
  if(!ii) throw new Error("Datei auf Wikimedia Commons nicht gefunden.");
  const md = ii.extmetadata || {}; const txt = h => { const d = new DOMParser().parseFromString(String(h||""), "text/html"); return (d.body.textContent||"").replace(/\s+/g, " ").trim().slice(0,120); };
  return {url: ii.thumburl || ii.url, urheber: txt(md.Artist?.value) || "Wikimedia Commons", lizenz: txt(md.LicenseShortName?.value), quelle: ii.descriptionurl, breite: ii.width, hoehe: ii.height, mime: ii.mime};
}
function bildVerkleinern(datei, max){
  return new Promise((ok, fehler) => { const img = new Image(); img.onload = () => { const f = Math.min(1, max[0] / img.naturalWidth, max[1] / img.naturalHeight);
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : fehler(new Error("WebP nicht möglich")), "image/webp", max[2]); URL.revokeObjectURL(img.src); };
    img.onerror = () => fehler(new Error("Bild kann nicht gelesen werden")); img.src = URL.createObjectURL(datei); });
}

async function bilderSpeichern(){
  const n = AE.bilder.size;
  const uploads = [];
  for(const [k, a] of AE.bilder) if(a.upload) uploads.push({pfad: bildPfad(k), base64: b64(await a.upload.klein.arrayBuffer())}, {pfad: bildPfad(k, true), base64: b64(await a.upload.gross.arrayBuffer())});
  await ghCommit(`Verwaltung: ${n} ${n === 1 ? "Bild" : "Bilder"} geändert`, async () => {
    const ix = JSON.parse(await ghDateiText("bildindex.json"));
    let gesperrt = []; try{ gesperrt = JSON.parse(await ghDateiText("tools/bilder_gesperrt.json")); }catch(e){}
    const ohne = new Set(ix._ohne || []);
    for(const [k, a] of AE.bilder){
      const vorher = ix[k];
      if(vorher && vorher[0] && vorher[5] !== "e" && (a.entfernen || a.eintrag)) gesperrt.push(vorher[0]);
      if(a.entfernen){ delete ix[k]; ohne.add(k); }
      else { ix[k] = a.eintrag; ohne.delete(k); }
    }
    ix._ohne = [...ohne].sort();
    return [{pfad:"bildindex.json", text: JSON.stringify(ix)}, {pfad:"tools/bilder_gesperrt.json", text: JSON.stringify([...new Set(gesperrt)].sort(), null, 0)}, ...uploads];
  });
  for(const [k, a] of AE.bilder){ if(a.entfernen) delete DATEN.bildindex[k]; else DATEN.bildindex[k] = a.eintrag; }
  AE.bilder.clear();
}

      <li>Der Schlüssel liegt nur in diesem Browser. Mit «merken» wird er mit deinem Passwort verschlüsselt gespeichert und nach der Anmeldung automatisch geladen. Auf fremden Geräten nicht anhaken.</li>
      <li>Nach 8 Stunden wirst du automatisch abgemeldet. Nach 5 falschen Passwörtern ist die Anmeldung 5 Minuten gesperrt.</li>
      <li>Supabase prüft bei jeder Aktion serverseitig, ob du Admin bist.</li></ul></div>
  </div></div>`;
  $("#zGhOk").onclick = async () => { const t = $("#zGh").value.trim(); if(!t){ store.del("ep-admin-gh"); statusZeigen(); return; }
    store.set("ep-admin-gh", t);
    if($("#zGhMerken").checked){ if(!SCHLUESSEL){ const pw = prompt("Zum verschlüsselten Speichern bitte dein Verwaltungs-Passwort eingeben:"); if(pw) SCHLUESSEL = await aesAusPasswort(pw); }
      if(!(await tokenVerschluesseln(t))) melde("Nicht gespeichert: Passwort fehlt.", "fe"); } else { try{ localStorage.removeItem("ep-admin-gh-enc"); }catch(e){} }
    try{ const r = await gh(""); const ok = r.permissions && r.permissions.push; $("#zGhInfo").innerHTML = ok ? '<span class="ok">Verbunden, Schreibrechte vorhanden.</span>' : '<span class="fe">Verbunden, aber ohne Schreibrechte. Contents: Read and write setzen.</span>'; }
    catch(e){ $("#zGhInfo").innerHTML = `<span class="fe">${esc(e.message)}</span>`; store.del("ep-admin-gh"); }
    statusZeigen(); };
  $("#zGhWeg").onclick = () => { store.del("ep-admin-gh"); try{ localStorage.removeItem("ep-admin-gh-enc"); }catch(e){} $("#zGh").value = ""; statusZeigen(); $("#zGhInfo").textContent = "Entfernt."; };
  const an = $("#zSbAn"); if(an) an.onclick = async () => { try{ await sbLogin($("#zMail").value.trim(), $("#zPw").value); statusZeigen(); zeige("zugang"); }catch(e){ $("#zSbInfo").innerHTML = `<span class="fe">${esc(e.message)}</span>`; } };
  const aus = $("#zSbAus"); if(aus) aus.onclick = () => { store.del("ep-admin-sb"); statusZeigen(); zeige("zugang"); };
  if(s && $("#zAdmin")){ try{ const ja = await rpc("ist_admin"); $("#zAdmin").innerHTML = ja ? '<span class="ok">Admin</span>' : '<span class="fe">kein Admin (siehe Einrichtung, Schritt 4)</span>'; }catch(e){ $("#zAdmin").innerHTML = `<span class="fe">${esc(e.message)}</span>`; } }
};

/* ======================= Speichern ======================= */
$("#aeVerwerfen").onclick = () => { if(!confirm("Alle nicht gespeicherten Änderungen verwerfen?")) return; AE.fragen.clear(); AE.bilder.clear(); aenderungenZeigen(); zeige(TAB); };
$("#aeListe").onclick = () => { const d = $("#dlg");
  d.innerHTML = `<h2>Nicht gespeicherte Änderungen</h2><ul>${[...AE.fragen].map(([nr, a]) => `<li>Frage ${nr}: ${a.loeschen ? "löschen" : a.neu._neu && !DATEN.fragen.some(f => +f.nr === nr) ? "neu" : "geändert"} · ${esc((a.neu.q||"").slice(0,80))}</li>`).join("")}${[...AE.bilder].map(([k, a]) => `<li>Bild «${esc((DATEN.seiten||[]).find(s => s.k === k)?.t || k)}»: ${a.entfernen ? "entfernen" : a.upload ? "eigenes Bild" : "ersetzen"}</li>`).join("")}</ul><div class="leiste"><span class="rechts"></span><button class="k" id="dZu">Schliessen</button></div>`;
  d.showModal(); $("#dZu").onclick = () => d.close(); };
$("#aeSpeichern").onclick = async () => { const b = $("#aeSpeichern"); b.disabled = true; b.textContent = "Speichert …";
  try{ if(AE.fragen.size) await fragenSpeichern(); if(AE.bilder.size) await bilderSpeichern(); melde("Gespeichert. In 1 bis 2 Minuten auf der Website; Bilder werden danach automatisch lokal kopiert."); aenderungenZeigen(); zeige(TAB); }
  catch(e){ melde("Speichern fehlgeschlagen: " + e.message, "fe"); }
  finally{ b.disabled = false; b.textContent = "Speichern"; } };

/* ======================= Anmeldung ======================= */
// Passwörter sind nur als PBKDF2-Prüfwert (600 000 Runden) gespeichert, nie im Klartext.
const KONTEN = { "dejan": {salt:"8feob5vLkLbgRAdD1FFkrg==", hash:"ZQT6VXj1ZoowgO2dtdROKyS9U1ISxz/SJFEZ3cW3H4Y="} };
const ab64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function pbkdf2(pw, salt, bits){ const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt, iterations:600000}, k, bits)); }
let SCHLUESSEL = null;   // AES-Schlüssel aus dem Passwort, nur im Speicher, zum Verschlüsseln des GitHub-Tokens
async function aesAusPasswort(pw){ const roh = await pbkdf2(pw, new TextEncoder().encode("easyplay-verwaltung-token"), 256); return crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["encrypt","decrypt"]); }
async function tokenVerschluesseln(t){ if(!SCHLUESSEL) return false; const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, SCHLUESSEL, new TextEncoder().encode(t)));
  try{ localStorage.setItem("ep-admin-gh-enc", JSON.stringify({iv:b64(iv), c:b64(c)})); }catch(e){} return true; }
async function tokenEntschluesseln(){ try{ const e = JSON.parse(localStorage.getItem("ep-admin-gh-enc") || "null"); if(!e || !SCHLUESSEL) return "";
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:ab64(e.iv)}, SCHLUESSEL, ab64(e.c))); }catch(e){ return ""; } }
function abmelden(){ if(AE.fragen.size + AE.bilder.size && !confirm("Nicht gespeicherte Änderungen gehen verloren. Trotzdem abmelden?")) return;
  AE.fragen.clear(); AE.bilder.clear(); store.del("ep-admin-sitzung"); try{ sessionStorage.removeItem("ep-admin-gh"); }catch(e){} SCHLUESSEL = null; location.replace(location.pathname); }
function angemeldet(){ const l = store.get("ep-admin-sitzung", null); return l && l.bis > Date.now() && KONTEN[l.name]; }
async function anmelden(e){
  e.preventDefault(); const f = $("#lFehler"), btn = $("#lGo");
  const sperre = store.get("ep-admin-sperre", {n:0, bis:0});
  if(sperre.bis > Date.now()){ f.textContent = `Zu viele Fehlversuche. Bitte ${Math.ceil((sperre.bis - Date.now())/60000)} Minuten warten.`; return; }
  btn.disabled = true; btn.textContent = "Prüfe …"; f.textContent = "";
  const name = $("#lName").value.trim().toLowerCase(), pw = $("#lPw").value, k = KONTEN[name];
  let ok = false;
  try{ const h = await pbkdf2(pw, ab64(k ? k.salt : "AAAAAAAAAAAAAAAAAAAAAA=="), 256); ok = !!k && b64(h) === k.hash; }catch(err){}
  if(!ok){ sperre.n++; if(sperre.n >= 5){ sperre.bis = Date.now() + 5*60000; sperre.n = 0; } store.set("ep-admin-sperre", sperre, true);
    f.textContent = "Benutzername oder Passwort falsch."; btn.disabled = false; btn.textContent = "Anmelden"; return; }
  store.del("ep-admin-sperre");
  store.set("ep-admin-sitzung", {name, bis: Date.now() + 8*3600000});
  SCHLUESSEL = await aesAusPasswort(pw);
  const t = await tokenEntschluesseln(); if(t) store.set("ep-admin-gh", t);
  $("#lPw").value = ""; starten();
}
$("#lForm").onsubmit = anmelden;
function starten(){
  try{ localStorage.removeItem("ep-admin-gh"); }catch(e){}   // alte, unverschlüsselte Ablage entfernen
  $("#login").hidden = true; $("#login").style.display = "none"; $("#app").hidden = false;
  statusZeigen(); aenderungenZeigen();
  zeige(TABS[location.hash.slice(1)] ? location.hash.slice(1) : "uebersicht");
  setInterval(() => { if(!angemeldet()) abmelden(); }, 60000);
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(() => { const f = $("#kopfFz"); if(!f) return; f.src = "../img/fragezeichen-zwinkern.webp"; setTimeout(() => f.src = "../img/fragezeichen.webp", 350); }, 7000);
}

/* ======================= Start ======================= */
if(angemeldet()) starten(); else { $("#lName").focus(); }
</script>
