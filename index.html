async function liveJoin(pin, name){
  if(!/^\d{4}$/.test(pin)){ $("#lvErr").textContent="Der PIN hat 4 Ziffern."; return; }
  if(!/^[\p{L}\p{N} _\-.]{2,16}$/u.test(name)){ $("#lvErr").textContent="Bitte einen Spielernamen mit 2 bis 16 Zeichen eingeben."; return; }
  const room = await liveRoom();
  if(!room){ $("#lvErr").textContent="Live-Spiele funktionieren nur in der claude.ai-Ansicht dieser Seite."; return; }
  liveLeave();
  L.pin=pin; L.role="player";
  L.sub = room.join("easyplay-"+pin);
  L.me = { name, av: ALT_AVATAR[S.profil?.avatar] || S.profil?.avatar || AVATARE[Math.floor(Math.random()*AVATARE.length)], pick:null, qid:null, seenQ:null, qSeenAt:0 };
  L.sub.presence({role:"player", pin, name, av:L.me.av, qid:null, pick:null}).catch(()=>{});
  L.unsub.push(L.sub.onPeers(()=>{ if(S.screen==="liveplay") renderLivePlay(); }));
  go("liveplay");
  L.tick=setInterval(()=>{ const el=$("#lvTime"); if(el && L.me.qSeenAt){ el.textContent=Math.max(0,Math.ceil((LIVE_DUR-(Date.now()-L.me.qSeenAt))/1000)); } },250);
  setTimeout(()=>{ if(S.screen==="liveplay" && !liveHostPeer()) renderLivePlay(); }, 4000);
}
function renderLivePlay(){
  const hp=liveHostPeer(); const st=hp?.presence; const me=L.me;
  let body;
  if(!st){ body=`<div class="lwait">${ico("timer")}<h2>Suche Spiel ${esc(L.pin)} …</h2><p>Falls nichts passiert: Stimmt der PIN? Ist der Wettbewerb schon erstellt?</p></div>`; }
  else if(st.phase==="lobby"){ body=`<div class="lwait"><div class="pav">${avatar(me.av)}</div><h2>Du bist dabei, ${esc(me.name)}!</h2><p>Kategorie: ${esc(st.cat)}. Warte, bis das Spiel startet …</p></div>`; }
  else if(st.phase==="q"){
    if(me.seenQ!==st.qid){ me.seenQ=st.qid; me.pick=null; me.qSeenAt=Date.now(); L.sub.presence({qid:st.qid, pick:null}).catch(()=>{}); }
    if(me.pick==null){
      body=`<div class="lq"><div class="lqtop"><span>Frage ${st.qi+1} von ${st.total}</span><span class="ltime" id="lvTime">${Math.ceil(LIVE_DUR/1000)}</span></div>

  } else if(st.phase==="reveal"){
    const myPts=(st.last||{})[myPeer()]||0, ok=me.pick!=null && me.pick===st.c;

  }

}

/* ---------- Quiz ---------- */
function startQuiz(themaId, mode, count){
  const all = pool(themaId);
  if(mode==="test" && all.length<TEST_LEN) return;
  const exact = shuffle(all.filter(f=>f.l===S.stufe));
  const near = shuffle(all.filter(f=>f.l!==S.stufe)).sort((a,b)=>Math.abs(a.l-S.stufe)-Math.abs(b.l-S.stufe));
  const list = [...exact, ...near].slice(0, mode==="test"? TEST_LEN : (count||10));
  S.thema = THEMA[themaId];
  S.quiz = { mode, list: list.map(f=>({...f, opts: shuffle(f.a.map((txt,i)=>({txt, ok:i===0}))) })), i:0, score:0, points:0,
    picked:null, tab:"frage", qStart:performance.now(), start:performance.now(), zeit:0, seen:0, log:[], flushed:false, lastPts:0, count:list.length, timeout:false };
  go("quiz");
  if(mode==="test"){ clearInterval(S.timer); S.timer=setInterval(tick,250); }
}
function tick(){
  const Q=S.quiz; if(!Q || Q.mode!=="test" || S.screen!=="quiz") return;
  const left = TEST_TIME - (performance.now()-Q.start);
  if(left<=0){ timeUp(); return; }
  const el=$("#timer"); if(!el) return;
  const sec=Math.ceil(left/1000), mm=Math.floor(sec/60), ss=String(sec%60).padStart(2,"0");
  el.innerHTML = ico("timer") + ` noch ${mm}:${ss}`;
  el.classList.toggle("warn", left<5*60*1000);
}
function timeUp(){
  const Q=S.quiz; if(!Q || Q.flushed) return;
  clearInterval(S.timer); S.timer=null;
  if(Q.picked==null){ Q.zeit += performance.now()-Q.qStart; }
  const from = Q.picked==null ? Q.i : Q.i+1;
  for(let k=from;k<Q.list.length;k++){ const f=Q.list[k]; Q.log.push({q:f.q, ok:false, richtig:f.a[0], m:f.m, s:f.s, skip:true}); }
  Q.timeout=true; finishQuiz();
}

function answer(i){
  const Q=S.quiz, f=Q.list[Q.i];
  if(Q.picked!=null) return;
  const dt = performance.now()-Q.qStart;
  Q.picked=i; Q.zeit+=dt; Q.seen++;
  const ok=f.opts[i].ok;
  let pts=0;
  if(ok){ Q.score++; if(Q.mode==="test"){ pts = 100 + Math.max(0, Math.round(50 - dt/1000*3)); Q.points+=pts; } }
  Q.lastPts=pts;
  Q.log.push({q:f.q, ok, richtig:f.a[0], m:f.m, s:f.s});
  render();
}

function renderQuiz(){

  const prog = ((Q.i + (answered?1:0)) / Q.list.length) * 100;

  $("#app").innerHTML = `${crumbs()}

      </div>`}
      ${body}
    </div>`;
  ($("#backB")||{}).onclick=()=>{ if(test && !confirm("Test abbrechen? Er wird nicht gewertet.")) return; go("mode"); };
  document.querySelectorAll(".tabbtn").forEach(b=>b.onclick=()=>{ stopSpeak(); Q.tab=b.dataset.tab; render(); });
  document.querySelectorAll(".ans").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $("#next") && ($("#next").onclick=nextQ);
  $("#toExplain") && ($("#toExplain").onclick=()=>{ Q.tab="erklaerung"; render(); });
  $("#toQuestion") && ($("#toQuestion").onclick=()=>{ Q.tab="frage"; render(); });
  if(test) tick();
}

function nextQ(){
  const Q=S.quiz;
  stopSpeak();
  if(Q.i+1<Q.list.length){ Q.i++; Q.picked=null; Q.tab="frage"; Q.qStart=performance.now(); render(); scrollTo({top:0}); return; }
  finishQuiz();
}
function finishQuiz(){
  const Q=S.quiz;
  const ratio = Q.score/Q.list.length; Q.stars = ratio>=.99?3:ratio>=.6?2:ratio>0?1:0;
  if(Q.mode==="train"){ const b=store.get("ep-sterne",{}), k=`${S.thema.id}-${S.stufe}`; if(b[k]==null||Q.stars>b[k]){ b[k]=Q.stars; store.set("ep-sterne",b); } }
  flushRun(true);
  go("done");
}

/* Statistik speichern */
async function flushRun(finished){
  const Q=S.quiz; if(!Q || Q.flushed) return; Q.flushed=true;
  if(Q.mode==="test" && !finished) return;            // abgebrochene Tests zählen nicht
  if(!Q.seen) return;
  const st={...LEER, ...S.stats};
  if(Q.mode==="train"){ st.trainRuns+=finished?1:0; st.trainFragen+=Q.seen; st.trainRichtig+=Q.score; st.trainZeit+=Math.round(Q.zeit); }
  else { st.testRuns++; st.testFragen+=Q.seen; st.testRichtig+=Q.score; st.testZeit+=Math.round(Q.zeit); st.bestTest=Math.max(st.bestTest||0,Q.points); }
  S.stats=st; store.set("ep-stats",st);
  if(S.online){ try{ await S.db.doc(`data/users/${S.uid}/stats`).set(st); }catch(e){} }
  if(Q.mode==="test" && S.profil){
    const k=bestKey(S.thema.id), best={...(S.profil.best||{})};
    Q.newBest = !best[k] || Q.points>best[k];
    if(Q.newBest) best[k]=Q.points;
    S.profil={...S.profil, best, tests:(S.profil.tests||0)+1};
    store.set("ep-profil",S.profil);
    if(S.online){ try{ await S.db.doc(`spieler/${S.uid}`).set(S.profil); }catch(e){} }
    if(S.screen==="done") render();
  }
}

/* ---------- Verlauf (Breadcrumbs), Stufen-Leiste, Untermenüs ---------- */
function goParent(t){
  if(!t) return go("home");
  if(t.parent?.startsWith("submenu:")){ S.menu=t.parent.slice(8); return go("submenu"); }
  if(t.parent) return go(t.parent);
  if(t.id==="beruf") return go("berufmenu");
  S.bereich=t.bereich; go("bereich");
}
function crumbPath(){
  const P=[["Start",()=>go("home")]];
  const B=b=>P.push([b.name,()=>{ S.bereich=b; go("bereich"); }]);
  const byId=id=>BEREICHE.find(x=>x.id===id);
  const G=()=>P.push(["Geschichte",()=>go("geschmenu")]);
  const CH=()=>P.push(["Schweizer Geschichte",()=>go("chmenu")]);
  const SUB=id=>P.push([THEMA[id].name,()=>{ S.menu=id; go("submenu"); }]);
  const BER=()=>P.push(["Berufswahl & Lehre",()=>go("berufmenu")]);
  const chain=t=>{ B(t.bereich); if(t.parent==="geschmenu") G(); else if(t.parent==="chmenu"){ G(); CH(); } else if(t.parent?.startsWith("submenu:")) SUB(t.parent.slice(8)); else if(t.id==="beruf") BER(); else if(t.menu==="submenu"){} };
  const t=S.thema; let cur="";
  switch(S.screen){
    case "bereich": cur=S.bereich.name; break;
    case "geschmenu": B(byId("welt")); cur="Geschichte"; break;
    case "chmenu": B(byId("welt")); G(); cur="Schweizer Geschichte"; break;
    case "submenu": B(THEMA[S.menu].bereich); cur=THEMA[S.menu].name; break;
    case "berufmenu": B(byId("geld")); cur="Berufswahl & Lehre"; break;
    case "check": case "checkdone": B(byId("geld")); BER(); cur="Berufs-Check"; break;
    case "mode": chain(t); if(t.menu==="submenu"){ SUB(t.id); cur="Alles gemischt"; } else cur=t.name; break;
    case "quiz": case "done": chain(t); if(t.menu==="submenu") SUB(t.id); P.push([t.menu==="submenu"?"Alles gemischt":t.name,()=>go("mode")]); cur=S.quiz?.mode==="test"?"Gewerteter Test":"Training"; break;
  }
  return {P,cur};
}
function crumbs(){
  const {P,cur}=crumbPath(); S._crumbs=P.map(x=>x[1]);
  return `<nav class="crumbs" aria-label="Verlauf">${P.map((x,i)=>`<button type="button" class="crumb" data-ci="${i}">${i===0?ico("house")+" ":""}${esc(x[0])}</button><span class="sep" aria-hidden="true">›</span>`).join("")}<span class="crumb cur" aria-current="page">${esc(cur)}</span></nav>`;
}
function bindCrumbs(){
  document.querySelectorAll(".crumb[data-ci]").forEach(b=>b.onclick=()=>{
    if(S.screen==="quiz" && S.quiz?.mode==="test" && !S.quiz.flushed && !confirm("Test abbrechen? Er wird nicht gewertet.")) return;
    const f=S._crumbs?.[+b.dataset.ci]; f&&f();

  document.querySelectorAll(".sbar [data-sl]").forEach(b=>b.onclick=()=>{ S.stufe=+b.dataset.sl; store.set("ep-stufe",S.stufe); render(); });
}

/* ---------- KI-Fragen ---------- */
async function generate(themaId){
  if(S.busy) return; S.busy=true;
  const t=THEMA[themaId], st=stufeObj(), st_el=$("#status"), btn=$("#gen");
  btn.disabled=true; st_el.textContent="Neue Fragen werden geschrieben … das dauert meist unter einer Minute."; st_el.classList.add("pulse");
  const known = pool(themaId).map(f=>f.q).slice(0,40).join(" | ");
  const ch = CH_IDS.includes(themaId) || t.bereich.id==="geld" || themaId==="pol_demokratie" || themaId==="alltag";
  const prompt = `Erstelle 5 neue Multiple-Choice-Lernfragen für ein Lernspiel für Kinder und Jugendliche in der Schweiz.
Thema: ${t.name}. Zielgruppe: ${st.alter} (Stufe "${st.name}"). Passe Wortwahl und Schwierigkeit genau an dieses Alter an.
${ch ? "Beziehe dich auf die Schweiz (Bund, Kantone, Gemeinden, CHF). Nenne keine exakten aktuellen Beträge, Sätze oder Zinsen, die sich jährlich ändern." : ""}
Nur sachlich korrekte, gut belegte Fakten; bei Unsicherheit ein anderes Thema wählen. Bei Religion neutral und respektvoll. Deutsch mit Schweizer Rechtschreibung ("ss" statt "ß").
Nicht wiederholen: ${known}
Jede Frage hat genau 4 Antworten; die ERSTE Antwort ist die richtige, die anderen sind plausibel, aber klar falsch.
"e" ist eine kurze, anschauliche Erklärung (2-3 Sätze), "m" ein Merksatz (max. 10 Wörter).
Antworte NUR mit einem JSON-Array: [{"q": string, "a": [string,string,string,string], "e": string, "m": string}]`;
  try{
    const arr = await S.sample.json(prompt, {modelTier:"default", cache:false});
    const neu = (Array.isArray(arr)?arr:[]).filter(x=>x && typeof x.q==="string" && Array.isArray(x.a) && x.a.length===4)
      .map(x=>({t:themaId, l:S.stufe, q:x.q.slice(0,300), a:x.a.map(s=>String(s).slice(0,200)), e:String(x.e||"").slice(0,900), m:String(x.m||"").slice(0,160), ki:true}));
    if(!neu.length) throw {code:"invalid_json"};
    if(S.db){ for(const f of neu){ try{ await S.db.collection("fragen").add(f); }catch(e){} } }
    else { S.extra.push(...neu); store.set("ep-extra", S.extra); }
    st_el.classList.remove("pulse");
    startQuiz(themaId,"train");
  }catch(e){
    st_el.classList.remove("pulse");
    st_el.textContent = e && e.code==="not_granted" ? "Ohne Freigabe können keine neuen Fragen erstellt werden." :
      e && e.code==="rate_limited" ? "Gerade zu viele Anfragen – bitte später nochmals." : "Das hat nicht geklappt. Versuch es nochmals.";
    btn.disabled=false;
  }finally{ S.busy=false; }
}

// Lädt die Fragen aus Supabase (wenn in config.js eingetragen) oder aus fragen.json.

async function ladeFragenDB(){
  if(window.claude) return;
  const cfg = window.EP_CONFIG || {};
  let rows = null;
  try{
    if(cfg.supabaseUrl && cfg.supabaseKey){
      rows = [];
      for(let from=0; ; from+=1000){
        const url = `${cfg.supabaseUrl.replace(/\/$/,"")}/rest/v1/fragen?select=thema,stufe,frage,antworten,erklaerung,merksatz,quelle,bild&status=eq.ok&order=id&limit=1000&offset=${from}`;
        const r = await fetch(url, {headers:{apikey:cfg.supabaseKey, Authorization:`Bearer ${cfg.supabaseKey}`}});
        if(!r.ok) throw new Error("Supabase "+r.status);
        const d = await r.json();
        rows.push(...d.map(x=>({t:x.thema, l:+x.stufe, q:x.frage, a:x.antworten, e:x.erklaerung||"", m:x.merksatz||"", s:x.quelle||"", img:x.bild||undefined})));
        if(d.length < 1000) break;
      }
      S.fragenQuelle = "Supabase";
    } else {
      const r = await fetch(cfg.fragenDatei || "fragen.json", {cache:"no-cache"});
      if(!r.ok) throw new Error("fragen.json "+r.status);
      rows = await r.json();
      S.fragenQuelle = "fragen.json";
    }
  }catch(e){ console.warn("Fragen-Datenbank nicht erreichbar, nutze eingebaute Fragen:", e); rows = null; }
  const ok = (rows||[]).filter(f=>f && f.t && f.q && Array.isArray(f.a) && f.a.length===4 && f.l>=1 && f.l<=3);
  if(ok.length){ FRAGEN.length = 0; FRAGEN.push(...ok); render(); }
}

/* ---------- Start ---------- */
$("#home").onclick=()=>go("home");
render();
ladeFragenDB();

(async()=>{
  if(!window.claude || !window.claude.use) return;
  claude.use("sample").then(s=>{ S.sample=s; if(S.screen==="done") render(); });
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if(!db) return;
  S.db = db;
  db.collection("fragen").onSnapshot(snap=>{
    const all = snap.docs.map(d=>{ const x=d.data()||{}; const o={id:d.id, t:ALIAS[x.t]||String(x.t), l:+x.l||1, q:String(x.q||""), a:Array.isArray(x.a)?x.a.map(String):[], e:String(x.e||""), m:String(x.m||""), s:x.s?String(x.s):"", status:x.status||"ok", ki:true}; if(typeof x.img==="string" && /^e:/.test(x.img)) o.img=x.img; return o; })
      .filter(x=>THEMA[x.t] && x.q && x.a.length===4);
    S.extra = all.filter(x=>x.status!=="neu");
    S.pending = all.filter(x=>x.status==="neu");
    if(["home","bereich","mode","berufmenu","werkstatt","geschmenu","chmenu"].includes(S.screen)) render(); else renderNav();
  }, ()=>{});
  try{ S.canEdit = user ? await user.canEdit() : false; if(S.canEdit) renderNav(); }catch(e){}
  const uid = user ? await user.id() : null;
  if(!uid) return;
  S.uid = uid; S.online = true;
  db.collection("spieler").onSnapshot(snap=>{
    S.spieler = snap.docs.map(d=>({id:d.id, ...(d.data()||{})})).filter(p=>p.name);
    const me = S.spieler.find(p=>p.id===uid);
    if(me){ S.profil = {name:me.name, avatar:me.avatar, stufe:me.stufe, kanton:me.kanton||"", best:me.best||{}, tests:me.tests||0, erstellt:me.erstellt}; store.set("ep-profil",S.profil); }
    if(["home","board","profil","bereich","mode"].includes(S.screen)) render();
  }, ()=>{});
  try{
    const snap = await db.doc(`data/users/${uid}/stats`).get();
    if(snap.exists){ S.stats = {...LEER, ...snap.data()}; store.set("ep-stats",S.stats); if(S.screen==="profil") render(); }
  }catch(e){}
})();
</script>
