const FRAGEN2 = [
 // ===== Geschichte =====
 {t:"ch_geschichte",l:1,s:"Wilhelm Tell",q:"Wie heisst der Held, der laut Sage einen Apfel vom Kopf seines Sohnes schoss?",a:["Wilhelm Tell","Winkelried","Robin Hood","Heidi"],e:"Wilhelm Tell ist die bekannteste Sagenfigur der Schweiz. Laut der Sage musste er auf Befehl des Vogts Gessler einen Apfel vom Kopf seines Sohnes schiessen. Ob Tell wirklich gelebt hat, ist nicht belegt.",m:"Tell = Sagenheld mit der Armbrust."},
 {t:"g_urzeit",l:1,s:"Steinzeit",q:"Wie nennt man die Zeit, in der Menschen ihre Werkzeuge vor allem aus Stein herstellten?",a:["Steinzeit","Eisenzeit","Neuzeit","Ritterzeit"],e:"In der Steinzeit gab es noch kein Metall. Die Menschen machten Werkzeuge und Waffen aus Stein, Knochen und Holz. Sie ist die längste Epoche der Menschheitsgeschichte.",m:"Steinzeit = Werkzeuge aus Stein."},
 {t:"g_mittelalter",l:1,s:"Burg",q:"Wer lebte im Mittelalter in Burgen?",a:["Ritter und Adelige","Astronauten","Römische Kaiser","Pharaonen"],e:"Burgen waren gut geschützte Wohnsitze von Adeligen und Rittern. Dicke Mauern, Türme und oft ein Graben schützten vor Angreifern. In der Schweiz gibt es noch viele Burgen, etwa das Schloss Chillon am Genfersee.",m:"Burgen = Wohnsitz von Rittern."},
 {t:"g_mittelalter",l:1,s:"Ritter",q:"Auf welchem Tier ritten die Ritter in den Kampf?",a:["Auf dem Pferd","Auf dem Esel","Auf dem Kamel","Auf dem Elefanten"],e:"Ritter waren Krieger zu Pferd. Pferd und Rüstung waren sehr teuer, deshalb stammten Ritter meist aus reichen Familien.",m:"Ritter kämpften zu Pferd."},
 {t:"g_antike",l:2,s:"Aventicum",q:"Welches Reich baute in der heutigen Schweiz Städte wie Aventicum (Avenches)?",a:["Das Römische Reich","Das Reich der Wikinger","Das Aztekenreich","Das Osmanische Reich"],e:"Vor rund 2000 Jahren gehörte das Gebiet der heutigen Schweiz zum Römischen Reich. Aventicum war damals eine wichtige Stadt mit Theater und Stadtmauer – Reste davon sieht man heute noch.",m:"Römer bauten Aventicum."},
 {t:"g_mittelalter",l:2,s:"Christoph Kolumbus",q:"Wer erreichte 1492 Amerika, obwohl er eigentlich einen Seeweg nach Indien suchte?",a:["Christoph Kolumbus","Marco Polo","James Cook","Neil Armstrong"],e:"Kolumbus segelte von Spanien aus nach Westen und glaubte, in Indien gelandet zu sein. Darum nannte man die Menschen dort lange «Indianer». In Amerika lebten aber schon seit Jahrtausenden Menschen.",m:"1492: Kolumbus erreicht Amerika."},
 {t:"g_mittelalter",l:2,s:"Johannes Gutenberg",q:"Welche Erfindung von Johannes Gutenberg um 1450 veränderte die Welt?",a:["Der Buchdruck mit beweglichen Buchstaben","Das Telefon","Die Dampfmaschine","Die Glühbirne"],e:"Vorher wurden Bücher von Hand abgeschrieben – das dauerte sehr lange. Mit Gutenbergs Druckverfahren konnte man Bücher schnell und günstiger herstellen. So verbreitete sich Wissen viel schneller.",m:"Gutenberg = Buchdruck."},
 {t:"g_neuzeit",l:2,s:"Zweiter Weltkrieg",q:"In welchem Jahr begann der Zweite Weltkrieg?",a:["1939","1914","1945","1968"],e:"Der Zweite Weltkrieg begann 1939 mit dem Angriff Deutschlands auf Polen und endete 1945. Die Schweiz blieb neutral, war aber vom Krieg umgeben.",m:"Zweiter Weltkrieg: 1939–1945."},
 {t:"g_neuzeit",l:2,s:"Apollo 11",q:"In welchem Jahr betraten erstmals Menschen den Mond?",a:["1969","1959","1979","1989"],e:"Mit der Mission Apollo 11 landeten die Amerikaner Neil Armstrong und Buzz Aldrin 1969 auf dem Mond. Millionen Menschen verfolgten das am Fernsehen.",m:"1969: Menschen auf dem Mond."},
 {t:"ch_geschichte",l:3,s:"Schlacht bei Marignano",q:"Nach welcher verlorenen Schlacht von 1515 zogen sich die Eidgenossen aus der Grossmachtpolitik zurück?",a:["Schlacht bei Marignano","Schlacht am Morgarten","Schlacht bei Sempach","Schlacht bei Waterloo"],e:"Bei Marignano in Norditalien verloren die Eidgenossen 1515 gegen Frankreich. Danach führten sie kaum mehr eigene Eroberungskriege. Das gilt als ein Ausgangspunkt der späteren Schweizer Neutralität.",m:"1515 Marignano – Rückzug aus der Grossmachtpolitik."},
 {t:"ch_geschichte",l:3,s:"Sonderbundskrieg",q:"Welcher kurze Bürgerkrieg ging 1847 der Gründung des Bundesstaates voraus?",a:["Der Sonderbundskrieg","Der Bauernkrieg","Der Dreissigjährige Krieg","Der Schwabenkrieg"],e:"1847 kämpften liberale gegen konservative, katholische Kantone, die sich im «Sonderbund» zusammengeschlossen hatten. Der Krieg dauerte nur wenige Wochen. Ein Jahr später entstand mit der Bundesverfassung die moderne Schweiz.",m:"1847 Sonderbundskrieg → 1848 Bundesstaat."},
 {t:"g_neuzeit",l:3,s:"Industrielle Revolution",q:"Was versteht man unter der Industriellen Revolution?",a:["Den Übergang zur Arbeit mit Maschinen und Fabriken ab dem 18. Jahrhundert","Eine Revolution gegen den König von Frankreich","Die Erfindung des Internets","Die Gründung der ersten Städte"],e:"Ab dem 18. Jahrhundert, zuerst in England, ersetzten Maschinen wie die Dampfmaschine viel Handarbeit. Es entstanden Fabriken, Eisenbahnen und neue Städte. Auch die Schweiz, etwa mit Textil- und Maschinenindustrie, wurde stark verändert.",m:"Industrielle Revolution = Maschinen und Fabriken."},
 {t:"ch_geschichte",l:3,s:"Henry Dunant",q:"Wer gab den Anstoss zur Gründung des Roten Kreuzes?",a:["Der Genfer Henry Dunant","Albert Einstein","Napoleon","Florence Nightingale"],e:"Henry Dunant erlebte 1859 die Schlacht von Solferino und sah das Leid der Verwundeten. Sein Buch darüber führte 1863 in Genf zur Gründung des Roten Kreuzes. 1901 erhielt er den ersten Friedensnobelpreis.",m:"Dunant = Rotes Kreuz, Genf."},
 // ===== Politik =====
 {t:"pol_demokratie",l:1,s:"Flagge der Schweiz",q:"Wie sieht die Schweizer Fahne aus?",a:["Weisses Kreuz auf rotem Grund","Rotes Kreuz auf weissem Grund","Blau-weiss gestreift","Grün mit einem Stern"],e:"Die Schweizer Fahne zeigt ein weisses Kreuz auf rotem Grund und ist quadratisch – das ist selten. Das Rote Kreuz hat übrigens die Farben umgekehrt, als Ehrung für die Schweiz.",m:"Weiss auf Rot – und quadratisch."},
 {t:"pol_demokratie",l:1,s:"Kanton (Schweiz)",q:"Wie viele Kantone hat die Schweiz?",a:["26","20","12","50"],e:"Die Schweiz besteht aus 26 Kantonen. Jeder Kanton hat eine eigene Regierung, ein eigenes Parlament und eigene Gesetze, zum Beispiel für die Schulen.",m:"26 Kantone."},
 {t:"pol_demokratie",l:1,s:"Schweizer Bundesfeier",q:"An welchem Tag feiert die Schweiz ihren Nationalfeiertag?",a:["Am 1. August","Am 1. Mai","Am 24. Dezember","Am 1. Januar"],e:"Am 1. August erinnert man an den Bundesbrief von 1291. Überall gibt es Feuer, Feuerwerk und Reden.",m:"1. August = Bundesfeier."},
 {t:"pol_demokratie",l:2,s:"Bundesversammlung (Schweiz)",q:"Aus welchen zwei Kammern besteht das Schweizer Parlament?",a:["Nationalrat und Ständerat","Bundesrat und Gemeinderat","Senat und Unterhaus","Grosser Rat und Kleiner Rat"],e:"Das Parlament heisst Bundesversammlung. Der Nationalrat vertritt das Volk, der Ständerat die Kantone. Neue Gesetze brauchen die Zustimmung beider Kammern.",m:"Nationalrat = Volk, Ständerat = Kantone."},
 {t:"pol_demokratie",l:2,s:"Nationalrat (Schweiz)",q:"Wie viele Mitglieder hat der Nationalrat?",a:["200","46","7","100"],e:"Der Nationalrat hat 200 Sitze. Grosse Kantone mit vielen Einwohnern haben mehr Sitze als kleine. Er wird alle vier Jahre neu gewählt.",m:"Nationalrat = 200 Sitze."},
 {t:"pol_demokratie",l:2,s:"Bundesrat (Schweiz)",q:"Wer wählt die Mitglieder des Bundesrates?",a:["Die Vereinigte Bundesversammlung","Das Volk direkt","Die Kantone","Der Bundespräsident"],e:"Nationalrat und Ständerat kommen zusammen und wählen als Vereinigte Bundesversammlung die sieben Bundesratsmitglieder. Das Volk wählt den Bundesrat also nicht direkt.",m:"Das Parlament wählt den Bundesrat."},
 {t:"pol_demokratie",l:2,s:"Gemeindeversammlung",q:"Was passiert an einer Gemeindeversammlung?",a:["Die Stimmberechtigten einer Gemeinde entscheiden direkt über Geschäfte","Der Bundesrat trifft sich","Die Polizei hält eine Übung ab","Es werden Kantone gegründet"],e:"In vielen Gemeinden, vor allem kleineren, gibt es kein Gemeindeparlament. Dort treffen sich die Stimmberechtigten und entscheiden zum Beispiel über das Budget oder ein neues Schulhaus.",m:"Gemeindeversammlung = direkte Demokratie vor Ort."},
 {t:"pol_demokratie",l:3,s:"Referendum (Schweiz)",q:"Wie viele Unterschriften braucht ein fakultatives Referendum gegen ein Bundesgesetz?",a:["50'000 in 100 Tagen","100'000 in 18 Monaten","10'000 in 30 Tagen","200'000 in einem Jahr"],e:"Mit dem fakultativen Referendum kann das Volk ein vom Parlament beschlossenes Gesetz zur Abstimmung bringen. Dafür braucht es 50'000 Unterschriften innert 100 Tagen – oder die Unterstützung von acht Kantonen.",m:"Referendum: 50'000 Unterschriften, 100 Tage."},
 {t:"pol_demokratie",l:3,s:"Volksinitiative (Schweiz)",q:"Was braucht eine eidgenössische Volksinitiative, damit sie angenommen ist?",a:["Das Volksmehr und das Ständemehr","Nur die Mehrheit im Kanton Bern","Die Zustimmung des Bundesrates","Zwei Drittel aller Stimmen"],e:"Weil eine Initiative die Verfassung ändert, braucht sie ein doppeltes Ja: die Mehrheit der Stimmenden in der ganzen Schweiz (Volksmehr) und die Mehrheit der Kantone (Ständemehr).",m:"Initiative = Volksmehr + Ständemehr."},
 {t:"pol_demokratie",l:3,s:"Ständerat",q:"Wie viele Mitglieder hat der Ständerat?",a:["46","26","200","7"],e:"Die meisten Kantone schicken zwei Mitglieder in den Ständerat, die sechs früheren Halbkantone je eines. Zusammen ergibt das 46.",m:"Ständerat = 46 Sitze."},
 {t:"pol_demokratie",l:3,s:"Gewaltenteilung",q:"Was bedeutet Gewaltenteilung?",a:["Gesetzgebung, Regierung und Gerichte sind voneinander getrennt","Die Polizei teilt sich die Arbeit","Jeder Kanton hat eine eigene Armee","Nur eine Person entscheidet alles"],e:"Die Macht im Staat ist auf drei Gewalten verteilt: Das Parlament macht Gesetze (Legislative), die Regierung führt sie aus (Exekutive), die Gerichte urteilen (Judikative). So kontrollieren sie sich gegenseitig.",m:"Legislative – Exekutive – Judikative."},
 {t:"pol_demokratie",l:3,s:"Bundesgericht (Schweiz)",q:"Wo hat das Bundesgericht, das oberste Gericht der Schweiz, seinen Hauptsitz?",a:["In Lausanne","In Bern","In Zürich","In Genf"],e:"Das Bundesgericht hat seinen Sitz in Lausanne, einzelne Abteilungen arbeiten in Luzern. So sind die Bundesbehörden auf verschiedene Landesteile verteilt.",m:"Bundesgericht = Lausanne."},
 {t:"pol_demokratie",l:3,s:"Landsgemeinde",q:"In welchen Kantonen gibt es heute noch eine Landsgemeinde?",a:["Glarus und Appenzell Innerrhoden","Zürich und Bern","Genf und Waadt","Tessin und Graubünden"],e:"An der Landsgemeinde versammeln sich die Stimmberechtigten unter freiem Himmel und stimmen mit erhobener Hand ab. Diese uralte Form der Demokratie gibt es nur noch in Glarus und Appenzell Innerrhoden.",m:"Landsgemeinde: Glarus und Appenzell Innerrhoden."},
 // ===== Religion =====
 {t:"rel_andere",l:1,s:"Synagoge",q:"Wie heisst das Gotteshaus der Jüdinnen und Juden?",a:["Synagoge","Moschee","Kapelle","Pagode"],e:"In der Synagoge beten Jüdinnen und Juden gemeinsam und lesen aus der Tora. Der wichtigste Tag in der Woche ist der Sabbat, von Freitagabend bis Samstagabend.",m:"Synagoge = jüdisches Gotteshaus."},
 {t:"rel_christentum",l:1,s:"Ostern",q:"An welchem christlichen Fest suchen viele Kinder bemalte Eier?",a:["Ostern","Weihnachten","Pfingsten","Allerheiligen"],e:"Ostern ist das wichtigste Fest im Christentum und erinnert an die Auferstehung von Jesus. Eier stehen dabei für neues Leben.",m:"Ostern = Auferstehung, Ostereier."},
 {t:"rel_christentum",l:1,s:"Weihnachten",q:"Wo wurde Jesus nach der Weihnachtsgeschichte geboren?",a:["In Bethlehem","In Rom","In Zürich","In Mekka"],e:"Nach der Bibel wurde Jesus in einem Stall in Bethlehem geboren. Die Stadt liegt im Westjordanland. Viele Krippen zeigen diese Geschichte.",m:"Weihnachtsgeschichte: Bethlehem."},
 {t:"rel_islam",l:2,s:"Koran",q:"Wie heisst die heilige Schrift des Islams?",a:["Koran","Bibel","Tora","Talmud"],e:"Für Musliminnen und Muslime ist der Koran das Wort Gottes, überbracht an den Propheten Mohammed. Er ist in Arabisch geschrieben und in Kapitel, die Suren, gegliedert.",m:"Islam = Koran."},
 {t:"rel_andere",l:2,s:"Chanukka",q:"Wie heisst das achttägige jüdische Lichterfest?",a:["Chanukka","Diwali","Ramadan","Advent"],e:"An Chanukka zünden Familien an acht Abenden je ein Licht mehr an einem besonderen Leuchter an. Das Fest erinnert an die Wiedereinweihung des Tempels in Jerusalem.",m:"Chanukka = 8 Tage Lichterfest."},
 {t:"rel_andere",l:2,s:"Diwali",q:"Welches grosse Lichterfest feiern Hindus im Herbst?",a:["Diwali","Chanukka","Ostern","Eid"],e:"Zu Diwali schmücken Hindus ihre Häuser mit Lichtern und Lampen. Das Fest steht für den Sieg des Lichts über die Dunkelheit und des Guten über das Böse.",m:"Diwali = hinduistisches Lichterfest."},
 {t:"rel_islam",l:2,s:"Mekka",q:"In welcher Stadt steht die Kaaba, das wichtigste Heiligtum des Islams?",a:["Mekka","Jerusalem","Kairo","Istanbul"],e:"Die Kaaba steht in Mekka in Saudi-Arabien. Muslime beten in ihre Richtung, und viele pilgern einmal im Leben dorthin.",m:"Kaaba = Mekka."},
 {t:"rel_islam",l:3,s:"Fünf Säulen des Islam",q:"Was gehört zu den «Fünf Säulen des Islams»?",a:["Glaubensbekenntnis, Gebet, Almosen, Fasten und Pilgerfahrt","Taufe, Kommunion, Firmung, Ehe und Beichte","Sabbat, Tora, Synagoge, Pessach und Chanukka","Yoga, Meditation, Karma, Tempel und Opfer"],e:"Die fünf Säulen sind die wichtigsten Pflichten im Islam: das Glaubensbekenntnis, das tägliche Gebet, Spenden an Bedürftige, das Fasten im Ramadan und – wer kann – die Pilgerfahrt nach Mekka.",m:"5 Säulen: Bekenntnis, Gebet, Almosen, Fasten, Pilgerfahrt."},
 {t:"rel_andere",l:3,s:"Nirwana",q:"In welcher Religion ist das Nirwana – das Ende des Kreislaufs der Wiedergeburt – ein zentrales Ziel?",a:["Im Buddhismus","Im Christentum","Im Judentum","Im Islam"],e:"Im Buddhismus glaubt man an einen Kreislauf von Geburt, Tod und Wiedergeburt. Wer Gier, Hass und Unwissen überwindet, kann laut der Lehre das Nirwana erreichen und diesen Kreislauf verlassen.",m:"Buddhismus: Ziel Nirwana."},
 {t:"rel_christentum",l:3,s:"Religionen in der Schweiz",q:"Welche beiden christlichen Konfessionen prägten die Schweiz historisch am stärksten?",a:["Römisch-katholisch und evangelisch-reformiert","Orthodox und anglikanisch","Baptistisch und methodistisch","Mormonisch und koptisch"],e:"Seit der Reformation im 16. Jahrhundert gibt es in der Schweiz katholische und reformierte Gebiete. Heute gehört ein wachsender Teil der Bevölkerung keiner Religion an, und es gibt viele weitere Glaubensgemeinschaften.",m:"Traditionell: katholisch und reformiert."},
 {t:"rel_christentum",l:3,s:"Reformation",q:"Wer veröffentlichte 1517 Thesen gegen den Ablasshandel, was als Beginn der Reformation gilt?",a:["Martin Luther","Huldrych Zwingli","Papst Leo X.","Johannes Calvin"],e:"Martin Luther kritisierte, dass die Kirche gegen Geld Sünden «erliess». Seine 95 Thesen lösten in Europa die Reformation aus, aus der die evangelischen Kirchen entstanden.",m:"1517 Luther – Beginn der Reformation."},
 {t:"rel_andere",l:3,s:"Atheismus",q:"Wie nennt man eine Person, die nicht an einen Gott glaubt?",a:["Atheistin oder Atheist","Pilgerin oder Pilger","Prophetin oder Prophet","Missionarin oder Missionar"],e:"Atheistinnen und Atheisten glauben nicht an Gott oder Götter. Agnostiker sagen dagegen, man könne nicht wissen, ob es einen Gott gibt. In der Schweiz ist jede dieser Haltungen durch die Glaubensfreiheit geschützt.",m:"Atheismus = kein Glaube an Gott."},
 // ===== Natur & Tiere =====
 {t:"tiere",l:1,s:"Blauwal",q:"Welches ist das grösste Tier der Welt?",a:["Der Blauwal","Der Elefant","Die Giraffe","Der Weisse Hai"],e:"Der Blauwal kann über 30 Meter lang werden – länger als ein Tennisplatz breit ist. Er ist das grösste Tier, das je gelebt hat, und frisst winzige Krebstierchen namens Krill.",m:"Blauwal = grösstes Tier."},
 {t:"tiere",l:1,s:"Metamorphose (Zoologie)",q:"Was wird aus einer Raupe?",a:["Ein Schmetterling","Eine Spinne","Ein Käfer","Eine Schnecke"],e:"Die Raupe frisst viel, verpuppt sich dann und verwandelt sich in der Puppe in einen Schmetterling. Diese Verwandlung nennt man Metamorphose.",m:"Raupe → Puppe → Schmetterling."},
 {t:"tiere",l:1,s:"Pflanzenfresser",q:"Wie nennt man ein Tier, das nur Pflanzen frisst?",a:["Pflanzenfresser","Fleischfresser","Allesfresser","Aasfresser"],e:"Kühe, Kaninchen oder Rehe sind Pflanzenfresser. Füchse fressen vor allem Fleisch, Bären und Menschen sind Allesfresser.",m:"Pflanzenfresser fressen nur Pflanzen."},
 {t:"tiere",l:1,s:"Reh",q:"Welches Tier lebt oft in Schweizer Wäldern, und das Männchen trägt ein Geweih?",a:["Das Reh","Der Fuchs","Der Dachs","Der Igel"],e:"Beim Reh trägt nur der Rehbock ein kleines Geweih. Er wirft es jedes Jahr ab, und es wächst wieder nach.",m:"Rehbock = Geweih, das jährlich nachwächst."},
 {t:"tiere",l:2,s:"Alpenmurmeltier",q:"Warum halten Murmeltiere einen langen Winterschlaf?",a:["Weil sie im Winter kaum Nahrung finden und so Energie sparen","Weil sie Angst vor Schnee haben","Weil sie im Sommer arbeiten müssen","Weil sie nachtaktiv sind"],e:"In den Alpen gibt es im Winter kaum Gras. Murmeltiere schlafen deshalb viele Monate in ihrem Bau. Herzschlag und Körpertemperatur sinken stark, so reicht ihr Fettvorrat bis zum Frühling.",m:"Winterschlaf = Energie sparen."},
 {t:"natur",l:2,s:"Dufourspitze",q:"Wie heisst der höchste Berg der Schweiz?",a:["Dufourspitze","Matterhorn","Eiger","Pilatus"],e:"Die Dufourspitze im Monte-Rosa-Massiv im Wallis ist mit 4634 Metern der höchste Gipfel der Schweiz. Das berühmtere Matterhorn ist etwas tiefer.",m:"Höchster Berg: Dufourspitze."},
 {t:"natur",l:2,s:"Wasserkreislauf",q:"Wie entsteht Regen?",a:["Wasser verdunstet, bildet Wolken und fällt wieder als Niederschlag","Regen kommt aus dem Weltall","Wolken sind aus Watte und werden ausgewrungen","Regen entsteht nur über Seen"],e:"Die Sonne erwärmt Wasser aus Meeren, Seen und Pflanzen, es verdunstet. In der Höhe kühlt der Wasserdampf ab und bildet Wolken. Werden die Tröpfchen schwer genug, fallen sie als Regen oder Schnee.",m:"Verdunsten – Wolke – Niederschlag."},
 {t:"natur",l:2,s:"Merkur (Planet)",q:"Welcher Planet ist der Sonne am nächsten?",a:["Merkur","Venus","Mars","Neptun"],e:"Merkur ist der kleinste Planet und kreist am nächsten um die Sonne. Die Reihenfolge merkt man sich mit: Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel.",m:"Merkur ist der Sonne am nächsten."},
 {t:"natur",l:2,s:"Jupiter (Planet)",q:"Welcher ist der grösste Planet in unserem Sonnensystem?",a:["Jupiter","Saturn","Erde","Mars"],e:"Jupiter ist ein Gasriese und so gross, dass die Erde über tausendmal hineinpassen würde. Sein bekanntestes Merkmal ist der Grosse Rote Fleck, ein riesiger Sturm.",m:"Jupiter = grösster Planet."},
 {t:"natur",l:3,s:"Biodiversität",q:"Was bedeutet Biodiversität?",a:["Die Vielfalt an Arten, Genen und Lebensräumen","Die Anzahl Bäume in einem Park","Eine Art Biodünger","Die Lehre vom Wetter"],e:"Biodiversität beschreibt die Vielfalt des Lebens: verschiedene Tier- und Pflanzenarten, Unterschiede innerhalb einer Art und verschiedene Lebensräume. Eine hohe Vielfalt macht die Natur widerstandsfähiger.",m:"Biodiversität = Vielfalt des Lebens."},
 {t:"tiere",l:3,s:"Nahrungskette",q:"Was zeigt eine Nahrungskette?",a:["Wer wen frisst – vom Pflanzenmaterial bis zum Raubtier","Wie man Lebensmittel einkauft","Wie Pflanzen Wasser aufnehmen","Welche Tiere Winterschlaf halten"],e:"Ein Beispiel: Gras → Maus → Fuchs. Pflanzen stehen am Anfang, weil sie mit Sonnenlicht Energie herstellen. Fehlt ein Glied, gerät die ganze Kette aus dem Gleichgewicht.",m:"Nahrungskette: Pflanze → Pflanzenfresser → Fleischfresser."},
 {t:"tiere",l:3,s:"Wolf",q:"Woher kamen die Wölfe, die seit den 1990er-Jahren in die Schweiz zurückkehrten?",a:["Aus Italien und Frankreich","Aus Kanada","Aus einem Zoo","Aus Australien"],e:"Der Wolf war in der Schweiz ausgerottet. Seit den 1990er-Jahren wandern Wölfe über die Alpen wieder ein, vor allem aus Italien und Frankreich. Ihre Rückkehr führt zu Diskussionen, etwa beim Schutz von Schafen.",m:"Wölfe kamen über die Alpen zurück."},
 {t:"natur",l:3,s:"Ökosystem",q:"Was ist ein Ökosystem?",a:["Eine Lebensgemeinschaft von Lebewesen zusammen mit ihrem Lebensraum","Ein Computerprogramm","Ein Bio-Laden","Eine einzelne Tierart"],e:"Ein Wald, ein Teich oder eine Wiese ist ein Ökosystem. Pflanzen, Tiere, Pilze und Bakterien hängen dort voneinander und von Boden, Wasser und Klima ab.",m:"Ökosystem = Lebewesen + Lebensraum."},
 // ===== Wissenschaft & Körper =====
 {t:"koerper",l:1,s:"Geruchssinn",q:"Mit welchem Sinnesorgan riechst du?",a:["Mit der Nase","Mit den Ohren","Mit den Augen","Mit der Haut"],e:"In der Nase sitzen viele Riechzellen. Sie erkennen Duftstoffe in der Luft und melden sie ans Gehirn. Riechen hilft auch beim Schmecken.",m:"Nase = Riechen."},
 {t:"koerper",l:1,s:"Sinn (Wahrnehmung)",q:"Wie viele Sinne zählt man klassisch beim Menschen?",a:["Fünf","Drei","Sieben","Zehn"],e:"Die fünf klassischen Sinne sind Sehen, Hören, Riechen, Schmecken und Tasten. Heute weiss man, dass wir noch mehr wahrnehmen, zum Beispiel das Gleichgewicht.",m:"5 Sinne: sehen, hören, riechen, schmecken, tasten."},
 {t:"koerper",l:1,s:"Skelett des Menschen",q:"Wie heisst das Gerüst aus Knochen, das deinen Körper stützt?",a:["Skelett","Muskel","Haut","Sehne"],e:"Das Skelett gibt dem Körper Halt und schützt Organe, zum Beispiel der Schädel das Gehirn. Muskeln bewegen die Knochen an den Gelenken.",m:"Skelett = Knochengerüst."},
 {t:"koerper",l:2,s:"Lunge",q:"Welches Organ nimmt beim Atmen Sauerstoff aus der Luft auf?",a:["Die Lunge","Die Leber","Der Magen","Die Niere"],e:"Beim Einatmen gelangt Luft in die Lunge. Dort geht Sauerstoff ins Blut über, und Kohlendioxid wird ausgeatmet.",m:"Lunge = Sauerstoff ins Blut."},
 {t:"koerper",l:2,s:"Haut",q:"Welches ist das grösste Organ des Menschen?",a:["Die Haut","Die Leber","Das Gehirn","Der Darm"],e:"Die Haut bedeckt den ganzen Körper. Sie schützt vor Keimen und Sonne, hilft die Temperatur zu regeln und lässt uns Berührungen spüren.",m:"Haut = grösstes Organ."},
 {t:"koerper",l:2,s:"Leukozyt",q:"Wofür sind die weissen Blutkörperchen zuständig?",a:["Für die Abwehr von Krankheitserregern","Für den Sauerstofftransport","Für die Verdauung","Für das Haarwachstum"],e:"Weisse Blutkörperchen sind die Polizei des Körpers. Sie erkennen Bakterien und Viren und bekämpfen sie. Den Sauerstoff transportieren die roten Blutkörperchen.",m:"Weiss = Abwehr, Rot = Sauerstoff."},
 {t:"koerper",l:2,s:"Skelett des Menschen",q:"Wie viele Knochen hat ein erwachsener Mensch ungefähr?",a:["Rund 206","Rund 50","Rund 1000","Rund 12"],e:"Ein erwachsener Mensch hat etwa 206 Knochen. Babys haben mehr, weil einige Knochen erst später zusammenwachsen.",m:"Erwachsene: ca. 206 Knochen."},
 {t:"koerper",l:2,s:"Gebiss des Menschen",q:"Wie viele Zähne hat ein erwachsener Mensch mit allen Weisheitszähnen?",a:["32","20","28","40"],e:"Das bleibende Gebiss hat 32 Zähne, davon 4 Weisheitszähne. Kinder haben ein Milchgebiss mit 20 Zähnen.",m:"Erwachsene: 32 Zähne, Kinder: 20."},
 {t:"koerper",l:3,s:"Impfung",q:"Wie funktioniert eine Impfung?",a:["Sie trainiert das Immunsystem, einen Erreger zu erkennen, bevor man krank wird","Sie tötet alle Bakterien im Körper","Sie ersetzt das Blut","Sie wirkt nur gegen Knochenbrüche"],e:"Eine Impfung zeigt dem Körper einen harmlosen Teil oder eine abgeschwächte Form eines Erregers. Das Immunsystem lernt ihn kennen und kann bei einer echten Ansteckung schneller reagieren.",m:"Impfung = Training fürs Immunsystem."},
 {t:"koerper",l:3,s:"Antibiotikum",q:"Warum helfen Antibiotika meist nicht gegen eine Erkältung?",a:["Erkältungen werden meist von Viren verursacht, Antibiotika wirken nur gegen Bakterien","Weil Erkältungen zu kurz dauern","Weil Antibiotika nur bei Kindern wirken","Weil Antibiotika nur im Sommer wirken"],e:"Antibiotika bekämpfen Bakterien, gegen Viren sind sie wirkungslos. Werden sie unnötig eingesetzt, können Bakterien resistent werden – dann wirken die Mittel auch bei echten Infektionen schlechter.",m:"Antibiotika: gegen Bakterien, nicht gegen Viren."},
 {t:"wissenschaft",l:3,s:"Atom",q:"Was ist ein Atom?",a:["Ein winziger Baustein der Materie aus Kern und Elektronenhülle","Eine Zelle im Körper","Ein kleiner Planet","Eine Einheit für Zeit"],e:"Alles um uns besteht aus Atomen. Im Kern sitzen Protonen und Neutronen, darum kreisen Elektronen. Atome sind so klein, dass Millionen nebeneinander auf einen Millimeter passen.",m:"Atom = Kern + Elektronen."},
 {t:"wissenschaft",l:3,s:"Wasser",q:"Wie lautet die chemische Formel für Wasser?",a:["H₂O","CO₂","O₂","NaCl"],e:"Ein Wassermolekül besteht aus zwei Wasserstoffatomen (H) und einem Sauerstoffatom (O). CO₂ ist Kohlendioxid, NaCl ist Kochsalz.",m:"Wasser = H₂O."},
 {t:"wissenschaft",l:3,s:"Charles Darwin",q:"Wer entwickelte die Evolutionstheorie durch natürliche Auslese?",a:["Charles Darwin","Isaac Newton","Albert Einstein","Marie Curie"],e:"Darwin beobachtete auf seinen Reisen, dass sich Lebewesen an ihre Umgebung anpassen. Wer besser angepasst ist, überlebt eher und hat mehr Nachwuchs. So verändern sich Arten über lange Zeit.",m:"Darwin = Evolution."},
 // ===== Physik =====
 {t:"physik",l:1,s:"Schatten",q:"Was braucht es, damit ein Schatten entsteht?",a:["Licht und einen Gegenstand, der das Licht abhält","Nur Dunkelheit","Wasser und Wind","Musik"],e:"Licht breitet sich geradlinig aus. Steht etwas im Weg, kommt dahinter weniger Licht an – dort entsteht ein Schatten.",m:"Licht + Hindernis = Schatten."},
 {t:"physik",l:1,s:"Regenbogen",q:"Wie entsteht ein Regenbogen?",a:["Sonnenlicht wird in Regentropfen in seine Farben zerlegt","Er wird an den Himmel gemalt","Er entsteht nur in der Nacht","Aus Rauch von Feuern"],e:"Sonnenlicht sieht weiss aus, besteht aber aus vielen Farben. In Regentropfen wird es gebrochen und in Rot, Orange, Gelb, Grün, Blau und Violett aufgefächert. Dazu muss die Sonne hinter dir stehen.",m:"Regenbogen = zerlegtes Sonnenlicht."},
 {t:"physik",l:1,s:"Thermometer",q:"Was misst ein Thermometer?",a:["Die Temperatur","Das Gewicht","Die Zeit","Die Lautstärke"],e:"Mit dem Thermometer misst man, wie warm oder kalt etwas ist, zum Beispiel die Luft oder das Fieber. In der Schweiz misst man in Grad Celsius.",m:"Thermometer = Temperatur."},
 {t:"physik",l:2,s:"Reflexion (Physik)",q:"Warum siehst du dich im Spiegel?",a:["Der Spiegel wirft das Licht zurück","Der Spiegel leuchtet selbst","Im Spiegel wohnt ein Bild","Der Spiegel speichert Fotos"],e:"Licht, das von dir ausgeht, trifft auf die glatte Spiegelfläche und wird zurückgeworfen. Das nennt man Reflexion. Darum siehst du dich seitenverkehrt.",m:"Spiegel = Reflexion."},
 {t:"physik",l:2,s:"Wärmeausdehnung",q:"Was passiert mit den meisten Metallen, wenn man sie erhitzt?",a:["Sie dehnen sich aus","Sie schrumpfen stark","Sie werden durchsichtig","Sie werden magnetisch"],e:"Beim Erwärmen bewegen sich die Teilchen stärker und brauchen mehr Platz. Deshalb haben Brücken und Schienen Dehnungsfugen, damit sie sich im Sommer ausdehnen können.",m:"Wärme = Ausdehnung."},
 {t:"physik",l:2,s:"Erneuerbare Energie",q:"Welche dieser Energiequellen ist erneuerbar?",a:["Sonnenenergie","Erdöl","Kohle","Erdgas"],e:"Erneuerbare Energie erschöpft sich nicht, zum Beispiel Sonne, Wind und Wasserkraft. Die Schweiz gewinnt einen grossen Teil ihres Stroms aus Wasserkraft.",m:"Sonne, Wind, Wasser = erneuerbar."},
 {t:"physik",l:2,s:"Stromkreis",q:"Wann leuchtet eine Lampe in einem einfachen Stromkreis?",a:["Wenn der Stromkreis geschlossen ist","Wenn ein Kabel fehlt","Wenn die Batterie leer ist","Wenn man sie schüttelt"],e:"Strom fliesst nur, wenn ein geschlossener Weg von der Batterie über die Lampe zurück zur Batterie besteht. Ein Schalter öffnet oder schliesst diesen Kreis.",m:"Geschlossener Stromkreis = Licht."},
 {t:"physik",l:3,s:"Äquivalenz von Masse und Energie",q:"Was beschreibt Albert Einsteins Formel E = mc²?",a:["Dass Masse und Energie ineinander umgewandelt werden können","Die Geschwindigkeit eines Autos","Die Formel für Wasser","Wie schnell Schall ist"],e:"E steht für Energie, m für Masse und c für die Lichtgeschwindigkeit. Weil c sehr gross ist, steckt schon in wenig Masse enorm viel Energie – das nutzt zum Beispiel die Sonne bei der Kernfusion.",m:"E = mc²: Masse ist Energie."},
 {t:"physik",l:3,s:"Elektrische Spannung",q:"In welcher Einheit misst man elektrische Spannung?",a:["Volt","Newton","Meter","Kelvin"],e:"Spannung wird in Volt gemessen, benannt nach Alessandro Volta. Eine normale Steckdose in der Schweiz hat 230 Volt.",m:"Spannung = Volt."},
 {t:"physik",l:3,s:"Rayleigh-Streuung",q:"Warum ist der Himmel am Tag blau?",a:["Blaues Licht wird von der Luft stärker gestreut als rotes","Weil das Meer sich spiegelt","Weil der Weltraum blau ist","Weil Wolken blau gefärbt sind"],e:"Sonnenlicht trifft auf die Luftteilchen. Kurzwelliges, blaues Licht wird viel stärker in alle Richtungen gestreut als rotes. Darum leuchtet der ganze Himmel blau. Bei Sonnenuntergang ist der Weg länger, das Blau wird herausgestreut und der Himmel wirkt rot.",m:"Blauer Himmel = Streuung von blauem Licht."},
 {t:"physik",l:3,s:"Gewichtskraft",q:"Was verändert sich, wenn eine Astronautin auf dem Mond steht?",a:["Ihre Gewichtskraft, nicht aber ihre Masse","Ihre Masse, nicht aber ihr Gewicht","Beides bleibt gleich","Sie wird grösser"],e:"Die Masse, also wie viel Stoff in einem Körper steckt, bleibt überall gleich. Die Gewichtskraft hängt von der Anziehung ab – auf dem Mond ist sie nur etwa ein Sechstel so gross wie auf der Erde.",m:"Masse bleibt, Gewichtskraft ändert sich."},
 // ===== Umgang mit Geld =====
 {t:"geld",l:1,s:"Schweizer Franken",q:"Was ist mehr wert?",a:["Ein 5-Franken-Stück","Ein 2-Franken-Stück","Ein 1-Franken-Stück","Ein 50-Rappen-Stück"],e:"Das 5-Franken-Stück ist die grösste und wertvollste Münze der Schweiz, man nennt es auch «Fünfliber». Grössere Beträge bezahlt man mit Banknoten ab 10 Franken.",m:"Fünfliber = grösste Münze."},
 {t:"geld",l:1,s:"Sparbüchse",q:"Wofür ist ein Sparschwein gut?",a:["Um Geld zu sammeln und zu sparen","Um Geld zu verstecken und zu vergessen","Um Geld zu verschenken","Um Süssigkeiten aufzubewahren"],e:"Im Sparschwein sammelst du Münzen, bis genug für etwas Grösseres zusammen ist. Später kann ein Sparkonto bei der Bank dazukommen.",m:"Sparschwein = kleines Sparziel."},
 {t:"geld",l:1,s:"In-App-Kauf",q:"In einem Handyspiel kannst du für «Juwelen» bezahlen. Was stimmt?",a:["Das kostet echtes Geld – vorher die Eltern fragen","Das ist immer gratis","Juwelen sind echte Edelsteine","Man bekommt das Geld später zurück"],e:"Solche In-App-Käufe kosten echtes Geld, auch wenn sie wie Spielgeld aussehen. Viele Spiele sind darauf ausgelegt, dass man immer wieder kauft. Frag deshalb immer zuerst.",m:"Spielwährung = echtes Geld."},
 {t:"geld",l:2,s:"Preisvergleich",q:"Warum lohnt es sich, Preise zu vergleichen?",a:["Das gleiche Produkt kann in verschiedenen Läden unterschiedlich viel kosten","Weil Preise überall gleich sind","Weil teurer immer besser ist","Weil man so mehr Taschengeld bekommt"],e:"Ein Vergleich im Laden oder online zeigt oft grosse Unterschiede. Achte auch auf den Preis pro Kilo oder Liter – der steht meist klein auf dem Preisschild.",m:"Vergleichen spart Geld."},
 {t:"geld",l:2,s:"Kredit",q:"Was ist ein Kredit?",a:["Geliehenes Geld, das man mit Zins zurückzahlen muss","Ein Geschenk der Bank","Ein Sparkonto","Eine Steuer"],e:"Bei einem Kredit leiht dir eine Bank Geld. Du zahlst es in Raten zurück und bezahlst zusätzlich Zinsen. Am Ende zahlst du also mehr zurück, als du bekommen hast.",m:"Kredit = geliehen + Zins."},
 {t:"geld",l:2,s:"Schulden",q:"Was ist ein Warnsignal für Schulden?",a:["Man bezahlt Rechnungen mit neuen Krediten","Man spart jeden Monat etwas","Man macht ein Budget","Man zahlt Rechnungen pünktlich"],e:"Wer alte Schulden mit neuen Krediten bezahlt, rutscht leicht in eine Schuldenspirale. In der Schweiz helfen Schuldenberatungsstellen kostenlos und vertraulich.",m:"Kredit für Schulden = Alarmzeichen."},
 {t:"geld",l:3,s:"Inflation",q:"Was bedeutet Inflation?",a:["Die Preise steigen allgemein, und mit dem gleichen Geld kann man weniger kaufen","Die Preise sinken dauernd","Man bekommt automatisch mehr Lohn","Es wird neues Geld gedruckt, das nichts wert ist"],e:"Bei Inflation werden Waren und Dienstleistungen teurer. Wenn dein Geld auf dem Konto weniger Zins bringt, als die Preise steigen, verliert es an Kaufkraft.",m:"Inflation = Geld verliert Kaufkraft."},
 {t:"geld",l:3,s:"Zinseszins",q:"Was ist der Zinseszins?",a:["Man bekommt auch Zins auf früher erhaltene Zinsen","Eine Strafgebühr der Bank","Doppelte Steuern","Ein Zins nur für Kinder"],e:"Wenn Zinsen auf dem Konto bleiben, werden sie im nächsten Jahr mitverzinst. So wächst das Geld mit der Zeit immer schneller. Deshalb lohnt es sich, früh mit dem Sparen anzufangen – bei Schulden wirkt der Effekt leider umgekehrt.",m:"Zinseszins: Zinsen verdienen Zinsen."},
 {t:"geld",l:3,s:"Bruttolohn",q:"Was ist der Unterschied zwischen Brutto- und Nettolohn?",a:["Netto ist, was nach Abzügen wie AHV und Pensionskasse ausbezahlt wird","Brutto ist immer weniger als netto","Es gibt keinen Unterschied","Netto ist der Lohn vor den Abzügen"],e:"Vom Bruttolohn werden in der Schweiz Beiträge für AHV/IV/EO, Arbeitslosenversicherung und meist Pensionskasse abgezogen. Was aufs Konto kommt, ist der Nettolohn.",m:"Brutto minus Abzüge = Netto."},
 {t:"geld",l:3,s:"Aktie",q:"Was kauft man mit einer Aktie?",a:["Einen kleinen Anteil an einem Unternehmen","Eine feste Zinszahlung","Ein Sparkonto","Eine Versicherung"],e:"Mit einer Aktie wird man Miteigentümer einer Firma. Läuft es gut, kann der Wert steigen und es gibt eine Gewinnbeteiligung (Dividende). Der Wert kann aber auch stark sinken.",m:"Aktie = Firmenanteil, mit Chance und Risiko."},
 {t:"geld",l:3,s:"Diversifikation (Wirtschaft)",q:"Warum legt man Geld besser verteilt an?",a:["Um das Risiko zu streuen","Weil es verboten ist, alles an einem Ort zu haben","Weil man so garantiert Gewinn macht","Weil Banken es verlangen"],e:"Wer alles auf eine Karte setzt, kann alles verlieren. Verteilt man das Geld auf verschiedene Anlagen, fallen Verluste bei einer Anlage weniger ins Gewicht. Das nennt man Diversifikation.",m:"Nicht alle Eier in einen Korb."},
 {t:"geld",l:3,s:"Schuldbetreibung",q:"Was ist eine Betreibung in der Schweiz?",a:["Ein amtliches Verfahren, um unbezahlte Schulden einzutreiben","Eine Art Steuerrückerstattung","Ein Sparplan","Eine Versicherung gegen Diebstahl"],e:"Wer Rechnungen nicht bezahlt, kann betrieben werden. Die Betreibung wird im Betreibungsregister eingetragen. Das kann Probleme machen, etwa bei der Wohnungssuche, weil Vermieter oft einen Auszug verlangen.",m:"Betreibung = offene Schulden amtlich eintreiben."},
 // ===== Banken =====
 {t:"banken",l:1,s:"Geldautomat",q:"Wie heisst in der Schweiz der Automat, an dem man Bargeld abheben kann?",a:["Bancomat","Kassomat","Fotomat","Rechenmaschine"],e:"In der Schweiz sagt man meist Bancomat. Mit einer Karte und der Geheimzahl kannst du dort Bargeld von deinem Konto abheben.",m:"Bancomat = Bargeld abheben."},
 {t:"banken",l:1,s:"Persönliche Identifikationsnummer",q:"Was machst du mit dem PIN-Code deiner Karte?",a:["Geheim halten und niemandem verraten","Auf die Karte schreiben","Freunden schicken","Im Internet posten"],e:"Der PIN ist eine Geheimzahl. Wer ihn kennt und die Karte hat, kann dein Geld abheben. Verdecke beim Eintippen die Tastatur.",m:"PIN = geheim."},
 {t:"banken",l:2,s:"Schweizerische Nationalbank",q:"Wer gibt die Schweizer Banknoten heraus?",a:["Die Schweizerische Nationalbank","Jede Bank selbst","Der Bundesrat","Die Post"],e:"Die Schweizerische Nationalbank (SNB) ist die Zentralbank der Schweiz. Sie gibt die Banknoten heraus und sorgt dafür, dass der Franken stabil bleibt. Sie hat Sitze in Bern und Zürich.",m:"Banknoten kommen von der SNB."},
 {t:"banken",l:2,s:"TWINT",q:"Was ist TWINT?",a:["Eine Schweizer App zum Bezahlen mit dem Handy","Eine Schweizer Bank","Eine Kreditkarte","Ein Online-Spiel"],e:"Mit TWINT kann man mit dem Smartphone bezahlen oder Freunden Geld schicken. Die App ist mit dem Bankkonto oder einem Guthaben verbunden.",m:"TWINT = mit dem Handy bezahlen."},
 {t:"banken",l:2,s:"Dauerauftrag",q:"Was ist ein Dauerauftrag?",a:["Eine regelmässige automatische Zahlung, zum Beispiel für die Miete","Ein Auftrag, der nie ausgeführt wird","Ein Kredit","Ein Sparbuch"],e:"Mit einem Dauerauftrag überweist die Bank jeden Monat automatisch den gleichen Betrag. Praktisch für Miete oder Handyabo – so vergisst man keine Zahlung.",m:"Dauerauftrag = automatisch jeden Monat."},
 {t:"banken",l:2,s:"QR-Rechnung",q:"Was hat in der Schweiz den alten orangen Einzahlungsschein ersetzt?",a:["Die QR-Rechnung","Der Bancomat","Die Kreditkarte","Das Sparbuch"],e:"Seit Herbst 2022 gibt es nur noch die QR-Rechnung. Den QR-Code scannt man mit der Banking-App, und alle Zahlungsdaten werden automatisch übernommen.",m:"QR-Rechnung = scannen und zahlen."},
 {t:"banken",l:2,s:"Kontoauszug",q:"Was zeigt ein Kontoauszug?",a:["Alle Ein- und Ausgänge auf deinem Konto","Deine Schulnoten","Deine Steuererklärung","Deinen Lebenslauf"],e:"Auf dem Kontoauszug oder in der App siehst du, wann Geld gekommen oder gegangen ist. Wer ihn regelmässig anschaut, entdeckt auch falsche Abbuchungen.",m:"Kontoauszug = Übersicht übers Konto."},
 {t:"banken",l:3,s:"Einlagensicherung",q:"Was schützt die Einlagensicherung in der Schweiz?",a:["Guthaben bis 100'000 Franken pro Person und Bank, falls die Bank pleitegeht","Alle Aktien gegen Kursverluste","Das Bargeld im Portemonnaie","Kredite vor Zinsen"],e:"Geht eine Bank in Konkurs, sind Guthaben auf Konten bis 100'000 Franken pro Kundin oder Kunde und Bank geschützt. Aktien und Fonds gehören ohnehin dem Kunden und sind davon getrennt.",m:"Einlagen gesichert bis 100'000 Franken."},
 {t:"banken",l:3,s:"Bankgeheimnis",q:"Was bedeutet das Bankgeheimnis in der Schweiz heute?",a:["Banken dürfen Kundendaten nicht an Unbefugte weitergeben – gegenüber Steuerbehörden vieler Länder gilt aber ein automatischer Informationsaustausch","Banken dürfen nie Auskunft geben, auch nicht an Gerichte","Jede Person darf alle Konten einsehen","Es gibt kein Bankgeheimnis"],e:"Das Bankgeheimnis schützt die Privatsphäre der Kunden. Seit einigen Jahren tauscht die Schweiz aber mit vielen Staaten automatisch Kontoinformationen für Steuerzwecke aus.",m:"Bankgeheimnis schützt – aber nicht vor dem Steueramt im Ausland."},
 {t:"banken",l:3,s:"Leitzins",q:"Wozu verändert die Nationalbank den Leitzins?",a:["Um die Preise stabil zu halten und die Wirtschaft zu steuern","Um Banken zu bestrafen","Um Steuern einzuziehen","Um neue Münzen zu prägen"],e:"Hebt die SNB den Leitzins, wird Geld leihen teurer – das bremst die Inflation. Senkt sie ihn, wird Geld günstiger, und die Wirtschaft wird angekurbelt.",m:"Leitzins = Werkzeug gegen Inflation."},
 {t:"banken",l:3,s:"Zwei-Faktor-Authentisierung",q:"Warum verlangt das E-Banking zusätzlich zum Passwort eine Bestätigung auf dem Handy?",a:["Weil ein zweiter Faktor Betrügern das Einloggen stark erschwert","Weil das Passwort zu kurz ist","Um Werbung zu zeigen","Weil Banken Handys verkaufen"],e:"Bei der Zwei-Faktor-Anmeldung braucht man etwas, das man weiss (Passwort), und etwas, das man hat (Handy). Selbst wenn jemand dein Passwort stiehlt, kommt er so nicht ins Konto.",m:"Passwort + Handy = doppelt sicher."},
 // ===== Steuern =====
 {t:"steuern",l:1,s:"Steuer",q:"Welches dieser Dinge wird mit Steuergeld bezahlt?",a:["Ein neues Schulhaus","Dein eigenes Handy","Deine Ferien","Das Velo deines Nachbarn"],e:"Mit Steuern bezahlen Gemeinden, Kantone und der Bund Dinge für alle: Schulen, Strassen, Parks, Feuerwehr und vieles mehr. Private Dinge kauft jede Person selbst.",m:"Steuergeld = für alle da."},
 {t:"steuern",l:1,s:"Steuer",q:"Zahlen auch Kinder manchmal Steuern?",a:["Ja, zum Beispiel die Mehrwertsteuer beim Einkaufen","Nein, niemals","Nur an Geburtstagen","Nur in den Ferien"],e:"Wenn du im Laden etwas kaufst, ist die Mehrwertsteuer schon im Preis enthalten. So zahlen alle ein wenig mit, auch Kinder.",m:"Einkaufen = MWST mitbezahlt."},
 {t:"steuern",l:2,s:"Mehrwertsteuer (Schweiz)",q:"Wie hoch ist der Normalsatz der Schweizer Mehrwertsteuer seit 2024?",a:["8,1 Prozent","19 Prozent","2,5 Prozent","25 Prozent"],e:"Seit 2024 beträgt der Normalsatz 8,1 Prozent. Für Lebensmittel, Bücher und Medikamente gilt ein reduzierter Satz. Im Vergleich zu vielen Ländern Europas ist die Mehrwertsteuer in der Schweiz tief.",m:"MWST-Normalsatz: 8,1 % (seit 2024)."},
 {t:"steuern",l:2,s:"Hundesteuer",q:"Welche Steuer zahlen Hundehalterinnen und Hundehalter in vielen Gemeinden?",a:["Die Hundesteuer","Die Katzensteuer","Die Futtersteuer","Die Tiersteuer des Bundes"],e:"Viele Gemeinden verlangen für jeden Hund eine jährliche Gebühr. Damit werden zum Beispiel Robidog-Kästen und deren Leerung bezahlt.",m:"Hund = Hundesteuer der Gemeinde."},
 {t:"steuern",l:2,s:"Steuererklärung",q:"Wann muss man in der Schweiz meist zum ersten Mal eine eigene Steuererklärung ausfüllen?",a:["Ab dem Jahr, in dem man volljährig wird","Ab 10 Jahren","Erst ab 30","Nur wenn man ein Haus besitzt"],e:"Mit der Volljährigkeit wird man selbst steuerpflichtig, auch wenn man noch in der Ausbildung ist. Je nach Kanton gibt es Details, zum Beispiel für Lernende mit Lohn schon vorher.",m:"Mit 18 kommt die erste Steuererklärung."},
 {t:"steuern",l:3,s:"Verrechnungssteuer",q:"Was ist die Verrechnungssteuer?",a:["35 Prozent auf bestimmte Zinsen und Dividenden, die man zurückbekommt, wenn man alles korrekt angibt","Eine Steuer auf Lebensmittel","Eine Strafe für zu spätes Zahlen","Eine Steuer auf Autos"],e:"Der Bund behält auf bestimmte Kapitalerträge 35 Prozent ein. Wer das Vermögen und die Erträge in der Steuererklärung angibt, erhält diesen Betrag zurück. So lohnt sich ehrliches Deklarieren.",m:"Verrechnungssteuer: deklarieren und zurückholen."},
 {t:"steuern",l:3,s:"Quellensteuer",q:"Was bedeutet Quellensteuer?",a:["Die Steuer wird direkt vom Lohn abgezogen, vor allem bei ausländischen Arbeitnehmenden ohne Niederlassungsbewilligung","Eine Steuer auf Mineralwasser","Eine Steuer nur für Bauern","Eine Steuer auf Quellen im Wald"],e:"Bei der Quellensteuer zieht die Arbeitgeberin die Steuer direkt vom Lohn ab und überweist sie dem Steueramt. Das betrifft vor allem Personen mit ausländischer Staatsangehörigkeit ohne Niederlassungsbewilligung C.",m:"Quellensteuer = direkt vom Lohn."},
 {t:"steuern",l:3,s:"Vermögenssteuer",q:"Wer erhebt in der Schweiz eine Vermögenssteuer?",a:["Die Kantone und Gemeinden","Nur der Bund","Die Banken","Niemand"],e:"Die Vermögenssteuer wird von Kantonen und Gemeinden erhoben, nicht vom Bund. Besteuert wird das Vermögen abzüglich Schulden, wobei es Freibeträge gibt.",m:"Vermögenssteuer = Kanton und Gemeinde."},
 {t:"steuern",l:3,s:"Steuerprogression",q:"Was bedeutet Progression bei der Einkommenssteuer?",a:["Wer mehr verdient, zahlt einen höheren Prozentsatz","Alle zahlen den gleichen Betrag","Die Steuer sinkt mit steigendem Einkommen","Man zahlt nur alle zwei Jahre"],e:"Bei der Progression steigt der Steuersatz mit dem Einkommen. Wer wenig verdient, zahlt anteilsmässig weniger. So sollen Menschen nach ihrer wirtschaftlichen Leistungsfähigkeit beitragen.",m:"Progression: mehr Einkommen, höherer Satz."},
 {t:"steuern",l:3,s:"Steuerabzug",q:"Was ist ein typischer Abzug in der Steuererklärung?",a:["Einzahlungen in die Säule 3a","Die Kosten für Ferien","Das Taschengeld","Der Kauf eines Handys für Spiele"],e:"Bestimmte Ausgaben darf man vom Einkommen abziehen, zum Beispiel Einzahlungen in die Säule 3a, Berufsauslagen oder Krankheitskosten über einem Mindestbetrag. So sinkt das steuerbare Einkommen.",m:"Abzüge senken das steuerbare Einkommen."},
 {t:"steuern",l:3,s:"Ermessensveranlagung",q:"Was passiert, wenn man die Steuererklärung trotz Mahnung nicht einreicht?",a:["Das Steueramt schätzt das Einkommen selbst ein, und es droht eine Busse","Man muss nie Steuern zahlen","Die Steuern werden automatisch halbiert","Nichts, es ist freiwillig"],e:"Wer nicht einreicht, wird «nach Ermessen» eingeschätzt – meist eher zu hoch als zu tief. Dazu kann eine Busse kommen. Fristverlängerungen kann man aber in der Regel beantragen.",m:"Nicht einreichen = Schätzung + Busse."},
 {t:"steuern",l:3,s:"Finanzausgleich (Schweiz)",q:"Was ist der Finanzausgleich zwischen den Kantonen?",a:["Finanzstarke Kantone und der Bund unterstützen finanzschwächere Kantone","Alle Kantone zahlen gleich viel Steuern","Der Bund zahlt alle Schulden der Kantone","Die Kantone tauschen ihre Steuerämter"],e:"Kantone haben unterschiedlich viel Einnahmen. Über den Finanzausgleich fliesst Geld von finanzstarken zu finanzschwächeren Kantonen, damit überall gute Leistungen möglich sind.",m:"Finanzausgleich = Solidarität unter Kantonen."},
 // ===== Krankenkasse =====
 {t:"krankenkasse",l:1,s:"Arzt",q:"Wohin gehst du, wenn du krank bist und Hilfe brauchst?",a:["Zur Ärztin oder zum Arzt","Zur Bank","Zum Coiffeur","Zur Post"],e:"Die Ärztin oder der Arzt untersucht dich und hilft dir, gesund zu werden. Die Krankenkasse hilft, die Kosten zu bezahlen.",m:"Krank? Ärztin oder Arzt."},
 {t:"krankenkasse",l:2,s:"Franchise (Krankenversicherung)",q:"Wie hoch ist die tiefste Franchise, die Erwachsene in der Grundversicherung wählen können?",a:["300 Franken","0 Franken","1000 Franken","5000 Franken"],e:"Erwachsene können eine Franchise zwischen 300 und 2500 Franken wählen. Je höher die Franchise, desto tiefer die Prämie – aber desto mehr zahlt man selbst, wenn man krank wird.",m:"Franchise Erwachsene: 300 bis 2500 Franken."},
 {t:"krankenkasse",l:2,s:"Franchise (Krankenversicherung)",q:"Wie hoch ist die Franchise für Kinder standardmässig?",a:["0 Franken","300 Franken","2500 Franken","1000 Franken"],e:"Für Kinder beträgt die Franchise normalerweise 0 Franken. Eltern können freiwillig eine höhere wählen, höchstens 600 Franken.",m:"Kinder: Franchise meist 0 Franken."},
 {t:"krankenkasse",l:2,s:"Krankenversicherung in der Schweiz",q:"Darf eine Krankenkasse dich für die Grundversicherung ablehnen?",a:["Nein, sie muss alle aufnehmen","Ja, wenn du oft krank bist","Ja, wenn du älter als 50 bist","Ja, ohne Grund"],e:"In der Grundversicherung müssen die Krankenkassen alle Personen aufnehmen, und die Leistungen sind bei allen gleich. Nur bei Zusatzversicherungen dürfen sie Anträge ablehnen.",m:"Grundversicherung: Aufnahmepflicht."},
 {t:"krankenkasse",l:2,s:"Krankenversicherung in der Schweiz",q:"Bis wann muss die Kündigung der Grundversicherung meist bei der Krankenkasse sein, um auf Anfang Jahr zu wechseln?",a:["Bis Ende November","Bis Ende Januar","Bis Ende Juni","Man kann nie wechseln"],e:"Im Herbst werden die neuen Prämien bekannt. Wer wechseln will, muss so kündigen, dass die Kündigung spätestens am letzten Arbeitstag im November ankommt. Ein Vergleich kann sich lohnen, weil die Leistungen überall gleich sind.",m:"Wechsel: Kündigung bis Ende November."},
 {t:"krankenkasse",l:3,s:"Selbstbehalt",q:"Wie hoch ist der jährliche maximale Selbstbehalt für Erwachsene in der Grundversicherung?",a:["700 Franken","70 Franken","7000 Franken","Es gibt kein Maximum"],e:"Nach der Franchise zahlt man 10 Prozent der Kosten selbst, bei Erwachsenen höchstens 700 Franken pro Jahr, bei Kindern 350 Franken. Danach übernimmt die Grundversicherung die weiteren Kosten.",m:"Selbstbehalt: 10 %, max. 700 Franken."},
 {t:"krankenkasse",l:3,s:"Spitalkostenbeitrag",q:"Wer muss bei einem Spitalaufenthalt keinen Spitalkostenbeitrag zahlen?",a:["Kinder und junge Erwachsene bis 25 in Ausbildung","Alle Erwachsenen über 30","Nur Männer","Niemand ist befreit"],e:"Erwachsene zahlen im Spital pro Tag einen kleinen Beitrag an Unterkunft und Verpflegung. Kinder und junge Erwachsene bis 25, die in Ausbildung sind, sind davon befreit, ebenso Leistungen bei Mutterschaft.",m:"Kinder und Junge in Ausbildung: kein Spitalbeitrag."},
 {t:"krankenkasse",l:3,s:"Prämienverbilligung",q:"Was ist die Prämienverbilligung?",a:["Kantone unterstützen Menschen mit tiefem Einkommen bei den Krankenkassenprämien","Ein Rabatt für Nichtraucher","Ein Geschenk der Krankenkasse zum Geburtstag","Eine Strafe für hohe Arztkosten"],e:"Weil die Prämien für viele Haushalte eine grosse Belastung sind, zahlen die Kantone mit Unterstützung des Bundes Beiträge an Personen mit tiefem Einkommen. Wie man sie beantragt, regelt jeder Kanton selbst.",m:"Prämienverbilligung = Hilfe vom Kanton."},
 {t:"krankenkasse",l:3,s:"Hausarztmodell",q:"Was ist das Hausarztmodell?",a:["Man geht zuerst zur Hausärztin und bekommt dafür eine tiefere Prämie","Man darf nie zu Spezialisten","Die Ärztin wohnt bei dir","Man zahlt keine Franchise"],e:"Im Hausarztmodell ist die Hausärztin oder der Hausarzt immer die erste Anlaufstelle und überweist bei Bedarf weiter. Dafür gibt es einen Prämienrabatt. Notfälle sind natürlich ausgenommen.",m:"Hausarztmodell: erst Hausarzt, dafür günstiger."},
 {t:"krankenkasse",l:3,s:"Unfallversicherung (Schweiz)",q:"Wer zahlt einen Unfall, wenn du mindestens 8 Stunden pro Woche beim gleichen Arbeitgeber arbeitest?",a:["Die Unfallversicherung deines Arbeitgebers","Nur du selbst","Die Gemeinde","Niemand"],e:"Wer mindestens 8 Stunden pro Woche beim gleichen Arbeitgeber arbeitet, ist über diesen auch gegen Unfälle in der Freizeit versichert. Dort gibt es keine Franchise und keinen Selbstbehalt.",m:"Ab 8 Std./Woche: Unfall über den Arbeitgeber."},
 {t:"krankenkasse",l:3,s:"Bundesgesetz über die Krankenversicherung",q:"Wie heisst das Gesetz, das die Grundversicherung regelt?",a:["KVG – Krankenversicherungsgesetz","ZGB – Zivilgesetzbuch","SVG – Strassenverkehrsgesetz","OR – Obligationenrecht"],e:"Das Krankenversicherungsgesetz (KVG) legt fest, dass alle versichert sein müssen und welche Leistungen die Grundversicherung bezahlt. Zusatzversicherungen fallen dagegen unter das Versicherungsvertragsgesetz.",m:"Grundversicherung = KVG."},
 {t:"krankenkasse",l:3,s:"Krankenversicherung in der Schweiz",q:"Ab welchem Alter zahlt man in der Grundversicherung die volle Erwachsenenprämie?",a:["Ab 26 Jahren","Ab 16 Jahren","Ab 18 Jahren","Ab 40 Jahren"],e:"Die Prämien sind in drei Altersgruppen eingeteilt: Kinder bis 18, junge Erwachsene von 19 bis 25 und Erwachsene ab 26. Junge Erwachsene zahlen weniger als Erwachsene.",m:"Volle Prämie ab 26."},
 // ===== Medien & Social Media =====
 {t:"medien",l:1,s:"Privatsphäre",q:"Was solltest du im Internet nie mit Fremden teilen?",a:["Deine Adresse und Telefonnummer","Deine Lieblingsfarbe","Dein Lieblingsessen","Welche Tiere du magst"],e:"Persönliche Daten wie Adresse, Telefonnummer oder Schule gehören nicht ins Internet und nicht in Chats mit Unbekannten. Man weiss nie genau, wer dahintersteckt.",m:"Adresse und Nummer bleiben privat."},
 {t:"medien",l:1,s:"Cybergrooming",q:"Jemand, den du nur online kennst, will dich treffen. Was tust du?",a:["Deinen Eltern oder einer Vertrauensperson davon erzählen und nicht allein hingehen","Sofort allein hingehen","Es niemandem sagen","Der Person deine Adresse schicken"],e:"Online kann sich jede Person als jemand anderes ausgeben. Erzähl es immer einer erwachsenen Vertrauensperson. Wenn dich jemand bittet, etwas geheim zu halten, ist das ein Warnzeichen.",m:"Online-Treffen? Immer zuerst Erwachsene fragen."},
 {t:"medien",l:1,s:"Bildschirmzeit",q:"Warum sind Pausen vom Bildschirm gut?",a:["Sie tun Augen, Kopf und Körper gut","Weil das Handy sonst explodiert","Weil Bildschirme verboten sind","Pausen sind nicht wichtig"],e:"Nach langem Schauen auf den Bildschirm werden die Augen müde und man kann sich schlechter konzentrieren. Draussen spielen, sich bewegen und Freunde treffen tut dem ganzen Körper gut.",m:"Bildschirm-Pausen = gut für dich."},
 {t:"medien",l:2,s:"Clickbait",q:"Was ist Clickbait?",a:["Reisserische Titel oder Bilder, die nur zum Klicken verleiten sollen","Eine Art Computermaus","Eine Tastenkombination","Ein Virus für Handys"],e:"Titel wie «Du wirst nicht glauben, was dann passiert!» sollen neugierig machen. Oft hält der Inhalt nicht, was versprochen wird – es geht um Klicks und Werbeeinnahmen.",m:"Reisserischer Titel = Vorsicht, Clickbait."},
 {t:"medien",l:2,s:"Schlafhygiene",q:"Warum ist es gut, das Handy vor dem Schlafen wegzulegen?",a:["Licht und spannende Inhalte halten das Gehirn wach","Weil das Handy nachts kaputt geht","Weil Nachrichten nachts verboten sind","Es spielt keine Rolle"],e:"Das helle Licht des Bildschirms und aufregende Videos machen den Kopf wach. Wer das Handy vor dem Schlafen weglegt oder ausserhalb des Zimmers lädt, schläft meist besser ein.",m:"Handy weg = besser schlafen."},
 {t:"medien",l:2,s:"Influencer",q:"Was ist ein Influencer oder eine Influencerin?",a:["Eine Person, die auf Social Media viele Follower hat und andere beeinflusst","Eine Krankheit","Ein Computerprogramm","Ein Beruf bei der Polizei"],e:"Influencer zeigen ihr Leben, Produkte oder Meinungen und verdienen oft mit Werbung Geld. Was sie zeigen, ist meist ausgewählt und bearbeitet – nicht das ganze echte Leben.",m:"Influencer zeigen nur einen Ausschnitt."},
 {t:"medien",l:2,s:"Recht am eigenen Bild",q:"Ein Kollege filmt dich heimlich und will das Video posten. Was gilt?",a:["Er braucht deine Erlaubnis, sonst verletzt er dein Recht am eigenen Bild","Er darf alles posten","Nur Lehrer dürfen das verbieten","Es gibt dazu keine Regeln"],e:"In der Schweiz ist das Recht am eigenen Bild durch das Persönlichkeitsrecht geschützt. Wer Bilder oder Videos von anderen ohne Einverständnis veröffentlicht, kann dafür belangt werden.",m:"Dein Bild – deine Entscheidung."},
 {t:"medien",l:3,s:"Filterblase",q:"Was ist eine Filterblase?",a:["Man sieht online vor allem Inhalte, die zur eigenen Meinung passen","Eine Seifenblase mit Filter","Ein Fotofilter für Gesichter","Ein Wasserfilter"],e:"Algorithmen zeigen dir mehr von dem, was dir bisher gefallen hat. So sieht man andere Meinungen immer seltener. Wer bewusst verschiedene Quellen nutzt, bekommt ein vollständigeres Bild.",m:"Filterblase = nur noch die eigene Meinung sehen."},
 {t:"medien",l:3,s:"Social Bot",q:"Was ist ein Social Bot?",a:["Ein automatisches Konto, das wie ein Mensch postet","Ein Roboter in der Schule","Ein Lautsprecher","Eine Handyhülle"],e:"Social Bots sind Programme, die automatisch Beiträge, Likes oder Kommentare erzeugen. Sie können so tun, als ob viele Menschen eine Meinung teilen, obwohl nur wenige dahinterstecken.",m:"Nicht jedes Konto ist ein Mensch."},
 {t:"medien",l:3,s:"Datenschutzgesetz (Schweiz)",q:"Welches Schweizer Gesetz schützt persönliche Daten und wurde 2023 erneuert?",a:["Das Datenschutzgesetz (DSG)","Das Strassenverkehrsgesetz","Das Krankenversicherungsgesetz","Das Mietrecht"],e:"Das Datenschutzgesetz regelt, wie Firmen und Behörden mit Personendaten umgehen dürfen. Seit September 2023 gilt eine überarbeitete Version mit strengeren Regeln, etwa zur Information der Betroffenen.",m:"Datenschutz = DSG."},
 {t:"medien",l:3,s:"SRG SSR",q:"Was ist die SRG?",a:["Das öffentliche Medienhaus der Schweiz mit SRF, RTS, RSI und RTR","Eine Social-Media-App","Eine Bank","Eine Zeitung aus Deutschland"],e:"Die SRG produziert Radio, Fernsehen und Online-Angebote in allen Landessprachen. Sie wird grösstenteils über die Medienabgabe finanziert und hat einen Auftrag zur ausgewogenen Information.",m:"SRG = öffentliches Radio und Fernsehen."},
 {t:"medien",l:3,s:"Schweizer Presserat",q:"Wer prüft in der Schweiz, ob sich Journalistinnen und Journalisten an ethische Regeln halten?",a:["Der Schweizer Presserat","Der Bundesrat","Die Polizei","Die Nationalbank"],e:"Der Presserat ist eine Beschwerdestelle der Medienbranche. Er prüft zum Beispiel, ob Fakten korrekt sind und die Privatsphäre respektiert wurde. Solche Regeln gelten für Social-Media-Posts meist nicht.",m:"Presserat = Ethik für Journalismus."},
 // ===== Berufswahl & Lehre =====
 {t:"beruf",l:1,s:"Automobil-Mechatroniker",q:"Wer repariert in der Garage Autos?",a:["Automobil-Mechatronikerinnen und -Mechatroniker","Bäckerinnen und Bäcker","Gärtnerinnen und Gärtner","Coiffeusen und Coiffeure"],e:"In der Garage prüfen und reparieren Automobil-Mechatronikerinnen und -Mechatroniker Motoren, Bremsen und Elektronik. Das ist eine vierjährige Lehre mit EFZ.",m:"Autos reparieren = Automobil-Mechatronik."},
 {t:"beruf",l:1,s:"Friseur",q:"Wer schneidet und färbt Haare?",a:["Coiffeusen und Coiffeure","Polymechaniker","Logistikerinnen","Köche"],e:"Coiffeusen und Coiffeure beraten Kundinnen und Kunden, schneiden und färben Haare. Kreativität und Freude am Kontakt mit Menschen sind hier wichtig.",m:"Haare = Coiffeur/Coiffeuse."},
 {t:"beruf",l:2,s:"Berufliche Grundbildung",q:"Welchen Weg wählen in der Schweiz nach der obligatorischen Schule die meisten Jugendlichen?",a:["Eine berufliche Grundbildung (Lehre)","Direkt die Universität","Keine Ausbildung","Ein Auslandjahr"],e:"Rund zwei Drittel der Jugendlichen in der Schweiz machen eine Lehre. Das duale System mit Betrieb und Schule gilt international als Vorbild.",m:"Die Lehre ist der häufigste Weg."},
 {t:"beruf",l:2,s:"Lehrvertrag",q:"Was ist ein Lehrvertrag?",a:["Ein schriftlicher Vertrag zwischen Lernenden und Lehrbetrieb, den der Kanton genehmigt","Ein mündliches Versprechen","Ein Vertrag mit der Schule","Ein Handyvertrag"],e:"Im Lehrvertrag stehen Dauer, Lohn, Ferien und Arbeitszeit. Bei Minderjährigen unterschreiben auch die Eltern. Das kantonale Berufsbildungsamt muss den Vertrag genehmigen.",m:"Lehrvertrag = schriftlich und vom Kanton genehmigt."},
 {t:"beruf",l:2,s:"Überbetriebliche Kurse",q:"Was sind überbetriebliche Kurse (üK)?",a:["Kurse ausserhalb des Lehrbetriebs, in denen grundlegende Fertigkeiten geübt werden","Ferienlager","Sportkurse der Schule","Kurse für Lehrpersonen"],e:"In den üK lernen alle Lernenden eines Berufs die wichtigsten Grundlagen, egal in welchem Betrieb sie arbeiten. So haben alle die gleiche Basis.",m:"üK = gemeinsame Grundlagen."},
 {t:"beruf",l:2,s:"Bewerbung",q:"Was gehört in eine Bewerbung für eine Lehrstelle?",a:["Motivationsschreiben, Lebenslauf und Zeugnisse","Nur ein Selfie","Eine Liste mit Lieblingsfilmen","Das Handy-Passwort"],e:"Im Motivationsschreiben erklärst du, warum dich der Beruf interessiert. Dazu kommen Lebenslauf, Schulzeugnisse und oft Schnupperberichte oder Testergebnisse.",m:"Bewerbung: Brief, Lebenslauf, Zeugnisse."},
 {t:"beruf",l:3,s:"Qualifikationsverfahren",q:"Wie heisst die Abschlussprüfung am Ende der Lehre?",a:["Qualifikationsverfahren (QV)","Maturaprüfung","Aufnahmeprüfung","Fahrprüfung"],e:"Im Qualifikationsverfahren zeigen Lernende in praktischen und schulischen Prüfungen, was sie gelernt haben. Wer besteht, erhält das EFZ oder EBA.",m:"Lehrabschluss = QV."},
 {t:"beruf",l:3,s:"Ferien (Arbeitsrecht)",q:"Wie viele Wochen Ferien haben Lernende bis zum 20. Geburtstag mindestens?",a:["5 Wochen","2 Wochen","4 Tage","10 Wochen"],e:"Jugendliche bis zum vollendeten 20. Altersjahr haben laut Gesetz mindestens fünf Wochen Ferien pro Jahr. Erwachsene haben mindestens vier Wochen.",m:"Bis 20: mindestens 5 Wochen Ferien."},
 {t:"beruf",l:3,s:"Höhere Fachschule",q:"Welche Weiterbildung kann man nach einer Lehre ohne Matura besuchen?",a:["Eine höhere Fachschule (HF)","Nur das Gymnasium","Keine","Nur die Primarschule"],e:"Höhere Fachschulen richten sich an Berufsleute mit Erfahrung, zum Beispiel in Technik, Pflege oder Wirtschaft. Dazu gibt es Berufsprüfungen und höhere Fachprüfungen. Die Lehre ist ein Startpunkt, kein Endpunkt.",m:"Nach der Lehre: HF, Berufsprüfungen, FH."},
 {t:"beruf",l:3,s:"Passerelle",q:"Was ermöglicht die Passerelle nach der Berufsmaturität?",a:["Ein Studium an einer Universität oder ETH","Den Lernfahrausweis","Eine zweite Lehre","Einen Job bei der Nationalbank"],e:"Mit der Berufsmaturität kommt man an die Fachhochschule. Wer an die Universität oder ETH will, kann zusätzlich die Ergänzungsprüfung Passerelle ablegen.",m:"BM + Passerelle = Uni möglich."},
 // ===== Alltag =====
 {t:"alltag",l:1,s:"Fahrradhelm",q:"Was solltest du beim Velofahren tragen?",a:["Einen Helm","Eine Sonnenbrille in der Nacht","Flip-Flops","Nichts Besonderes"],e:"Ein Helm schützt bei einem Sturz den Kopf. Wichtig ist, dass er gut sitzt und der Riemen geschlossen ist.",m:"Velo = Helm auf."},
 {t:"alltag",l:1,s:"Rechtsverkehr",q:"Auf welcher Strassenseite fährt man in der Schweiz?",a:["Rechts","Links","In der Mitte","Egal"],e:"In der Schweiz gilt Rechtsverkehr: Velos und Autos fahren auf der rechten Seite. In Grossbritannien fährt man dagegen links.",m:"Schweiz = rechts fahren."},
 {t:"alltag",l:1,s:"PET-Recycling",q:"Wohin gehört eine leere PET-Flasche?",a:["In die PET-Sammlung","In den Kompost","In den Wald","In den Briefkasten"],e:"PET-Flaschen kann man in vielen Läden zurückgeben. Aus dem Material werden neue Flaschen gemacht. So spart man Rohstoffe und Energie.",m:"PET zurück in die Sammlung."},
 {t:"alltag",l:1,s:"Händewaschen",q:"Warum wäscht man sich vor dem Essen die Hände?",a:["Um Keime zu entfernen","Damit die Hände nass sind","Weil Seife gut schmeckt","Das ist nicht nötig"],e:"An den Händen sammeln sich Bakterien und Viren. Mit Wasser und Seife – etwa 20 Sekunden lang – werden die meisten entfernt. So wird man seltener krank.",m:"Hände waschen = weniger Keime."},
 {t:"alltag",l:2,s:"Tox Info Suisse",q:"Welche Nummer rufst du in der Schweiz bei einer Vergiftung an?",a:["145","117","1818","112 nur im Ausland"],e:"Tox Info Suisse berät unter 145 rund um die Uhr bei Vergiftungen, zum Beispiel wenn ein Kind Putzmittel oder Tabletten geschluckt hat. Bei Bewusstlosigkeit sofort 144.",m:"Vergiftung: 145."},
 {t:"alltag",l:2,s:"Rega",q:"Mit welcher Nummer alarmiert man die Rega, die Schweizer Luftrettung?",a:["1414","144","118","1818"],e:"Die Rega fliegt mit Helikoptern und Ambulanzjets Verletzte ins Spital, etwa nach einem Unfall in den Bergen. Man erreicht sie unter 1414.",m:"Rega: 1414."},
 {t:"alltag",l:2,s:"Lebensmittelpyramide",q:"Wovon sollte man laut Lebensmittelpyramide am meisten essen oder trinken?",a:["Wasser sowie Gemüse und Früchte","Süssigkeiten","Chips","Energy-Drinks"],e:"Die Basis bilden ungesüsste Getränke wie Wasser, darüber folgen Gemüse und Früchte, dann Getreide. Süsses und Salziges steht zuoberst – davon wenig.",m:"Viel Wasser, Gemüse, Früchte – wenig Süsses."},
 {t:"alltag",l:2,s:"Sackgebühr",q:"Warum zahlt man in vielen Gemeinden eine Gebühr für den Kehrichtsack?",a:["Wer mehr Abfall macht, soll mehr bezahlen","Weil Säcke Gold enthalten","Um Recycling zu verbieten","Damit Abfall teurer als Essen ist"],e:"Mit der Sackgebühr gilt das Verursacherprinzip: Wer viel Abfall produziert, zahlt mehr. Das motiviert, Glas, Papier und PET separat zu sammeln.",m:"Sackgebühr = Verursacherprinzip."},
 {t:"alltag",l:3,s:"Lernfahrausweis",q:"Ab welchem Alter darf man in der Schweiz den Lernfahrausweis für das Auto beantragen?",a:["Ab 17 Jahren","Ab 16 Jahren","Ab 18 Jahren","Ab 21 Jahren"],e:"Seit 2021 kann man den Lernfahrausweis für Autos schon mit 17 erhalten. Wer vor 20 lernt, muss mindestens ein Jahr üben, bevor die praktische Prüfung möglich ist.",m:"Lernfahrausweis Auto: ab 17."},
 {t:"alltag",l:3,s:"Haftpflichtversicherung",q:"Was bezahlt eine private Haftpflichtversicherung?",a:["Schäden, die du anderen Personen oder deren Sachen verursachst","Deine eigenen kaputten Sachen","Deine Arztkosten","Deine Steuern"],e:"Wenn du beim Nachbarn aus Versehen das Fenster einschlägst, zahlt die Haftpflichtversicherung. Sie ist freiwillig, aber sehr verbreitet und wird oft von Vermietern verlangt.",m:"Haftpflicht = Schaden bei anderen."},
 {t:"alltag",l:3,s:"Hausratversicherung",q:"Was versichert die Hausratversicherung?",a:["Deine eigenen Sachen, zum Beispiel bei Feuer, Wasser oder Diebstahl","Schäden an fremden Autos","Deine Gesundheit","Den Lohn"],e:"Die Hausratversicherung ersetzt Möbel, Kleider oder Elektronik, wenn sie durch Feuer, Wasser oder Einbruch beschädigt werden oder verloren gehen. Sie schützt also deine eigenen Sachen.",m:"Hausrat = eigene Sachen."},
 {t:"alltag",l:3,s:"Mietrecht (Schweiz)",q:"Wie lange ist die gesetzliche Kündigungsfrist für eine Wohnung mindestens?",a:["Drei Monate","Eine Woche","Ein Jahr","Es gibt keine Frist"],e:"Für Wohnungen gilt eine Kündigungsfrist von mindestens drei Monaten auf die ortsüblichen Kündigungstermine. Im Mietvertrag können längere Fristen stehen. Kündigungen macht man am besten eingeschrieben.",m:"Wohnung kündigen: mind. 3 Monate."},
 {t:"alltag",l:3,s:"Einwohnerkontrolle",q:"Was musst du nach einem Umzug in eine andere Gemeinde tun?",a:["Dich bei der neuen Gemeinde anmelden, in der Regel innert 14 Tagen","Nichts","Nur der Post Bescheid geben","Einen neuen Pass beantragen"],e:"Bei einem Umzug meldet man sich bei der alten Gemeinde ab und bei der neuen an, meist innert 14 Tagen. Das geht oft auch online. Die Anmeldung ist wichtig für Steuern, Abstimmungen und Versicherungen.",m:"Umzug: innert 14 Tagen anmelden."}
