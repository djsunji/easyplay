const FRAGEN4 = [
 // Politik
 {t:"pol_demokratie",l:1,s:"Gemeindepräsident",q:"Wer leitet in vielen Schweizer Gemeinden die Gemeinderegierung?",a:["Die Gemeindepräsidentin oder der Gemeindepräsident","Der Bundesrat","Die Polizei","Der Schulleiter"],e:"Jede Gemeinde hat eine eigene Regierung, meist Gemeinderat genannt. An ihrer Spitze steht die Gemeindepräsidentin oder der Gemeindepräsident. In Städten heisst das Amt oft Stadtpräsidium.",m:"Gemeinde: Gemeindepräsidium."},
 {t:"pol_demokratie",l:2,s:"Nationalrat (Schweiz)",q:"Wie oft wird der Nationalrat neu gewählt?",a:["Alle vier Jahre","Jedes Jahr","Alle zehn Jahre","Nie, man bleibt lebenslang"],e:"Die Nationalratswahlen finden alle vier Jahre im Oktober statt. Die Ständeratsmitglieder werden in den meisten Kantonen am gleichen Tag gewählt.",m:"Nationalratswahlen: alle 4 Jahre."},
 {t:"pol_demokratie",l:3,s:"Bundespräsident (Schweiz)",q:"Wie lange bleibt jemand Bundespräsidentin oder Bundespräsident der Schweiz?",a:["Ein Jahr","Vier Jahre","Acht Jahre","Bis zur Pensionierung"],e:"Das Präsidium wechselt jedes Jahr zwischen den sieben Bundesratsmitgliedern. Die Präsidentin oder der Präsident leitet die Sitzungen und vertritt die Schweiz, hat aber nicht mehr Macht als die anderen.",m:"Bundespräsidium: 1 Jahr."},
 // Natur & Tiere
 {t:"tiere",l:1,s:"Vögel",q:"Welches Tier hat Federn und legt Eier?",a:["Das Huhn","Die Katze","Der Hund","Die Kuh"],e:"Alle Vögel haben Federn und legen Eier. Das Huhn ist ein Vogel, auch wenn es kaum fliegen kann.",m:"Federn + Eier = Vogel."},
 {t:"natur",l:2,s:"Neuenburgersee",q:"Welcher ist der grösste See, der vollständig in der Schweiz liegt?",a:["Der Neuenburgersee","Der Genfersee","Der Bodensee","Der Lago Maggiore"],e:"Der Genfersee und der Bodensee sind grösser, liegen aber teilweise in Frankreich beziehungsweise Deutschland und Österreich. Der grösste See ganz auf Schweizer Boden ist der Neuenburgersee.",m:"Grösster rein schweizerischer See: Neuenburgersee."},
 {t:"natur",l:3,s:"Laubfall",q:"Warum werfen viele Laubbäume im Herbst ihre Blätter ab?",a:["Um im Winter Wasser zu sparen und Frostschäden zu vermeiden","Weil die Blätter zu schwer werden","Weil Vögel sie abreissen","Damit mehr Licht auf den Boden fällt"],e:"Über die Blätter verdunstet viel Wasser. Im Winter ist der Boden oft gefroren, und der Baum kann kaum Wasser aufnehmen. Darum zieht er wichtige Stoffe aus den Blättern zurück und wirft sie ab.",m:"Laubfall = Wasser sparen im Winter."},
 // Wissenschaft & Körper
 {t:"koerper",l:1,s:"Zahnpflege",q:"Wie oft sollte man die Zähne mindestens putzen?",a:["Zweimal am Tag","Einmal pro Woche","Nur am Wochenende","Gar nicht"],e:"Zahnärzte empfehlen, morgens und abends die Zähne zu putzen. So werden Essensreste und Beläge entfernt, die sonst Karies verursachen können.",m:"Zähne putzen: morgens und abends."},
 {t:"koerper",l:2,s:"Magen",q:"Was passiert im Magen?",a:["Die Nahrung wird mit Magensaft vermischt und zerkleinert","Das Blut wird gepumpt","Die Luft wird gefiltert","Die Knochen wachsen"],e:"Im Magen wird die Nahrung mit Säure und Verdauungssäften vermischt und durchgeknetet. Danach geht der Brei in den Darm, wo die Nährstoffe ins Blut gelangen.",m:"Magen = Nahrung vorverdauen."},
 {t:"koerper",l:2,s:"Schlaf",q:"Warum ist genug Schlaf wichtig?",a:["Der Körper erholt sich, und das Gehirn verarbeitet Gelerntes","Weil man sonst verhungert","Damit die Haare schneller wachsen","Schlaf ist nicht wichtig"],e:"Im Schlaf erholen sich Körper und Gehirn. Was man am Tag gelernt hat, wird dabei im Gedächtnis gefestigt. Kinder und Jugendliche brauchen deshalb besonders viel Schlaf.",m:"Schlaf = Erholung + Lernen festigen."},
 {t:"wissenschaft",l:3,s:"Penicillin",q:"Wer entdeckte 1928 das Penicillin, das erste Antibiotikum?",a:["Alexander Fleming","Louis Pasteur","Robert Koch","Marie Curie"],e:"Fleming bemerkte, dass ein Schimmelpilz Bakterien in einer Schale abtötete. Aus dieser Entdeckung entstand das Penicillin, das seither unzählige Leben gerettet hat.",m:"Penicillin: Fleming, 1928."},
 // Umgang mit Geld
 {t:"geld",l:1,s:"Banknoten des Schweizer Frankens",q:"Welche Farbe hat die aktuelle 10-Franken-Note?",a:["Gelb","Blau","Grün","Violett"],e:"Jede Schweizer Banknote hat ihre eigene Farbe: 10 Franken gelb, 20 rot, 50 grün, 100 blau, 200 braun und 1000 violett. So kann man sie leicht unterscheiden.",m:"10er gelb, 20er rot, 50er grün, 100er blau."},
 {t:"geld",l:2,s:"Abonnement",q:"Warum lohnt es sich, Abos regelmässig zu überprüfen?",a:["Kleine monatliche Beträge summieren sich über das Jahr zu viel Geld","Weil Abos jedes Jahr gratis werden","Weil man Abos nicht kündigen kann","Es lohnt sich nie"],e:"Streaming, Musik, Spiele, Handy: Jedes Abo kostet vielleicht nur ein paar Franken pro Monat. Zusammen und über ein ganzes Jahr gerechnet kommt aber schnell ein grosser Betrag zusammen.",m:"Abos checken – kleine Beträge läppern sich."},
 {t:"geld",l:3,s:"Rücklage",q:"Wozu dient eine Notfallreserve?",a:["Um unerwartete Ausgaben bezahlen zu können, ohne Schulden zu machen","Um jeden Monat Ferien zu machen","Um Aktien zu kaufen","Um Steuern zu vermeiden"],e:"Ein kaputtes Handy, eine Zahnarztrechnung oder eine Nachzahlung: Unerwartete Ausgaben kommen vor. Wer eine Reserve auf der Seite hat, muss dafür keinen teuren Kredit aufnehmen. Oft wird empfohlen, mehrere Monatsausgaben zu sparen.",m:"Notfallreserve schützt vor Schulden."},
 // Banken
 {t:"banken",l:1,s:"Sparkonto",q:"Wofür ist ein Sparkonto gedacht?",a:["Um Geld länger auf die Seite zu legen","Um täglich einzukaufen","Um Schulden zu machen","Um Steuern zu bezahlen"],e:"Auf dem Sparkonto legt man Geld zur Seite, das man nicht sofort braucht. Oft gibt es dafür etwas mehr Zins als auf dem Konto für den Alltag.",m:"Sparkonto = Geld zur Seite legen."},
 {t:"banken",l:2,s:"Überweisung",q:"Was ist eine Überweisung?",a:["Man schickt Geld von einem Konto auf ein anderes","Man hebt Bargeld ab","Man eröffnet ein Konto","Man wechselt Franken in Euro"],e:"Bei einer Überweisung gibst du der Bank den Auftrag, Geld auf ein anderes Konto zu senden – zum Beispiel für eine Rechnung. Dazu braucht es die IBAN der Empfängerin oder des Empfängers.",m:"Überweisung = Geld von Konto zu Konto."},
 {t:"banken",l:2,s:"Bankkonto",q:"Was bieten viele Banken speziell für Jugendliche an?",a:["Jugendkonten, oft ohne Gebühren","Kredite ohne Zinsen","Gratis-Aktien","Nichts"],e:"Viele Banken haben Konten für Kinder und Jugendliche, oft ohne Kontogebühren und mit einer eigenen Karte. So lernt man früh, mit Geld umzugehen. Bei Minderjährigen müssen die Eltern meist zustimmen.",m:"Jugendkonto = günstiger Einstieg."},
 {t:"banken",l:3,s:"Hypothek",q:"Was ist eine Hypothek?",a:["Ein Kredit für ein Haus oder eine Wohnung, gesichert durch die Liegenschaft","Eine Versicherung gegen Feuer","Ein Sparkonto für Kinder","Eine Art Steuer"],e:"Wer ein Haus kauft, bezahlt meist nur einen Teil selbst. Den Rest leiht die Bank als Hypothek. Wird der Kredit nicht zurückbezahlt, kann die Bank die Liegenschaft verkaufen lassen.",m:"Hypothek = Kredit fürs Eigenheim."},
 {t:"banken",l:3,s:"Bitcoin",q:"Was stimmt über Kryptowährungen wie Bitcoin?",a:["Ihr Wert kann stark schwanken, und es gibt keine Einlagensicherung","Sie sind garantiert sicher","Sie werden von der Nationalbank herausgegeben","Ihr Wert steigt immer"],e:"Kryptowährungen sind digitale Werte, die ohne Zentralbank funktionieren. Ihr Preis kann innert Tagen stark steigen oder fallen. Geht eine Handelsplattform pleite, ist das Geld nicht wie ein Bankguthaben geschützt.",m:"Krypto = hohes Risiko."},
 // Steuern
 {t:"steuern",l:2,s:"Direkte Bundessteuer",q:"Wer erhebt die direkte Bundessteuer auf dem Einkommen?",a:["Der Bund – eingezogen wird sie von den Kantonen","Die Gemeinden allein","Die Banken","Die Arbeitgeber für sich selbst"],e:"Die direkte Bundessteuer ist eine Steuer des Bundes. Damit nicht jede Person zwei Steuererklärungen ausfüllen muss, veranlagen und beziehen die Kantone sie zusammen mit ihren eigenen Steuern.",m:"Bundessteuer – eingezogen vom Kanton."},
 {t:"steuern",l:3,s:"Kirchensteuer",q:"Was gilt in den meisten Kantonen für die Kirchensteuer?",a:["Sie wird von Mitgliedern anerkannter Landeskirchen erhoben – wer austritt, zahlt keine","Alle Personen müssen sie zahlen","Nur Kinder zahlen sie","Sie wird vom Bund erhoben"],e:"In den meisten Kantonen zahlen Mitglieder der anerkannten Landeskirchen eine Kirchensteuer. Wer aus der Kirche austritt, zahlt sie als Privatperson nicht mehr. In vielen Kantonen zahlen jedoch auch Firmen eine Kirchensteuer.",m:"Kirchensteuer: für Kirchenmitglieder."},
 {t:"steuern",l:3,s:"Erbschaftssteuer",q:"Was gilt in den meisten Kantonen bei einer Erbschaft von den Eltern an ihre Kinder?",a:["Die Kinder zahlen keine Erbschaftssteuer","Die Kinder zahlen die Hälfte als Steuer","Der Bund nimmt alles","Man darf nichts erben"],e:"Die Erbschaftssteuer ist Sache der Kantone. In den meisten Kantonen sind Ehepartner und direkte Nachkommen befreit. Andere Erbende, etwa Geschwister oder Freunde, zahlen je nach Kanton eine Steuer.",m:"Kinder erben meist steuerfrei."},
 // Krankenkasse
 {t:"krankenkasse",l:1,s:"Apotheke",q:"Wo bekommst du Medikamente, die dir die Ärztin verschrieben hat?",a:["In der Apotheke","Beim Kiosk","In der Bibliothek","Bei der Post"],e:"In der Apotheke erhältst du Medikamente und kannst dich auch beraten lassen. Medikamente sollte man nur so nehmen, wie es die Ärztin oder die Apotheke erklärt.",m:"Medikamente: aus der Apotheke, wie verordnet."},
 {t:"krankenkasse",l:2,s:"Versichertenkarte",q:"Wofür brauchst du die Versichertenkarte der Krankenkasse?",a:["Du zeigst sie beim Arzt oder in der Apotheke, damit abgerechnet werden kann","Um im Laden zu bezahlen","Als Ausweis für den Bus","Um Geld abzuheben"],e:"Auf der Versichertenkarte stehen deine Versichertennummer und deine Krankenkasse. Arztpraxen und Apotheken brauchen diese Angaben, um die Kosten abzurechnen.",m:"Versichertenkarte immer dabei haben."},
 {t:"krankenkasse",l:2,s:"Telmed",q:"Was ist das Telmed-Modell?",a:["Man ruft vor einem Arztbesuch zuerst eine medizinische Beratung an und bekommt dafür eine tiefere Prämie","Man darf nur per Telefon krank sein","Man bekommt ein Gratis-Handy","Die Krankenkasse ruft jeden Tag an"],e:"Bei Telmed meldet man sich vor einem Arztbesuch zuerst bei einer telefonischen Beratung. Die Fachleute sagen, ob und wo eine Behandlung nötig ist. Dafür ist die Prämie günstiger. Notfälle sind ausgenommen.",m:"Telmed: erst anrufen, dafür günstiger."},
 {t:"krankenkasse",l:3,s:"Krankenversicherung in der Schweiz",q:"Bezahlt die Grundversicherung normale Zahnarztbehandlungen wie Kontrollen oder Füllungen?",a:["Nein, in der Regel nicht","Ja, immer vollständig","Nur bei Kindern unter 5","Nur im Sommer"],e:"Normale Zahnbehandlungen muss man in der Schweiz meist selbst bezahlen oder über eine Zusatzversicherung abdecken. Die Grundversicherung zahlt nur in besonderen Fällen, etwa bei bestimmten schweren Erkrankungen. Gute Zahnpflege spart also Geld.",m:"Zahnarzt: meist selbst zahlen."},
 // Berufswahl & Lehre
 {t:"beruf",l:1,s:"Bäcker",q:"Wer macht in der Backstube Brot und Gipfeli?",a:["Bäckerinnen und Bäcker","Gärtnerinnen und Gärtner","Informatikerinnen und Informatiker","Coiffeusen und Coiffeure"],e:"Bäcker-Konditorinnen und -Konditoren beginnen oft sehr früh am Morgen, damit das Brot frisch ist. Die Lehre dauert drei Jahre und schliesst mit dem EFZ ab.",m:"Brot = Bäckerei."},
 {t:"beruf",l:2,s:"Berufsmesse",q:"Was kann man an einer Berufsmesse machen?",a:["Viele Berufe kennenlernen und mit Lernenden und Betrieben sprechen","Nur einkaufen","Eine Lehre sofort abschliessen","Ferien buchen"],e:"An Berufsmessen stellen sich viele Berufe und Betriebe vor. Man kann Tätigkeiten ausprobieren und Lernende direkt fragen, wie ihr Alltag aussieht.",m:"Berufsmesse = Berufe entdecken."},
 {t:"beruf",l:2,s:"Lehrlingslohn",q:"Was stimmt über den Lohn von Lernenden?",a:["Er ist im Lehrvertrag festgelegt und steigt meist mit jedem Lehrjahr","Lernende bekommen nie Lohn","Er ist immer gleich hoch wie bei ausgelernten Fachleuten","Die Schule zahlt ihn"],e:"Lernende erhalten einen Lohn, der im Lehrvertrag steht. Er ist tiefer als bei ausgebildeten Fachleuten, weil man noch lernt, und steigt meist von Lehrjahr zu Lehrjahr. Je nach Beruf gibt es grosse Unterschiede.",m:"Lernendenlohn steigt pro Lehrjahr."},
 {t:"beruf",l:3,s:"Arbeitszeugnis",q:"Was ist ein Arbeitszeugnis?",a:["Eine Beurteilung von Leistung und Verhalten, die man vom Arbeitgeber verlangen kann","Eine Schulnote","Eine Steuerrechnung","Ein Arztzeugnis"],e:"Arbeitnehmende und Lernende können jederzeit ein Zeugnis verlangen. Es beschreibt die Aufgaben und beurteilt Leistung und Verhalten. Bei Bewerbungen ist es sehr wichtig.",m:"Arbeitszeugnis = Beurteilung der Arbeit."},
 // Alltag
 {t:"alltag",l:1,s:"Fussgängerstreifen",q:"Was gilt am Fussgängerstreifen in der Schweiz?",a:["Fussgängerinnen und Fussgänger haben Vortritt, trotzdem immer zuerst schauen","Autos haben immer Vortritt","Man darf dort nicht über die Strasse","Man muss rennen"],e:"Wer am Fussgängerstreifen erkennbar über die Strasse will, hat Vortritt. Trotzdem gilt: warten, bis die Autos anhalten, und Blickkontakt suchen.",m:"Streifen = Vortritt, aber zuerst schauen."},
 {t:"alltag",l:2,s:"Euronotruf",q:"Welche Notrufnummer funktioniert in ganz Europa, auch in der Schweiz?",a:["112","911","144","999"],e:"Die 112 ist die europäische Notrufnummer. In der Schweiz wird man damit zur Polizei verbunden. Für Sanität (144) und Feuerwehr (118) gibt es eigene Nummern.",m:"112 = Notruf in ganz Europa."},
 {t:"alltag",l:2,s:"Lebensmittelverschwendung",q:"Was bedeutet Foodwaste?",a:["Essbare Lebensmittel, die weggeworfen werden","Eine Fastfood-Kette","Kompost im Garten","Ein Kochwettbewerb"],e:"Ein grosser Teil der Lebensmittel landet im Abfall, obwohl er noch essbar wäre. Tipps dagegen: gezielt einkaufen, Resten verwerten und beim Mindesthaltbarkeitsdatum riechen und probieren statt sofort wegwerfen.",m:"Foodwaste vermeiden: planen, Resten nutzen."},
 {t:"alltag",l:3,s:"Radio- und Fernsehabgabe",q:"Wofür bezahlen Haushalte in der Schweiz die Medienabgabe (Serafe)?",a:["Für Radio und Fernsehen mit Service-public-Auftrag, unabhängig davon, ob man ein Gerät hat","Für das Internet-Abo","Für Handyverträge","Für Zeitungen"],e:"Die Abgabe wird pro Haushalt erhoben und finanziert vor allem die SRG und regionale Sender. Ob man ein Radio oder einen Fernseher besitzt, spielt keine Rolle.",m:"Medienabgabe: pro Haushalt."},
 // Schweizer Geschichte
 {t:"ch_geschichte",l:1,s:"Confoederatio Helvetica",q:"Wofür steht das Kürzel CH?",a:["Confoederatio Helvetica","Canton Helvetia","Central Helvetica","Chocolat Heaven"],e:"CH ist die Abkürzung für den lateinischen Namen der Schweiz: Confoederatio Helvetica, also Schweizerische Eidgenossenschaft. Latein ist neutral und keine der vier Landessprachen.",m:"CH = Confoederatio Helvetica."},
 {t:"ch_geschichte",l:2,s:"Schweizer Franken",q:"Seit wann gibt es den Franken als gemeinsame Währung der Schweiz?",a:["Seit 1850","Seit 1291","Seit 1971","Seit 2002"],e:"Vor 1850 gab es in der Schweiz viele verschiedene Münzen der Kantone und Städte. Mit dem neuen Bundesstaat wurde der Franken als einheitliche Währung eingeführt.",m:"Franken: seit 1850."},
 {t:"ch_geschichte",l:2,s:"Mediationsakte",q:"Wer gab der Schweiz 1803 mit der Mediationsakte eine neue Ordnung?",a:["Napoleon Bonaparte","Karl der Grosse","Henri Guisan","Wilhelm Tell"],e:"Die Helvetische Republik war zerstritten. Napoleon vermittelte 1803 eine neue Verfassung, die Mediationsakte. Dabei entstanden neue Kantone wie Aargau, Thurgau, St. Gallen, Graubünden, Tessin und Waadt.",m:"1803: Mediationsakte von Napoleon."},
 {t:"ch_geschichte",l:2,s:"Spanisch-Brötli-Bahn",q:"Welche Strecke befuhr 1847 die erste Eisenbahn, die ganz in der Schweiz verlief?",a:["Zürich–Baden","Bern–Thun","Genf–Lausanne","Chur–St. Moritz"],e:"Die erste Bahn innerhalb der Schweiz verband 1847 Zürich mit Baden. Man nennt sie «Spanisch-Brötli-Bahn», weil damit angeblich ein beliebtes Gebäck aus Baden schnell nach Zürich kam.",m:"1847: Spanisch-Brötli-Bahn Zürich–Baden."},
 {t:"ch_geschichte",l:3,s:"Alters- und Hinterlassenenversicherung",q:"Seit wann gibt es in der Schweiz die AHV?",a:["Seit 1948","Seit 1848","Seit 1918","Seit 2000"],e:"Die AHV sichert ein Grundeinkommen im Alter. Sie wurde 1947 vom Volk angenommen und trat 1948 in Kraft. Die Forderung nach einer Altersversicherung war schon beim Landesstreik 1918 erhoben worden.",m:"AHV: seit 1948."},
 // Vom Urknall zur Steinzeit
 {t:"g_urzeit",l:1,s:"Tyrannosaurus",q:"Welcher Dinosaurier war ein riesiger Fleischfresser mit auffällig kleinen Armen?",a:["Tyrannosaurus rex","Brachiosaurus","Triceratops","Stegosaurus"],e:"Der Tyrannosaurus rex war einer der grössten Fleischfresser an Land. Seine Arme waren im Vergleich zum Körper winzig, sein Biss dafür extrem stark.",m:"T. rex: grosser Kopf, kleine Arme."},
 {t:"g_urzeit",l:1,s:"Fossil",q:"Was ist ein Fossil?",a:["Versteinerte Überreste oder Spuren von Lebewesen aus der Urzeit","Ein altes Spielzeug","Ein Edelstein","Ein Werkzeug aus Metall"],e:"Wenn Tiere oder Pflanzen nach dem Tod schnell von Schlamm bedeckt werden, können sich über Millionen Jahre Versteinerungen bilden. So wissen wir, wie Dinosaurier aussahen.",m:"Fossil = Versteinerung aus der Urzeit."},
 {t:"g_urzeit",l:1,s:"Mammut",q:"Welches grosse, haarige Tier mit langen Stosszähnen lebte in der Eiszeit?",a:["Das Mammut","Das Nashorn von heute","Das Kamel","Das Nilpferd"],e:"Mammuts waren mit den Elefanten verwandt und hatten ein dichtes Fell gegen die Kälte. Auch in der Schweiz wurden Knochen und Zähne von Mammuts gefunden.",m:"Mammut = Eiszeit-Elefant mit Fell."},
 {t:"g_urzeit",l:2,s:"Eiszeitalter",q:"Was formten die Gletscher der Eiszeit in der Schweiz?",a:["Viele Täler und Seen, zum Beispiel den Zürichsee","Die Vulkane im Jura","Das Mittelmeer","Die Städte"],e:"Während der Eiszeiten bedeckten riesige Gletscher weite Teile der Schweiz. Sie schliffen Täler aus und hinterliessen Seen, Hügel und grosse Findlinge.",m:"Eiszeit-Gletscher formten die Landschaft."},
 {t:"g_urzeit",l:2,s:"Neandertaler",q:"Welche Menschenform lebte schon vor dem modernen Menschen in Europa?",a:["Der Neandertaler","Der Wikinger","Der Römer","Der Pharao"],e:"Neandertaler lebten Hunderttausende Jahre in Europa und waren an die Kälte angepasst. Sie starben vor etwa 40'000 Jahren aus. Viele Menschen tragen heute noch einen kleinen Teil ihres Erbguts in sich.",m:"Neandertaler: frühe Europäer."},
 {t:"g_urzeit",l:2,s:"Eiszeitalter",q:"Was war typisch für eine Eiszeit?",a:["Grosse Teile der Erde waren von Eis bedeckt, und es war viel kälter","Es gab kein Wasser","Die Sonne ging nie auf","Es war heisser als heute"],e:"In Eiszeiten war es im Durchschnitt deutlich kälter, und Gletscher breiteten sich weit aus. Die letzte Eiszeit endete vor etwa 12'000 Jahren.",m:"Eiszeit = kalt und viel Gletschereis."},
 {t:"g_urzeit",l:3,s:"Bronzezeit",q:"Bronze gab einer ganzen Epoche ihren Namen. Woraus besteht sie?",a:["Aus Kupfer und Zinn","Aus Eisen und Gold","Aus Stein und Holz","Aus Silber und Blei"],e:"Bronze ist eine Mischung aus Kupfer und etwas Zinn und härter als reines Kupfer. Ab etwa 2200 v. Chr. stellten Menschen daraus Werkzeuge, Waffen und Schmuck her.",m:"Bronze = Kupfer + Zinn."},
 {t:"g_urzeit",l:3,s:"Urknall",q:"Aus welchen Stoffen bestanden die ersten Sterne nach dem Urknall hauptsächlich?",a:["Aus Wasserstoff und Helium","Aus Eisen und Gold","Aus Wasser und Sand","Aus Kohle und Öl"],e:"Nach dem Urknall gab es fast nur Wasserstoff und Helium. Schwerere Elemente wie Kohlenstoff, Sauerstoff oder Eisen entstanden erst später im Inneren von Sternen.",m:"Erste Sterne: Wasserstoff und Helium."},
 // Antike
 {t:"g_antike",l:1,s:"Zeus",q:"Wer war bei den alten Griechen der oberste Gott?",a:["Zeus","Thor","Ra","Odin"],e:"Die Griechen glaubten an viele Götter, die auf dem Berg Olymp wohnten. Zeus war ihr König und schleuderte laut Sagen Blitze. Thor und Odin sind nordische Götter.",m:"Griechischer Göttervater: Zeus."},
 {t:"g_antike",l:1,s:"Hannibal",q:"Mit welchen Tieren überquerte der Feldherr Hannibal die Alpen?",a:["Mit Elefanten","Mit Kamelen","Mit Pferden aus Plastik","Mit Löwen"],e:"Hannibal aus Karthago zog 218 v. Chr. mit einem Heer und Kriegselefanten über die Alpen, um Rom anzugreifen. Viele Tiere überlebten die Kälte nicht.",m:"Hannibal: Elefanten über die Alpen."},
 {t:"g_antike",l:2,s:"Kolosseum",q:"Wie heisst das berühmte Amphitheater in Rom, in dem Gladiatoren kämpften?",a:["Kolosseum","Akropolis","Pantheon","Parthenon"],e:"Das Kolosseum bot Platz für Zehntausende Zuschauer. Dort fanden Gladiatorenkämpfe und Tierhetzen statt. Es gehört heute zu den bekanntesten Bauwerken der Welt.",m:"Gladiatoren im Kolosseum."},
 {t:"g_antike",l:2,s:"Sieben Weltwunder",q:"Welches der sieben Weltwunder der Antike steht heute noch?",a:["Die Pyramiden von Gizeh","Der Koloss von Rhodos","Der Leuchtturm von Alexandria","Die Hängenden Gärten"],e:"Von den sieben Weltwundern der Antike sind nur die Pyramiden von Gizeh erhalten geblieben. Die anderen wurden durch Erdbeben, Feuer oder Zerfall zerstört.",m:"Einziges erhaltenes Weltwunder: Pyramiden."},
 {t:"g_antike",l:2,s:"Latein",q:"Welche Sprache sprachen die alten Römer?",a:["Latein","Griechisch","Italienisch","Französisch"],e:"Die Römer sprachen Latein. Daraus entwickelten sich Italienisch, Französisch, Spanisch und Rätoromanisch. Auch viele deutsche Wörter stammen aus dem Latein, etwa «Fenster» oder «Mauer».",m:"Römer = Latein."},
 {t:"g_antike",l:2,s:"Kleopatra VII.",q:"Wer war Kleopatra?",a:["Die letzte Königin des alten Ägyptens","Eine griechische Göttin","Eine römische Kaiserin","Eine Pharaonin, die die Pyramiden baute"],e:"Kleopatra regierte im 1. Jahrhundert v. Chr. Sie verbündete sich mit Cäsar und später mit Marcus Antonius. Nach ihrem Tod 30 v. Chr. wurde Ägypten eine römische Provinz.",m:"Kleopatra: letzte Königin Ägyptens."},
 {t:"g_antike",l:3,s:"Alexander der Große",q:"Wofür ist Alexander der Grosse bekannt?",a:["Er eroberte ein riesiges Reich von Griechenland bis nach Indien","Er baute die Chinesische Mauer","Er erfand die Demokratie","Er gründete Rom"],e:"Alexander wurde mit 20 Jahren König von Makedonien. In nur etwa zehn Jahren eroberte er das Perserreich und zog bis nach Indien. Er starb schon mit 32 Jahren.",m:"Alexander: Reich bis Indien."},
 {t:"g_antike",l:3,s:"Chinesische Mauer",q:"Welche riesige Grenzbefestigung wurde in China ab der Antike gebaut?",a:["Die Chinesische Mauer","Der Hadrianswall","Der Limes","Die Berliner Mauer"],e:"Erste Mauerabschnitte entstanden schon vor über 2000 Jahren. Über viele Jahrhunderte wurden sie verlängert und ausgebaut. Die meisten heute sichtbaren Teile stammen aus der späteren Ming-Zeit.",m:"Chinesische Mauer: über Jahrhunderte gebaut."},
 // Mittelalter & Entdeckungen
 {t:"g_mittelalter",l:1,s:"Rüstung",q:"Wie heisst die schützende Kleidung aus Metall, die Ritter trugen?",a:["Rüstung","Mantel","Tracht","Uniform"],e:"Eine Rüstung schützte den Ritter im Kampf. Sie war schwer und teuer. Man brauchte Hilfe, um sie anzuziehen.",m:"Ritter tragen Rüstungen."},
 {t:"g_mittelalter",l:1,s:"Pergament",q:"Worauf schrieben Mönche im Mittelalter ihre Bücher?",a:["Auf Pergament aus Tierhaut","Auf Plastik","Auf Glas","Auf Handybildschirme"],e:"Pergament wurde aus Tierhaut hergestellt. Mit Feder und Tinte schrieben Mönche Bücher sorgfältig ab und verzierten sie mit bunten Bildern.",m:"Mittelalter-Bücher: Pergament und Feder."},
 {t:"g_mittelalter",l:2,s:"Marco Polo",q:"Wer war Marco Polo?",a:["Ein Händler aus Venedig, der bis nach China reiste","Ein Wikinger","Ein römischer Kaiser","Ein Erfinder aus der Schweiz"],e:"Marco Polo reiste im 13. Jahrhundert nach China und lebte dort viele Jahre. Sein Reisebericht machte Europa neugierig auf Asien.",m:"Marco Polo: Venedig → China."},
 {t:"g_mittelalter",l:2,s:"Jeanne d’Arc",q:"Wer war Jeanne d’Arc?",a:["Eine junge Französin, die im Hundertjährigen Krieg ein Heer anführte","Eine englische Königin","Eine Nonne aus Zürich","Eine Entdeckerin Amerikas"],e:"Jeanne d’Arc half Frankreich 1429, die Stadt Orléans zu befreien. Später wurde sie gefangen genommen und 1431 verbrannt. Heute ist sie eine Nationalheldin Frankreichs.",m:"Jeanne d’Arc: Heldin von Orléans."},
 {t:"g_mittelalter",l:2,s:"Leibeigenschaft",q:"Was waren Leibeigene im Mittelalter?",a:["Bauern, die von einem Grundherrn abhängig waren und nicht frei wegziehen durften","Reiche Kaufleute","Ritter mit eigener Burg","Mönche"],e:"Leibeigene bearbeiteten das Land eines Grundherrn und mussten ihm Abgaben und Dienste leisten. Ohne seine Erlaubnis durften sie weder wegziehen noch heiraten.",m:"Leibeigene: unfreie Bauern."},
 {t:"g_mittelalter",l:3,s:"Magna Carta",q:"Was regelte die Magna Carta von 1215 in England?",a:["Sie beschränkte die Macht des Königs gegenüber dem Adel","Sie gründete das englische Parlament der Arbeiter","Sie verbot das Christentum","Sie machte England zur Republik"],e:"Der englische König musste 1215 zusagen, dass auch er an Gesetze gebunden ist. Die Magna Carta gilt als wichtiger früher Schritt zu Rechtsstaat und Grundrechten.",m:"Magna Carta: auch der König steht unter dem Recht."},
 {t:"g_mittelalter",l:3,s:"Eroberung von Konstantinopel (1453)",q:"In welchem Jahr eroberten die Osmanen Konstantinopel, das heutige Istanbul?",a:["1453","1291","1066","1789"],e:"Mit der Eroberung Konstantinopels endete das Oströmische (Byzantinische) Reich. Die Stadt wurde Hauptstadt des Osmanischen Reiches.",m:"1453: Konstantinopel fällt."},
 {t:"g_mittelalter",l:3,s:"Vasco da Gama",q:"Wer erreichte 1498 als erster Europäer auf dem Seeweg um Afrika herum Indien?",a:["Vasco da Gama","Christoph Kolumbus","Marco Polo","Ferdinand Magellan"],e:"Der Portugiese Vasco da Gama segelte um die Südspitze Afrikas bis nach Indien. So entstand ein direkter Seehandel mit Gewürzen zwischen Europa und Asien.",m:"1498: Vasco da Gama erreicht Indien."},
 // Neuzeit bis heute
 {t:"g_neuzeit",l:1,s:"Neil Armstrong",q:"Wer betrat als erster Mensch den Mond?",a:["Neil Armstrong","Juri Gagarin","Buzz Lightyear","Albert Einstein"],e:"Neil Armstrong stieg 1969 als Erster aus der Mondfähre. Juri Gagarin war 1961 der erste Mensch im Weltall. Buzz Lightyear ist eine Filmfigur.",m:"Erster auf dem Mond: Neil Armstrong."},
 {t:"g_neuzeit",l:1,s:"Eisenbahn",q:"Welches Verkehrsmittel veränderte im 19. Jahrhundert das Reisen und fährt auf Schienen?",a:["Die Eisenbahn","Das Flugzeug","Das Velo","Das Segelschiff"],e:"Mit der Eisenbahn konnte man plötzlich viel schneller und weiter reisen. Güter liessen sich günstig transportieren. In der Schweiz entstand ab 1847 ein dichtes Bahnnetz.",m:"19. Jahrhundert: Siegeszug der Eisenbahn."},
 {t:"g_neuzeit",l:2,s:"Alexander Graham Bell",q:"Wer erhielt 1876 ein Patent für das Telefon?",a:["Alexander Graham Bell","Thomas Edison","Nikola Tesla","Steve Jobs"],e:"Alexander Graham Bell liess das Telefon 1876 patentieren. Auch andere Erfinder arbeiteten daran. Heute trägt fast jede Person ein Telefon in der Hosentasche.",m:"Telefon-Patent 1876: Bell."},
 {t:"g_neuzeit",l:2,s:"Napoleon Bonaparte",q:"Welcher französische Herrscher krönte sich 1804 selbst zum Kaiser?",a:["Napoleon Bonaparte","Ludwig XIV.","Karl der Grosse","Charles de Gaulle"],e:"Napoleon war ein erfolgreicher General der Revolution und wurde 1804 Kaiser. Er eroberte grosse Teile Europas, auch die Schweiz stand unter seinem Einfluss. 1815 wurde er endgültig besiegt.",m:"Napoleon: Kaiser ab 1804."},
 {t:"g_neuzeit",l:3,s:"Holocaust",q:"Was bezeichnet man als Holocaust?",a:["Den Völkermord an rund sechs Millionen europäischen Jüdinnen und Juden durch das nationalsozialistische Deutschland","Einen Vulkanausbruch","Eine Revolution in Frankreich","Einen Friedensvertrag"],e:"Im Zweiten Weltkrieg verfolgten und ermordeten die Nationalsozialisten systematisch Jüdinnen und Juden sowie weitere Gruppen, etwa Sinti und Roma. Die Erinnerung daran soll helfen, dass so etwas nie wieder geschieht.",m:"Holocaust: Völkermord – nie vergessen."},
 {t:"g_neuzeit",l:3,s:"Vertrag von Maastricht",q:"Mit welchem Vertrag entstand 1993 die Europäische Union?",a:["Mit dem Vertrag von Maastricht","Mit dem Wiener Kongress","Mit der Magna Carta","Mit dem Bundesbrief"],e:"Der Vertrag von Maastricht wurde 1992 unterzeichnet und trat 1993 in Kraft. Er schuf die Europäische Union. Die Schweiz ist nicht Mitglied, arbeitet aber über bilaterale Verträge eng mit der EU zusammen.",m:"EU seit 1993 (Maastricht)."},
 {t:"g_neuzeit",l:3,s:"Mahatma Gandhi",q:"Wofür ist Mahatma Gandhi bekannt?",a:["Für seinen gewaltfreien Kampf für die Unabhängigkeit Indiens","Für die Erfindung des Telefons","Als erster Mensch auf dem Mond","Als Kaiser von Frankreich"],e:"Gandhi setzte auf friedlichen Widerstand, etwa Boykotte und Protestmärsche. 1947 wurde Indien von Grossbritannien unabhängig. Sein Vorbild beeinflusste auch Martin Luther King.",m:"Gandhi: gewaltfrei zur Unabhängigkeit."},
 {t:"g_neuzeit",l:3,s:"Übereinkommen von Paris",q:"Welches Ziel hat das Klimaabkommen von Paris aus dem Jahr 2015?",a:["Die Erderwärmung auf deutlich unter 2 Grad zu begrenzen","Alle Autos sofort zu verbieten","Die Sonne abzukühlen","Mehr Kohle zu verbrennen"],e:"Fast alle Staaten der Welt, auch die Schweiz, haben sich verpflichtet, ihre Treibhausgase zu senken. Die Erwärmung soll deutlich unter 2 Grad bleiben, möglichst bei 1,5 Grad.",m:"Paris 2015: unter 2 Grad bleiben."}
];

 {t:"physik",l:1,s:"Magnet",q:"Was zieht ein Magnet an?",a:["Eine Büroklammer aus Eisen","Ein Stück Holz","Ein Blatt Papier","Einen Plastiklöffel"],e:"Magnete ziehen vor allem Eisen und Stahl an, zum Beispiel Büroklammern oder Nägel. Holz, Papier und Kunststoff reagieren nicht auf Magnete.",m:"Magnete ziehen Eisen an.",},
 {t:"physik",l:2,s:"Reibung",q:"Wie heisst die Kraft, die ein rollendes Velo langsam abbremst, wenn man nicht mehr tritt?",a:["Die Reibung","Die Magnetkraft","Der Auftrieb","Die Fliehkraft"],e:"Zwischen Reifen und Strasse und in der Luft entsteht Reibung. Sie wirkt gegen die Bewegung und bremst. Ohne Reibung könnte man aber auch nicht bremsen oder gehen.",m:"Reibung bremst Bewegung."}

const FRAGEN6 = [
 // ===== Weltpolitik =====
 {t:"pol_welt",l:1,s:"Vereinte Nationen",q:"Welche Organisation hat das Ziel, den Frieden auf der ganzen Welt zu sichern?",a:["Die UNO (Vereinte Nationen)","Die FIFA","Die Post","Der Zirkus Knie"],e:"In der UNO arbeiten fast alle Länder der Welt zusammen. Sie wollen Kriege verhindern, Menschenrechte schützen und Menschen in Not helfen.",m:"UNO = Länder arbeiten für Frieden zusammen."},
 {t:"pol_welt",l:1,s:"Internationales Genf",q:"In welcher Schweizer Stadt haben besonders viele internationale Organisationen ihren Sitz?",a:["Genf","Chur","Luzern","Schaffhausen"],e:"In Genf arbeiten die UNO, das Rote Kreuz, die Weltgesundheitsorganisation und viele weitere Organisationen. Darum wird dort oft über Frieden verhandelt.",m:"Genf = Stadt der internationalen Organisationen."},
 {t:"pol_welt",l:2,s:"Vereinte Nationen",q:"Wie viele Staaten sind ungefähr Mitglied der UNO?",a:["193","50","12","500"],e:"Fast alle Staaten der Welt sind Mitglied der Vereinten Nationen – es sind 193. Die Schweiz ist seit 2002 dabei.",m:"UNO: 193 Mitgliedstaaten."},
 {t:"pol_welt",l:2,s:"Hauptquartier der Vereinten Nationen",q:"In welcher Stadt steht das Hauptquartier der UNO?",a:["New York","Genf","Paris","Brüssel"],e:"Das Hauptquartier der UNO steht in New York. In Genf befindet sich der wichtigste Sitz in Europa.",m:"UNO-Hauptquartier: New York."},
 {t:"pol_welt",l:2,s:"Europäische Union",q:"Was stimmt über die Europäische Union (EU)?",a:["Viele europäische Staaten arbeiten eng zusammen – die Schweiz ist nicht Mitglied","Alle Länder der Welt sind Mitglied","Die Schweiz ist Gründungsmitglied","Sie ist ein Fussballverband"],e:"In der EU arbeiten 27 europäische Staaten politisch und wirtschaftlich eng zusammen. Die Schweiz ist nicht Mitglied, hat aber viele Verträge mit der EU.",m:"Schweiz: nicht in der EU, aber mit Verträgen verbunden."},
 {t:"pol_welt",l:2,s:"NATO",q:"Was ist die NATO?",a:["Ein Verteidigungsbündnis von Staaten aus Nordamerika und Europa","Eine Organisation für Sport","Die Nationalbank der Schweiz","Eine Hilfsorganisation für Tiere"],e:"In der NATO versprechen sich die Mitglieder, einander bei einem Angriff beizustehen. Die neutrale Schweiz ist nicht Mitglied.",m:"NATO = Verteidigungsbündnis."},
 {t:"pol_welt",l:3,s:"UN-Sicherheitsrat",q:"Welche fünf Staaten sind ständige Mitglieder im UNO-Sicherheitsrat?",a:["USA, Russland, China, Frankreich und Grossbritannien","Schweiz, Deutschland, Italien, Österreich und Frankreich","Japan, Indien, Brasilien, Kanada und Australien","USA, Kanada, Mexiko, Brasilien und Argentinien"],e:"Der Sicherheitsrat ist für Frieden und Sicherheit zuständig. Die fünf ständigen Mitglieder haben ein Vetorecht – jedes kann einen Beschluss allein verhindern.",m:"Sicherheitsrat: 5 ständige Mitglieder mit Veto."},
 {t:"pol_welt",l:3,s:"Genfer Konventionen",q:"Was regeln die Genfer Konventionen?",a:["Den Schutz von Verwundeten, Gefangenen und Zivilpersonen in Kriegen","Die Regeln im Fussball","Die Steuern in Genf","Den Handel mit Uhren"],e:"Die Genfer Konventionen legen fest, dass auch im Krieg bestimmte Regeln gelten. Sie gehen auf eine Idee von Henry Dunant zurück.",m:"Genfer Konventionen = Regeln zum Schutz im Krieg."},
 {t:"pol_welt",l:3,s:"Gute Dienste",q:"Was sind die «Guten Dienste» der Schweiz?",a:["Die Schweiz vermittelt zwischen Staaten oder vertritt Staaten, die keine direkten Beziehungen haben","Ein Lieferdienst für Käse","Freiwillige Hilfe in Schulen","Eine Versicherung"],e:"Als neutrales Land stellt die Schweiz Orte für Verhandlungen zur Verfügung und übernimmt Schutzmachtmandate. So hilft sie, Konflikte friedlich zu lösen.",m:"Gute Dienste = Vermitteln für den Frieden."},
 {t:"pol_welt",l:3,s:"Botschafter",q:"Was macht eine Botschafterin oder ein Botschafter?",a:["Vertritt das eigene Land in einem anderen Staat","Verteilt Briefe","Leitet eine Bank","Schreibt Zeitungsartikel"],e:"Botschafterinnen und Botschafter pflegen die Beziehungen zwischen zwei Ländern. Sie arbeiten in einer Botschaft, meist in der Hauptstadt des Gastlandes.",m:"Botschaft = Vertretung im Ausland."},
 // ===== Demokratie (Ergänzung) =====
 {t:"pol_demokratie",l:1,s:"Demokratie",q:"Was bedeutet das Wort «Demokratie»?",a:["Herrschaft des Volkes","Herrschaft eines Königs","Herrschaft der Reichen","Herrschaft der Armee"],e:"Das Wort kommt aus dem Griechischen: «demos» heisst Volk, «kratos» heisst Macht. In einer Demokratie bestimmen die Menschen mit, wer regiert und was gilt.",m:"Demokratie = das Volk bestimmt."},
 {t:"pol_demokratie",l:2,s:"Pressefreiheit",q:"Was ist in einer Demokratie besonders wichtig?",a:["Meinungs- und Pressefreiheit","Dass nur eine Partei erlaubt ist","Dass Zeitungen verboten sind","Dass niemand wählen darf"],e:"In einer Demokratie darf man seine Meinung frei sagen, und Medien dürfen kritisch berichten. Nur so können sich alle eine eigene Meinung bilden.",m:"Demokratie braucht freie Meinung und freie Medien."},
 // ===== Kommunismus =====
 {t:"pol_kommunismus",l:2,s:"Kommunismus",q:"Was ist die Grundidee des Kommunismus?",a:["Fabriken und Boden sollen allen gemeinsam gehören, es soll keine reichen und armen Klassen geben","Jeder soll so viel besitzen, wie er will","Ein König soll über alles bestimmen","Die Kirche soll regieren"],e:"Der Kommunismus ist eine politische Idee, nach der das Eigentum an Fabriken, Land und Maschinen der Gemeinschaft gehört. In der Praxis regierten in kommunistischen Staaten meist eine einzige Partei und ihre Führung.",m:"Kommunismus: gemeinsames Eigentum als Ziel."},
 {t:"pol_kommunismus",l:2,s:"Manifest der Kommunistischen Partei",q:"Wer schrieb 1848 das «Kommunistische Manifest»?",a:["Karl Marx und Friedrich Engels","Napoleon und Cäsar","Martin Luther und Zwingli","Einstein und Newton"],e:"Marx und Engels beschrieben darin die Ungleichheit zwischen Arbeitern und Fabrikbesitzern und forderten eine neue Gesellschaft. Das Buch hatte grossen Einfluss auf das 20. Jahrhundert.",m:"Kommunistisches Manifest: Marx und Engels, 1848."},
 {t:"pol_kommunismus",l:2,s:"Sowjetunion",q:"Welcher grosse Staat wurde von 1922 bis 1991 kommunistisch regiert?",a:["Die Sowjetunion","Die Schweiz","Frankreich","Kanada"],e:"Die Sowjetunion war ein riesiger Staat mit Russland als grösstem Teil. Sie zerfiel 1991 in viele unabhängige Länder.",m:"Sowjetunion: 1922–1991."},
 {t:"pol_kommunismus",l:2,s:"Deutsche Demokratische Republik",q:"Was war die DDR?",a:["Ein kommunistisch regierter Staat im Osten Deutschlands von 1949 bis 1990","Ein Fussballclub","Ein Teil der Schweiz","Eine Automarke"],e:"Nach dem Zweiten Weltkrieg war Deutschland geteilt. Die DDR im Osten wurde von der SED regiert, die Menschen durften nicht frei in den Westen reisen. 1990 wurde Deutschland wiedervereinigt.",m:"DDR: Ostdeutschland 1949–1990."},
 {t:"pol_kommunismus",l:3,s:"Oktoberrevolution",q:"Wer führte 1917 die Oktoberrevolution in Russland an?",a:["Lenin mit den Bolschewiki","Napoleon","Zar Nikolaus II.","Karl Marx"],e:"Lenin und die Bolschewiki übernahmen 1917 die Macht in Russland. Kurz davor lebte Lenin einige Zeit im Exil in der Schweiz, unter anderem in Zürich.",m:"1917: Lenin und die Oktoberrevolution."},
 {t:"pol_kommunismus",l:3,s:"Planwirtschaft",q:"Was ist Planwirtschaft?",a:["Der Staat plant, was produziert wird und was es kostet","Firmen und Kundschaft bestimmen die Preise frei","Jede Familie druckt ihr eigenes Geld","Es gibt keine Waren mehr"],e:"In kommunistischen Staaten legte der Staat in Plänen fest, was hergestellt wurde. Oft gab es dadurch zu wenig von manchen Waren. In der Marktwirtschaft entscheiden dagegen Angebot und Nachfrage.",m:"Planwirtschaft: Der Staat plant die Wirtschaft."},
 {t:"pol_kommunismus",l:3,s:"Ostblock",q:"Was kritisierten viele Menschen in den kommunistischen Staaten Osteuropas?",a:["Fehlende Meinungs- und Reisefreiheit","Zu viele Wahlen mit vielen Parteien","Zu viele Feiertage","Zu viele Schulen"],e:"Kritik an der Regierung war gefährlich, und Reisen in den Westen war meist verboten. 1989 protestierten viele Menschen friedlich – danach fielen die kommunistischen Regierungen in Osteuropa.",m:"1989: friedliche Proteste in Osteuropa."},
 {t:"pol_kommunismus",l:3,s:"Kommunistische Partei Chinas",q:"In welchem grossen Land regiert bis heute eine kommunistische Partei als einzige Partei?",a:["China","Deutschland","Brasilien","Australien"],e:"In China regiert seit 1949 die Kommunistische Partei. Die Wirtschaft ist heute teilweise marktwirtschaftlich, politisch bestimmt aber die Partei.",m:"China: Einparteienstaat der Kommunistischen Partei."},
 // ===== Diktatur =====
 {t:"pol_diktatur",l:1,s:"Diktatur",q:"Was ist eine Diktatur?",a:["Eine einzelne Person oder kleine Gruppe hat die ganze Macht, das Volk darf nicht frei wählen","Alle entscheiden gemeinsam","Das Volk stimmt über alles ab","Es gibt keine Regierung"],e:"In einer Diktatur bestimmt eine Person oder eine kleine Gruppe allein. Wer anderer Meinung ist, kann bestraft werden. Das Gegenteil ist die Demokratie.",m:"Diktatur = Macht bei wenigen, keine freien Wahlen."},
 {t:"pol_diktatur",l:2,s:"Diktator (Rom)",q:"Woher stammt das Wort «Diktator»?",a:["Aus dem alten Rom: ein Amt mit grosser Macht in Notzeiten","Aus dem Englischen für «Lehrer»","Von einem Schweizer Berg","Aus dem Mittelalter für «Ritter»"],e:"Im alten Rom konnte in Notzeiten ein Diktator ernannt werden, der für kurze Zeit fast unbeschränkte Macht hatte. Heute bezeichnet man damit Herrscher, die ohne Kontrolle regieren.",m:"Diktator: ursprünglich ein römisches Notamt."},
 {t:"pol_diktatur",l:2,s:"Zensur",q:"Was ist Zensur?",a:["Der Staat kontrolliert oder verbietet, was in Medien, Büchern oder im Internet erscheinen darf","Eine Schulnote","Eine Steuer","Ein Wahlverfahren"],e:"In Diktaturen werden kritische Zeitungen, Bücher oder Webseiten oft verboten. In der Schweiz schützt die Verfassung die Meinungs- und Medienfreiheit.",m:"Zensur = Kontrolle der Meinung."},
 {t:"pol_diktatur",l:2,s:"Putsch",q:"Was ist ein Putsch?",a:["Eine gewaltsame Machtübernahme, oft durch das Militär","Eine Wahl","Ein Feiertag","Ein Sportanlass"],e:"Bei einem Putsch reisst eine Gruppe die Macht an sich, ohne Wahl. Daraus entsteht häufig eine Diktatur.",m:"Putsch = Macht mit Gewalt ergreifen."},
 {t:"pol_diktatur",l:3,s:"Zeit des Nationalsozialismus",q:"Wer regierte Deutschland von 1933 bis 1945 als Diktator?",a:["Adolf Hitler","Otto von Bismarck","Konrad Adenauer","Kaiser Wilhelm I."],e:"Die Nationalsozialisten unter Hitler errichteten eine Diktatur, verfolgten Andersdenkende und begingen den Holocaust. Der Zweite Weltkrieg, den Deutschland begann, kostete Millionen Menschen das Leben.",m:"1933–1945: NS-Diktatur in Deutschland."},
 {t:"pol_diktatur",l:3,s:"Benito Mussolini",q:"Wer regierte ab 1922 Italien als faschistischer Diktator?",a:["Benito Mussolini","Giuseppe Garibaldi","Julius Cäsar","Napoleon"],e:"Mussolini kam 1922 an die Macht und schaffte die Demokratie in Italien schrittweise ab. Später verbündete er sich mit Hitler.",m:"Italien: Mussolini ab 1922."},
 {t:"pol_diktatur",l:3,s:"Absolutismus",q:"Was bedeutet absolute Monarchie?",a:["Ein König oder eine Königin herrscht mit uneingeschränkter Macht","Das Volk wählt den König jedes Jahr","Der König hat keine Macht","Mehrere Könige teilen sich ein Land"],e:"Ein bekanntes Beispiel ist Ludwig XIV. von Frankreich. Ihm wird der Satz «Der Staat bin ich» zugeschrieben. Die Französische Revolution richtete sich gegen diese Herrschaftsform.",m:"Absolutismus: alle Macht beim König."},
 {t:"pol_diktatur",l:3,s:"Propaganda",q:"Was ist Propaganda?",a:["Gezielte Beeinflussung der Menschen, oft mit einseitigen oder falschen Informationen","Neutrale Berichterstattung","Eine Art Sport","Ein Musikstil"],e:"Diktaturen nutzen Propaganda, um ihre Macht zu sichern: Sie zeigen nur, was ihnen nützt, und stellen Gegner schlecht dar. Mehrere Quellen zu vergleichen hilft, Propaganda zu erkennen.",m:"Propaganda erkennen: Quellen vergleichen."},
 // ===== Christentum =====
 {t:"rel_christentum",l:1,s:"Kirchengebäude",q:"Wie heisst das Gotteshaus der Christinnen und Christen?",a:["Kirche","Moschee","Synagoge","Tempel"],e:"In der Kirche feiern Christinnen und Christen Gottesdienste, zum Beispiel an Sonntagen, Weihnachten und Ostern.",m:"Christen gehen in die Kirche."},
 {t:"rel_christentum",l:1,s:"Bibel",q:"Wie heisst die heilige Schrift der Christinnen und Christen?",a:["Die Bibel","Der Koran","Die Tora allein","Die Veden"],e:"Die Bibel besteht aus dem Alten und dem Neuen Testament. Im Neuen Testament wird vom Leben von Jesus erzählt.",m:"Christentum = Bibel."},
 {t:"rel_christentum",l:2,s:"Pfingsten",q:"Woran erinnern Christinnen und Christen an Pfingsten?",a:["An die Sendung des Heiligen Geistes","An die Geburt von Jesus","An die Auferstehung von Jesus","An die Erschaffung der Welt"],e:"Pfingsten wird 50 Tage nach Ostern gefeiert. Laut Bibel empfingen die Jünger den Heiligen Geist und begannen, die Botschaft von Jesus zu verbreiten.",m:"Pfingsten: 50 Tage nach Ostern."},
 {t:"rel_christentum",l:2,s:"Papst",q:"Wie heisst das Oberhaupt der römisch-katholischen Kirche?",a:["Der Papst","Der Bischof von Basel","Der Dalai Lama","Der Rabbiner"],e:"Der Papst leitet die katholische Kirche weltweit und lebt im Vatikan in Rom. Er wird von den Kardinälen gewählt.",m:"Katholische Kirche: Papst in Rom."},
 {t:"rel_christentum",l:2,s:"Päpstliche Schweizergarde",q:"Wer beschützt den Papst im Vatikan seit über 500 Jahren?",a:["Die Schweizergarde","Die französische Armee","Die UNO","Die italienische Polizei allein"],e:"Die Päpstliche Schweizergarde wurde 1506 gegründet. Ihre Mitglieder sind junge katholische Schweizer und tragen bunte Uniformen.",m:"Schweizergarde schützt den Papst seit 1506."},
 {t:"rel_christentum",l:3,s:"Evangelium",q:"Was bedeutet das Wort «Evangelium»?",a:["Frohe oder gute Botschaft","Heiliger Ort","Letzter Tag","Grosses Buch"],e:"Das Wort kommt aus dem Griechischen. Die vier Evangelien im Neuen Testament erzählen vom Leben und der Lehre von Jesus.",m:"Evangelium = gute Botschaft."},
 // ===== Islam =====
 {t:"rel_islam",l:1,s:"Ramadan",q:"Wie heisst der Fastenmonat im Islam?",a:["Ramadan","Advent","Chanukka","Diwali"],e:"Im Ramadan essen und trinken viele gläubige Musliminnen und Muslime von der Morgendämmerung bis zum Sonnenuntergang nichts. Am Abend wird oft gemeinsam gegessen.",m:"Fastenmonat = Ramadan."},
 {t:"rel_islam",l:2,s:"Mohammed",q:"Wer ist für Musliminnen und Muslime der wichtigste Prophet?",a:["Mohammed","Mose","Buddha","Paulus"],e:"Nach islamischem Glauben empfing Mohammed im 7. Jahrhundert die Offenbarungen, die im Koran stehen.",m:"Islam: Prophet Mohammed."},
 {t:"rel_islam",l:2,s:"Salat (Gebet)",q:"Wie oft am Tag beten gläubige Musliminnen und Muslime nach der Tradition?",a:["Fünfmal","Einmal","Zwölfmal","Nur am Freitag"],e:"Das Gebet zu festen Zeiten gehört zu den fünf Säulen des Islams. Am Freitag gibt es ein besonderes gemeinsames Gebet in der Moschee.",m:"Gebet: fünfmal am Tag."},
 {t:"rel_islam",l:2,s:"Koran",q:"In welcher Sprache wurde der Koran ursprünglich verfasst?",a:["Arabisch","Latein","Hebräisch","Türkisch"],e:"Der Koran wurde auf Arabisch überliefert. Er ist in viele Sprachen übersetzt, doch beim Gebet wird er meist auf Arabisch rezitiert.",m:"Koran: auf Arabisch."},
 {t:"rel_islam",l:3,s:"Haddsch",q:"Wie heisst die grosse Pilgerfahrt nach Mekka?",a:["Hadsch","Ramadan","Sabbat","Pessach"],e:"Wer gesund ist und es sich leisten kann, soll einmal im Leben die Pilgerfahrt nach Mekka unternehmen. Jedes Jahr kommen dafür Millionen Menschen zusammen.",m:"Pilgerfahrt nach Mekka = Hadsch."},
 {t:"rel_islam",l:3,s:"Minarett",q:"Was ist ein Minarett?",a:["Ein Turm bei einer Moschee, von dem traditionell zum Gebet gerufen wird","Ein Gebetsteppich","Ein islamischer Feiertag","Eine heilige Schrift"],e:"Vom Minarett aus ruft der Muezzin traditionell zum Gebet. In der Schweiz wurde 2009 in einer Volksabstimmung beschlossen, dass keine neuen Minarette gebaut werden dürfen.",m:"Minarett = Turm der Moschee."},
 {t:"rel_islam",l:3,s:"Sunniten",q:"Welches sind die beiden grössten Glaubensrichtungen im Islam?",a:["Sunniten und Schiiten","Katholiken und Reformierte","Orthodoxe und Anglikaner","Hindus und Sikhs"],e:"Die Trennung entstand nach dem Tod Mohammeds in der Frage, wer die Gemeinschaft führen soll. Die grosse Mehrheit der Musliminnen und Muslime sind Sunniten.",m:"Islam: Sunniten und Schiiten."},
 // ===== Andere Religionen =====
 {t:"rel_andere",l:2,s:"Hinduismus",q:"In welcher Religion werden unter anderem die Götter Brahma, Vishnu und Shiva verehrt?",a:["Im Hinduismus","Im Buddhismus","Im Judentum","Im Christentum"],e:"Der Hinduismus ist vor allem in Indien verbreitet und kennt viele Götter und Göttinnen. Zu den wichtigsten gehören Brahma, Vishnu und Shiva.",m:"Brahma, Vishnu, Shiva = Hinduismus."},
 {t:"rel_andere",l:2,s:"Sabbat",q:"Wie heisst der wöchentliche Ruhetag im Judentum?",a:["Sabbat","Sonntag","Freitag","Diwali"],e:"Der Sabbat dauert von Freitagabend bis Samstagabend. Viele Jüdinnen und Juden ruhen dann, beten und essen gemeinsam mit der Familie.",m:"Judentum: Sabbat, Freitag- bis Samstagabend."},
 {t:"rel_andere",l:2,s:"Hindu-Tempel",q:"Wie heisst das Gotteshaus im Hinduismus?",a:["Tempel (Mandir)","Kirche","Moschee","Synagoge"],e:"Im Hindu-Tempel stehen Figuren von Gottheiten. Gläubige bringen Blumen, Früchte oder Licht als Gabe.",m:"Hinduismus: Tempel."},
 {t:"rel_andere",l:3,s:"Sikhismus",q:"Wer gilt als Begründer des Sikhismus?",a:["Guru Nanak","Buddha","Mose","Konfuzius"],e:"Der Sikhismus entstand im 15. Jahrhundert im Punjab in Indien. Viele Sikh-Männer tragen einen Turban.",m:"Sikhismus: Guru Nanak."},
 // ===== Wissenschaft =====
 {t:"wissenschaft",l:1,s:"Mikroskop",q:"Womit kann man sehr kleine Dinge stark vergrössert sehen?",a:["Mit einem Mikroskop","Mit einem Fernrohr","Mit einem Thermometer","Mit einem Kompass"],e:"Ein Mikroskop vergrössert winzige Dinge, zum Beispiel Zellen oder Bakterien. Mit einem Fernrohr schaut man dagegen in die Ferne.",m:"Klein anschauen = Mikroskop."},
 {t:"wissenschaft",l:1,s:"Sauerstoff",q:"Welches Gas brauchen Menschen und Tiere zum Atmen?",a:["Sauerstoff","Helium","Kohlendioxid","Stickstoff allein"],e:"Wir atmen Luft ein, und unser Körper braucht daraus den Sauerstoff. Pflanzen stellen Sauerstoff bei der Photosynthese her.",m:"Atmen = Sauerstoff."},
 {t:"wissenschaft",l:2,s:"Marie Curie",q:"Welche Forscherin erhielt als erste Frau einen Nobelpreis?",a:["Marie Curie","Ada Lovelace","Rosalind Franklin","Jane Goodall"],e:"Marie Curie erforschte die Radioaktivität. Sie erhielt 1903 den Nobelpreis für Physik und 1911 den für Chemie.",m:"Marie Curie: erste Nobelpreisträgerin."},
 {t:"wissenschaft",l:2,s:"Galileo Galilei",q:"Womit entdeckte Galileo Galilei die Monde des Jupiter?",a:["Mit einem Fernrohr","Mit einem Mikroskop","Mit einer Rakete","Mit blossem Auge"],e:"Galilei richtete um 1610 als einer der Ersten ein Fernrohr auf den Himmel. Er entdeckte vier Monde des Jupiter.",m:"Galilei: Fernrohr, Jupitermonde."},
 {t:"wissenschaft",l:2,s:"Gold",q:"Welches chemische Zeichen hat Gold?",a:["Au","Go","Gd","Ag"],e:"Das Zeichen Au kommt vom lateinischen Wort «aurum». Ag steht für Silber, vom Lateinischen «argentum».",m:"Gold = Au, Silber = Ag."},
 {t:"wissenschaft",l:3,s:"Periodensystem",q:"Was wird im Periodensystem geordnet?",a:["Die chemischen Elemente","Die Planeten","Die Tierarten","Die Musiknoten"],e:"Das Periodensystem ordnet alle bekannten chemischen Elemente nach ihrem Aufbau. Elemente mit ähnlichen Eigenschaften stehen untereinander.",m:"Periodensystem = Ordnung der Elemente."},
 {t:"wissenschaft",l:3,s:"Experiment",q:"Wozu machen Forschende ein Experiment?",a:["Um eine Vermutung durch einen geplanten Versuch zu überprüfen","Um Zeit zu vertreiben","Um etwas zu zerstören","Um Geld zu drucken"],e:"Bei einem Experiment stellt man eine Vermutung auf, plant einen Versuch und beobachtet genau. Wiederholt man es mit gleichem Ergebnis, wird das Wissen verlässlicher.",m:"Experiment = Vermutung prüfen."},
 {t:"wissenschaft",l:3,s:"Kohlenstoffdioxid",q:"Welches Gas entsteht beim Verbrennen von Holz, Kohle und Benzin vor allem?",a:["Kohlendioxid (CO₂)","Sauerstoff","Helium","Wasserstoff"],e:"Beim Verbrennen verbindet sich Kohlenstoff mit Sauerstoff zu Kohlendioxid. Zu viel CO₂ in der Luft verstärkt den Treibhauseffekt.",m:"Verbrennen erzeugt CO₂."}

const FRAGEN7 = [{"t": "pol_welt", "l": 1, "s": "Friedenstaube", "q": "Welches Tier gilt weltweit als Symbol für den Frieden?", "a": ["Die Taube", "Der Adler", "Der Löwe", "Der Hai"], "e": "Die weisse Taube, oft mit einem Olivenzweig, ist ein bekanntes Friedenssymbol. Man sieht sie auf Plakaten, Fahnen und Briefmarken.", "m": "Friedenssymbol = weisse Taube."}, {"t": "pol_welt", "l": 1, "s": "Frieden", "q": "Was bedeutet Frieden zwischen Ländern?", "a": ["Es gibt keinen Krieg, Streit wird ohne Gewalt gelöst", "Alle Länder haben die gleiche Flagge", "Niemand darf reisen", "Es gibt keine Regeln"], "e": "Frieden heisst, dass Länder ihre Probleme durch Gespräche und Verträge lösen statt mit Waffen. Die UNO und die Schweiz setzen sich dafür ein.", "m": "Frieden = Streit ohne Gewalt lösen."}, {"t": "pol_welt", "l": 2, "s": "Schweiz", "q": "Wie viele Nachbarländer hat die Schweiz?", "a": ["Fünf", "Drei", "Vier", "Sieben"], "e": "Die Schweiz grenzt an Deutschland, Frankreich, Italien, Österreich und Liechtenstein.", "m": "5 Nachbarn: DE, FR, IT, AT, LI."}, {"t": "pol_welt", "l": 2, "s": "UNICEF", "q": "Wofür setzt sich UNICEF ein?", "a": ["Für die Rechte und das Wohl von Kindern weltweit", "Für Fussballturniere", "Für den Bau von Autobahnen", "Für die Rechte von Banken"], "e": "UNICEF ist das Kinderhilfswerk der Vereinten Nationen. Es hilft Kindern mit Impfungen, Schulen, sauberem Wasser und Schutz in Notlagen.", "m": "UNICEF = Kinderhilfswerk der UNO."}, {"t": "pol_welt", "l": 2, "s": "Weltgesundheitsorganisation", "q": "Welche UNO-Organisation mit Sitz in Genf kümmert sich um die Gesundheit weltweit?", "a": ["Die WHO (Weltgesundheitsorganisation)", "Die FIFA", "Die NATO", "Die SNB"], "e": "Die WHO unterstützt Länder im Kampf gegen Krankheiten, etwa bei Impfprogrammen. Ihr Hauptsitz ist in Genf.", "m": "WHO = Gesundheit, Sitz in Genf."}, {"t": "pol_welt", "l": 2, "s": "Flüchtling", "q": "Was ist ein Flüchtling?", "a": ["Ein Mensch, der wegen Krieg oder Verfolgung seine Heim n-Massaker", "q": "Was geschah 1989 auf dem Tian’anmen-Platz in Peking?", "a": ["Proteste für mehr Freiheit wurden vom Militär gewaltsam niedergeschlagen", "Die Olympischen Spiele wurden eröffnet", "Die Chinesische Mauer wurde fertiggestellt", "China wurde eine Demokratie"], "e": "Viele Studierende demonstrierten für mehr Freiheit. Im Juni 1989 liess die Regierung die Proteste mit Panzern beenden, dabei starben zahlreiche Menschen. In China wird darüber bis heute kaum offen gesprochen.", "m": "1989: Proteste in Peking gewaltsam beendet."}, {"t": "pol_diktatur", "l": 3, "s": "Rechtsstaat", "q": "Was schützt ein Land am besten davor, zur Diktatur zu werden?", "a": ["Gewaltenteilung, freie Wahlen, freie Medien und unabhängige Gerichte", "Eine möglichst grosse Armee", "Ein einziger starker Anführer", "Möglichst wenige Gesetze"], "e": "Wenn sich Parlament, Regierung, Gerichte und Medien gegenseitig kontrollieren, kann niemand allein alle Macht an sich reissen.", "m": "Kontrolle der Macht schützt die Demokratie."}, {"t": "rel_christentum", "l": 1, "s": "Nikolaus von Myra", "q": "Wer kommt in der Schweiz am 6. Dezember zu vielen Kindern?", "a": ["Der Samichlaus", "Der Osterhase", "Das Christkind im Sommer", "Der Weihnachtsmann im Juli"], "e": "Der Samichlaus geht auf den heiligen Nikolaus zurück, einen Bischof, der Kindern und Armen geholfen haben soll. Oft begleitet ihn der Schmutzli.", "m": "6. Dezember: Samichlaus."}, {"t": "rel_christentum", "l": 1, "s": "Apostel", "q": "Wie viele Jünger (Apostel) hatte Jesus laut der Bibel?", "a": ["Zwölf", "Drei", "Sieben", "Hundert"], "e": "Die zwölf Apostel begleiteten Jesus und verbreiteten nach seinem Tod seine Lehre. Bekannte Apostel sind Petrus und Johannes.", "m": "Jesus hatte 12 Apostel."}, {"t": "rel_christentum", "l": 1, "s": "Adventskranz", "q": "Wie viele Kerzen hat ein Adventskranz?", "a": ["Vier", "Zwei", "Sieben", "Zwölf"], "e": "An jedem der vier Adventssonntage vor Weihnachten wird eine Kerze mehr angezündet. So zähl 2, "s": "Opferfest", "q": "Woran erinnert das islamische Opferfest?", "a": ["An Abraham (Ibrahim), der bereit war, Gott zu gehorchen", "An die Geburt Mohammeds", "An den Bau der ersten Moschee", "An das Ende des Winters"], "e": "Das Opferfest ist das höchste Fest im Islam und findet während der Pilgerzeit statt. Familien feiern gemeinsam und teilen Essen mit Bedürftigen.", "m": "Opferfest: Erinnerung an Abraham."}, {"t": "rel_islam", "l": 2, "s": "Qibla", "q": "In welche Richtung beten Musliminnen und Muslime?", "a": ["In Richtung Mekka", "Immer nach Norden", "In Richtung Jerusalem", "In Richtung Sonnenuntergang"], "e": "Beim Gebet wenden sich Musliminnen und Muslime auf der ganzen Welt der Kaaba in Mekka zu. In der Moschee zeigt eine Nische an der Wand die Richtung.", "m": "Gebetsrichtung: Mekka."}, {"t": "rel_islam", "l": 2, "s": "Imam", "q": "Was ist ein Imam?", "a": ["Jemand, der in der Moschee das Gebet leitet", "Ein Gebetsteppich", "Ein Monat im Jahr", "Eine heilige Stadt"], "e": "Der Imam steht beim gemeinsamen Gebet vorne und betet vor. Oft hält er auch die Predigt am Freitag.", "m": "Imam = Vorbeter in der Moschee."}, {"t": "rel_islam", "l": 2, "s": "Freitagsgebet", "q": "An welchem Wochentag findet das wichtige gemeinsame Gebet in der Moschee statt?", "a": ["Am Freitag", "Am Sonntag", "Am Samstag", "Am Montag"], "e": "Das Freitagsgebet am Mittag ist für viele Musliminnen und Muslime der wichtigste Gottesdienst der Woche.", "m": "Islam: Freitagsgebet."}, {"t": "rel_islam", "l": 3, "s": "Abraham", "q": "Welche Person ist im Judentum, Christentum und Islam gleichermassen wichtig?", "a": ["Abraham", "Buddha", "Zeus", "Konfuzius"], "e": "Abraham, im Islam Ibrahim, gilt in allen drei Religionen als Stammvater des Glaubens. Deshalb nennt man sie auch «abrahamitische Religionen».", "m": "Judentum, Christentum, Islam: Abraham."}, {"t": "rel_islam", "l": 3, "s": "Hidschra", "q": "Mit welchem Ereignis beginnt die islamische Zeitrechnung?", "a": ["Mit der Auswanderung "s": "Dalai Lama", "q": "Wie heisst das geistliche Oberhaupt des tibetischen Buddhismus?", "a": ["Dalai Lama", "Papst", "Imam", "Rabbiner"], "e": "Der Dalai Lama setzt sich für Frieden und Gewaltlosigkeit ein. 1989 erhielt er den Friedensnobelpreis.", "m": "Tibetischer Buddhismus: Dalai Lama."}, {"t": "rel_andere", "l": 3, "s": "Karma", "q": "Was bedeutet «Karma» im Hinduismus und Buddhismus?", "a": ["Die Vorstellung, dass gute und schlechte Taten Folgen haben – auch für ein späteres Leben", "Ein Gericht aus Reis", "Ein Tempel in Indien", "Ein Feiertag im Winter"], "e": "Nach dieser Lehre bestimmen die eigenen Taten, wie es einem im weiteren Leben oder in einer Wiedergeburt ergeht.", "m": "Karma: Taten haben Folgen."}, {"t": "rel_andere", "l": 3, "s": "Bar Mitzwa", "q": "Was feiern jüdische Jungen mit 13 Jahren?", "a": ["Bar Mizwa – sie werden religiös mündig", "Ihre Taufe", "Die Konfirmation", "Das Zuckerfest"], "e": "Mit der Bar Mizwa (bei Mädchen Bat Mizwa, meist mit 12) übernehmen Jugendliche Verantwortung für die religiösen Gebote. Oft lesen sie dabei aus der Tora vor.", "m": "Bar/Bat Mizwa: religiös erwachsen."}, {"t": "natur", "l": 1, "s": "Sonne", "q": "Wie heisst der Stern, um den die Erde kreist?", "a": ["Die Sonne", "Der Mond", "Der Polarstern", "Der Mars"], "e": "Die Sonne ist ein riesiger Stern. Sie spendet Licht und Wärme, ohne sie gäbe es kein Leben auf der Erde.", "m": "Die Erde kreist um die Sonne."}, {"t": "natur", "l": 1, "s": "Jahreszeit", "q": "Welche Jahreszeit folgt auf den Winter?", "a": ["Der Frühling", "Der Sommer", "Der Herbst", "Nochmals Winter"], "e": "Die Reihenfolge ist Frühling, Sommer, Herbst, Winter. Im Frühling blühen die ersten Blumen, und die Tage werden länger.", "m": "Nach dem Winter kommt der Frühling."}, {"t": "natur", "l": 1, "s": "Mond", "q": "Was ist der Mond?", "a": ["Ein Himmelskörper, der um die Erde kreist", "Ein kleiner Stern, der selbst leuchtet", "Ein Planet wie die Erde mit Städten", "Eine Wolke"], "e": "Der Mond leuchtet nicht selbst, er wird von der Sonne angestrahlt. Deshalb sehen wir ihn mal als Sichel, mal als Vollmond.", "m": "Der Mond kreist um die Erde."}, {"t": "natur", "l": 1, "s": "Schnee", "q": "Woraus besteht Schnee?", "a": ["Aus winzigen Eiskristallen", "Aus Zucker", "Aus Watte", "Aus Salz"], "e": "Wenn es in den Wolken sehr kalt ist, gefriert das Wasser zu Eiskristallen. Viele davon zusammen fallen als Schneeflocken.", "m": "Schnee = Eiskristalle."}, {"t": "natur", "l": 2, "s": "Erdrotation", "q": "Warum gibt es Tag und Nacht?", "a": ["Die Erde dreht sich in etwa 24 Stunden einmal um sich selbst", "Die Sonne geht jede Nacht aus", "Der Mond verdeckt die Sonne", "Wolken verdunkeln den Himmel"], "e": "Die Seite der Erde, die zur Sonne zeigt, hat Tag. Die abgewandte Seite hat Nacht.", "m": "Erddrehung = Tag und Nacht."}, {"t": "natur", "l": 2, "s": "Erdbahn", "q": "Wie lange braucht die Erde für eine ganze Runde um die Sonne?", "a": ["Ungefähr ein Jahr", "Einen Tag", "Einen Monat", "Zehn Jahre"], "e": "Die Erde braucht etwa 365 Tage für eine Runde. Weil es genau etwa 365 und ein Viertel Tage sind, gibt es alle vier Jahre ein Schaltjahr.", "m": "Eine Runde um die Sonne = 1 Jahr."}, {"t": "natur", "l": 2, "s": "Aare", "q": "Welcher Fluss ist der längste, der vollständig in der Schweiz fliesst?", "a": ["Die Aare", "Der Rhein", "Die Rhone", "Der Inn"], "e": "Die Aare entspringt im Berner Oberland und mündet bei Koblenz AG in den Rhein. Der Rhein ist insgesamt länger, fliesst aber auch durch andere Länder.", "m": "Längster Fluss nur in der Schweiz: Aare."}, {"t": "natur", "l": 3, "s": "Permafrost", "q": "Was ist Permafrost?", "a": ["Boden, der das ganze Jahr über gefroren bleibt", "Frost, der nur eine Nacht dauert", "Eine Eissorte", "Ein Wintersport"], "e": "In den Alpen gibt es Permafrost in grosser Höhe. Wenn er wegen der Erwärmung auftaut, können Felsstürze und Murgänge häufiger werden.", "m": "Permafrost = dauerhaft gefrorener Boden."}, {"t": "natur", "l": 3, "s": "Treibhauseffekt", "q": "Warum ist der natürliche Treibhauseffekt für das Leben wichtig?", "a": ["Ohne ihn wäre es auf der Erde viel zu kalt", "Er macht den Himmel blau", "Er sorgt für Ebbe und Flut", "Er erzeugt Sauerstoff"], "e": "Gase in der Atmosphäre halten einen Teil der Wärme zurück. Ohne diesen Effekt wäre es im Durchschnitt deutlich unter null Grad. Problematisch ist, dass der Mensch den Effekt verstärkt.", "m": "Natürlicher Treibhauseffekt: gut – zu viel: Klimawandel."}, {"t": "tiere", "l": 2, "s": "Gepard", "q": "Welches ist das schnellste Landtier der Welt?", "a": ["Der Gepard", "Das Pferd", "Der Hase", "Der Strauss"], "e": "Ein Gepard kann für kurze Strecken über 90 Kilometer pro Stunde erreichen. Lange durchhalten kann er dieses Tempo aber nicht.", "m": "Schnellstes Landtier: Gepard."}, {"t": "tiere", "l": 2, "s": "Kieme", "q": "Womit atmen Fische?", "a": ["Mit Kiemen", "Mit einer Lunge wie wir", "Mit der Haut allein", "Mit den Flossen"], "e": "Fische nehmen Wasser durch das Maul auf. In den Kiemen gelangt der im Wasser gelöste Sauerstoff ins Blut.", "m": "Fische atmen mit Kiemen."}, {"t": "tiere", "l": 2, "s": "Kolibris", "q": "Welcher Vogel kann sogar rückwärts fliegen?", "a": ["Der Kolibri", "Der Spatz", "Die Taube", "Das Huhn"], "e": "Kolibris schlagen extrem schnell mit den Flügeln. So können sie in der Luft stehen bleiben und sogar rückwärts fliegen, während sie Nektar trinken.", "m": "Kolibri: fliegt auch rückwärts."}, {"t": "tiere", "l": 2, "s": "Alpensteinbock", "q": "Welches Tier der Alpen hat als Männchen grosse, gebogene Hörner und klettert sehr geschickt?", "a": ["Der Steinbock", "Das Reh", "Der Fuchs", "Das Murmeltier"], "e": "Der Steinbock war in der Schweiz fast ausgerottet und wurde wieder angesiedelt. Heute leben wieder viele Tausend in den Alpen. Er ist auch im Wappen von Graubünden.", "m": "Steinbock: Kletterkünstler der Alpen."}, {"t": "tiere", "l": 2, "s": "Webspinnen", "q": "Wie viele Beine hat eine Spinne?", "a": ["Acht", "Sechs", "Vier", "Zehn"], "e": "Spinnen haben acht Beine und gehören nicht zu den Insekten. Insekten wie Käfer oder Bienen haben sechs Beine.", "m": "Spinne 8 Beine, Insekt 6 Beine."}, {"t": "tiere", "l": 3, "s": "Rote Liste gefährdeter Arten", "q": "Was bedeutet es, wenn eine Tierart «vom Aussterben bedroht» ist?", "a": ["Es gibt nur noch wenige Tiere, und die Art könnte ganz verschwinden", "Die Tiere sind gefährlich für Menschen", "Die Art ist neu entdeckt worden", "Die Tiere leben nur im Zoo"], "e": "Auf der Roten Liste steht, welche Arten gefährdet sind. Gründe sind oft der Verlust von Lebensräumen, Wilderei oder der Klimawandel.", "m": "Bedroht = die Art könnte verschwinden."}, {"t": "tiere", "l": 3, "s": "Vogelzug", "q": "Warum fliegen viele Vögel im Herbst in den Süden?", "a": ["Weil sie im Winter bei uns zu wenig Nahrung finden", "Weil sie Ferien machen", "Weil sie das Meer sehen wollen", "Weil ihre Federn im Winter ausfallen"], "e": "Schwalben und Störche fressen zum Beispiel Insekten, die es im Winter kaum gibt. Darum fliegen sie Tausende Kilometer bis nach Afrika und kehren im Frühling zurück.", "m": "Zugvögel folgen der Nahrung."}, {"t": "tiere", "l": 3, "s": "Wirbeltiere", "q": "Was haben alle Wirbeltiere gemeinsam?", "a": ["Eine Wirbelsäule", "Federn", "Sechs Beine", "Kiemen"], "e": "Zu den Wirbeltieren gehören Fische, Amphibien, Reptilien, Vögel und Säugetiere. Insekten, Schnecken und Würmer haben keine Wirbelsäule.", "m": "Wirbeltiere = Tiere mit Wirbelsäule."}, {"t": "tiere", "l": 3, "s": "Fledertiere", "q": "Welches Säugetier kann aktiv fliegen?", "a": ["Die Fledermaus", "Das Eichhörnchen", "Der Pinguin", "Der Hamster"], "e": "Fledermäuse fliegen mit Flughäuten zwischen ihren Fingern. Nachts orientieren sie sich mit Ultraschall, also mit Echos.", "m": "Fliegendes Säugetier: Fledermaus."}, {"t": "wissenschaft", "l": 1, "s": "Astronomie", "q": "Wie nennt man Forschende, die Sterne und Planeten untersuchen?", "a": ["Astronominnen und Astronomen", "Archäologinnen und Archäologen", "Geologinnen und Geologen", "Zoologinnen und Zoologen"], "e": "Astronomen beobachten den Himmel mit Teleskopen. Archäologen erforschen alte Funde, Geologen Gesteine und Zoologen Tiere.", "m": "Sterne erforschen = Astronomie."}, {"t": "wissenschaft", "l": 1, "s": "Kompass", "q": "Welches Gerät zeigt mit seiner Nadel nach Norden?", "a": ["Der Kompass", "Das Thermometer", "Die Waage", "Die Uhr"], "e": "Die Kompassnadel ist magnetisch und richtet sich nach dem Magnetfeld der Erde aus. So findet man auch ohne Handy die Richtung.", "m": "Kompass zeigt nach Norden."}, {"t": "wissenschaft", "l": 2, "s": "Glühlampe", "q": "Wer machte die Glühbirne ab 1879 alltagstauglich?", "a": ["Thomas Edison", "Albert Einstein", "Isaac Newton", "Charles Darwin"], "e": "Mehrere Erfinder arbeiteten an der Glühbirne. Edison entwickelte eine Version, die lange leuchtete und sich gut herstellen liess.", "m": "Glühbirne im Alltag: Edison."}, {"t": "wissenschaft", "l": 2, "s": "Biologie", "q": "Was untersucht die Biologie?", "a": ["Lebewesen – Pflanzen, Tiere, Menschen und Mikroorganismen", "Die Sterne", "Die Sprache", "Die Zahlen"], "e": "Das Wort kommt aus dem Griechischen: «bios» heisst Leben. Die Biologie erforscht, wie Lebewesen aufgebaut sind und zusammenleben.", "m": "Biologie = Lehre vom Leben."}, {"t": "wissenschaft", "l": 2, "s": "Virus", "q": "Was unterscheidet ein Virus von einem Bakterium?", "a": ["Ein Virus ist viel kleiner und kann sich nur in fremden Zellen vermehren", "Ein Virus ist grösser als eine Maus", "Viren sind immer harmlos", "Es gibt keinen Unterschied"], "e": "Bakterien sind eigenständige Lebewesen. Viren brauchen die Zellen eines Wirts, um sich zu vermehren. Deshalb wirken Antibiotika gegen Viren nicht.", "m": "Virus braucht fremde Zellen."}, {"t": "wissenschaft", "l": 3, "s": "Auguste Piccard", "q": "Welcher Schweizer Forscher stieg 1931 mit einem Ballon als erster Mensch in die Stratosphäre auf?", "a": ["Auguste Piccard", "Albert Einstein", "Henri Dunant", "Jean Piaget"], "e": "Piccard erreichte mit einem Ballon mit Druckkabine eine Höhe von rund 15 Kilometern. Später baute er auch Tauchboote für die Tiefsee.", "m": "Piccard: Ballon in die Stratosphäre, 1931."}, {"t": "koerper", "l": 3, "s": "Niere", "q": "Welches Organ reinigt das Blut und bildet den Urin?", "a": ["Die Nieren", "Die Lunge", "Das Herz", "Der Magen"], "e": "Die beiden Nieren filtern jeden Tag grosse Mengen Blut. Abfallstoffe und überschüssiges Wasser werden als Urin ausgeschieden.", "m": "Nieren = Blutfilter."}, {"t": "koerper", "l": 3, "s": "Leber", "q": "Welches ist das grösste innere Organ des Menschen?", "a": ["Die Leber", "Das Herz", "Die Niere", "Die Milz"], "e": "Die Leber liegt rechts im Oberbauch. Sie baut Giftstoffe ab, speichert Energie und bildet Galle für die Verdauung.", "m": "Grösstes inneres Organ: Leber."}, {"t": "koerper", "l": 3, "s": "Erythrozyt", "q": "Was transportieren die roten Blutkörperchen?", "a": ["Sauerstoff", "Nahrung für die Knochen", "Gedanken", "Wasser zum Schwitzen"], "e": "Rote Blutkörperchen enthalten den roten Farbstoff Hämoglobin. Er bindet Sauerstoff in der Lunge und gibt ihn im ganzen Körper wieder ab.", "m": "Rote Blutkörperchen = Sauerstofftransport."}, {"t": "koerper", "l": 3, "s": "Protein", "q": "Wofür braucht der Körper Eiweiss (Proteine)?", "a": ["Zum Aufbau von Muskeln, Zellen und vielen wichtigen Stoffen", "Nur für die Haarfarbe", "Zum Atmen", "Gar nicht"], "e": "Eiweiss steckt zum Beispiel in Milchprodukten, Eiern, Hülsenfrüchten, Fleisch und Fisch. Der Körper baut daraus Muskeln, Haut und Abwehrstoffe.", "m": "Eiweiss = Baustoff des Körpers."}];

/* ================= Stimme ================= */
const FEMALE = /(leni|seraphina|amala|katja|ingrid|louisa|tanja|gisela|elke|klarissa|maja|anna|petra|helena|hedda|marlene|vicki|sabine|yvonne|google deutsch|female|frau)/i;
const MALE = /(stefan|conrad|killian|jan\b|florian|ralf|bernd|christoph|kasper|klaus|markus|yannick|hans|karsten|martin|jonas|male|mann|eddy|reed|rocko|grandpa)/i;
function germanVoices(){ try{ return speechSynthesis.getVoices().filter(v=>/^de\b|^de-/i.test(v.lang)); }catch(e){ return []; } }
function voiceScore(v){
  let s=0; const n=v.name;
  if(/natural|neural|online|premium|enhanced/i.test(n)) s+=50;
  if(FEMALE.test(n)) s+=35; if(MALE.test(n)) s-=60;
  if(/de-CH/i.test(v.lang)) s+=12; else if(/de-DE/i.test(v.lang)) s+=8;
  if(/google/i.test(n)) s+=10;
  if(v.localService===false) s+=5;
  return s;
}
function bestVoice(){
  const vs=germanVoices(); if(!vs.length) return null;
  const want=store.get("ep-voice",""); const chosen=vs.find(v=>v.name===want); if(chosen) return chosen;
  return [...vs].sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
}
try{ speechSynthesis.getVoices(); speechSynthesis.addEventListener?.("voiceschanged",()=>{ if(S.screen==="profil"||S.screen==="register") render(); }); }catch(e){}
function speakText(text, btn){
  stopSpeak();
  const v=bestVoice();
  // Satzweise sprechen: klingt flüssiger und bricht bei langen Texten nicht ab
  const parts=String(text).match(/[^.!?]+[.!?]*/g)||[text];
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p.trim());
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="de-DE";
    u.rate=1; u.pitch=1.05;
    if(i===parts.length-1) u.onend=u.onerror=()=>{ if(btn){ btn.classList.remove("on"); btn.innerHTML=`${ico("speaker")} Vorlesen`; } };
    speechSynthesis.speak(u);
  });
  if(btn){ btn.classList.add("on"); btn.innerHTML=`${ico("stop")} Stopp`; }
}
function voiceSelect(){
  const vs=germanVoices(); if(!vs.length) return `<p class="help">Dieses Gerät bietet keine deutsche Vorlesestimme an.</p>`;
  const cur=bestVoice()?.name;
  const sorted=[...vs].sort((a,b)=>voiceScore(b)-voiceScore(a));
  return `<select id="voiceSel" class="sel">${sorted.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${esc(v.name)} (${esc(v.lang)})${FEMALE.test(v.name)?" – weiblich":""}</option>`).join("")}</select>
    <div class="row" style="justify-content:flex-start;margin-top:10px"><button class="big alt" id="voiceTest" type="button">${ico("speaker")} Stimme testen</button></div>`;
}
function bindVoice(){
  $("#voiceSel") && ($("#voiceSel").onchange=e=>store.set("ep-voice",e.target.value));
  $("#voiceTest") && ($("#voiceTest").onclick=e=>speakText("Hallo! Ich lese dir die Fragen und Erklärungen vor. Viel Spass beim Lernen mit easyplay.", e.currentTarget));
}

const norm = s => String(s).toLowerCase().replace(/[^a-zäöüéèà0-9]+/g," ").trim();
async function werkstattRun(themaId, stufe, batches, bilder){
  if(W8.run || !S.sample || !S.db) return;
  W8.run=true; W8.done=0; W8.err=0; render();
  const t=THEMA[themaId];
  const ch = CH_IDS.includes(themaId) || t.bereich.id==="geld" || ["pol_demokratie","pol_welt","alltag","beruf","medien"].includes(themaId);
  const seen = new Set([...pool(themaId), ...(S.pending||[])].map(f=>norm(f.q)));
  for(let b=0; b<batches && W8.run; b++){
    const st = stufe || (b%3)+1; const so=stufeObj(st);
    const recent = [...seen].slice(-80).join(" | ");
    const prompt = `Erstelle 20 neue Multiple-Choice-Lernfragen für die Lern-App «easyplay» für Kinder und Jugendliche in der Schweiz.
Thema: ${t.name}${t.text?` (${t.text})`:""}. Zielgruppe: ${so.alter} (Stufe "${so.name}"). Passe Wortwahl und Schwierigkeit genau an dieses Alter an.
${ch ? "Beziehe dich auf die Schweiz (Bund, Kantone, Gemeinden, CHF). Nenne keine exakten Beträge, Sätze oder Zinsen, die sich jährlich ändern." : ""}
Decke möglichst verschiedene Unterthemen ab und wiederhole keine dieser bestehenden Fragen (auch nicht umformuliert): ${recent}
Nur sachlich korrekte, gut belegte Fakten, wie sie in der deutschsprachigen Wikipedia stehen. Bei Unsicherheit ein anderes Thema wählen. Religion und Politik neutral und respektvoll. Deutsch mit Schweizer Rechtschreibung ("ss" statt "ß").
Jede Frage hat genau 4 Antworten; die ERSTE ist richtig, die anderen plausibel, aber eindeutig falsch.
"e": kurze, anschauliche Erklärung (2-3 Sätze). "m": Merksatz (max. 10 Wörter). "s": Titel des passenden Artikels in der deutschsprachigen Wikipedia.
${bilder ? `Bei etwa jeder dritten Frage füge "bild" hinzu: 1 bis 4 Emojis, die ein Bild oder Bilderrätsel ergeben, auf das sich die Frage bezieht (z. B. "Welches Fest passt zu diesen Bildern?"). Keine Flaggen-Emojis.` : ""}
Antworte NUR mit einem JSON-Array: [{"q": string, "a": [string,string,string,string], "e": string, "m": string, "s": string${bilder?`, "bild"?: string`:""}}]`;
    try{
      const arr = await S.sample.json(prompt, {modelTier:"default", cache:false});
      for(const x of (Array.isArray(arr)?arr:[])){
        if(!W8.run) break;
        if(!x || typeof x.q!=="string" || !Array.isArray(x.a) || x.a.length!==4) continue;
        const k=norm(x.q); if(seen.has(k)) continue; seen.add(k);
        const doc={t:themaId, l:st, q:x.q.slice(0,300), a:x.a.map(s=>String(s).slice(0,200)), e:String(x.e||"").slice(0,900), m:String(x.m||"").slice(0,160), s:String(x.s||"").slice(0,120), status:"neu", ki:true, erstellt:new Date().toISOString()};
        if(bilder && typeof x.bild==="string" && x.bild.trim() && x.bild.length<=24 && !/[A-Za-z0-9]/.test(x.bild)) doc.img="e:"+x.bild.trim();
        try{ await S.db.collection("fragen").add(doc); W8.done++; }catch(e){ W8.err++; }
      }
    }catch(e){
      W8.err++;
      if(e && (e.code==="not_granted")){ W8.run=false; }
      if(e && e.code==="rate_limited"){ await new Promise(r=>setTimeout(r,20000)); }
    }
    const el=$("#wSt"); if(el) el.textContent=`Paket ${b+1} von ${batches} fertig · ${W8.done} Fragen erstellt${W8.err?` · ${W8.err} Fehler`:""}`;
  }
  W8.run=false; if(S.screen==="werkstatt") render();
}

/* ---- Spielleitung ---- */
async function liveHost(cat, n){
  const room = await liveRoom();
  if(!room){ $("#lvErr").textContent="Live-Spiele funktionieren nur in der claude.ai-Ansicht dieser Seite."; return; }
  liveLeave();
  const all = shuffle(pool(cat));
  const list = all.slice(0, Math.min(n, all.length)).map(f=>{ const o=shuffle(f.a.map((t,i)=>({t,ok:i===0}))); return {q:f.q, img:f.img||null, opts:o.map(x=>x.t), c:o.findIndex(x=>x.ok), e:f.m}; });
  L.pin = String(Math.floor(1000+Math.random()*9000));
  L.sub = room.join("easyplay-"+L.pin);
  L.role="host";
  L.host = { cat, catName:THEMA[cat].name, list, qi:-1, phase:"lobby", scores:{}, answers:{}, qStart:0, last:{} };
  hostPublish();
  L.unsub.push(L.sub.onPeers(ch=>{ hostCollect(ch.peers); if(S.screen==="livehost") renderLiveHost(); }));
  go("livehost");
  L.tick=setInterval(()=>{ const H=L.host; if(H?.phase==="q"){ const left=LIVE_DUR-(Date.now()-H.qStart); const el=$("#lvTime"); if(el) el.textContent=Math.max(0,Math.ceil(left/1000)); if(left<=0) hostReveal(); } },250);
}
function hostPublish(){
  const H=L.host; if(!H||!L.sub) return;
  const cur = H.list[H.qi];
  const top = Object.entries(H.scores).sort((a,b)=>b[1]-a[1]).slice(0,40);
  const st = { role:"host", pin:L.pin, phase:H.phase, cat:H.catName, qi:H.qi, total:H.list.length, scores:Object.fromEntries(top) };
  if(cur && H.phase!=="lobby"){ st.q = {text:cur.q, img:cur.img, opts:cur.opts}; st.qid = L.pin+"-"+H.qi; }
  if(H.phase==="reveal"||H.phase==="end"){ st.c = cur?.c; st.last = H.last; }
  L.sub.presence(st).catch(()=>{});
}
function hostCollect(peers){
  const H=L.host; if(!H) return;
  if(H.phase==="q"){
    const qid=L.pin+"-"+H.qi;
    let changed=false;
    peers.forEach(p=>{
      const pr=p.presence||{};
      if(pr.role==="player" && pr.pin===L.pin && pr.qid===qid && Number.isInteger(pr.pick) && !(p.peer in H.answers)){
        const ms = Math.max(0, Date.now()-H.qStart);
        const ok = pr.pick===H.list[H.qi].c;
        const pts = ok ? 500 + Math.round(500*Math.max(0,1-ms/LIVE_DUR)) : 0;
        H.answers[p.peer]={pick:pr.pick, pts};
        changed=true;
      }
    });
    const players = peers.filter(p=>p.presence?.role==="player" && p.presence?.pin===L.pin);
    if(changed && players.length && players.every(p=>p.peer in H.answers)) hostReveal();
  }
}
function hostNext(){
  const H=L.host;
  if(H.qi+1>=H.list.length){ H.phase="end"; hostPublish(); renderLiveHost(); return; }
  H.qi++; H.phase="q"; H.answers={}; H.qStart=Date.now(); hostPublish(); renderLiveHost();
}
function hostReveal(){
  const H=L.host; if(H.phase!=="q") return;
  H.phase="reveal"; H.last={};
  Object.entries(H.answers).forEach(([peer,a])=>{ H.scores[peer]=(H.scores[peer]||0)+a.pts; H.last[peer]=a.pts; });
  livePlayers().forEach(p=>{ if(!(p.peer in H.scores)) H.scores[p.peer]=0; });
  hostPublish(); renderLiveHost();
}
function nameOf(peer){ const p=(L.sub?.peers()||[]).find(x=>x.peer===peer); return p?.presence?.name || "Gast"; }
function avOf(peer){ const p=(L.sub?.peers()||[]).find(x=>x.peer===peer); return p?.presence?.av || "fuchs"; }
function ranking(scores){ return Object.entries(scores||{}).sort((a,b)=>b[1]-a[1]); }

  } else {
    const r=ranking(H.scores);
    body = `<div class="podium">${[1,0,2].map(i=>r[i]?`<div class="pod p${i+1}"><div class="pav">${avatar(avOf(r[i][0]))}</div><b>${esc(nameOf(r[i][0]))}</b><span>${r[i][1]} Punkte</span><div class="block">${medalSvg(i)}</div></div>`:"").join("")}</div>

function scoreboard(scores, n, last){
  const r=ranking(scores).slice(0,n);
  if(!r.length) return "";
  return `<div class="board lboard">${r.map(([peer,pts],i)=>`<div class="rrow"><span class="rank">${medalSvg(i)}</span><span class="rav">${avatar(avOf(peer))}</span><span class="rname"><b>${esc(nameOf(peer))}</b>${last&&last[peer]?`<span>+${last[peer]}</span>`:""}</span><span class="rpts">${pts}<small>Punkte</small></span></div>`).join("")}</div>`;
}
function drawQR(){
  const box=$("#qr"); if(!box) return;
  const make=()=>{ try{ box.innerHTML=""; new QRCode(box,{text:ARTIFACT_URL,width:220,height:220,colorDark:"#14245E",colorLight:"#ffffff"}); }catch(e){ box.innerHTML=`<p class="url">${esc(ARTIFACT_URL)}</p>`; } };
  if(window.QRCode) return make();
  if(!L.qrLoaded){ L.qrLoaded=true; const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload=make; s.onerror=()=>{ box.innerHTML=`<p class="url">${esc(ARTIFACT_URL)}</p>`; }; document.head.appendChild(s); }
  else setTimeout(()=>{ if(window.QRCode) make(); },500);
}
