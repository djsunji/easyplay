<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>easyplay – Fragen. Wissen. Weiterkommen.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6FF; --surface:#FFFFFF; --ink:#1B2240; --soft:#5A6385; --line:#D9E0F3;
  --welt:#3D5AFE; --natur:#17A35A; --geld:#E0312B; --alltag:#F2A000;
  --ok:#17A35A; --bad:#D6362E; --focus:#3D5AFE; --gold:#F2B400;
  --shadow:0 18px 40px -22px rgba(27,34,64,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10152C; --surface:#1B2244; --ink:#EEF1FF; --soft:#AAB2D4; --line:#2D3663;
    --welt:#7C92FF; --natur:#4FCB85; --geld:#FF6B63; --alltag:#FFC24A; --ok:#4FCB85; --bad:#FF6B63; --focus:#9DB0FF; --gold:#FFD24A;
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#10152C; --surface:#1B2244; --ink:#EEF1FF; --soft:#AAB2D4; --line:#2D3663;
  --welt:#7C92FF; --natur:#4FCB85; --geld:#FF6B63; --alltag:#FFC24A; --ok:#4FCB85; --bad:#FF6B63; --focus:#9DB0FF; --gold:#FFD24A;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 "Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 0);background-size:26px 26px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(38vmax 30vmax at 95% -5%,color-mix(in srgb,var(--welt) 22%,transparent),transparent 70%),
             radial-gradient(30vmax 26vmax at -8% 30%,color-mix(in srgb,var(--alltag) 20%,transparent),transparent 70%),
             radial-gradient(34vmax 26vmax at 100% 100%,color-mix(in srgb,var(--natur) 18%,transparent),transparent 70%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding:16px 18px 80px}
h1,h2,h3{font-family:"Bricolage Grotesque","Lexend",system-ui,sans-serif;line-height:1.08;margin:0}

/* Kopf */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.55rem;letter-spacing:-.01em}
.logoimg{width:50px;height:50px;border-radius:15px;flex:none;box-shadow:0 6px 16px -8px rgba(60,40,140,.5)}
.wordmark{font-family:"Fredoka","Bricolage Grotesque",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1}
.wordmark .easy{color:#14245E}
.dark .wordmark .easy{color:#EEF1FF}
.wordmark .play{background:linear-gradient(90deg,#2B4BF2 0%,#8A3FE0 30%,#E043B8 58%,#FF7A3D 82%,#FFB800 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .wordmark{font-size:1.9rem}
.hero .hero-wm{font-size:clamp(3.6rem,11vw,6.4rem);font-weight:700;letter-spacing:-.02em;padding-bottom:.08em}
.tagline{font-family:"Fredoka",system-ui,sans-serif;font-weight:500;font-size:clamp(1.25rem,3vw,1.6rem)!important;color:#14245E!important;margin:6px 0 14px!important;letter-spacing:.01em}
.dark .tagline{color:#EEF1FF!important}
.heroicon{position:absolute;right:10px;top:0;width:300px;height:300px;border-radius:44px;box-shadow:var(--shadow);transform:rotate(-3deg);animation:floaty 5s ease-in-out infinite}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.navbtn{display:flex;align-items:center;gap:8px;min-height:48px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:600;font-size:1rem}
.navbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navbtn .av{font-size:1.4rem;line-height:1}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center;margin:14px 0 34px}
.mobicon{display:none}
@media (max-width:760px){.hero{grid-template-columns:1fr}.heroart{display:none}.mobicon{display:block;width:120px;height:120px;border-radius:30px;box-shadow:var(--shadow);margin:0 0 14px;transform:rotate(-3deg)}}
.hero h1{font-size:clamp(2.5rem,7vw,4.4rem);font-weight:800;letter-spacing:-.025em}
.hero p{color:var(--soft);font-size:1.15rem;margin:14px 0 20px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{display:flex;align-items:baseline;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 14px}
.chip b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.5rem;font-weight:800}
.chip span{color:var(--soft);font-size:.95rem}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.heroart{position:relative;height:330px}
.mini{position:absolute;width:260px;border-radius:24px;padding:18px;background:var(--surface);box-shadow:var(--shadow);border:2px solid var(--line)}
.mini.b1{right:0;top:30px;height:290px;transform:rotate(9deg);background:linear-gradient(135deg,#FFB800,#FF7A3D);border-color:transparent}
.mini.b2{right:40px;top:14px;height:290px;transform:rotate(-10deg);background:linear-gradient(135deg,#2B4BF2,#E043B8);border-color:transparent}
.mini.front{right:20px;top:40px;transform:rotate(-2deg)}
.mini h3{font-size:1.15rem;margin-bottom:12px}
.mini .o{border:2px solid var(--line);border-radius:12px;padding:6px 10px;margin-top:8px;font-size:.9rem}
.mini .o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.mini .tag{display:inline-block;background:var(--welt);color:#fff;border-radius:999px;padding:2px 10px;font-size:.8rem;margin-bottom:10px}
.badge{position:absolute;left:4px;bottom:26px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);font-weight:600;transform:rotate(-4deg)}
.badge span{font-size:1.6rem;vertical-align:middle;margin-right:6px}

/* Stufen */
.label{font-weight:600;margin:0 0 12px;font-size:1.1rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label small{font-weight:400;color:var(--soft)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 32px}
@media (max-width:640px){.levels{grid-template-columns:1fr}}
.level{min-height:96px;border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:14px 18px;text-align:left;display:flex;align-items:center;gap:14px}
.level .em{font-size:2.3rem}
.level b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.45rem}
.level span.a{color:var(--soft);font-size:1rem}
.level[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 6px 0 var(--ink)}

/* Bereiche */
.bereiche{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media (max-width:640px){.bereiche{grid-template-columns:1fr}}
.bereich{position:relative;min-height:190px;border:0;border-radius:28px;padding:22px 24px;text-align:left;color:#fff;background:var(--c);
  background-image:radial-gradient(circle at 2px 2px,rgba(255,255,255,.22) 1.5px,transparent 0),linear-gradient(160deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c));
  background-size:18px 18px,auto;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 58%,#000);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:transform .12s}
.bereich:hover{transform:translateY(-2px)}
.bereich:active{transform:translateY(5px);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 58%,#000)}
.bereich .emo{position:absolute;right:14px;top:8px;font-size:4.6rem;line-height:1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.bereich h2{font-size:1.95rem;font-weight:800}
.bereich p{margin:4px 0 0;font-size:1rem;opacity:.95}
.count-pill{position:absolute;left:20px;top:18px;background:rgba(255,255,255,.92);color:#1B2240;border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:600}
.dark .bereich{color:#0F1430}

/* Themen */
.back{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 18px;font-weight:600;min-height:52px}
.bhead{display:flex;align-items:center;gap:16px;margin:20px 0 20px;flex-wrap:wrap}
.bhead .emo{font-size:3.4rem}
.bhead h1{font-size:clamp(2rem,6vw,3rem);font-weight:800}
.bhead .sub{color:var(--soft);width:100%}
.themen{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.thema{min-height:128px;border:3px solid color-mix(in srgb,var(--c) 40%,var(--line));background:var(--surface);border-radius:24px;padding:18px 20px;text-align:left;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 30%,var(--line))}
.thema:hover{border-color:var(--c)}
.thema{position:relative}
.thema .step{position:absolute;top:10px;right:14px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.6rem;color:color-mix(in srgb,var(--c) 45%,transparent)}
.kantone{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kanton{min-height:84px;display:flex;align-items:center;gap:14px;text-align:left;border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 var(--line)}
.kanton:hover{border-color:var(--geld)}
.kanton:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.kz{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--geld);color:#fff;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.2rem}
.dark .kz{color:#0F1430}
.kn b{display:block;font-size:1.1rem}
.kn span{color:var(--soft);font-size:.9rem}
.thema .emo{font-size:2.7rem}
.thema b{display:block;font-size:1.25rem;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.thema span.t{display:block;color:var(--soft);font-size:.95rem}
.thema span.n{display:inline-block;margin-top:6px;font-size:.85rem;font-weight:600;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 14%,var(--surface))}

/* Modus */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:640px){.modes{grid-template-columns:1fr}}
.mode{min-height:210px;border:3px solid var(--line);background:var(--surface);border-radius:28px;padding:24px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 0 var(--line)}
.mode .em{font-size:3rem;line-height:1}
.mode h2{font-size:1.8rem;font-weight:800}
.mode p{margin:0;color:var(--soft)}
.mode.test{border-color:var(--gold);box-shadow:0 6px 0 var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.mode[disabled]{opacity:.6;cursor:not-allowed}

/* Quiz */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar{flex:1 1 200px;height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:999px;transition:width .3s}
.count{font-weight:600;color:var(--soft)}
.timer{font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);border:2px solid var(--gold);border-radius:999px;padding:6px 14px}
.card{background:var(--surface);border-radius:28px;border:3px solid color-mix(in srgb,var(--c) 40%,var(--line));padding:clamp(18px,4vw,34px);box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tabbtn{flex:1;min-height:58px;border:3px solid var(--line);background:var(--bg);border-radius:16px;font-weight:600;font-size:1.1rem}
.tabbtn[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.dark .tabbtn[aria-selected="true"]{color:#0F1430}
.tabbtn .new{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--geld);margin-left:6px;vertical-align:middle}
.modebadge{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem;margin-bottom:14px;background:color-mix(in srgb,var(--gold) 22%,var(--surface))}
.question{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:600;font-size:clamp(1.5rem,4vw,2.05rem);line-height:1.25;margin:0 0 22px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.answers{grid-template-columns:1fr}}
.ans{min-height:80px;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 16px;text-align:left;font-size:1.1rem;display:flex;align-items:center;gap:12px;box-shadow:0 5px 0 var(--line)}
.ans .key{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--bg)}
.ans:hover:not([disabled]){border-color:var(--c)}
.ans:active:not([disabled]){transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.ans[disabled]{cursor:default}
.ans.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface));box-shadow:0 5px 0 var(--ok)}
.ans.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));box-shadow:0 5px 0 var(--bad)}
.feedback{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.feedback p{margin:0;font-weight:600;font-size:1.2rem}
.big{min-height:62px;padding:12px 26px;border:0;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:600;font-size:1.1rem;box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 55%,#000)}
.big.alt{background:var(--surface);color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.big.gold{background:var(--gold);color:#1B2240;box-shadow:0 5px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.big[disabled]{opacity:.55;cursor:default}
.speak{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 12px;font-size:.95rem;margin-bottom:14px}
.explain .pic{font-size:4.5rem;line-height:1;margin-bottom:10px}
.explain p{font-size:1.15rem;max-width:60ch;margin:0 0 16px}
.merke{border-radius:18px;padding:16px 18px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border:2px solid var(--c);font-weight:600;max-width:60ch}
.merke small{display:block;font-weight:500;color:var(--soft);margin-bottom:4px}
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.16em;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .f{fill:currentColor;opacity:.22;stroke:none}
.ic .s{fill:currentColor;stroke:none}
.av-ic{stroke:none}
.avbtn .ic{width:2.9rem;height:2.9rem}
.tabbtn .ic,.navbtn .ic,.speak .ic,.src .ic,.seg .ic,.big .ic,.modebadge .ic,.timer .ic,.statcard h2 .ic,.label .ic{width:1.35em;height:1.35em;vertical-align:-.3em}
.level .em .ic{width:1.25em;height:1.25em}
.bigav .ic{width:64%;height:64%}
.bigav.trophy{color:var(--gold)}
.navbtn .av .ic,.rav .ic{width:1.3em;height:1.3em}
.rank .ic{width:1.6em;height:1.6em}
.thema .emo,.bhead .emo{color:var(--c,var(--welt))}
.level .em{color:var(--welt)}
.mode .em{color:var(--c,var(--welt))}
.mode.test .em{color:var(--gold)}
.explain .pic{color:var(--c)}
.locked .pic{color:var(--soft)}
.ans .key .ic{width:1.5em;height:1.5em}
.stars .ic{width:1.1em;height:1.1em;margin:0 .05em}
.thema .t .ic{width:1.05em;height:1.05em}
.feedback .ic,.rev .ic{width:1.3em;height:1.3em;vertical-align:-.3em}
.badge .ic{width:1.5em;height:1.5em;vertical-align:-.4em}
.startlbl{display:inline-flex;align-items:center;align-self:flex-start;margin-top:auto}
.pick-lbl{font-weight:600;color:var(--ink)!important;margin-top:10px!important}
.counts{display:flex;flex-wrap:wrap;gap:10px}
.cnt{min-width:72px;min-height:58px;border:3px solid var(--c);background:var(--surface);border-radius:16px;font-weight:600;font-size:1.15rem;padding:6px 16px;box-shadow:0 4px 0 var(--c)}
.cnt:hover{background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.cnt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--c)}
.mode[disabled] h2,.mode[disabled] .em{opacity:.5}
.timer.warn{border-color:var(--bad);color:var(--bad)}
.timeup{color:var(--bad)!important;font-weight:600}
.rev em{font-weight:400;color:var(--soft)}
.qimg{display:flex;justify-content:center;margin:0 0 18px}
.qimg .qbig{width:auto;height:170px;max-width:100%;filter:drop-shadow(0 8px 14px rgba(27,34,64,.18))}
.qimg .flag.qbig{height:140px}
.wappen{width:1em;height:1.2em;display:inline-block;vertical-align:-.25em}
.kw{flex:none;width:46px;height:56px;display:grid;place-items:center}
.kw .wappen{width:44px;height:53px}
.bhead .emo .wappen{width:.9em;height:1.08em}
.explain .pic .wappen{width:.9em;height:1.08em}
.navbtn.live{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.bigav.live{color:var(--gold)}
.sel,.pin{width:100%;min-height:56px;border:3px solid var(--line);border-radius:14px;padding:8px 14px;font:inherit;font-size:1.1rem;background:var(--bg);color:var(--ink)}
.pin{font-size:1.6rem;letter-spacing:.3em;font-weight:600;text-align:center}
.pin.name{font-size:1.15rem;letter-spacing:0;text-align:left}
.cnt.on{background:var(--c);color:#fff}
.livehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.lcat{font-weight:600;color:var(--soft)}
.lobby{display:grid;gap:22px}
.joinbox{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:24px}
.qr{background:#fff;padding:12px;border-radius:18px;min-width:120px;min-height:120px}
.qr img,.qr canvas{display:block}
.joinbox .lbl{font-weight:600;margin:0 0 6px}
.joinbox .url{color:var(--soft);word-break:break-all;margin:0 0 18px}
.bigpin{font-family:"Fredoka","Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(3.5rem,10vw,6rem);font-weight:700;letter-spacing:.12em;line-height:1;color:var(--welt)}
.plist h2{font-size:1.5rem;margin-bottom:12px}
.chips2{display:flex;flex-wrap:wrap;gap:10px}
.pchip{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600}
.pchip .ic{width:1.8em;height:1.8em}
.wait{color:var(--soft)}
.lq{display:grid;gap:18px}
.lqtop{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--soft);gap:10px}
.ltime{font-family:"Fredoka",system-ui,sans-serif;font-size:2.2rem;font-weight:700;color:var(--ink);background:var(--surface);border:3px solid var(--gold);border-radius:999px;min-width:72px;text-align:center;padding:2px 12px}
.lqtext{font-size:clamp(1.6rem,4.5vw,2.6rem);text-align:center;background:var(--surface);border-radius:24px;padding:22px;box-shadow:var(--shadow)}
.lqtext.small{font-size:clamp(1.2rem,4vw,1.6rem)}
.lopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}

const FRAGEN = [
 // Geschichte
 {t:"g_mittelalter",l:1,q:"Wie hiessen die Seefahrer, die vor etwa 1000 Jahren aus Skandinavien mit Langschiffen loszogen?",a:["Wikinger","Römer","Ägypter","Azteken"],e:"Die Wikinger lebten im Gebiet des heutigen Norwegens, Schwedens und Dänemarks. Mit ihren schnellen Langschiffen fuhren sie als Händler, Entdecker und Krieger über die Meere – sogar bis nach Nordamerika.",m:"Wikinger = Seefahrer aus dem Norden."},
 {t:"g_antike",l:1,q:"Wofür bauten die alten Ägypter die grossen Pyramiden?",a:["Als Grabmäler für ihre Könige","Als Wohnhäuser","Als Leuchttürme","Als Getreidelager"],e:"Die Könige im alten Ägypten hiessen Pharaonen. Die Ägypter glaubten an ein Leben nach dem Tod und bauten ihnen deshalb riesige Grabmäler: die Pyramiden.",m:"Pyramiden waren Gräber für Pharaonen."},
 {t:"ch_geschichte",l:2,q:"Seit welchem Jahr ist die Schweiz ein moderner Bundesstaat mit einer Bundesverfassung?",a:["1848","1291","1515","1971"],e:"1291 ist das Jahr des Bundesbriefs der ersten Kantone – daran erinnert der 1. August. Den modernen Bundesstaat mit gemeinsamer Verfassung, Parlament und Bundesrat gibt es aber erst seit 1848.",m:"1291 = Bundesbrief, 1848 = moderner Bundesstaat."},
 {t:"ch_geschichte",l:2,q:"In welcher Stadt sitzen der Bundesrat und das Parlament der Schweiz?",a:["Bern","Zürich","Genf","Luzern"],e:"Bern ist die Bundesstadt der Schweiz. Dort steht das Bundeshaus, in dem der Bundesrat arbeitet und das Parlament tagt.",m:"Bundeshaus = Bern."},
 {t:"ch_geschichte",l:3,q:"Seit wann dürfen Frauen in der Schweiz auf Bundesebene abstimmen und wählen?",a:["Seit 1971","Seit 1848","Seit 1919","Seit 2000"],e:"Die Schweizer Männer stimmten 1971 zu, dass Frauen national mitbestimmen dürfen – im Vergleich zu vielen Ländern Europas sehr spät. Im Kanton Appenzell Innerrhoden kam das kantonale Stimmrecht erst 1990, nach einem Entscheid des Bundesgerichts.",m:"Frauenstimmrecht national: 1971."},
 {t:"g_neuzeit",l:3,q:"Welches Ereignis von 1989 wurde zum Symbol für das Ende des Kalten Krieges?",a:["Der Fall der Berliner Mauer","Die Mondlandung","Der Beginn des Ersten Weltkriegs","Die Gründung der UNO"],e:"Die Berliner Mauer trennte Ost- und Westberlin. Als sie im November 1989 geöffnet wurde, war das der Anfang vom Ende der Teilung Europas in Ost und West.",m:"1989: Die Mauer fällt."},
 // Politik
 {t:"pol_demokratie",l:1,q:"Wie viele Landessprachen hat die Schweiz?",a:["Vier","Zwei","Drei","Sechs"],e:"In der Schweiz gibt es vier Landessprachen: Deutsch, Französisch, Italienisch und Rätoromanisch. Rätoromanisch wird vor allem in Graubünden gesprochen.",m:"Deutsch, Französisch, Italienisch, Rätoromanisch."},
 {t:"pol_demokratie",l:2,q:"Wie viele Mitglieder hat der Bundesrat, die Regierung der Schweiz?",a:["Sieben","Fünf","Neun","Zwölf"],e:"Der Bundesrat besteht aus sieben Mitgliedern. Sie leiten gemeinsam das Land, und jedes Mitglied führt ein Departement, zum Beispiel für Finanzen oder Verteidigung.",m:"Bundesrat = 7 Mitglieder."},
 {t:"pol_demokratie",l:2,q:"Was ist der Unterschied zwischen Wählen und Abstimmen?",a:["Beim Wählen bestimmt man Personen, beim Abstimmen entscheidet man über eine Sachfrage","Es gibt keinen Unterschied","Abstimmen machen nur Politiker","Wählen gibt es nur in den Gemeinden"],e:"Bei Wahlen bestimmst du, wer dich vertritt, zum Beispiel im Nationalrat. Bei Abstimmungen sagst du selbst Ja oder Nein zu einem Thema. In der Schweiz passiert das mehrmals pro Jahr.",m:"Wählen = Personen. Abstimmen = Sachfragen."},
 {t:"pol_demokratie",l:3,q:"Wie viele Unterschriften braucht eine eidgenössische Volksinitiative?",a:["100'000 in 18 Monaten","50'000 in 100 Tagen","10'000 in einem Jahr","1 Million ohne Frist"],e:"Mit einer Volksinitiative können Bürgerinnen und Bürger eine Änderung der Bundesverfassung vorschlagen. Kommen innert 18 Monaten 100'000 gültige Unterschriften zusammen, stimmt das ganze Volk darüber ab.",m:"Initiative: 100'000 Unterschriften, 18 Monate."},
 {t:"pol_demokratie",l:3,q:"Ab welchem Alter darf man in der Schweiz bei eidgenössischen Abstimmungen mitmachen?",a:["Ab 18","Ab 16","Ab 20","Ab 21"],e:"Auf Bundesebene gilt das Stimmrechtsalter 18. Der Kanton Glarus erlaubt schon ab 16 die Mitbestimmung bei kantonalen und kommunalen Fragen.",m:"National: ab 18."},
 // Religion
 {t:"rel_christentum",l:1,q:"Welches Fest feiern Christinnen und Christen zur Geburt von Jesus?",a:["Weihnachten","Ostern","Pfingsten","Halloween"],e:"An Weihnachten erinnern sich Christinnen und Christen an die Geburt von Jesus. Ostern ist ein anderes wichtiges Fest: Es erinnert an seine Auferstehung.",m:"Weihnachten = Geburt von Jesus."},
 {t:"rel_islam",l:1,q:"Wie heisst das Gotteshaus der Musliminnen und Muslime?",a:["Moschee","Kirche","Synagoge","Tempel"],e:"Musliminnen und Muslime beten gemeinsam in einer Moschee. Christen gehen in die Kirche, Jüdinnen und Juden in die Synagoge.",m:"Moschee – Kirche – Synagoge."},
 {t:"rel_andere",l:2,q:"Welche fünf Religionen werden oft als die grossen Weltreligionen bezeichnet?",a:["Judentum, Christentum, Islam, Hinduismus, Buddhismus","Christentum, Islam, Wikingerglaube, Hinduismus, Buddhismus","Judentum, Christentum, Islam, Olympia, Buddhismus","Nur Christentum und Islam"],e:"Diese fünf Religionen haben weltweit viele Anhängerinnen und Anhänger und eine lange Geschichte. Daneben gibt es noch viele weitere Religionen und Menschen ohne Religion.",m:"Judentum, Christentum, Islam, Hinduismus, Buddhismus."},
 {t:"rel_islam",l:2,q:"Wie heisst das Fest am Ende des Fastenmonats Ramadan?",a:["Zuckerfest (Eid al-Fitr)","Chanukka","Diwali","Erntedank"],e:"Im Ramadan fasten viele Musliminnen und Muslime tagsüber. Am Ende feiern sie das Zuckerfest mit Familie, Besuchen und Süssigkeiten.",m:"Ende des Ramadan = Zuckerfest."},
 {t:"rel_andere",l:2,q:"Wie heisst die heilige Schrift des Judentums, die die fünf Bücher Mose enthält?",a:["Tora","Koran","Veden","Bhagavad Gita"],e:"Die Tora ist der wichtigste Teil der jüdischen Bibel. In der Synagoge wird sie aus einer handgeschriebenen Schriftrolle vorgelesen.",m:"Tora = heilige Schrift des Judentums."},
 {t:"rel_andere",l:3,q:"Wer gilt als Begründer des Buddhismus?",a:["Siddhartha Gautama, genannt Buddha","Konfuzius","Mose","Martin Luther"],e:"Siddhartha Gautama lebte vor rund 2500 Jahren in Indien. Nach der Überlieferung erlangte er die «Erleuchtung» und wurde darum Buddha genannt – «der Erwachte».",m:"Buddha = Siddhartha Gautama."},
 {t:"rel_christentum",l:3,q:"Welcher Reformator wirkte ab 1519 am Grossmünster in Zürich?",a:["Huldrych Zwingli","Johannes Calvin","Martin Luther","Niklaus von Flüe"],e:"Zwingli prägte die Reformation in Zürich. Calvin wirkte später in Genf, Luther in Deutschland. Deshalb ist ein grosser Teil der Schweiz reformiert geprägt.",m:"Zürich: Zwingli. Genf: Calvin."},
 {t:"rel_andere",l:3,q:"Was bedeutet Glaubens- und Gewissensfreiheit in der Schweiz?",a:["Jede Person darf ihre Religion frei wählen, ausüben – oder keine haben","Alle müssen derselben Religion angehören","Nur Erwachsene über 30 dürfen glauben, was sie wollen","Religion ist in der Schweiz verboten"],e:"Die Bundesverfassung schützt die Glaubens- und Gewissensfreiheit. Niemand darf gezwungen werden, einer Religion beizutreten oder an religiösen Handlungen teilzunehmen.",m:"Glauben ist frei – auch nicht zu glauben."},
 // Physik
 {t:"physik",l:1,q:"Was passiert mit Wasser, wenn es unter 0 °C kalt wird?",a:["Es gefriert zu Eis","Es wird zu Dampf","Es wird zu Sand","Es verschwindet"],e:"Wasser hat drei Zustände: fest (Eis), flüssig (Wasser) und gasförmig (Dampf). Unter 0 °C wird flüssiges Wasser fest – es gefriert.",m:"Unter 0 °C: Wasser wird Eis."},
 {t:"physik",l:1,q:"Welche Pole von zwei Magneten ziehen sich an?",a:["Nordpol und Südpol","Nordpol und Nordpol","Südpol und Südpol","Keine"],e:"Jeder Magnet hat einen Nord- und einen Südpol. Ungleiche Pole ziehen sich an, gleiche Pole stossen sich ab.",m:"Ungleich zieht an, gleich stösst ab."},
 {t:"physik",l:2,q:"Warum siehst du bei einem Gewitter zuerst den Blitz und hörst erst danach den Donner?",a:["Licht ist viel schneller als Schall","Der Donner entsteht später","Die Ohren sind langsamer als die Augen","Der Blitz ist näher als der Donner"],e:"Blitz und Donner entstehen gleichzeitig. Licht ist aber extrem schnell, Schall braucht für einen Kilometer rund drei Sekunden. Zählst du die Sekunden und teilst durch drei, weisst du ungefähr, wie viele Kilometer das Gewitter entfernt ist.",m:"Licht ist schneller als Schall."},
 {t:"physik",l:2,q:"Welches Material leitet elektrischen Strom gut?",a:["Kupfer","Holz","Gummi","Glas"],e:"Metalle wie Kupfer lassen Strom gut durch – darum bestehen Kabel innen aus Kupfer. Gummi und Kunststoff leiten kaum und werden deshalb als Schutzhülle verwendet.",m:"Metall leitet, Gummi isoliert."},
 {t:"physik",l:2,q:"Warum schwimmt ein grosses Schiff aus Stahl?",a:["Es verdrängt so viel Wasser, dass der Auftrieb es trägt","Weil Stahl leichter als Wasser ist","Weil der Motor es oben hält","Weil Meerwasser klebrig ist"],e:"Ein Schiff ist innen grösstenteils hohl und drückt viel Wasser zur Seite. Das Wasser drückt mit einer Kraft zurück, die man Auftrieb nennt. Ist sie so gross wie das Gewicht des Schiffs, schwimmt es.",m:"Viel verdrängtes Wasser = viel Auftrieb."},
 {t:"physik",l:3,q:"Warum kippst du im Bus nach vorne, wenn er plötzlich bremst?",a:["Wegen der Trägheit: Dein Körper will sich weiterbewegen","Weil der Bus dich nach vorne stösst","Wegen der Schwerkraft des Fahrers","Weil die Luft im Bus nach vorne strömt"],e:"Nach dem Trägheitsgesetz von Newton bleibt ein Körper in Bewegung, solange keine Kraft ihn bremst. Der Bus wird langsamer, dein Körper will aber weiterfahren – darum kippst du nach vorne. Deshalb sind Sicherheitsgurte so wichtig.",m:"Trägheit: Was sich bewegt, will weiterfahren."},
 {t:"physik",l:3,q:"In welcher Einheit misst man eine Kraft?",a:["Newton","Watt","Joule","Volt"],e:"Kräfte misst man in Newton, benannt nach Isaac Newton. Watt ist die Einheit für Leistung, Joule für Energie und Volt für die elektrische Spannung.",m:"Kraft = Newton."},
 {t:"physik",l:3,q:"Wie schnell ist Licht ungefähr im Vakuum?",a:["Rund 300'000 Kilometer pro Sekunde","Rund 300 Kilometer pro Stunde","Rund 3'000 Kilometer pro Sekunde","Rund 30 Kilometer pro Sekunde"],e:"Licht legt pro Sekunde etwa 300'000 Kilometer zurück. Das Sonnenlicht, das dich gerade trifft, hat die Sonne vor etwa acht Minuten verlassen.",m:"Licht: ca. 300'000 km pro Sekunde."},
 // Medien & Social Media
 {t:"medien",l:1,q:"Im Internet siehst du etwas, das dir Angst macht. Was tust du?",a:["Einer erwachsenen Vertrauensperson davon erzählen","Es für dich behalten","Es an alle Freunde schicken","Weiter schauen, bis es vorbei ist"],e:"Niemand muss mit so etwas allein bleiben. Erzähl es deinen Eltern, einer Lehrperson oder einer anderen Person, der du vertraust. Kinder und Jugendliche können sich auch bei Pro Juventute unter der Nummer 147 melden.",m:"Komisches Gefühl? Erzähl es jemandem."},
 {t:"medien",l:1,q:"Darfst du ein Foto von jemand anderem einfach ins Internet stellen?",a:["Nur wenn die Person einverstanden ist","Ja, immer","Nur am Wochenende","Ja, wenn das Foto lustig ist"],e:"Jeder Mensch darf selbst entscheiden, ob ein Bild von ihm im Internet landet. Frag deshalb immer zuerst – und denk daran: Was einmal online ist, lässt sich kaum mehr ganz löschen.",m:"Erst fragen, dann posten."},
 {t:"medien",l:2,q:"Ab welchem Alter erlauben TikTok, Instagram und Snapchat laut ihren eigenen Regeln ein Konto?",a:["Ab 13 Jahren","Ab 8 Jahren","Ab 18 Jahren","Es gibt keine Altersgrenze"],e:"Die grossen Plattformen verlangen in ihren Nutzungsbedingungen ein Mindestalter von 13 Jahren. Für Jüngere sind viele Inhalte und Funktionen nicht gedacht, zum Beispiel Nachrichten von Fremden.",m:"Social Media: meist erst ab 13."},
 {t:"medien",l:2,q:"Was macht der Algorithmus bei TikTok & Co.?",a:["Er wählt aus, welche Videos du siehst – je nachdem, was du dir anschaust","Er prüft, ob Videos wahr sind","Er zählt deine Hausaufgaben","Er schützt dich vor Werbung"],e:"Die App merkt sich, wie lange du welche Videos anschaust, und zeigt dir mehr davon. So bleibt man leicht länger dran als geplant. Wer das weiss, kann bewusster entscheiden, wann Schluss ist.",m:"Der Algorithmus will dich in der App halten."},
 {t:"medien",l:2,q:"Jemand wird in einem Gruppenchat immer wieder fertiggemacht. Was ist sinnvoll?",a:["Screenshots machen, blockieren oder melden und eine Vertrauensperson einbeziehen","Mitlachen, damit es aufhört","Den Chat löschen und nichts sagen","Zurückbeleidigen"],e:"Das nennt man Cybermobbing. Beweise sichern, die Person blockieren oder melden und Hilfe holen – bei Eltern, Lehrpersonen oder bei Pro Juventute unter 147. Wer zuschaut und nichts sagt, macht es für die betroffene Person schlimmer.",m:"Sichern, melden, Hilfe holen."},
 {t:"medien",l:3,q:"Du liest eine überraschende Nachricht auf Social Media. Wie prüfst du, ob sie stimmt?",a:["Die Quelle prüfen und schauen, ob seriöse Medien dasselbe berichten","Schauen, wie viele Likes sie hat","Sie sofort teilen","Der Person glauben, die sie gepostet hat"],e:"Viele Likes heissen nicht, dass etwas stimmt. Frag dich: Wer steckt dahinter? Berichten bekannte Zeitungen oder das Radio und Fernsehen ebenfalls darüber? Wenn nicht, ist Vorsicht angebracht.",m:"Quelle prüfen, vergleichen, dann teilen."},
 {t:"medien",l:3,q:"Was ist ein Deepfake?",a:["Ein mit KI gefälschtes Bild, Video oder eine Stimme, das echt wirkt","Ein besonders tiefes Foto","Ein Filter, der nur die Farbe ändert","Ein Fehler beim Hochladen"],e:"Mit künstlicher Intelligenz lassen sich Gesichter und Stimmen täuschend echt nachmachen. So können Menschen Dinge «sagen», die sie nie gesagt haben. Bei auffälligen Videos lohnt es sich zu prüfen, woher sie stammen.",m:"Nicht alles, was echt aussieht, ist echt."},
 {t:"medien",l:3,q:"Warum sind viele Apps gratis?",a:["Sie verdienen mit Werbung und mit deinen Daten","Weil der Staat sie bezahlt","Weil die Firmen kein Geld brauchen","Weil Programmieren nichts kostet"],e:"Wenn du nichts bezahlst, verdient die App meist an Werbung. Je mehr sie über dich weiss, desto gezielter kann sie Werbung zeigen. Darum lohnt sich ein Blick in die Privatsphäre-Einstellungen.",m:"Gratis-App: Du zahlst mit Aufmerksamkeit und Daten."},
 {t:"medien",l:3,q:"Eine Influencerin wird von einer Firma für einen Post bezahlt. Was gilt?",a:["Der Post sollte klar als Werbung erkennbar sein","Das darf man nie","Sie muss es geheim halten","Nur Fernsehwerbung ist Werbung"],e:"Bezahlte Posts sind Werbung. Damit Followerinnen und Follower nicht getäuscht werden, sollte das klar gekennzeichnet sein, etwa mit «Werbung» oder «Anzeige». Achte darauf, bevor du einer Empfehlung glaubst.",m:"Bezahlt = Werbung."},
 // Berufswahl & Lehre
 {t:"beruf",l:1,q:"Welcher Beruf passt zu jemandem, der sehr gerne mit Tieren arbeitet?",a:["Tierpflegerin oder Tierpfleger","Bäckerin oder Bäcker","Informatikerin oder Informatiker","Buchhalterin oder Buchhalter"],e:"Tierpflegerinnen und Tierpfleger füttern und pflegen Tiere, zum Beispiel im Zoo oder im Tierheim. Viele Berufe passen gut zu dem, was man in der Freizeit gerne macht.",m:"Was du gerne machst, kann dein Beruf werden."},
 {t:"beruf",l:2,q:"Wie ist eine Lehre in der Schweiz aufgebaut?",a:["Man arbeitet im Lehrbetrieb und besucht zusätzlich die Berufsfachschule","Man geht nur in die Schule","Man arbeitet nur, ohne Schule","Man lernt alles allein im Internet"],e:"Die Lehre heisst offiziell berufliche Grundbildung. Du lernst den Beruf im Betrieb, besuchst an einem oder zwei Tagen pro Woche die Berufsfachschule und dazu überbetriebliche Kurse.",m:"Lehre = Betrieb + Schule."},
 {t:"beruf",l:2,q:"Was ist eine Schnupperlehre?",a:["Ein paar Tage in einem Betrieb, um einen Beruf kennenzulernen","Die Abschlussprüfung der Lehre","Ein Parfümkurs","Ein Ferienjob im Sommer"],e:"Beim Schnuppern arbeitest du einige Tage in einem Betrieb mit. So merkst du, ob dir der Beruf gefällt – und der Betrieb lernt dich kennen. Oft ist das der erste Schritt zu einer Lehrstelle.",m:"Schnuppern = Beruf ausprobieren."},
 {t:"beruf",l:2,q:"Was bedeutet die Abkürzung EFZ?",a:["Eidgenössisches Fähigkeitszeugnis","Eidgenössische Freizeitzone","Erste Firmen-Zulassung","Europäisches Fachzertifikat"],e:"Das EFZ erhältst du nach einer drei- oder vierjährigen Lehre. Es zeigt, dass du einen Beruf gelernt hast, und wird in der ganzen Schweiz anerkannt.",m:"EFZ = Abschluss einer 3- bis 4-jährigen Lehre."},
 {t:"beruf",l:3,q:"Was ist eine EBA-Lehre?",a:["Eine zweijährige Grundbildung mit Eidgenössischem Berufsattest, danach ist ein EFZ möglich","Eine Lehre nur für Erwachsene","Eine Lehre ohne Schule","Ein Studium an der Universität"],e:"Die EBA-Lehre dauert zwei Jahre und ist etwas praktischer ausgerichtet. Wer danach weiterlernen möchte, kann oft verkürzt eine EFZ-Lehre im gleichen Berufsfeld anschliessen.",m:"EBA = 2 Jahre, Weg zum EFZ bleibt offen."},
 {t:"beruf",l:3,q:"Was ermöglicht dir die Berufsmaturität?",a:["Ein Studium an einer Fachhochschule, ohne Aufnahmeprüfung","Nichts Zusätzliches","Nur den Autoführerschein","Einen höheren Lohn ab dem ersten Tag"],e:"Die Berufsmaturität kannst du während oder nach der Lehre machen. Damit steht dir die Fachhochschule offen, mit einer Zusatzprüfung (Passerelle) sogar die Universität. Eine Lehre ist also kein Sackgassenweg.",m:"Lehre + BM = Tür zur Fachhochschule."},
 {t:"beruf",l:3,q:"Wo findest du in der Schweiz offizielle Infos zu Berufen und offene Lehrstellen?",a:["Auf berufsberatung.ch und bei der Berufsberatung deines Kantons","Nur in Social-Media-Kommentaren","Nur im Telefonbuch","Nirgends, man muss raten"],e:"Auf berufsberatung.ch findest du Beschreibungen zu allen Lehrberufen und den Lehrstellennachweis. Die kantonale Berufsberatung, oft BIZ genannt, berät dich kostenlos persönlich.",m:"berufsberatung.ch + BIZ im Kanton."},
 // Natur & Tiere
 {t:"tiere",l:1,q:"Welches dieser Tiere ist ein Säugetier?",a:["Delfin","Hai","Pinguin","Frosch"],e:"Der Delfin lebt im Meer, ist aber kein Fisch: Er atmet Luft mit der Lunge, bringt lebende Junge zur Welt und säugt sie mit Milch. Genau das macht ein Säugetier aus.",m:"Säugetiere säugen ihre Jungen mit Milch."},
 {t:"natur",l:1,q:"Was brauchen Pflanzen, um selbst Nahrung herzustellen?",a:["Licht, Wasser und Luft","Nur Erde","Musik","Dunkelheit"],e:"Pflanzen machen mit Sonnenlicht, Wasser und Kohlendioxid aus der Luft Zucker. Das nennt man Photosynthese. Dabei geben sie Sauerstoff ab, den wir atmen.",m:"Photosynthese: Licht + Wasser + CO₂ → Zucker + Sauerstoff."},
 {t:"natur",l:2,q:"Wie viele Planeten gibt es in unserem Sonnensystem?",a:["Acht","Neun","Sieben","Zwölf"],e:"Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus und Neptun. Pluto galt früher als neunter Planet, zählt aber seit 2006 als Zwergplanet.",m:"8 Planeten – Pluto ist ein Zwergplanet."},
 {t:"tiere",l:2,q:"Warum sind Bienen für uns so wichtig?",a:["Sie bestäuben viele Pflanzen, die uns Nahrung liefern","Sie fressen Schädlinge","Sie reinigen das Wasser","Sie machen den Boden weich"],e:"Beim Sammeln tragen Bienen Blütenstaub von Blüte zu Blüte. Erst dadurch entstehen bei vielen Pflanzen Früchte, zum Beispiel Äpfel oder Kirschen.",m:"Bienen bestäuben – ohne sie weniger Früchte."},
 {t:"natur",l:3,q:"Was ist die Hauptursache des heutigen Klimawandels?",a:["Treibhausgase aus menschlichen Tätigkeiten, vor allem durch Verbrennen von Kohle, Öl und Gas","Mehr Sonnenflecken","Vulkanausbrüche","Die Erdrotation wird langsamer"],e:"Beim Verbrennen fossiler Brennstoffe entsteht CO₂. Es wirkt in der Atmosphäre wie eine Decke und hält Wärme zurück. Darum wird es auf der Erde wärmer – in den Alpen sieht man das zum Beispiel am Schmelzen der Gletscher.",m:"Mehr CO₂ → mehr Wärme bleibt auf der Erde."},
 // Wissenschaft & Körper
 {t:"koerper",l:1,q:"Welches Organ pumpt das Blut durch deinen Körper?",a:["Das Herz","Die Lunge","Der Magen","Das Gehirn"],e:"Das Herz ist ein starker Muskel. Es schlägt ohne Pause und pumpt das Blut durch die Adern, damit alle Teile deines Körpers Sauerstoff bekommen.",m:"Herz = Pumpe des Körpers."},
 {t:"wissenschaft",l:2,q:"Warum fällt ein Apfel vom Baum nach unten?",a:["Wegen der Schwerkraft","Wegen des Windes","Weil er zu schwer für die Luft ist","Wegen des Magnetfelds"],e:"Die Erde zieht alle Dinge zu sich hin. Diese Anziehungskraft heisst Schwerkraft. Sie hält auch uns am Boden und den Mond in seiner Bahn.",m:"Schwerkraft zieht alles zur Erde."},
 {t:"wissenschaft",l:2,q:"Bei wie viel Grad Celsius kocht Wasser auf Meereshöhe?",a:["100 °C","50 °C","80 °C","150 °C"],e:"Auf Meereshöhe siedet Wasser bei 100 °C. Auf einem hohen Berg ist der Luftdruck tiefer – dort kocht Wasser schon bei weniger Grad.",m:"Wasser siedet bei 100 °C (auf Meereshöhe)."},
 {t:"koerper",l:3,q:"Wo ist in einer menschlichen Zelle die Erbinformation (DNA) hauptsächlich gespeichert?",a:["Im Zellkern","In der Zellmembran","Im Blutplasma","In den Knochen"],e:"Die DNA ist wie eine Bauanleitung für den Körper. Sie liegt vor allem im Zellkern, gut geschützt. Bei jeder Zellteilung wird sie kopiert.",m:"DNA = Bauanleitung, liegt im Zellkern."},
 // Umgang mit Geld
 {t:"geld",l:1,q:"Wie heisst das Geld in der Schweiz?",a:["Schweizer Franken","Euro","Dollar","Taler"],e:"In der Schweiz bezahlt man mit Schweizer Franken, kurz CHF. Ein Franken hat 100 Rappen.",m:"1 Franken = 100 Rappen."},
 {t:"geld",l:1,q:"Du bekommst jede Woche 5 Franken und wünschst dir ein Spiel für 20 Franken. Was hilft?",a:["Einige Wochen sparen","Alles sofort für Süssigkeiten ausgeben","Das Geld verstecken und vergessen","Nichts, es geht nie"],e:"Wenn du jede Woche dein Taschengeld beiseitelegst, hast du nach vier Wochen 20 Franken zusammen. Sparen heisst: jetzt verzichten, um später etwas Grösseres zu kaufen.",m:"Sparen = heute zurücklegen, später mehr haben."},
 {t:"geld",l:2,q:"Was ist ein Budget?",a:["Ein Plan, wie viel Geld reinkommt und wofür man es ausgibt","Eine Sparbüchse","Ein Kredit von der Bank","Eine Art Steuer"],e:"Im Budget schreibst du auf, wie viel Geld du bekommst und wofür du es ausgeben willst. So siehst du früh, ob das Geld reicht, und bleibst nicht plötzlich ohne da.",m:"Budget = Plan für Einnahmen und Ausgaben."},
 {t:"geld",l:2,q:"Was davon ist ein echtes Bedürfnis und nicht nur ein Wunsch?",a:["Essen","Das neuste Handy","Markenturnschuhe","Ein Videospiel"],e:"Bedürfnisse brauchst du zum Leben, zum Beispiel Essen, Wohnen oder Kleidung. Wünsche sind schön, aber nicht nötig. Wer beides unterscheiden kann, hat sein Geld besser im Griff.",m:"Erst Bedürfnisse, dann Wünsche."},
 {t:"geld",l:3,q:"Was passiert, wenn du die Rechnung deiner Kreditkarte nicht vollständig bezahlst?",a:["Auf den Restbetrag fallen meist hohe Zinsen an","Die Bank schenkt dir den Rest","Nichts, das ist gratis","Die Karte wird automatisch aufgeladen"],e:"Bei Teilzahlung verlangt die Bank Zinsen auf den offenen Betrag, und die sind bei Kreditkarten meist hoch. So können Schulden schnell wachsen. Am besten zahlst du die Rechnung jeden Monat ganz.",m:"Kreditkarte immer ganz bezahlen."},
 {t:"geld",l:3,q:"Was bedeutet es, ein Auto zu leasen?",a:["Man zahlt monatlich für die Nutzung, das Auto gehört einem aber nicht","Man kauft es billiger","Man bekommt es geschenkt","Man teilt es mit Nachbarn"],e:"Beim Leasing mietest du das Auto für einige Jahre und zahlst jeden Monat eine Rate. Dazu kommen Versicherung, Service und oft eine Vollkasko-Pflicht. Am Ende gibst du das Auto zurück, es gehört dir nicht.",m:"Leasing = mieten, nicht besitzen."},
 // Banken
 {t:"banken",l:1,q:"Wo kann man Geld sicher aufbewahren?",a:["Auf einem Konto bei einer Bank","Unter der Matratze","In der Hosentasche","Im Briefkasten"],e:"Auf einem Bankkonto ist dein Geld vor Diebstahl und Feuer geschützt. Du siehst jederzeit, wie viel du hast, und kannst es abheben, wenn du es brauchst.",m:"Bankkonto = sicherer Ort fürs Geld."},
 {t:"banken",l:2,q:"Was sind Zinsen auf einem Sparkonto?",a:["Geld, das dir die Bank dafür bezahlt, dass dein Geld bei ihr liegt","Eine Gebühr für das Konto","Eine Strafe fürs Sparen","Ein Geschenk vom Staat"],e:"Die Bank arbeitet mit deinem Geld, zum Beispiel indem sie Kredite vergibt. Dafür zahlt sie dir einen kleinen Betrag: den Zins. Wie hoch er ist, hängt von der Bank und der Zeit ab.",m:"Zins = Belohnung fürs Sparen."},
 {t:"banken",l:2,q:"Was ist der Unterschied zwischen einer Debitkarte und einer Kreditkarte?",a:["Die Debitkarte zieht direkt vom Konto ab, die Kreditkarte rechnet später ab","Es gibt keinen","Mit der Debitkarte bekommt man Kredit","Die Kreditkarte ist nur für Kinder"],e:"Mit der Debitkarte wird der Betrag sofort von deinem Konto abgebucht – du gibst nur aus, was da ist. Bei der Kreditkarte bekommst du am Monatsende eine Rechnung. Das ist praktisch, aber man verliert leichter den Überblick.",m:"Debit = sofort. Kredit = später."},
 {t:"banken",l:3,q:"Du bekommst eine E-Mail «von deiner Bank», die dein Passwort verlangt. Was tust du?",a:["Nicht antworten, keinen Link öffnen, die Bank direkt kontaktieren","Das Passwort schnell eingeben","Die E-Mail an Freunde weiterleiten","Den Anhang öffnen, um nachzusehen"],e:"Das ist fast sicher Phishing: Betrüger geben sich als Bank aus, um an deine Daten zu kommen. Eine seriöse Bank fragt nie per E-Mail oder SMS nach deinem Passwort.",m:"Banken fragen nie per Mail nach dem Passwort."},
 {t:"banken",l:3,q:"Womit beginnt eine Schweizer IBAN?",a:["Mit CH","Mit SF","Mit SW","Mit einer Null"],e:"Die IBAN ist deine internationale Kontonummer. Schweizer IBANs beginnen mit dem Ländercode CH. Damit können andere dir Geld überweisen.",m:"Schweizer IBAN = CH…"},
 // Steuern
 {t:"steuern",l:1,q:"Wofür braucht der Staat Steuern?",a:["Für Schulen, Strassen, Spitäler und vieles mehr","Nur für Politiker","Für Geschenke an Banken","Gar nicht"],e:"Mit Steuern bezahlen wir gemeinsam Dinge, die alle brauchen: Schulhäuser, Lehrpersonen, Strassen, Polizei, Feuerwehr und vieles mehr.",m:"Steuern = gemeinsames Geld für alle."},
 {t:"steuern",l:2,q:"Welche drei Ebenen erheben in der Schweiz Steuern?",a:["Bund, Kanton und Gemeinde","Stadt, Land und Fluss","Europa, Schweiz und Kanton","Schule, Firma und Familie"],e:"In der Schweiz zahlst du Steuern an den Bund, an deinen Kanton und an deine Gemeinde. Deshalb zahlt man je nach Wohnort unterschiedlich viel.",m:"Bund – Kanton – Gemeinde."},
 {t:"steuern",l:2,q:"Was ist die Mehrwertsteuer?",a:["Eine Steuer, die im Preis vieler Waren und Dienstleistungen enthalten ist","Eine Steuer nur für Firmen","Eine Steuer auf das Taschengeld","Ein Rabatt beim Einkaufen"],e:"Die Mehrwertsteuer (MWST) zahlst du bei fast jedem Einkauf mit, auch ohne es zu merken. Sie steht oft klein auf dem Kassenzettel. Für Lebensmittel gilt ein tieferer Satz als für die meisten anderen Dinge.",m:"MWST steckt im Preis."},
 {t:"steuern",l:3,q:"Was macht man mit der Steuererklärung?",a:["Man gibt jedes Jahr Einkommen und Vermögen an, damit die Steuern berechnet werden","Man beantragt Geld vom Staat","Man meldet ein Auto an","Man kündigt die Krankenkasse"],e:"Wer volljährig ist oder eigenes Einkommen hat, füllt in der Schweiz meist jedes Jahr eine Steuererklärung aus. Darin stehen Einkommen, Vermögen und erlaubte Abzüge. Daraus berechnet das Steueramt die Steuer.",m:"Steuererklärung = jährliche Angaben ans Steueramt."},
 {t:"steuern",l:3,q:"Warum zahlt man nicht in jedem Kanton gleich viel Steuern?",a:["Kantone und Gemeinden legen ihre Steuern teilweise selbst fest","Weil jeder Kanton eine andere Währung hat","Weil der Bund es verbietet","Das stimmt nicht, es ist überall gleich"],e:"Die Schweiz ist föderalistisch: Kantone und Gemeinden bestimmen einen Teil der Steuern selbst, zum Beispiel über den Steuerfuss. Darum lohnt sich ein Vergleich beim Umzug.",m:"Föderalismus: Steuern je nach Wohnort verschieden."},
 {t:"steuern",l:3,q:"Was ist die Säule 3a?",a:["Freiwilliges Sparen fürs Alter, das man vom steuerbaren Einkommen abziehen kann","Eine Steuer auf Mieten","Die obligatorische AHV","Ein Bankkonto nur für Kinder"],e:"Die Schweizer Altersvorsorge hat drei Säulen. Die Säule 3a ist freiwillig: Wer arbeitet, kann jedes Jahr bis zu einem Höchstbetrag einzahlen und diesen Betrag bei den Steuern abziehen.",m:"3a = freiwillig vorsorgen und Steuern sparen."},
 // Krankenkasse
 {t:"krankenkasse",l:1,q:"Wofür gibt es eine Krankenkasse?",a:["Sie hilft, Kosten für Arzt, Spital und Medikamente zu bezahlen","Sie verkauft Medikamente","Sie macht Schulreisen","Sie gibt Taschengeld"],e:"Wer krank wird, braucht manchmal teure Behandlungen. Viele Menschen zahlen jeden Monat etwas in die Krankenkasse ein. Damit werden die Kosten für die bezahlt, die Hilfe brauchen.",m:"Krankenkasse = alle zahlen ein, wer krank ist, bekommt Hilfe."},
 {t:"krankenkasse",l:2,q:"Muss man in der Schweiz eine Grundversicherung bei einer Krankenkasse haben?",a:["Ja, sie ist für alle in der Schweiz Wohnenden obligatorisch","Nein, sie ist freiwillig","Nur Erwachsene über 30","Nur wer oft krank ist"],e:"Die Grundversicherung ist Pflicht für alle, die in der Schweiz wohnen – auch für Kinder. Jede Krankenkasse muss dich dafür aufnehmen, und die Leistungen sind überall gleich.",m:"Grundversicherung = Pflicht für alle."},
 {t:"krankenkasse",l:2,q:"Was ist die Prämie?",a:["Der Betrag, den man jeden Monat der Krankenkasse bezahlt","Eine Belohnung für Gesundheit","Das Geld für den Arztbesuch","Ein Geschenk der Krankenkasse"],e:"Die Prämie zahlst du regelmässig, egal ob du krank bist oder nicht. Wie hoch sie ist, hängt von Krankenkasse, Wohnort, Alter und deinem Versicherungsmodell ab.",m:"Prämie = monatliche Zahlung."},
 {t:"krankenkasse",l:3,q:"Was ist die Franchise?",a:["Der Betrag, den man pro Jahr selbst zahlt, bevor die Krankenkasse Kosten übernimmt","Die monatliche Prämie","Eine Zusatzversicherung","Ein Rabatt für Gesunde"],e:"Mit der Franchise zahlst du die ersten Kosten eines Jahres selbst. Wählst du eine höhere Franchise, wird die Prämie günstiger – dafür zahlst du mehr, wenn du krank wirst.",m:"Hohe Franchise = tiefere Prämie, aber mehr Risiko."},
 {t:"krankenkasse",l:3,q:"Was ist der Selbstbehalt?",a:["Ein Anteil der Kosten, den man nach der Franchise noch selbst trägt, bis zu einem Jahresmaximum","Das Gleiche wie die Prämie","Ein Bonus der Krankenkasse","Die Kosten für Zahnarztbesuche"],e:"Nach der Franchise zahlst du meist noch 10 Prozent der Kosten selbst. Das ist der Selbstbehalt. Er ist pro Jahr begrenzt, danach übernimmt die Krankenkasse den Rest.",m:"Erst Franchise, dann Selbstbehalt."},
 {t:"krankenkasse",l:3,q:"Was stimmt für Zusatzversicherungen?",a:["Sie sind freiwillig, und die Krankenkasse darf einen Antrag ablehnen","Sie sind Pflicht","Sie kosten nichts","Sie ersetzen die Grundversicherung"],e:"Zusatzversicherungen decken Extras ab, zum Beispiel ein Einzelzimmer im Spital. Anders als bei der Grundversicherung kann die Kasse Gesundheitsfragen stellen und Anträge ablehnen.",m:"Grund = Pflicht. Zusatz = freiwillig."},
 // Alltag
 {t:"alltag",l:1,q:"Welche Nummer rufst du in der Schweiz für die Feuerwehr an?",a:["118","117","144","1818"],e:"In der Schweiz gibt es drei wichtige Notrufnummern: 117 für die Polizei, 118 für die Feuerwehr und 144 für die Sanität. Die 112 funktioniert zusätzlich überall in Europa.",m:"117 Polizei, 118 Feuerwehr, 144 Sanität."},
 {t:"alltag",l:1,q:"Was machst du, wenn die Fussgängerampel rot zeigt?",a:["Stehen bleiben und warten","Schnell rennen","Nur schauen und gehen","Die Augen schliessen"],e:"Rot heisst stehen bleiben. Erst bei Grün darfst du gehen – und auch dann kurz links und rechts schauen, ob alle Autos wirklich anhalten.",m:"Rot = stehen, Grün = schauen und gehen."},
 {t:"alltag",l:2,q:"Welches Passwort ist am sichersten?",a:["Ein langer Satz mit Zahlen und Zeichen, den nur du kennst","Dein Name","123456","Dein Geburtsdatum"],e:"Lange Passwörter sind schwer zu erraten. Ein ganzer Satz wie «Mein Hund frisst 3 Rüebli!» ist gut zu merken und schwer zu knacken. Verwende nie dasselbe Passwort überall.",m:"Lang, einzigartig, geheim."},
 {t:"alltag",l:3,q:"Wie hoch darf eine Mietkaution in der Schweiz für eine Wohnung höchstens sein?",a:["Drei Monatsmieten","Eine Jahresmiete","Zehn Monatsmieten","Es gibt keine Grenze"],e:"Das Gesetz erlaubt bei Wohnungen höchstens drei Monatsmieten als Kaution. Sie muss auf ein Sperrkonto auf den Namen der Mieterin oder des Mieters – beim Auszug bekommst du sie zurück, wenn alles in Ordnung ist.",m:"Kaution: max. 3 Monatsmieten, auf Sperrkonto."}
