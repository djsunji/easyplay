const FRAGEN3 = [
 // ===== Vom Urknall zur Steinzeit =====
 {t:"g_urzeit",l:1,s:"Dinosaurier",q:"Welche Tiere lebten vor Millionen Jahren und sind heute ausgestorben?",a:["Die Dinosaurier","Die Hauskatzen","Die Kühe","Die Tauben"],e:"Dinosaurier beherrschten über 150 Millionen Jahre lang die Erde. Wir kennen sie heute durch Fossilien, also versteinerte Knochen und Spuren. Die Vögel stammen übrigens von Dinosauriern ab.",m:"Dinosaurier sind ausgestorben – ihre Nachfahren sind die Vögel."},
 {t:"g_urzeit",l:1,s:"Höhlenmalerei",q:"Wo malten Menschen in der Steinzeit Bilder von Tieren?",a:["An Höhlenwände","Auf Papier","Auf Leinwände im Museum","Auf Handys"],e:"Vor Zehntausenden Jahren malten Menschen Pferde, Bisons und Hirsche an Höhlenwände. Dafür nutzten sie Farben aus Erde, Kohle und Pflanzen. Diese Bilder sind die ältesten Kunstwerke der Menschheit.",m:"Steinzeit-Kunst = Höhlenmalerei."},
 {t:"g_urzeit",l:1,s:"Feuerstein",q:"Womit konnten Steinzeitmenschen Feuer machen?",a:["Mit Feuerstein, Schwefelkies und trockenem Zunder","Mit Streichhölzern","Mit einem Feuerzeug","Mit Strom"],e:"Schlägt man Feuerstein gegen ein eisenhaltiges Gestein, entstehen Funken. Fallen sie auf trockenen Zunder, beginnt er zu glimmen. Feuer gab Wärme, Licht und Schutz und machte das Kochen möglich.",m:"Funken + Zunder = Feuer."},
 {t:"g_urzeit",l:2,s:"Urknall",q:"Wie alt ist das Universum nach heutigem Wissen ungefähr?",a:["Rund 13,8 Milliarden Jahre","Rund 6000 Jahre","Rund 1 Million Jahre","Es war schon immer da"],e:"Forschende berechnen aus Beobachtungen, dass das Universum vor etwa 13,8 Milliarden Jahren mit dem Urknall begann. Seither dehnt es sich aus.",m:"Universum: ca. 13,8 Milliarden Jahre alt."},
 {t:"g_urzeit",l:2,s:"Erde",q:"Wie alt ist die Erde ungefähr?",a:["Rund 4,6 Milliarden Jahre","Rund 2000 Jahre","Rund 100 Millionen Jahre","Rund 50 Milliarden Jahre"],e:"Die Erde entstand vor etwa 4,6 Milliarden Jahren aus Staub und Gestein, das um die junge Sonne kreiste. Menschen gibt es erst seit einem winzigen Bruchteil dieser Zeit.",m:"Erde: ca. 4,6 Milliarden Jahre alt."},
 {t:"g_urzeit",l:2,s:"Kreide-Paläogen-Grenze",q:"Was war nach heutigem Wissen der Hauptgrund für das Aussterben der Dinosaurier vor etwa 66 Millionen Jahren?",a:["Der Einschlag eines riesigen Asteroiden","Eine Eiszeit durch den Menschen","Sie wurden alle von Säbelzahntigern gefressen","Sie wanderten ins Weltall aus"],e:"Ein Asteroid von etwa zehn Kilometern Durchmesser schlug im heutigen Mexiko ein. Staub verdunkelte den Himmel, das Klima änderte sich stark, und viele Tierarten starben aus. Menschen gab es damals noch lange nicht.",m:"Asteroid vor 66 Mio. Jahren → Ende der Dinosaurier."},
 {t:"g_urzeit",l:2,s:"Ötzi",q:"Wie heisst der Mann aus der Steinzeit, der 1991 im Eis der Ötztaler Alpen gefunden wurde?",a:["Ötzi","Heidi","Tell","Ötzli"],e:"Ötzi lebte vor über 5000 Jahren. Weil er im Gletschereis lag, blieben Körper, Kleidung und Werkzeuge erstaunlich gut erhalten. So weiss man viel über das Leben in der Jungsteinzeit.",m:"Ötzi = Gletschermumie, über 5000 Jahre alt."},
 {t:"g_urzeit",l:3,s:"Urknall",q:"Was beschreibt die Urknall-Theorie?",a:["Dass sich das Universum aus einem extrem heissen, dichten Zustand ausgedehnt hat","Dass die Erde durch eine Explosion eines Vulkans entstand","Dass Sterne aus der Erde herauswachsen","Dass das Universum immer kleiner wird"],e:"Nach der Urknall-Theorie war alles Material des Universums am Anfang unvorstellbar heiss und dicht. Seither dehnt es sich aus und kühlt ab. Wichtige Hinweise darauf sind die Flucht der Galaxien und die kosmische Hintergrundstrahlung.",m:"Urknall = Beginn der Ausdehnung des Universums."},
 {t:"g_urzeit",l:3,s:"Homo sapiens",q:"Auf welchem Kontinent entstand nach heutigem Wissen der moderne Mensch (Homo sapiens)?",a:["In Afrika","In Europa","In Australien","In Südamerika"],e:"Die ältesten Funde des Homo sapiens stammen aus Afrika und sind rund 300'000 Jahre alt. Von dort breiteten sich die Menschen später über die ganze Welt aus.",m:"Wiege der Menschheit: Afrika."},
 {t:"g_urzeit",l:3,s:"Neolithische Revolution",q:"Was veränderte sich in der Jungsteinzeit grundlegend?",a:["Die Menschen wurden sesshaft und betrieben Ackerbau und Viehzucht","Die Menschen erfanden das Auto","Die Menschen zogen in Städte mit Hochhäusern","Die Menschen hörten auf, Werkzeuge zu benutzen"],e:"Statt nur zu jagen und zu sammeln, pflanzten die Menschen Getreide an und hielten Tiere. Sie bauten feste Häuser und Dörfer. Diese Veränderung nennt man Neolithische Revolution.",m:"Jungsteinzeit: sesshaft, Ackerbau, Viehzucht."},
 {t:"g_urzeit",l:3,s:"Prähistorische Pfahlbauten um die Alpen",q:"Was sind die Pfahlbauten, die man an vielen Schweizer Seen gefunden hat?",a:["Reste von Dörfern aus der Stein- und Bronzezeit, heute UNESCO-Welterbe","Moderne Ferienhäuser","Römische Tempel","Mittelalterliche Burgen"],e:"An Seeufern und in Mooren blieben Holzpfähle, Werkzeuge und sogar Essensreste Tausende Jahre erhalten. Die Pfahlbauten rund um die Alpen sind seit 2011 UNESCO-Welterbe – viele davon liegen in der Schweiz.",m:"Pfahlbauten = Dörfer der Urzeit an Seen."},
 {t:"g_urzeit",l:3,s:"Evolution",q:"Wie sahen die ersten Lebewesen auf der Erde aus?",a:["Winzige Einzeller im Wasser","Grosse Dinosaurier","Affen","Bäume"],e:"Die ersten Lebewesen entstanden vor über 3,5 Milliarden Jahren im Wasser und bestanden aus nur einer Zelle. Aus ihnen entwickelten sich über sehr lange Zeit alle Pflanzen und Tiere.",m:"Leben begann mit Einzellern im Wasser."},
 // ===== Antike =====
 {t:"g_antike",l:1,s:"Pharao",q:"Wie nannte man die Könige im alten Ägypten?",a:["Pharaonen","Kaiser","Ritter","Häuptlinge"],e:"Die Pharaonen regierten das alte Ägypten und wurden wie Götter verehrt. Einer der bekanntesten ist Tutanchamun, dessen Grab voller Schätze 1922 entdeckt wurde.",m:"Ägyptische Könige = Pharaonen."},
 {t:"g_antike",l:1,s:"Olympische Spiele der Antike",q:"Woher stammen die Olympischen Spiele ursprünglich?",a:["Aus dem alten Griechenland","Aus der Schweiz","Aus Amerika","Aus China"],e:"Die ersten Olympischen Spiele fanden vor rund 2800 Jahren in Olympia in Griechenland statt, zu Ehren des Gottes Zeus. Die modernen Spiele gibt es seit 1896.",m:"Olympia liegt in Griechenland."},
 {t:"g_antike",l:2,s:"Hieroglyphen",q:"Wie heisst die Bilderschrift der alten Ägypter?",a:["Hieroglyphen","Runen","Keilschrift der Römer","Emojis"],e:"Hieroglyphen bestehen aus kleinen Bildern für Laute und Wörter. Lange konnte niemand sie lesen. Erst mit dem Stein von Rosetta wurden sie im 19. Jahrhundert entschlüsselt.",m:"Ägyptische Schrift = Hieroglyphen."},
 {t:"g_antike",l:2,s:"Aquädukt",q:"Was bauten die Römer, um Wasser in ihre Städte zu leiten?",a:["Aquädukte","Staudämme aus Beton","Wasserleitungen aus Plastik","Pumpwerke mit Strom"],e:"Aquädukte waren Wasserleitungen mit leichtem Gefälle, oft über hohe Bogenbrücken. So floss frisches Wasser über viele Kilometer zu Brunnen und Bädern.",m:"Römer = Aquädukte."},
 {t:"g_antike",l:2,s:"Attische Demokratie",q:"In welcher Stadt der Antike entstand eine frühe Form der Demokratie?",a:["Athen","Rom","Kairo","Babylon"],e:"Im alten Athen durften freie Männer in der Volksversammlung mitentscheiden. Frauen, Sklaven und Fremde waren aber ausgeschlossen. Das Wort Demokratie bedeutet «Herrschaft des Volkes».",m:"Demokratie begann in Athen."},
 {t:"g_antike",l:2,s:"Pompeji",q:"Welcher Vulkan begrub im Jahr 79 die römische Stadt Pompeji?",a:["Der Vesuv","Der Ätna","Der Stromboli","Der Fuji"],e:"Beim Ausbruch des Vesuvs wurde Pompeji unter Asche begraben. Dadurch blieb die Stadt erhalten – heute kann man dort Strassen, Häuser und Wandbilder besichtigen.",m:"Vesuv verschüttete Pompeji."},
 {t:"g_antike",l:3,s:"Gaius Iulius Caesar",q:"Wer war Julius Cäsar?",a:["Ein römischer Feldherr und Politiker, der 44 v. Chr. ermordet wurde","Ein griechischer Philosoph","Ein ägyptischer Pharao","Ein Ritter im Mittelalter"],e:"Cäsar eroberte Gallien und wurde zum mächtigsten Mann Roms. Weil viele fürchteten, er wolle König werden, wurde er an den Iden des März 44 v. Chr. ermordet.",m:"Cäsar: Feldherr, 44 v. Chr. ermordet."},
 {t:"g_antike",l:3,s:"Helvetier",q:"Welches keltische Volk lebte im Gebiet der heutigen Schweiz und wurde 58 v. Chr. von Cäsar besiegt?",a:["Die Helvetier","Die Wikinger","Die Hunnen","Die Azteken"],e:"Die Helvetier wollten nach Gallien auswandern, wurden aber von Cäsar bei Bibracte besiegt und mussten zurückkehren. Von ihrem Namen kommt «Helvetia» und das «CH» für Confoederatio Helvetica.",m:"Helvetier → Helvetia → CH."},
 {t:"g_antike",l:3,s:"Weströmisches Reich",q:"Wann endete das Weströmische Reich nach üblicher Zählung?",a:["476 n. Chr.","44 v. Chr.","1492","1291"],e:"476 wurde der letzte weströmische Kaiser abgesetzt. Das gilt als Ende der Antike im Westen. Das Oströmische Reich mit Hauptstadt Konstantinopel bestand noch fast 1000 Jahre weiter.",m:"476: Ende Westroms."},
 {t:"g_antike",l:3,s:"Antike Philosophie",q:"Was verbindet Sokrates, Platon und Aristoteles?",a:["Sie waren berühmte Philosophen im antiken Griechenland","Sie waren römische Kaiser","Sie waren ägyptische Baumeister","Sie waren Olympiasieger"],e:"Die drei Denker lebten vor etwa 2400 Jahren in Griechenland. Sie fragten zum Beispiel, was Gerechtigkeit ist und wie man gut lebt. Ihre Ideen prägen das Denken bis heute.",m:"Sokrates, Platon, Aristoteles = griechische Philosophen."},
 // ===== Mittelalter & Entdeckungen =====
 {t:"g_mittelalter",l:1,s:"Kloster",q:"Wer lebte im Mittelalter in einem Kloster?",a:["Mönche und Nonnen","Ritter und Könige","Piraten","Bauarbeiter"],e:"In Klöstern lebten Mönche oder Nonnen nach festen Regeln. Sie beteten, arbeiteten und schrieben Bücher von Hand ab. So bewahrten sie viel Wissen.",m:"Kloster = Mönche und Nonnen."},
 {t:"g_mittelalter",l:2,s:"Schwarzer Tod",q:"Welche Krankheit tötete um 1350 einen grossen Teil der Menschen in Europa?",a:["Die Pest","Die Grippe","Die Masern","Der Schnupfen"],e:"Die Pest, auch Schwarzer Tod genannt, wurde durch Bakterien übertragen, oft über Flöhe von Ratten. Schätzungen zufolge starb etwa ein Drittel der Bevölkerung Europas.",m:"Um 1350: Pest in Europa."},
 {t:"g_mittelalter",l:2,s:"Karl der Große",q:"Welcher Frankenkönig wurde im Jahr 800 zum Kaiser gekrönt?",a:["Karl der Grosse","Julius Cäsar","Napoleon","Wilhelm Tell"],e:"Karl der Grosse herrschte über ein riesiges Reich, zu dem auch Teile der heutigen Schweiz gehörten. Er förderte Schulen und Klöster. Der Sage nach gründete er das Grossmünster in Zürich.",m:"Jahr 800: Karl der Grosse wird Kaiser."},
 {t:"g_mittelalter",l:2,s:"Ferdinand Magellan",q:"Wessen Expedition umsegelte als erste die ganze Welt?",a:["Die Expedition von Ferdinand Magellan","Die von Christoph Kolumbus","Die der Wikinger","Die von Marco Polo"],e:"Magellan brach 1519 mit fünf Schiffen auf. Er selbst starb unterwegs, aber ein Schiff kam 1522 unter Juan Sebastián Elcano zurück. Damit war bewiesen, dass man die Erde umrunden kann.",m:"1519–1522: erste Weltumsegelung."},
 {t:"g_mittelalter",l:3,s:"Hanse",q:"Was war die Hanse?",a:["Ein Bund von Kaufleuten und Handelsstädten in Nordeuropa","Ein Ritterorden","Eine Krankheit","Ein Königreich in Spanien"],e:"Die Hanse verband im Mittelalter Städte wie Lübeck, Hamburg und Bergen. Gemeinsam schützten sie ihren Handel über Nord- und Ostsee und wurden sehr reich.",m:"Hanse = Handelsbund im Norden."},
 {t:"g_mittelalter",l:3,s:"Kreuzzug",q:"Was waren die Kreuzzüge?",a:["Religiös begründete Kriegszüge christlicher Heere, vor allem ins Heilige Land","Friedliche Pilgerwanderungen in die Schweiz","Handelsreisen nach China","Entdeckungsfahrten nach Amerika"],e:"Ab 1096 zogen christliche Heere Richtung Jerusalem, um das «Heilige Land» zu erobern. Die Kreuzzüge brachten viel Leid, aber auch Kontakt mit der arabischen Welt und ihrem Wissen.",m:"Kreuzzüge: ab 1096 ins Heilige Land."},
 {t:"g_mittelalter",l:3,s:"Renaissance",q:"Welcher Künstler der Renaissance malte die Mona Lisa?",a:["Leonardo da Vinci","Pablo Picasso","Vincent van Gogh","Albrecht Dürer"],e:"Leonardo da Vinci war Maler, Erfinder und Forscher. In der Renaissance ab dem 15. Jahrhundert besannen sich Künstler und Gelehrte neu auf die Antike und stellten den Menschen in den Mittelpunkt.",m:"Mona Lisa = Leonardo da Vinci."},
 {t:"g_mittelalter",l:3,s:"Nikolaus Kopernikus",q:"Welches neue Weltbild beschrieb Nikolaus Kopernikus?",a:["Die Sonne steht im Zentrum, und die Erde kreist um sie","Die Erde ist eine Scheibe","Die Sonne kreist um die Erde","Die Sterne sind Löcher im Himmel"],e:"Früher glaubte man, die Erde stehe im Mittelpunkt. Kopernikus zeigte 1543, dass sich die Planeten mit Hilfe eines sonnenzentrierten Modells besser erklären lassen. Das veränderte das Denken grundlegend.",m:"Kopernikus: Sonne im Zentrum."},
 // ===== Neuzeit bis heute =====
 {t:"g_neuzeit",l:1,s:"Smartphone",q:"Was gab es vor 100 Jahren noch nicht?",a:["Smartphones","Brot","Häuser","Pferde"],e:"Smartphones gibt es erst seit etwa 20 Jahren. Vor 100 Jahren hatten viele Familien noch nicht einmal ein Telefon zu Hause.",m:"Smartphones sind sehr neu."},
 {t:"g_neuzeit",l:2,s:"Französische Revolution",q:"In welchem Jahr begann die Französische Revolution?",a:["1789","1492","1914","1848"],e:"1789 stürmten Menschen in Paris die Bastille, ein Gefängnis. Die Revolution forderte Freiheit, Gleichheit und Brüderlichkeit und veränderte ganz Europa, auch die Schweiz.",m:"1789: Französische Revolution."},
 {t:"g_neuzeit",l:2,s:"Erster Weltkrieg",q:"In welchem Jahr begann der Erste Weltkrieg?",a:["1914","1939","1789","1968"],e:"Der Erste Weltkrieg dauerte von 1914 bis 1918. Neue Waffen machten ihn besonders zerstörerisch. Die Schweiz blieb neutral, litt aber unter Hunger und Not.",m:"Erster Weltkrieg: 1914–1918."},
 {t:"g_neuzeit",l:2,s:"Vereinte Nationen",q:"Welche Organisation wurde 1945 gegründet, um den Frieden in der Welt zu sichern?",a:["Die UNO (Vereinte Nationen)","Die FIFA","Die EU","Die NATO"],e:"Nach dem Zweiten Weltkrieg gründeten 51 Staaten die Vereinten Nationen. Heute sind fast alle Länder der Welt Mitglied. Ein wichtiger Sitz der UNO ist Genf.",m:"1945: Gründung der UNO."},
 {t:"g_neuzeit",l:3,s:"Unabhängigkeitserklärung der Vereinigten Staaten",q:"Wann erklärten die USA ihre Unabhängigkeit von Grossbritannien?",a:["1776","1492","1848","1918"],e:"Am 4. Juli 1776 erklärten 13 amerikanische Kolonien ihre Unabhängigkeit. Darum ist der 4. Juli in den USA Nationalfeiertag.",m:"4. Juli 1776: Unabhängigkeit der USA."},
 {t:"g_neuzeit",l:3,s:"Kalter Krieg",q:"Was war der Kalte Krieg?",a:["Ein jahrzehntelanger Konflikt zwischen den USA und der Sowjetunion ohne direkten Krieg zwischen beiden","Ein Krieg in der Arktis","Ein Krieg im Winter 1914","Ein Streit zwischen zwei Kantonen"],e:"Nach 1945 standen sich der Westen unter Führung der USA und der Osten unter der Sowjetunion gegenüber. Sie rüsteten auf, kämpften aber nicht direkt gegeneinander. Mit dem Fall der Berliner Mauer ging der Kalte Krieg zu Ende.",m:"Kalter Krieg: USA gegen Sowjetunion, 1947–1991."},
 {t:"g_neuzeit",l:3,s:"World Wide Web",q:"Wo wurde das World Wide Web erfunden?",a:["Am CERN bei Genf","Im Silicon Valley","In Tokio","An der Universität Oxford"],e:"Der britische Forscher Tim Berners-Lee entwickelte das Web 1989 am CERN, dem Forschungszentrum bei Genf. Es sollte Forschenden helfen, Informationen auszutauschen – heute nutzt es fast die ganze Welt.",m:"Das Web entstand 1989 am CERN."},
 {t:"g_neuzeit",l:3,s:"Martin Luther King",q:"Wofür kämpfte Martin Luther King in den USA?",a:["Für gleiche Rechte für Schwarze – gewaltfrei","Für die Unabhängigkeit der USA","Für die Mondlandung","Für die Reformation"],e:"Martin Luther King setzte sich in den 1950er- und 1960er-Jahren gewaltfrei gegen Rassentrennung ein. Seine Rede «I have a dream» ist weltberühmt. 1964 erhielt er den Friedensnobelpreis.",m:"MLK: gewaltfrei für Gleichberechtigung."},
 {t:"g_neuzeit",l:3,s:"Nelson Mandela",q:"Wer war Nelson Mandela?",a:["Ein Kämpfer gegen die Apartheid und später erster schwarzer Präsident Südafrikas","Ein amerikanischer Astronaut","Ein Schweizer Bundesrat","Ein römischer Kaiser"],e:"Mandela war 27 Jahre im Gefängnis, weil er gegen die Rassentrennung in Südafrika kämpfte. 1994 wurde er zum Präsidenten gewählt und setzte sich für Versöhnung ein.",m:"Mandela: gegen Apartheid, Präsident 1994."},
 // ===== Schweizer Geschichte allgemein =====
 {t:"ch_geschichte",l:1,s:"Urkantone",q:"Welche drei Orte gelten als Gründer der Eidgenossenschaft?",a:["Uri, Schwyz und Unterwalden","Zürich, Bern und Basel","Genf, Waadt und Wallis","Tessin, Graubünden und Glarus"],e:"Die drei «Urkantone» schlossen sich laut Überlieferung 1291 zusammen, um sich gegenseitig zu helfen. Unterwalden ist heute in Obwalden und Nidwalden geteilt.",m:"Urkantone: Uri, Schwyz, Unterwalden."},
 {t:"ch_geschichte",l:1,s:"Rütlischwur",q:"Auf welcher Wiese am Vierwaldstättersee soll der Rütlischwur stattgefunden haben?",a:["Auf dem Rütli","Auf dem Bundesplatz","Auf dem Gotthard","Auf der Rigi"],e:"Laut der Sage schworen sich Vertreter der Urkantone auf dem Rütli ewige Treue. Die Wiese ist heute ein Symbol der Schweiz, und am 1. August finden dort Feiern statt.",m:"Rütli = Symbolort der Eidgenossenschaft."},
 {t:"ch_geschichte",l:2,s:"Schlacht am Morgarten",q:"Welche Schlacht gewannen die Eidgenossen 1315 gegen ein habsburgisches Heer?",a:["Die Schlacht am Morgarten","Die Schlacht bei Marignano","Die Schlacht bei Waterloo","Die Schlacht bei Hastings"],e:"Am Morgarten überraschten Schwyzer ein habsburgisches Ritterheer an einem engen Weg zwischen Berg und See. Der Sieg stärkte den Bund der Eidgenossen.",m:"1315: Sieg am Morgarten."},
 {t:"ch_geschichte",l:2,s:"Helvetische Republik",q:"Was geschah 1798 mit der Alten Eidgenossenschaft?",a:["Französische Truppen marschierten ein, und die Helvetische Republik wurde ausgerufen","Sie trat der EU bei","Sie wurde ein Königreich","Sie gewann die Fussball-WM"],e:"1798 besetzte das revolutionäre Frankreich die Schweiz. Die alte Ordnung mit Untertanengebieten wurde abgeschafft und ein Einheitsstaat, die Helvetische Republik, gegründet. Sie hielt nur wenige Jahre.",m:"1798: Helvetische Republik."},
 {t:"ch_geschichte",l:2,s:"Neutralität der Schweiz",q:"Wann wurde die Neutralität der Schweiz von den europäischen Grossmächten anerkannt?",a:["1815 im Rahmen des Wiener Kongresses","1291","1971","2002"],e:"Nach dem Ende der Napoleonischen Kriege anerkannten die Grossmächte 1815 die dauernde Neutralität der Schweiz. Auch die heutigen Grenzen stammen weitgehend aus dieser Zeit.",m:"1815: Neutralität anerkannt."},
 {t:"ch_geschichte",l:3,s:"Landesstreik",q:"Was war der Landesstreik von 1918?",a:["Ein landesweiter Generalstreik von Arbeiterinnen und Arbeitern für bessere Lebensbedingungen","Ein Streik der Bauern gegen Kühe","Ein Streik der Banken","Ein Krieg gegen Frankreich"],e:"Im November 1918 legten rund 250'000 Menschen die Arbeit nieder. Sie forderten unter anderem die 48-Stunden-Woche, eine Altersversicherung und das Frauenstimmrecht. Der Streik wurde vom Militär beendet, doch viele Forderungen wurden später umgesetzt.",m:"1918: Landesstreik – viele Forderungen später erfüllt."},
 {t:"ch_geschichte",l:3,s:"Henri Guisan",q:"Wer war General Henri Guisan?",a:["Der Oberbefehlshaber der Schweizer Armee im Zweiten Weltkrieg","Der erste Bundespräsident","Der Gründer des Roten Kreuzes","Ein Reformator in Genf"],e:"Henri Guisan führte die Armee von 1939 bis 1945. Bekannt ist sein «Rütlirapport» 1940, bei dem er den Widerstandswillen der Schweiz betonte. Dazu gehörte der Plan, sich im Alpen-Réduit zu verteidigen.",m:"Guisan: General im Zweiten Weltkrieg."},
 {t:"ch_geschichte",l:3,s:"Réduit",q:"Was war das Réduit im Zweiten Weltkrieg?",a:["Ein Verteidigungsplan, bei dem sich die Armee in die Alpen zurückziehen sollte","Ein Luxushotel","Ein Friedensvertrag","Eine Bank"],e:"Bei einem Angriff sollte die Armee das Mittelland nur verzögern und sich in eine stark befestigte Alpenfestung zurückziehen. So sollte ein Angriff auf die Schweiz möglichst teuer werden.",m:"Réduit = Alpenfestung."},
 {t:"ch_geschichte",l:3,s:"Schweiz in den Vereinten Nationen",q:"In welchem Jahr trat die Schweiz der UNO bei?",a:["2002","1945","1971","1848"],e:"Obwohl Genf seit Langem ein wichtiger UNO-Standort ist, wurde die Schweiz erst 2002 nach einer Volksabstimmung Mitglied. Sie war eines der letzten Länder, die beitraten.",m:"UNO-Beitritt: 2002."},
 {t:"ch_geschichte",l:3,s:"Gotthard-Basistunnel",q:"In welchem Jahr wurde der Gotthard-Basistunnel eröffnet, der längste Eisenbahntunnel der Welt?",a:["2016","1882","1980","2030"],e:"Der Gotthard-Basistunnel ist rund 57 Kilometer lang und wurde 2016 eröffnet. Güter und Personen können seither schneller und flacher durch die Alpen reisen. Der erste Gotthard-Eisenbahntunnel stammt von 1882.",m:"Gotthard-Basistunnel: 2016, 57 km."},
 // ===== Kantone =====
 {t:"kt_ZH",l:1,s:"Sechseläuten",q:"Welcher Schneemann wird am Zürcher Sechseläuten verbrannt?",a:["Der Böögg","Der Samichlaus","Der Schmutzli","Der Grittibänz"],e:"Am Sechseläuten im Frühling ziehen die Zünfte durch Zürich. Zum Schluss wird der Böögg auf einem Scheiterhaufen angezündet. Je schneller sein Kopf explodiert, desto schöner soll der Sommer werden.",m:"Sechseläuten: Der Böögg brennt."},
 {t:"kt_ZH",l:2,s:"Zürich",q:"Wie hiess Zürich zur Römerzeit?",a:["Turicum","Aventicum","Vindonissa","Salodurum"],e:"Die Römer hatten am Ausfluss der Limmat aus dem Zürichsee eine Zollstation namens Turicum. Daraus entstand der Name Zürich.",m:"Zürich = römisch Turicum."},
 {t:"kt_ZH",l:2,s:"Kanton Zürich",q:"In welchem Jahr trat Zürich der Eidgenossenschaft bei?",a:["1351","1291","1803","1848"],e:"Zürich schloss 1351 einen Bund mit den Waldstätten und Luzern. Damit bekam die Eidgenossenschaft eine bedeutende Handelsstadt.",m:"Zürich: seit 1351 dabei."},
 {t:"kt_ZH",l:3,s:"ETH Zürich",q:"Welche Hochschule wurde 1855 in Zürich als Eidgenössisches Polytechnikum gegründet?",a:["Die ETH Zürich","Die Universität Basel","Die HSG","Die EPFL"],e:"Die ETH wurde vom Bund gegründet, um Ingenieure und Naturwissenschaftler auszubilden. Viele Nobelpreisträger haben dort studiert oder gelehrt, darunter Albert Einstein.",m:"ETH Zürich: seit 1855."},
 {t:"kt_BE",l:1,s:"Bern",q:"Welches Tier ist das Wappentier von Bern?",a:["Der Bär","Der Löwe","Der Adler","Der Steinbock"],e:"Der Bär ist seit Jahrhunderten das Symbol von Bern. Im Bärenpark an der Aare kann man bis heute lebende Bären sehen.",m:"Bern = Bär."},
 {t:"kt_BE",l:2,s:"Zähringer",q:"Welches Adelsgeschlecht gründete 1191 die Stadt Bern?",a:["Die Zähringer","Die Habsburger","Die Medici","Die Kyburger"],e:"Herzog Berchtold V. von Zähringen gründete Bern auf einer Halbinsel in einer Aareschlaufe. Die Zähringer gründeten auch Freiburg im Üechtland.",m:"Bern: Gründung 1191 durch die Zähringer."},
 {t:"kt_BE",l:3,s:"Albert Einstein",q:"Welcher berühmte Physiker entwickelte 1905 in Bern seine spezielle Relativitätstheorie?",a:["Albert Einstein","Isaac Newton","Marie Curie","Galileo Galilei"],e:"Einstein arbeitete damals als Experte im Eidgenössischen Patentamt in Bern. Im Jahr 1905 veröffentlichte er mehrere bahnbrechende Arbeiten. Seine Wohnung in der Berner Altstadt ist heute ein Museum.",m:"Einstein: 1905 in Bern."},
 {t:"kt_BE",l:3,s:"Kanton Bern",q:"In welchem Jahr trat Bern der Eidgenossenschaft bei?",a:["1353","1291","1481","1815"],e:"Bern verbündete sich 1353 mit den Waldstätten. Später wurde es zum mächtigsten Stadtstaat der Eidgenossenschaft und beherrschte lange auch die Waadt und den Aargau.",m:"Bern: seit 1353 dabei."},
 {t:"kt_LU",l:1,s:"Kapellbrücke",q:"Welche berühmte überdachte Holzbrücke steht in Luzern?",a:["Die Kapellbrücke","Die Teufelsbrücke","Die Golden Gate Bridge","Die Rialtobrücke"],e:"Die Kapellbrücke stammt aus dem 14. Jahrhundert und gehört zu den ältesten Holzbrücken Europas. 1993 brannte sie teilweise ab und wurde wieder aufgebaut. Daneben steht der Wasserturm.",m:"Luzern = Kapellbrücke."},
 {t:"kt_LU",l:2,s:"Löwendenkmal",q:"Woran erinnert das Löwendenkmal in Luzern?",a:["An Schweizer Gardisten, die 1792 in Paris ums Leben kamen","An einen entlaufenen Zoolöwen","An die Gründung der Stadt","An den Bau der Eisenbahn"],e:"Der sterbende Löwe im Fels erinnert an Schweizer Söldner, die 1792 beim Sturm auf die Tuilerien in Paris den französischen König verteidigten. Viele Schweizer dienten damals in fremden Armeen.",m:"Löwendenkmal: Schweizergarde 1792."},
 {t:"kt_LU",l:2,s:"Schlacht bei Sempach",q:"Welche Schlacht fand 1386 im heutigen Kanton Luzern statt?",a:["Die Schlacht bei Sempach","Die Schlacht am Morgarten","Die Schlacht bei Murten","Die Schlacht bei Marignano"],e:"Bei Sempach besiegten die Eidgenossen 1386 ein habsburgisches Heer. Herzog Leopold III. von Österreich fiel dabei. Mit dieser Schlacht ist die Sage von Winkelried verbunden.",m:"1386: Sempach."},
 {t:"kt_LU",l:3,s:"Kanton Luzern",q:"Als erste Stadt schloss sich Luzern den Waldstätten an. In welchem Jahr?",a:["1332","1291","1415","1798"],e:"1332 verbündete sich Luzern mit Uri, Schwyz und Unterwalden. Damit trat erstmals eine Stadt dem Bund bei.",m:"Luzern: 1332 als erste Stadt."},
 {t:"kt_UR",l:1,s:"Telldenkmal",q:"In welchem Urner Ort steht das berühmte Telldenkmal?",a:["In Altdorf","In Zürich","In Genf","In Chur"],e:"Das Telldenkmal in Altdorf zeigt Wilhelm Tell mit Armbrust und seinem Sohn Walter. Laut Sage schoss Tell in Altdorf den Apfel.",m:"Telldenkmal = Altdorf."},
 {t:"kt_UR",l:2,s:"Teufelsbrücke (Schöllenen)",q:"Um welche Brücke in der Schöllenenschlucht rankt sich eine Sage mit dem Teufel?",a:["Die Teufelsbrücke","Die Kapellbrücke","Die Kornhausbrücke","Die Tower Bridge"],e:"Laut Sage baute der Teufel die Brücke über die Reuss und verlangte die erste Seele, die sie überquert. Die Urner schickten einen Ziegenbock. Die Brücke machte den Gotthardweg erst richtig passierbar.",m:"Teufelsbrücke: der Teufel bekam einen Geissbock."},
 {t:"kt_UR",l:3,s:"Gotthardpass",q:"Welcher bedeutende Alpenpass verbindet Uri mit dem Tessin?",a:["Der Gotthardpass","Der Grosse St. Bernhard","Der Simplon","Der Julier"],e:"Seit dem Mittelalter ist der Gotthard eine der wichtigsten Nord-Süd-Verbindungen Europas. Der Handel über den Pass machte Uri bedeutend. Heute führen auch Strassen- und Bahntunnel darunter hindurch.",m:"Uri = Tor zum Gotthard."},
 {t:"kt_SZ",l:1,s:"Kanton Schwyz",q:"Welcher Kanton gab der ganzen Schweiz ihren Namen?",a:["Schwyz","Zürich","Bern","Uri"],e:"Nach den Schwyzern, die in vielen Schlachten auffielen, wurden bald alle Eidgenossen «Schwyzer» genannt. Daraus wurde der Name Schweiz.",m:"Schwyz → Schweiz."},
 {t:"kt_SZ",l:2,s:"Bundesbrief",q:"Wo wird der Bundesbrief von 1291 aufbewahrt?",a:["Im Bundesbriefmuseum in Schwyz","Im Bundeshaus in Bern","Im Landesmuseum in Paris","Im Vatikan"],e:"Der Bundesbrief ist eine Urkunde auf Latein, in der sich Uri, Schwyz und Unterwalden gegenseitige Hilfe versprechen. Das Original liegt im Bundesbriefmuseum in Schwyz.",m:"Bundesbrief: Museum in Schwyz."},
 {t:"kt_SZ",l:3,s:"Flagge der Schweiz",q:"Woraus hat sich die Schweizer Fahne entwickelt?",a:["Aus dem Banner von Schwyz, einem roten Tuch mit kleinem weissem Kreuz","Aus der Fahne Frankreichs","Aus der Fahne des Roten Kreuzes","Aus einem Wettbewerb im Jahr 2000"],e:"Die Schwyzer führten ein rotes Banner, später mit einem kleinen weissen Kreuz. Eidgenössische Truppen übernahmen das Kreuz als gemeinsames Zeichen. Offizielle Landesfahne wurde es im 19. Jahrhundert.",m:"Schweizer Kreuz kommt von Schwyz."},
 {t:"kt_OW",l:1,s:"Unterwalden",q:"Zu welchem Urkanton gehörten Obwalden und Nidwalden gemeinsam?",a:["Unterwalden","Uri","Schwyz","Luzern"],e:"Obwalden und Nidwalden bildeten zusammen Unterwalden, einen der drei Urkantone. Sie wurden aber schon früh getrennt verwaltet.",m:"Obwalden + Nidwalden = Unterwalden."},
 {t:"kt_OW",l:2,s:"Niklaus von Flüe",q:"Welcher Einsiedler aus Obwalden half 1481, einen gefährlichen Streit zwischen den Eidgenossen zu schlichten?",a:["Niklaus von Flüe","Wilhelm Tell","Huldrych Zwingli","Arnold Winkelried"],e:"Niklaus von Flüe lebte als Einsiedler im Ranft. Sein Rat trug 1481 zum Stanser Verkommnis bei, einer Einigung, die einen Bruch der Eidgenossenschaft verhinderte. Er ist Schutzpatron der Schweiz.",m:"Bruder Klaus: Friedensstifter 1481."},
 {t:"kt_OW",l:3,s:"Weisses Buch von Sarnen",q:"Welche Handschrift im Staatsarchiv in Sarnen enthält eine der frühesten Erzählungen der Tellsage?",a:["Das Weisse Buch von Sarnen","Der Bundesbrief","Die Bibel von Gutenberg","Das Nibelungenlied"],e:"Das Weisse Buch wurde um 1470 geschrieben. Es erzählt von der Befreiung der Waldstätte und von Wilhelm Tell. Historiker halten es für eine Sammlung von Überlieferungen, nicht für einen genauen Bericht.",m:"Weisses Buch: frühe Tellsage."},
 {t:"kt_NW",l:1,s:"Arnold Winkelried",q:"Welcher Sagenheld aus Nidwalden soll bei Sempach die Speere der Feinde gepackt haben?",a:["Arnold Winkelried","Wilhelm Tell","Niklaus von Flüe","Henri Guisan"],e:"Laut Sage öffnete Winkelried in der Schlacht bei Sempach eine Lücke in den feindlichen Reihen, indem er viele Speere auf sich zog. Ob er wirklich gelebt hat, ist nicht sicher. In Stans steht ein Denkmal für ihn.",m:"Winkelried: Held von Sempach (Sage)."},
 {t:"kt_NW",l:2,s:"Stans",q:"Wie heisst der Hauptort von Nidwalden?",a:["Stans","Sarnen","Altdorf","Schwyz"],e:"Stans ist der Hauptort von Nidwalden. Dort wurde 1481 das Stanser Verkommnis geschlossen. Sarnen ist der Hauptort von Obwalden.",m:"Nidwalden: Stans. Obwalden: Sarnen."},
 {t:"kt_NW",l:3,s:"Franzoseneinfall",q:"Was geschah 1798 in Nidwalden?",a:["Nidwalden wehrte sich gegen die Helvetische Republik, und französische Truppen richteten grosse Zerstörung an","Nidwalden wurde ein eigenes Land","Nidwalden trat Österreich bei","Nidwalden baute die erste Eisenbahn"],e:"Nidwalden lehnte die neue Verfassung der Helvetischen Republik ab. Im September 1798 griffen französische Truppen an. Viele Menschen starben, und Dörfer wurden niedergebrannt. Man spricht von den «Schreckenstagen».",m:"1798: Schreckenstage in Nidwalden."},
 {t:"kt_GL",l:1,s:"Fridolin von Säckingen",q:"Welcher Heilige ist auf der Glarner Fahne abgebildet?",a:["Der heilige Fridolin","Der heilige Gallus","Der heilige Nikolaus","Der heilige Georg"],e:"Glarus ist der einzige Kanton, dessen Wappen eine Person zeigt: den heiligen Fridolin als Wanderer mit Stab und Bibel. Er soll im Frühmittelalter das Christentum in die Gegend gebracht haben.",m:"Glarus-Wappen: Fridolin."},
 {t:"kt_GL",l:2,s:"Schlacht bei Näfels",q:"An welche Schlacht erinnert die jährliche Näfelser Fahrt?",a:["An die Schlacht bei Näfels von 1388","An die Schlacht bei Marignano","An die Schlacht bei Murten","An die Schlacht am Morgarten"],e:"1388 besiegten die Glarner bei Näfels ein habsburgisches Heer. Seither erinnern sie jedes Jahr im April mit einer Wallfahrt, der Näfelser Fahrt, an diesen Sieg.",m:"Näfelser Fahrt: Sieg von 1388."},
 {t:"kt_GL",l:3,s:"Kanton Glarus",q:"Was macht Glarus politisch besonders?",a:["Die Landsgemeinde und das Stimmrechtsalter 16 für kantonale Fragen","Glarus hat keinen Regierungsrat","In Glarus gibt es keine Gemeinden","Glarus gehört nicht zur Schweiz"],e:"In Glarus entscheiden die Stimmberechtigten an der Landsgemeinde unter freiem Himmel. Seit 2007 dürfen dort schon 16-Jährige bei kantonalen und kommunalen Fragen abstimmen – als erster Kanton der Schweiz.",m:"Glarus: Landsgemeinde und Stimmrecht ab 16."},
 {t:"kt_ZG",l:1,s:"Zuger Kirschtorte",q:"Welche süsse Spezialität ist nach Zug benannt?",a:["Die Zuger Kirschtorte","Die Basler Läckerli","Die Engadiner Nusstorte","Die Luzerner Chügelipastete"],e:"Die Zuger Kirschtorte besteht aus Biskuit, Buttercreme und Japonais-Böden und wird mit Kirsch getränkt. Rund um Zug wachsen seit Langem viele Kirschbäume.",m:"Zug = Kirschtorte."},
 {t:"kt_ZG",l:2,s:"Kanton Zug",q:"In welchem Jahr trat Zug der Eidgenossenschaft bei?",a:["1352","1291","1803","1979"],e:"Zug wurde 1352 in den Bund aufgenommen, im gleichen Jahr wie Glarus. Ein Jahr später folgte Bern.",m:"Zug: 1352."},
 {t:"kt_ZG",l:3,s:"Zuger Vorstadtkatastrophe",q:"Was geschah 1887 bei der Zuger Vorstadtkatastrophe?",a:["Ein Teil der Stadt rutschte in den Zugersee","Ein Vulkan brach aus","Ein Erdbeben zerstörte die ganze Stadt","Ein Stausee lief aus"],e:"Am 5. Juli 1887 gab das Ufer nach, und Häuser der Vorstadt versanken im Zugersee. Elf Menschen kamen ums Leben. Danach wurde die Uferzone neu gestaltet.",m:"1887: Vorstadt versinkt im Zugersee."},
 {t:"kt_FR",l:1,s:"Kanton Freiburg",q:"Welche beiden Sprachen spricht man im Kanton Freiburg?",a:["Französisch und Deutsch","Italienisch und Rätoromanisch","Englisch und Deutsch","Nur Deutsch"],e:"Freiburg liegt an der Sprachgrenze. Die Mehrheit spricht Französisch, ein Teil Deutsch. Die Stadt heisst auf Französisch Fribourg.",m:"Freiburg: zweisprachig."},
 {t:"kt_FR",l:2,s:"Schlacht bei Murten",q:"Gegen wen kämpften die Eidgenossen 1476 in der Schlacht bei Murten?",a:["Gegen Karl den Kühnen, Herzog von Burgund","Gegen Napoleon","Gegen die Römer","Gegen die Wikinger"],e:"In den Burgunderkriegen besiegten die Eidgenossen den mächtigen Herzog Karl den Kühnen bei Grandson und Murten. Der Sieg brachte grosse Beute und Ansehen in Europa.",m:"1476 Murten: Sieg über Burgund."},
 {t:"kt_FR",l:3,s:"Stanser Verkommnis",q:"Mit welchem Kanton trat Freiburg 1481 gemeinsam der Eidgenossenschaft bei?",a:["Mit Solothurn","Mit Genf","Mit Basel","Mit dem Tessin"],e:"Nach langem Streit einigten sich die Orte 1481 im Stanser Verkommnis. Dabei wurden die Städte Freiburg und Solothurn aufgenommen.",m:"1481: Freiburg und Solothurn."},
 {t:"kt_SO",l:1,s:"Solothurn",q:"Welche Zahl spielt in Solothurn eine besondere Rolle?",a:["Die Zahl 11","Die Zahl 7","Die Zahl 100","Die Zahl 3"],e:"Solothurn wurde als elfter Ort in die Eidgenossenschaft aufgenommen. Seither taucht die 11 überall auf: Es gibt 11 Kirchen und Kapellen, 11 Brunnen, und die Kathedrale hat 11 Glocken. Es gibt sogar eine Uhr mit nur 11 Stunden.",m:"Solothurn liebt die 11."},
 {t:"kt_SO",l:2,s:"Solothurn",q:"Wie hiess Solothurn zur Römerzeit?",a:["Salodurum","Turicum","Genava","Basilia"],e:"Solothurn gehört zu den ältesten Städten der Schweiz. Die Römer nannten die Siedlung an der Aare Salodurum.",m:"Solothurn = römisch Salodurum."},
 {t:"kt_SO",l:3,s:"Ambassadorenstadt",q:"Warum nennt man Solothurn «Ambassadorenstadt»?",a:["Weil von 1530 bis 1792 der französische Botschafter bei den Eidgenossen dort residierte","Weil dort alle Botschaften der Welt stehen","Weil dort die UNO sitzt","Weil der Bundesrat dort wohnt"],e:"Die französischen Botschafter lebten über 250 Jahre lang in Solothurn. Das brachte Geld und französische Lebensart in die Stadt. Viele barocke Bauten stammen aus dieser Zeit.",m:"Ambassadorenstadt = Sitz des französischen Botschafters."},
 {t:"kt_BS",l:1,s:"Basler Fasnacht",q:"Welches grosse Fest beginnt in Basel mit dem Morgestraich um 4 Uhr früh?",a:["Die Basler Fasnacht","Das Sechseläuten","Die Escalade","Der Zibelemärit"],e:"Beim Morgestraich wird um 4 Uhr morgens das Licht in der Stadt gelöscht, und Cliquen ziehen mit Laternen, Piccolos und Trommeln los. Die Basler Fasnacht ist UNESCO-Kulturerbe.",m:"Basel: Fasnacht mit Morgestraich."},
 {t:"kt_BS",l:2,s:"Universität Basel",q:"Welche ist die älteste Universität der Schweiz?",a:["Die Universität Basel, gegründet 1460","Die ETH Zürich","Die Universität Bern","Die Universität Genf"],e:"Die Universität Basel wurde 1460 gegründet. Berühmte Gelehrte wie Erasmus von Rotterdam wirkten in Basel, das auch ein Zentrum des Buchdrucks war.",m:"Älteste Uni: Basel, 1460."},
 {t:"kt_BS",l:2,s:"Kanton Basel-Stadt",q:"In welchem Jahr trat Basel der Eidgenossenschaft bei?",a:["1501","1291","1848","1353"],e:"Basel wurde 1501 aufgenommen, im gleichen Jahr wie Schaffhausen. Als Handelsstadt am Rhein war es ein wichtiger Partner.",m:"Basel: 1501."},
 {t:"kt_BS",l:3,s:"Kantonstrennung Basel",q:"Warum gibt es heute zwei Basler Kantone?",a:["Nach Konflikten zwischen Stadt und Landschaft wurde der Kanton 1833 geteilt","Weil der Rhein Basel in zwei Hälften teilt","Weil Basel zwei Sprachen hat","Weil der Bund es 1999 so entschied"],e:"Die Landbevölkerung forderte mehr Mitsprache gegenüber der Stadt. Nach Unruhen und Kämpfen wurde der Kanton 1833 in Basel-Stadt und Basel-Landschaft getrennt.",m:"1833: Basel wird geteilt."},
 {t:"kt_BL",l:1,s:"Augusta Raurica",q:"Welche römische Stadt kann man in Augst im Kanton Basel-Landschaft besuchen?",a:["Augusta Raurica","Pompeji","Aventicum","Turicum"],e:"Augusta Raurica war eine grosse römische Stadt. Heute sieht man dort ein Theater, Tempel und einen nachgebauten Römerhaushalt. Jedes Jahr findet ein Römerfest statt.",m:"Augst = Augusta Raurica."},
 {t:"kt_BL",l:2,s:"Liestal",q:"Wie heisst der Hauptort von Basel-Landschaft?",a:["Liestal","Basel","Aarau","Olten"],e:"Seit der Kantonstrennung 1833 ist Liestal der Hauptort von Basel-Landschaft. Bekannt ist dort der Feuerbrauch «Chienbäse» an der Fasnacht.",m:"Basel-Landschaft: Liestal."},
 {t:"kt_BL",l:3,s:"Kanton Basel-Landschaft",q:"Seit wann ist Basel-Landschaft ein eigener Kanton?",a:["Seit 1833","Seit 1291","Seit 1979","Seit 1501"],e:"Nach der Trennung vom Stadtkanton 1833 wurde Basel-Landschaft eigenständig. Spätere Versuche, die beiden Basel wieder zu vereinen, wurden an der Urne abgelehnt.",m:"Basel-Landschaft: seit 1833."},
 {t:"kt_SH",l:1,s:"Rheinfall",q:"Welcher grosse Wasserfall liegt bei Schaffhausen?",a:["Der Rheinfall","Die Reichenbachfälle","Die Niagarafälle","Der Staubbachfall"],e:"Der Rheinfall ist einer der grössten Wasserfälle Europas. Man kann mit dem Boot bis zum Felsen in der Mitte fahren.",m:"Schaffhausen = Rheinfall."},
 {t:"kt_SH",l:2,s:"Munot",q:"Wie heisst die runde Festung über der Altstadt von Schaffhausen?",a:["Munot","Castelgrande","Chillon","Kyburg"],e:"Der Munot wurde im 16. Jahrhundert gebaut. Jeden Abend läutet dort das Munotglöckchen. Im Sommer finden auf der Zinne Bälle statt.",m:"Schaffhausen: Munot."},
 {t:"kt_SH",l:3,s:"Bombardierung von Schaffhausen",q:"Was geschah am 1. April 1944 in Schaffhausen?",a:["Amerikanische Flugzeuge bombardierten die Stadt irrtümlich","Die Stadt wurde von Frankreich erobert","Der Rheinfall versiegte","Es gab ein grosses Erdbeben"],e:"Im Zweiten Weltkrieg verwechselten amerikanische Bomber Schaffhausen mit einer deutschen Stadt. 40 Menschen starben. Die USA entschuldigten sich und zahlten später Entschädigung.",m:"1944: irrtümliche Bombardierung."},
 {t:"kt_AR",l:1,s:"Appenzeller (Käse)",q:"Welcher Käse trägt den Namen des Appenzellerlands?",a:["Appenzeller","Emmentaler","Gruyère","Tilsiter"],e:"Der Appenzeller wird mit einer geheimen Kräutersulz behandelt, das gibt ihm seinen würzigen Geschmack. Die Region ist auch für Brauchtum wie das Silvesterchlausen bekannt.",m:"Appenzellerland = Appenzeller Käse."},
 {t:"kt_AR",l:2,s:"Appenzeller Landteilung",q:"Warum wurde das Land Appenzell 1597 geteilt?",a:["Wegen der Konfession: Ausserrhoden wurde reformiert, Innerrhoden blieb katholisch","Wegen eines Streits um Käse","Weil der Bund es verlangte","Wegen eines Erdbebens"],e:"Nach der Reformation gab es im Appenzell reformierte und katholische Gemeinden. Um den Frieden zu bewahren, teilte man das Land 1597 in Ausserrhoden und Innerrhoden.",m:"1597: Teilung nach Konfession."},
 {t:"kt_AR",l:3,s:"Kanton Appenzell Ausserrhoden",q:"In welchem Jahr schaffte Appenzell Ausserrhoden seine Landsgemeinde ab?",a:["1997","1848","1291","2020"],e:"Die Stimmberechtigten beschlossen 1997, die Landsgemeinde abzuschaffen und an der Urne abzustimmen. Innerrhoden hält dagegen bis heute an der Landsgemeinde fest.",m:"Ausserrhoden: Landsgemeinde bis 1997."},
 {t:"kt_AI",l:1,s:"Kanton Appenzell Innerrhoden",q:"Welcher Kanton hat die wenigsten Einwohnerinnen und Einwohner?",a:["Appenzell Innerrhoden","Zürich","Bern","Tessin"],e:"Appenzell Innerrhoden ist der bevölkerungsmässig kleinste Kanton der Schweiz. Er ist ländlich geprägt und für seine Traditionen bekannt.",m:"Kleinster Kanton (Einwohner): Innerrhoden."},
 {t:"kt_AI",l:2,s:"Appenzell",q:"Wie heisst der Hauptort von Appenzell Innerrhoden, wo die Landsgemeinde stattfindet?",a:["Appenzell","Herisau","Trogen","St. Gallen"],e:"Auf dem Landsgemeindeplatz in Appenzell stimmen die Innerrhoder jeden April mit erhobener Hand ab. Herisau ist der Hauptort von Ausserrhoden.",m:"Innerrhoden: Hauptort Appenzell."},
 {t:"kt_AI",l:3,s:"Frauenstimmrecht in der Schweiz",q:"Wie erhielten die Frauen in Appenzell Innerrhoden 1990 das kantonale Stimmrecht?",a:["Durch einen Entscheid des Bundesgerichts","Durch einen Beschluss der Landsgemeinde","Durch einen Befehl des Bundesrates","Durch eine Volksabstimmung in ganz Europa"],e:"Die Landsgemeinde hatte das Frauenstimmrecht mehrfach abgelehnt. 1990 entschied das Bundesgericht, dass dies gegen die Gleichberechtigung in der Bundesverfassung verstösst. Innerrhoden war damit der letzte Kanton.",m:"1990: Bundesgericht erzwingt Frauenstimmrecht."},
 {t:"kt_SG",l:1,s:"Gallus (Heiliger)",q:"Welcher Mönch gab der Stadt St. Gallen ihren Namen?",a:["Gallus","Fridolin","Nikolaus","Benedikt"],e:"Der irische Mönch Gallus liess sich um 612 im Steinachtal nieder. Laut Legende half ihm ein Bär beim Bau seiner Zelle – darum ist ein Bär im Stadtwappen.",m:"St. Gallen: Gallus und der Bär."},
 {t:"kt_SG",l:2,s:"Stiftsbibliothek St. Gallen",q:"Welcher Schatz in St. Gallen gehört zum UNESCO-Welterbe?",a:["Der Stiftsbezirk mit der Stiftsbibliothek","Der Rheinfall","Das Matterhorn","Die Kapellbrücke"],e:"Die Stiftsbibliothek ist eine der ältesten Bibliotheken der Welt und besitzt kostbare mittelalterliche Handschriften. Den prachtvollen Barocksaal betritt man in Filzpantoffeln.",m:"Stiftsbibliothek = UNESCO-Welterbe."},
 {t:"kt_SG",l:3,s:"St. Galler Stickerei",q:"Wofür war St. Gallen um 1900 weltberühmt?",a:["Für Stickereien","Für Uhren","Für Schokolade","Für Autos"],e:"Um 1910 war Stickerei das wichtigste Exportprodukt der Schweiz, und ein grosser Teil der Weltproduktion kam aus der Ostschweiz. Nach dem Ersten Weltkrieg brach der Markt ein. Bis heute stammen feine Stoffe aus St. Gallen.",m:"St. Gallen = Stickerei."},
 {t:"kt_SG",l:3,s:"Kanton St. Gallen",q:"Seit wann gibt es den Kanton St. Gallen?",a:["Seit 1803","Seit 1291","Seit 1515","Seit 1979"],e:"Der Kanton St. Gallen wurde 1803 durch die Mediationsakte von Napoleon geschaffen. Er wurde aus früheren Herrschaftsgebieten des Klosters und anderen Gebieten zusammengesetzt.",m:"St. Gallen: Kanton seit 1803."},
 {t:"kt_GR",l:1,s:"Kanton Graubünden",q:"Welcher ist der flächenmässig grösste Kanton der Schweiz?",a:["Graubünden","Bern","Wallis","Zürich"],e:"Graubünden ist fast so gross wie ein Sechstel der Schweiz. Es hat rund 150 Täler und sehr viele Berggipfel.",m:"Grösster Kanton: Graubünden."},
 {t:"kt_GR",l:2,s:"Kanton Graubünden",q:"Welche drei Sprachen sind in Graubünden Amtssprachen?",a:["Deutsch, Rätoromanisch und Italienisch","Deutsch, Französisch und Englisch","Nur Deutsch","Italienisch, Französisch und Spanisch"],e:"Graubünden ist der einzige dreisprachige Kanton. Rätoromanisch wird fast nur hier gesprochen.",m:"Graubünden: dreisprachig."},
 {t:"kt_GR",l:3,s:"Drei Bünde",q:"Aus welchem Zusammenschluss entstand Graubünden?",a:["Aus den Drei Bünden: Gotteshausbund, Grauer Bund und Zehngerichtebund","Aus drei Klöstern","Aus drei Königreichen","Aus drei Urkantonen"],e:"Die drei Bünde waren lange ein eigener Freistaat und mit den Eidgenossen verbündet. Erst 1803 wurde Graubünden ein Kanton der Schweiz. Der Name kommt vom Grauen Bund.",m:"Graubünden = Drei Bünde, Kanton seit 1803."},
 {t:"kt_GR",l:3,s:"Rhätische Bahn in der Landschaft Albula/Bernina",q:"Welche Bahnstrecken in Graubünden gehören zum UNESCO-Welterbe?",a:["Die Albula- und die Berninalinie der Rhätischen Bahn","Die Gotthardbahn","Die Jungfraubahn","Die Zürcher S-Bahn"],e:"Die Strecken über Albula und Bernina führen durch Kehrtunnels und über kühne Viadukte wie das Landwasserviadukt. Sie sind seit 2008 UNESCO-Welterbe.",m:"Albula/Bernina: Welterbe-Bahn."},
 {t:"kt_AG",l:1,s:"Habsburg (Schloss)",q:"Welches mächtige Herrschergeschlecht hat seinen Namen von einer Burg im Aargau?",a:["Die Habsburger","Die Zähringer","Die Medici","Die Windsor"],e:"Die Habsburg steht bei Brugg im Aargau. Die Familie, die sich nach ihr benannte, wurde später eine der mächtigsten in Europa und herrschte über Österreich und Spanien.",m:"Habsburg liegt im Aargau."},
 {t:"kt_AG",l:2,s:"Vindonissa",q:"Welches grosse römische Legionslager lag bei Windisch im Aargau?",a:["Vindonissa","Turicum","Salodurum","Genava"],e:"In Vindonissa waren einst Tausende römische Soldaten stationiert. Das Lager war das einzige römische Legionslager auf dem Gebiet der heutigen Schweiz.",m:"Windisch = Vindonissa."},
 {t:"kt_AG",l:3,s:"Kanton Aargau",q:"Seit wann ist der Aargau ein eigener Kanton?",a:["Seit 1803","Seit 1291","Seit 1415","Seit 1979"],e:"Vorher war der Aargau zum Teil Untertanengebiet von Bern und anderen Orten. 1803 wurde er durch die Mediationsakte ein gleichberechtigter Kanton.",m:"Aargau: Kanton seit 1803."},
 {t:"kt_TG",l:1,s:"Kanton Thurgau",q:"Wegen welcher Früchte nennt man den Thurgau scherzhaft «Mostindien»?",a:["Wegen der vielen Äpfel","Wegen der Bananen","Wegen der Orangen","Wegen der Kokosnüsse"],e:"Im Thurgau wachsen besonders viele Obstbäume. Aus den Äpfeln wird Most gemacht. Weil die Form des Kantons ein wenig an Indien erinnert, entstand der Spitzname.",m:"Thurgau = Mostindien."},
 {t:"kt_TG",l:2,s:"Bodensee",q:"An welchem grossen See liegt der Thurgau?",a:["Am Bodensee","Am Genfersee","Am Lago Maggiore","Am Zürichsee"],e:"Der Bodensee grenzt an die Schweiz, Deutschland und Österreich. Am Thurgauer Ufer liegen Orte wie Kreuzlingen, Romanshorn und Arbon.",m:"Thurgau liegt am Bodensee."},
 {t:"kt_TG",l:3,s:"Landgrafschaft Thurgau",q:"Wie wurde der Thurgau vor 1798 regiert?",a:["Als gemeinsames Untertanengebiet mehrerer eidgenössischer Orte","Als eigenes Königreich","Von Frankreich","Er war unbewohnt"],e:"Ab 1460 war der Thurgau eine «gemeine Herrschaft»: Mehrere eidgenössische Orte schickten abwechselnd Landvögte. Erst 1803 wurde der Thurgau ein gleichberechtigter Kanton.",m:"Thurgau: bis 1798 Untertanengebiet."},
 {t:"kt_TI",l:1,s:"Kanton Tessin",q:"Welche Sprache spricht man im Tessin hauptsächlich?",a:["Italienisch","Französisch","Rätoromanisch","Englisch"],e:"Das Tessin ist der einzige Kanton, in dem nur Italienisch Amtssprache ist. Zusammen mit Südbünden bildet es die italienische Schweiz.",m:"Tessin = Italienisch."},
 {t:"kt_TI",l:2,s:"Burgen von Bellinzona",q:"Welche Burgen in Bellinzona gehören zum UNESCO-Welterbe?",a:["Castelgrande, Montebello und Sasso Corbaro","Chillon, Munot und Kyburg","Habsburg und Lenzburg","Die Burgen am Rhein"],e:"Die drei Burgen sicherten im Mittelalter den Zugang zu mehreren Alpenpässen. Die Herzöge von Mailand bauten sie aus. Seit 2000 sind sie UNESCO-Welterbe.",m:"Bellinzona: drei Burgen, UNESCO."},
 {t:"kt_TI",l:3,s:"Ennetbirgische Vogteien",q:"Wie war das Tessin vor 1798 mit der Eidgenossenschaft verbunden?",a:["Als Untertanengebiet, das von eidgenössischen Landvögten verwaltet wurde","Als eigenständiger Kanton","Gar nicht, es gehörte zu Spanien","Als Teil von Graubünden"],e:"Die Eidgenossen eroberten die Tessiner Täler im 15. und 16. Jahrhundert und verwalteten sie als «ennetbirgische Vogteien». Erst 1803 wurde das Tessin ein gleichberechtigter Kanton.",m:"Tessin: Kanton seit 1803."},
 {t:"kt_VD",l:1,s:"Schloss Chillon",q:"Welches berühmte Wasserschloss steht bei Montreux am Genfersee?",a:["Schloss Chillon","Schloss Lenzburg","Castelgrande","Schloss Neuschwanstein"],e:"Schloss Chillon steht auf einem Felsen im See. Es gehörte lange den Grafen von Savoyen und später Bern. Es gehört zu den meistbesuchten historischen Bauten der Schweiz.",m:"Chillon: Schloss im Genfersee."},
 {t:"kt_VD",l:2,s:"Internationales Olympisches Komitee",q:"Welche internationale Sportorganisation hat ihren Sitz in Lausanne?",a:["Das Internationale Olympische Komitee (IOC)","Die FIFA","Die UEFA","Die NBA"],e:"Das IOC sitzt seit 1915 in Lausanne. Dort gibt es auch ein grosses Olympisches Museum. Lausanne nennt sich deshalb «Olympische Hauptstadt».",m:"IOC = Lausanne."},
 {t:"kt_VD",l:2,s:"Lavaux",q:"Welche Weinbergterrassen am Genfersee sind UNESCO-Welterbe?",a:["Das Lavaux","Die Bündner Herrschaft","Das Seeland","Das Emmental"],e:"Die steilen Rebterrassen im Lavaux wurden seit dem Mittelalter von Mönchen und Bauern angelegt. Seit 2007 sind sie UNESCO-Welterbe.",m:"Lavaux: Rebterrassen, UNESCO."},
 {t:"kt_VD",l:3,s:"Kanton Waadt",q:"Welcher Kanton beherrschte die Waadt bis 1798?",a:["Bern","Genf","Freiburg","Wallis"],e:"Bern eroberte die Waadt 1536. Mit der Revolution 1798 befreite sich die Waadt von der Berner Herrschaft und wurde 1803 ein eigener Kanton.",m:"Waadt: bis 1798 unter Bern."},
 {t:"kt_VS",l:1,s:"Matterhorn",q:"Welcher berühmte Berg steht bei Zermatt im Wallis?",a:["Das Matterhorn","Die Rigi","Der Säntis","Der Pilatus"],e:"Das Matterhorn ist wegen seiner Pyramidenform einer der bekanntesten Berge der Welt. Es liegt an der Grenze zu Italien.",m:"Zermatt = Matterhorn."},
 {t:"kt_VS",l:2,s:"Grosser Aletschgletscher",q:"Welcher ist der grösste Gletscher der Alpen?",a:["Der Grosse Aletschgletscher","Der Rhonegletscher","Der Morteratschgletscher","Der Gornergletscher"],e:"Der Aletschgletscher ist rund 20 Kilometer lang. Wie alle Alpengletscher schmilzt er wegen der Klimaerwärmung und wird jedes Jahr kürzer.",m:"Grösster Alpengletscher: Aletsch."},
 {t:"kt_VS",l:3,s:"Matterhorn",q:"Wann wurde das Matterhorn zum ersten Mal bestiegen?",a:["1865","1492","1953","1999"],e:"1865 erreichte eine Seilschaft um den Engländer Edward Whymper den Gipfel. Beim Abstieg stürzten vier Männer tödlich ab. Die Tragödie machte das Matterhorn weltberühmt.",m:"Matterhorn-Erstbesteigung: 1865."},
 {t:"kt_VS",l:3,s:"Kanton Wallis",q:"In welchem Jahr wurde das Wallis ein Kanton der Eidgenossenschaft?",a:["1815","1291","1481","1979"],e:"Das Wallis war lange mit den Eidgenossen verbündet, aber nicht Mitglied. Unter Napoleon gehörte es zeitweise zu Frankreich. 1815 wurde es als Kanton aufgenommen, zusammen mit Genf und Neuenburg.",m:"Wallis: 1815."},
 {t:"kt_NE",l:1,s:"Uhrenindustrie",q:"Für welche Industrie ist der Kanton Neuenburg besonders bekannt?",a:["Für die Uhrenindustrie","Für den Schiffsbau","Für Erdöl","Für Bananen"],e:"Im Neuenburger Jura entwickelte sich seit dem 18. Jahrhundert eine berühmte Uhrenindustrie. Viele Familien fertigten Uhrenteile in Heimarbeit.",m:"Neuenburg = Uhren."},
 {t:"kt_NE",l:2,s:"La Chaux-de-Fonds / Le Locle, Stadtlandschaft Uhrenindustrie",q:"Welche beiden Neuenburger Uhrenstädte sind UNESCO-Welterbe?",a:["La Chaux-de-Fonds und Le Locle","Neuenburg und Biel","Genf und Lausanne","Zürich und Winterthur"],e:"Die beiden Städte wurden nach Bränden im 19. Jahrhundert ganz auf die Uhrmacherei ausgerichtet: mit geraden Strassen und Häusern mit grossen Fenstern für gutes Licht. Seit 2009 sind sie UNESCO-Welterbe.",m:"La Chaux-de-Fonds & Le Locle: Uhren-Welterbe."},
 {t:"kt_NE",l:3,s:"Fürstentum Neuenburg",q:"Wer war bis 1848 der Fürst von Neuenburg?",a:["Der König von Preussen","Der König von Frankreich","Der Papst","Der Bundesrat"],e:"Neuenburg war ab 1815 ein Schweizer Kanton und gleichzeitig ein Fürstentum des preussischen Königs – eine seltsame Doppelrolle. 1848 riefen die Neuenburger die Republik aus. Preussen verzichtete erst 1857 endgültig.",m:"Neuenburg: bis 1848 preussisches Fürstentum."},
 {t:"kt_GE",l:1,s:"Escalade",q:"Welches Fest feiert Genf jedes Jahr im Dezember, oft mit Schokoladentöpfen?",a:["Die Escalade","Die Fasnacht","Das Sechseläuten","Das Knabenschiessen"],e:"Die Escalade erinnert an die Nacht im Dezember 1602, als Genf einen Angriff von Savoyen abwehrte. Laut Legende goss Mère Royaume heisse Suppe auf die Angreifer. Darum zerschlägt man heute Schokoladentöpfe.",m:"Escalade: Genf 1602, Suppentopf."},
 {t:"kt_GE",l:2,s:"Johannes Calvin",q:"Welcher Reformator prägte Genf im 16. Jahrhundert?",a:["Johannes Calvin","Martin Luther","Huldrych Zwingli","Niklaus von Flüe"],e:"Calvin machte Genf zu einem Zentrum der Reformation. Viele Glaubensflüchtlinge kamen in die Stadt. Genf wurde deshalb auch «protestantisches Rom» genannt.",m:"Genf = Calvin."},
 {t:"kt_GE",l:3,s:"Palais des Nations",q:"Welche Organisation hat im Palais des Nations in Genf einen ihrer Hauptsitze?",a:["Die Vereinten Nationen (UNO)","Die FIFA","Die Schweizerische Nationalbank","Die ETH"],e:"Das Palais des Nations wurde für den Völkerbund gebaut und ist heute der europäische Sitz der UNO. Dazu kommen in Genf viele weitere internationale Organisationen, etwa das Rote Kreuz.",m:"Genf: UNO im Palais des Nations."},
 {t:"kt_GE",l:3,s:"Kanton Genf",q:"In welchem Jahr wurde Genf ein Kanton der Eidgenossenschaft?",a:["1815","1291","1602","1848"],e:"Genf war lange eine unabhängige Stadtrepublik und mit den Eidgenossen verbündet. Nach der französischen Herrschaft trat es 1815 als Kanton bei.",m:"Genf: 1815."},
 {t:"kt_JU",l:1,s:"Kanton Jura",q:"Welcher ist der jüngste Kanton der Schweiz?",a:["Der Jura","Zürich","Uri","Genf"],e:"Der Kanton Jura existiert erst seit 1979. Er ist damit der jüngste der 26 Kantone.",m:"Jüngster Kanton: Jura."},
 {t:"kt_JU",l:2,s:"Jurafrage",q:"Von welchem Kanton trennte sich der Jura?",a:["Von Bern","Von Neuenburg","Von Basel","Von Solothurn"],e:"Der Nordjura gehörte seit 1815 zum Kanton Bern. Viele französischsprachige, katholische Jurassierinnen und Jurassier fühlten sich nicht vertreten und kämpften jahrzehntelang für einen eigenen Kanton.",m:"Jura trennte sich von Bern."},
 {t:"kt_JU",l:3,s:"Kanton Jura",q:"Wann wurde der Kanton Jura offiziell ein Kanton der Schweiz?",a:["1979, nach Volksabstimmungen im Jura und in der ganzen Schweiz","1815 am Wiener Kongress","1848 mit der Bundesverfassung","2002 mit dem UNO-Beitritt"],e:"1974 stimmte der Nordjura für einen eigenen Kanton, 1978 stimmte das ganze Schweizer Volk zu. Am 1. Januar 1979 wurde der Kanton Jura Wirklichkeit – ein seltenes Beispiel für eine friedliche Grenzänderung per Abstimmung.",m:"Jura: Kanton seit 1979."}
